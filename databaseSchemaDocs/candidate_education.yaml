database: dbpcm_warehouse
table: candidate_education
description: Candidate-provided education history linked to an ATS application. Not verified current employee education and not directly linked to EmployeeCode or CandidateId.

grain: [ EducationId ]

temporal:
  dimensions: []
  default_pin: null

primary_key: [ EducationId ]

join_keys:
  - { column: ApplicationId, joins: applicant_tracking_application.ApplicationId, cardinality: N:1 }

columns:
  ClientCode: { type: Nullable(String), description: Client/company code. }
  EducationId: { type: Nullable(Int32), description: Unique education-history row identifier. }
  ApplicationId: { type: Nullable(Int32), description: Application identifier; join through applicant_tracking_application. }
  InstituteName: { type: Nullable(String), description: Candidate-provided institution name. }
  EducationCity: { type: Nullable(String), description: Institution city. }
  EducationState: { type: Nullable(String), description: Institution state. }
  EducationCountry: { type: Nullable(String), description: Institution country. }
  StudentDegree: { type: Nullable(String), description: Candidate-provided degree. }
  StudentMajor: { type: Nullable(String), description: Candidate-provided major. }
  StudentMinor: { type: Nullable(String), description: Candidate-provided minor. }
  StudentAlias: { type: Nullable(String), description: Student alias/name used at institution. }
  StudentGPA: { type: "Nullable(Decimal(18, 6))", description: Candidate-provided GPA. }
  Graduated:
    type: Nullable(String)
    observed_values: [ Yes, No ]
    description: Whether the candidate reported graduating.
  CurrentlyEnrolled:
    type: Nullable(String)
    observed_values: [ No ]
    description: Whether the candidate reported being currently enrolled.
  EducationDateAttendedStart: { type: Nullable(String), description: Candidate-provided attendance start date; stored as String. }
  EducationDateAttendedEnd: { type: Nullable(String), description: Candidate-provided attendance end date; stored as String. }
  AnticipatedGraduationDate: { type: Nullable(String), description: Candidate-provided anticipated graduation date; stored as String. }
  EducationPhoneNumber: { type: Nullable(String), sensitive: true, description: Sensitive institution phone number. }
  InstitutionType:
    type: Nullable(String)
    observed_values: [ Other, High School, University, University / Graduate School ]
    description: Candidate-provided institution type.

measures:
  education_entries: { column: "*", agg: count, defined_over: "education rows after application/candidate filters" }

rules:
  - { id: graduated, predicate: "Graduated = 'Yes'", applies_when: graduated education analysis, description: Restrict to rows marked graduated. }
  - { id: not_graduated, predicate: "Graduated = 'No'", applies_when: non-graduated education analysis, description: Restrict to rows marked not graduated. }
  - { id: currently_enrolled, predicate: "CurrentlyEnrolled = 'Yes'", applies_when: current enrollment analysis, description: Restrict to rows marked currently enrolled. }
  - { id: university_institution, predicate: "InstitutionType IN ('University', 'University / Graduate School')", applies_when: college/university education analysis, description: Restrict to university-type institutions. }
  - { id: high_school_institution, predicate: "InstitutionType = 'High School'", applies_when: high-school education analysis, description: Restrict to high-school institutions. }
  - { id: has_gpa, predicate: "StudentGPA IS NOT NULL", applies_when: GPA analysis, description: Restrict to rows with a GPA value. }

ambiguities:
  - { term: employee_education_history, resolves_to: [ "join employee -> applicant_tracking_application by EmployeeCode, pick the application with MAX(ApplicationDate) for that employee, then candidate_education on its ApplicationId" ], default: latest_application_by_ApplicationDate, clarify_if: user wants all ATS education across every application, or a specific application }
  - { term: candidate_education_history, resolves_to: [ "candidate_education rows joined through ApplicationId" ], default: application_linked_education_rows, clarify_if: candidate has multiple applications and user does not specify which one }
  - { term: highest_degree, resolves_to: [ StudentDegree ], default: candidate_provided_degree_text, clarify_if: degree ranking/mapping is required }
  - { term: education_dates, resolves_to: [ EducationDateAttendedStart, EducationDateAttendedEnd, AnticipatedGraduationDate ], default: candidate_provided_string_dates, clarify_if: "candidate-entered String dates with NO guaranteed format — parse via parseDateTimeBestEffortOrNull(...) (nulls unparseable values rather than erroring); chronological sorting/filtering is best-effort and may silently drop rows. Confirm before relying on date math." }


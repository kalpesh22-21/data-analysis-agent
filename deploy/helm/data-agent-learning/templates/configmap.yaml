{{/*
Shared ConfigMap of NON-SECRET env, mounted into every workload via envFrom.
Secret keys are intentionally kept out of here — they live in the out-of-band
Secret named by the secretName helper, which this chart does not render.

Two values are DERIVED rather than copied straight from .Values.config:
INBOX_SERVICE_URL (this release's inbox Service) and LEARNING_REDIS_URL (the
in-chart Redis Service). Both fall back to the explicit .Values.config entry
whenever it is non-empty; see the helpers for the full precedence.

A BLANK value is normally OMITTED from the ConfigMap, so the process falls through
to whatever default its settings model carries. That is the right rule for almost
everything here and the WRONG one for the tenant claims: their code defaults are the
LOCAL DEV SEED, so omitting a blank would silently re-mint the dev tenant in a
cluster — matching zero rows under the row policies and turning every golden replay
into a structural pass against nobody's data. The three TENANT_* keys are therefore
rendered even when blank, so "unset" reaches the process AS blank and trips the
readiness gates in run_learning_scheduler.py / learning/inbox/service.py.
*/}}
{{- $alwaysRender := list "TENANT_CLIENT_CODE" "TENANT_PROC_CENTER" "TENANT_JTI" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-agent-learning.configMapName" . }}
  labels:
    {{- include "data-agent-learning.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{- /* INBOX_SERVICE_URL and LEARNING_REDIS_URL are handled below via helpers */}}
  {{- if not (has $key (list "INBOX_SERVICE_URL" "LEARNING_REDIS_URL")) }}
  {{- if or (ne (toString $val) "") (has $key $alwaysRender) }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.components.inbox.enabled }}
  INBOX_SERVICE_URL: {{ include "data-agent-learning.inboxServiceUrl" . | quote }}
  {{- else if .Values.config.INBOX_SERVICE_URL }}
  INBOX_SERVICE_URL: {{ .Values.config.INBOX_SERVICE_URL | quote }}
  {{- end }}
  {{- /* Always rendered: the helper's last fallback is still a usable URL, and a
         learning plane with no LEARNING_REDIS_URL at all has no transport. */}}
  LEARNING_REDIS_URL: {{ include "data-agent-learning.redisUrl" . | quote }}

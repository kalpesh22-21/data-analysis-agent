{{- $c := .Values.components.inbox -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "inbox" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-agent-learning.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent-learning.componentLabels" $cmpArgs | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-agent-learning.componentSelectorLabels" $cmpArgs | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "data-agent-learning.checksumAnnotations" $ | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "data-agent-learning.componentSelectorLabels" $cmpArgs | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-agent-learning.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) ($c.podSecurityContext | default dict)) | nindent 8 }}
      containers:
        - name: inbox
          image: {{ include "data-agent-learning.image" (dict "root" $ "component" $c) }}
          imagePullPolicy: {{ include "data-agent-learning.imagePullPolicy" (dict "root" $ "component" $c) }}
          # Review-inbox HTTP service. Authenticates its callers on the shared
          # REVIEWER_TOKEN, which the reviewer UI holds server-side and attaches on
          # the proxy hop — the browser never sees it.
          command:
            - python
            - scripts/run_inbox_service.py
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) ($c.securityContext | default dict)) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $c.service.port }}
              protocol: TCP
          envFrom:
            {{- include "data-agent-learning.envFrom" $ | nindent 12 }}
          # Per-workload env: activate the dormant inbox app and bind it to all
          # interfaces (code default is 127.0.0.1, unreachable in-cluster).
          env:
            - name: REVIEW_INBOX_ENABLED
              value: "1"
            - name: INBOX_SERVICE_HOST
              value: "0.0.0.0"
            - name: INBOX_SERVICE_PORT
              value: {{ $c.service.port | quote }}
            {{- with concat (.Values.env | default list) ($c.env | default list) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # TCP probes, NOT `httpGet /inbox/health`. Every inbox route — health
          # included — sits behind the `_require_reviewer` dependency, so a request
          # without an `X-Reviewer-Token` header answers 401 (or 503 when the token is
          # unconfigured). The kubelet sends no such header and treats anything >=400 as
          # a FAILED probe, so an httpGet here could never pass: the pod would never
          # become Ready, the Service would have no endpoints, and the reviewer UI would
          # 502 forever. Putting the token in `httpHeaders` is not the fix either — that
          # writes a live credential into the pod spec in plaintext, readable by anyone
          # with `get pod`. A TCP probe answers the question a probe can honestly ask
          # here: is the server accepting connections?
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml (default .Values.resources $c.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.nodeSelector $c.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity $c.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations $c.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

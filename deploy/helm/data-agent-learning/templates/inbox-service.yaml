{{- $c := .Values.components.inbox -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "inbox" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-agent-learning.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent-learning.componentLabels" $cmpArgs | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP on purpose: the ONLY intended caller is the reviewer UI in this same
  # release (see the inboxServiceUrl helper). Never expose this Service through an
  # Ingress — its whole authentication surface is one shared bearer token.
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "data-agent-learning.componentSelectorLabels" $cmpArgs | nindent 4 }}
{{- end }}

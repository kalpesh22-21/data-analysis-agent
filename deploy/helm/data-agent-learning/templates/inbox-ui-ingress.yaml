{{/*
Ingress for the REVIEWER UI.

The pod behind it runs the whole `ui/server.py` app, so the agent-chat routes
(GET /, /api/session*, /api/turn*, /api/history, /api/query/page, /api/upload*)
EXIST on it — they are simply not routed here. This path list is the fence: it
defaults to the inbox surface only (`/inbox` + `/api/inbox`), so publishing the
reviewer UI does not publish a second, unintended door into the agent. Widening
`uiIngress.hosts[].paths` (e.g. to `/`) opens that door; see values.yaml.
*/}}
{{- if and .Values.uiIngress.enabled .Values.components.inboxUi.enabled -}}
{{- $cmpArgs := dict "root" $ "component" "inbox-ui" -}}
{{- $svcName := include "data-agent-learning.componentFullname" $cmpArgs -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "data-agent-learning.componentLabels" $cmpArgs | nindent 4 }}
  {{- with .Values.uiIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.uiIngress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.uiIngress.tls }}
  tls:
    {{- range .Values.uiIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- /* OPTIONAL. Omit secretName to use the ingress controller's default
             certificate; set it for a BYO cert, or to name the Secret
             cert-manager's ingress-shim should create from the cluster-issuer
             annotation (the shim needs a name to write to). */}}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.uiIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}

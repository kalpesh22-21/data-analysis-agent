{{- $c := .Values.components.inboxUi -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "inbox-ui" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-agent-learning.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent-learning.componentLabels" $cmpArgs | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "data-agent-learning.componentSelectorLabels" $cmpArgs | nindent 4 }}
{{- end }}

{{- $c := .Values.components.learningSweeper -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "learning-sweeper" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-agent-learning.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent-learning.componentLabels" $cmpArgs | nindent 4 }}
spec:
  # Fixed single replica: this is a periodic idle-scan sweeper; >1 replica would
  # double-enqueue sessions. Do not scale.
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-agent-learning.componentSelectorLabels" $cmpArgs | nindent 6 }}
  # Background daemon with no readiness gate — recreate rather than rolling.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- include "data-agent-learning.checksumAnnotations" $ | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "data-agent-learning.componentSelectorLabels" $cmpArgs | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-agent-learning.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) ($c.podSecurityContext | default dict)) | nindent 8 }}
      containers:
        - name: learning-sweeper
          image: {{ include "data-agent-learning.image" (dict "root" $ "component" $c) }}
          imagePullPolicy: {{ include "data-agent-learning.imagePullPolicy" (dict "root" $ "component" $c) }}
          # Periodic idle-scan sweeper (no HTTP server). Scans the AGENT's Couchbase
          # session bucket — this chart's COUCHBASE_* must match the data-agent
          # release's, or the sweep finds nothing and says nothing.
          command:
            - python
            - scripts/run_learning_sweeper.py
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) ($c.securityContext | default dict)) | nindent 12 }}
          envFrom:
            {{- include "data-agent-learning.envFrom" $ | nindent 12 }}
          {{- with concat (.Values.env | default list) ($c.env | default list) }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No HTTP server -> no readiness/liveness HTTP probe. The Deployment
          # controller restarts the pod if the process exits.
          resources:
            {{- toYaml (default .Values.resources $c.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.nodeSelector $c.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity $c.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations $c.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

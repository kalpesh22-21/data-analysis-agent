{{/*
Shared ConfigMap of NON-SECRET env, mounted into every workload via envFrom.
Secret keys are intentionally kept out of here — they live in the out-of-band
Secret named by the secretName helper, which this chart does not render. The
UI-only derived value RUNTIME_URL is computed from the release name when not
explicitly set in .Values.config.

A BLANK value is normally OMITTED from the ConfigMap, so the process falls through
to whatever default its settings model carries. That is the right rule for almost
everything here and the WRONG one for the tenant claims: their code defaults are the
LOCAL DEV SEED, so omitting a blank would silently re-mint the dev tenant in a
cluster — matching zero rows under the row policies and turning every golden replay
into a structural pass against nobody's data. The three TENANT_* keys are therefore
rendered even when blank, so "unset" reaches the process AS blank and trips the
readiness gates in run_learning_scheduler.py / learning/inbox/service.py.
*/}}
{{- $alwaysRender := list "TENANT_CLIENT_CODE" "TENANT_PROC_CENTER" "TENANT_JTI" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-agent.configMapName" . }}
  labels:
    {{- include "data-agent.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{- /* RUNTIME_URL is handled below via the helper */}}
  {{- if ne $key "RUNTIME_URL" }}
  {{- if or (ne (toString $val) "") (has $key $alwaysRender) }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.components.runtime.enabled }}
  RUNTIME_URL: {{ include "data-agent.runtimeUrl" . | quote }}
  {{- else if .Values.config.RUNTIME_URL }}
  RUNTIME_URL: {{ .Values.config.RUNTIME_URL | quote }}
  {{- end }}

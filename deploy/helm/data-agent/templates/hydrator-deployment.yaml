{{- $c := .Values.components.hydrator -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "hydrator" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-agent.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent.componentLabels" $cmpArgs | nindent 4 }}
spec:
  # Fixed single replica: this is the SINGLETON neo4j seeder — it owns the DESTRUCTIVE
  # nuke/rebuild on a dimension change. >1 replica would race the graph write path (two
  # writers reconciling/nuking the shared graph). A single runner needs no distributed
  # lock. Do not scale.
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-agent.componentSelectorLabels" $cmpArgs | nindent 6 }}
  # Background daemon with no HTTP server / readiness gate — recreate rather than rolling
  # (never two seeders alive at once during a deploy).
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- include "data-agent.checksumAnnotations" $ | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "data-agent.componentSelectorLabels" $cmpArgs | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) ($c.podSecurityContext | default dict)) | nindent 8 }}
      containers:
        - name: hydrator
          image: {{ include "data-agent.image" (dict "root" $ "component" $c) }}
          imagePullPolicy: {{ include "data-agent.imagePullPolicy" (dict "root" $ "component" $c) }}
          # Singleton neo4j seeder daemon (no HTTP server).
          command:
            - python
            - scripts/run_hydrator.py
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) ($c.securityContext | default dict)) | nindent 12 }}
          envFrom:
            {{- include "data-agent.envFrom" $ | nindent 12 }}
          {{- with concat (.Values.env | default list) ($c.env | default list) }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No HTTP server -> no readiness/liveness HTTP probe. The Deployment
          # controller restarts the pod if the process exits.
          resources:
            {{- toYaml (default .Values.resources $c.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.nodeSelector $c.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity $c.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations $c.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

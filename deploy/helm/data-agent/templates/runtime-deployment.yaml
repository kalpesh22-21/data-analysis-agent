{{- $c := .Values.components.runtime -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "runtime" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-agent.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent.componentLabels" $cmpArgs | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "data-agent.componentSelectorLabels" $cmpArgs | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "data-agent.checksumAnnotations" $ | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "data-agent.componentSelectorLabels" $cmpArgs | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) ($c.podSecurityContext | default dict)) | nindent 8 }}
      containers:
        - name: runtime
          image: {{ include "data-agent.image" (dict "root" $ "component" $c) }}
          imagePullPolicy: {{ include "data-agent.imagePullPolicy" (dict "root" $ "component" $c) }}
          # The core agent API, same `create_app` factory as ever — but through the
          # repo's launcher, NOT the uvicorn CLI. uvicorn re-raises the SIGTERM it
          # captured onto the SIG_DFL it restores after `serve()` returns, so a clean
          # rollout shutdown still exited 143 and read as a crash (ISSUES.md C3); the
          # launcher chains that re-raise and exits 0.
          command:
            - python
            - scripts/run_runtime_api.py
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) ($c.securityContext | default dict)) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            {{- include "data-agent.envFrom" $ | nindent 12 }}
          {{- with concat (.Values.env | default list) ($c.env | default list) }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # READINESS gates on the graph: GET /ready is unauthenticated and returns 200
          # only once the singleton hydrator has seeded neo4j (the :CorpusMeta.corpus_sha
          # singleton is present), 503 otherwise — so a pod stays OUT of the Service until
          # it can actually recall (Neo4j-absent deploys report ready immediately).
          #
          # timeoutSeconds: 5 — the kubelet default (1s) is BELOW the runtime's 10s Neo4j
          # query timeout, so a slow-but-healthy DB would flap pods; 5s gives the readiness
          # query room without waiting on the full degrade budget.
          #
          # REBUILD WINDOW (intended maintenance behavior): when the hydrator does a scoped
          # source='mcp' rebuild (a model/dimension change) it deletes :CorpusMeta, so EVERY
          # runtime replica reads 503 and de-routes until the reseed re-stamps it. That is
          # correct — it keeps stale/empty-recall pods out of the Service during the rebuild.
          # failureThreshold*periodSeconds (3*10=30s) bounds how long a pod tolerates the
          # cold window before de-routing; tune consciously against your corpus reseed time.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # LIVENESS stays a TCP probe: it tests that the PROCESS is up, not that the
          # graph is seeded — so hydrator lag never restarts a pod (it only de-routes it
          # via the readiness gate above).
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml (default .Values.resources $c.resources) | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem=true -> writable scratch space at /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.nodeSelector $c.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity $c.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations $c.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

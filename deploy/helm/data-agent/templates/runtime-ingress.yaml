{{- if and .Values.ingress.enabled .Values.components.runtime.enabled -}}
{{- $cmpArgs := dict "root" $ "component" "runtime" -}}
{{- $svcName := include "data-agent.componentFullname" $cmpArgs -}}
{{- $svcPort := .Values.components.runtime.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "data-agent.componentLabels" $cmpArgs | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- /* OPTIONAL. Omit secretName to use the ingress controller's default
             certificate; set it for a BYO cert, or to name the Secret
             cert-manager's ingress-shim should create from the cluster-issuer
             annotation (the shim needs a name to write to). */}}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}

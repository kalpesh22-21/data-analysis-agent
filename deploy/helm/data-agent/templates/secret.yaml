{{/*
Chart-managed Secret of SECRET env, mounted into every workload via envFrom.
Only rendered when secrets.existingSecret is empty — otherwise the user-supplied
Secret is referenced directly (see the secretName helper).
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-agent.secretName" . }}
  labels:
    {{- include "data-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets.data }}
  {{- if ne (toString $val) "" }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}

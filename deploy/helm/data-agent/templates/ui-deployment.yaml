{{- $c := .Values.components.ui -}}
{{- if $c.enabled }}
{{- $cmpArgs := dict "root" $ "component" "ui" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-agent.componentFullname" $cmpArgs }}
  labels:
    {{- include "data-agent.componentLabels" $cmpArgs | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-agent.componentSelectorLabels" $cmpArgs | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "data-agent.checksumAnnotations" $ | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "data-agent.componentSelectorLabels" $cmpArgs | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) ($c.podSecurityContext | default dict)) | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "data-agent.image" (dict "root" $ "component" $c) }}
          imagePullPolicy: {{ include "data-agent.imagePullPolicy" (dict "root" $ "component" $c) }}
          # Thin backend-for-frontend; serves the static page + proxies to runtime.
          # Launched through the repo script, not the uvicorn CLI: uvicorn re-raises the
          # captured SIGTERM onto the restored SIG_DFL after `serve()` returns, so a
          # clean rollout shutdown exited 143 (ISSUES.md C3). Same app, same flags.
          command:
            - python
            - scripts/run_ui_bff.py
            - --host
            - "0.0.0.0"
            - --port
            - "3000"
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) ($c.securityContext | default dict)) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            {{- include "data-agent.envFrom" $ | nindent 12 }}
          {{- with concat (.Values.env | default list) ($c.env | default list) }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The UI serves GET / (the static page) without auth -> HTTP probe.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml (default .Values.resources $c.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.nodeSelector $c.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.affinity $c.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.tolerations $c.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

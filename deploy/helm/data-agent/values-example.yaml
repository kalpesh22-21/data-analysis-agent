# ---------------------------------------------------------------------------
# values-example.yaml — a realistic PRODUCTION-style override for data-agent
# (the ONLINE plane: runtime + agent UI + hydrator).
#
# This file doubles as documentation of a real deployment. It:
#   * pins a concrete image repo + tag (build/push your own — see README)
#   * points every workload at real external service endpoints
#   * exposes the agent UI via an Ingress with TLS
#   * sets resource requests/limits per component
#   * enables the runtime HPA + PDBs
#   * references a pre-created Secret (existingSecret) instead of inline secrets
#
# Install with:
#   helm upgrade --install data-agent deploy/helm/data-agent \
#     -f deploy/helm/data-agent/values-example.yaml
#
# The offline learning plane is a SECOND release from a SECOND chart:
#   helm upgrade --install data-agent-learning deploy/helm/data-agent-learning \
#     -f deploy/helm/data-agent-learning/values-example.yaml
# Both must agree on the Couchbase session bucket, the Neo4j graph and the
# TENANT_* triple — see the shared-secret note in deploy/helm/README.md.
# ---------------------------------------------------------------------------

image:
  # Your built-and-pushed application image (all workloads share it — and it is
  # the SAME image the data-agent-learning chart deploys).
  repository: ghcr.io/acme/data-agent
  tag: "1.4.2"
  pullPolicy: IfNotPresent

# Pull secret for the private registry (must exist in the namespace).
imagePullSecrets:
  - name: ghcr-pull

serviceAccount:
  create: true
  # Example: bind to a cloud IAM role for pulling secrets / OTLP export.
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/data-agent

# ---- External service endpoints (all EXTERNAL infra, not deployed here) ----
config:
  MCP_URL: "http://clickhouse-api.data.svc.cluster.local:8000/mcp"
  CATALOG_SOURCE: "mcp"
  # Set CATALOG_API_URL explicitly when the MCP sits behind a path-routed
  # ingress — the derivation from MCP_URL DISCARDS the path prefix.
  CATALOG_API_URL: ""
  SCRATCH_ENABLED: "true"
  OPENAI_MODEL: "gpt-4o"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  MODEL_CONTEXT_WINDOW: "128000"

  # Session store. The learning chart's sweeper scans THIS bucket for idle
  # sessions — keep the two charts pointed at the same cluster + bucket.
  COUCHBASE_CONNECTION_STRING: "couchbases://couchbase.data.svc.cluster.local"
  COUCHBASE_USERNAME: "data_agent"
  COUCHBASE_BUCKET: "data_agent"

  OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTLP_SERVICE_NAME: "data-agent-runtime"

  JWKS_URL: "https://idp.acme.com/.well-known/jwks.json"
  JWT_ISSUER: "https://idp.acme.com/"
  JWT_AUDIENCE: "data-agent"
  TOKEN_SERVICE_URL: "https://idp.acme.com/token"

  # The warehouse tenant this deployment reads as. YOU MUST SET ALL THREE: the chart
  # defaults them to "" on purpose, because there is no safe default for "which
  # tenant?" and a wrong one is invisible — row policies FILTER rather than error, so
  # a misconfigured tenant yields zero rows and the golden replay's grain check reads
  # 0 == 0 and passes. Required by the MCP on EVERY call (403 MISSING_TENANT_CLAIM
  # otherwise).
  #
  # SET THE SAME THREE VALUES in the data-agent-learning chart: its offline golden
  # replay mints its own token and must replay as this same principal. Divergence
  # between the two charts is silent for exactly the reason above.
  TENANT_CLIENT_CODE: "ACME"
  TENANT_PROC_CENTER: "PC42"
  TENANT_JTI: "svc-data-agent"

  NEO4J_URL: "bolt://neo4j.data.svc.cluster.local:7687"
  NEO4J_USERNAME: "neo4j"

  EMBEDDING_API_URL: "http://embedding.ml.svc.cluster.local:8080/embed"
  EMBEDDING_MODEL: "text-embedding-3-small"
  RERANKER_API_URL: "http://reranker.ml.svc.cluster.local:8080/rerank"
  RERANKER_MODEL: "rerank-english-v3"
  RETRIEVAL_ENABLED: "true"
  SESSION_TTL_SECONDS: "3600"

  # Hydrator daemon (singleton neo4j seeder). HYDRATOR_ENABLED is the kill-switch
  # it re-reads every cycle; the poll interval is its MCP export re-check cadence.
  HYDRATOR_ENABLED: "true"
  HYDRATOR_POLL_INTERVAL_SECONDS: "60"

  UPLOAD_MAX_BYTES: "8388608"
  # RUNTIME_URL left empty -> auto-derived from the release name.
  RUNTIME_URL: ""

# ---- Secrets: reference a Secret you created out-of-band ----
# Create it first, e.g.:
#   kubectl create secret generic data-agent-secrets \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=COUCHBASE_PASSWORD=... \
#     --from-literal=NEO4J_PASSWORD=... \
#     --from-literal=MCP_SERVICE_KEY=... \
#     --from-literal=TOKEN_ISSUER_API_KEY=... \
#     --from-literal=EMBEDDING_API_KEY=... \
#     --from-literal=RERANKER_API_KEY=...
# The chart-managed Secret is NOT rendered when existingSecret is set.
#
# Point the data-agent-learning release at this SAME Secret (it needs
# COUCHBASE_PASSWORD / NEO4J_PASSWORD / TOKEN_ISSUER_API_KEY / EMBEDDING_API_KEY
# too, plus its own learning-only keys) so the shared credentials cannot drift.
secrets:
  existingSecret: data-agent-secrets

# ---- Per-workload sizing ----
components:
  runtime:
    replicaCount: 2            # ignored because autoscaling is enabled below
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  ui:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  hydrator:
    # Singleton seeder — pinned to 1 replica by the template, no knob to raise it.
    # Every runtime pod's /ready gate depends on this daemon having seeded neo4j.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ---- Expose the agent UI via Ingress + TLS ----
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  hosts:
    - host: data-agent.acme.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: data-agent-tls
      hosts:
        - data-agent.acme.com

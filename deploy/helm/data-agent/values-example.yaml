# ---------------------------------------------------------------------------
# values-example.yaml — a realistic PRODUCTION-style override for data-agent.
#
# This file doubles as documentation of a real deployment. It:
#   * pins a concrete image repo + tag (build/push your own — see README)
#   * points every workload at real external service endpoints
#   * exposes the UI via an Ingress with TLS
#   * sets resource requests/limits per component
#   * enables the learning-consumer HPA and scales the consumer to 2
#   * references a pre-created Secret (existingSecret) instead of inline secrets
#
# Install with:
#   helm upgrade --install data-agent deploy/helm/data-agent \
#     -f deploy/helm/data-agent/values-example.yaml
# ---------------------------------------------------------------------------

image:
  # Your built-and-pushed application image (all workloads share it).
  repository: ghcr.io/acme/data-agent
  tag: "1.4.2"
  pullPolicy: IfNotPresent

# Pull secret for the private registry (must exist in the namespace).
imagePullSecrets:
  - name: ghcr-pull

serviceAccount:
  create: true
  # Example: bind to a cloud IAM role for pulling secrets / OTLP export.
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/data-agent

# ---- External service endpoints (all EXTERNAL infra, not deployed here) ----
config:
  MCP_URL: "http://clickhouse-api.data.svc.cluster.local:8000/mcp"
  SCRATCH_ENABLED: "true"
  OPENAI_MODEL: "gpt-4o"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  MODEL_CONTEXT_WINDOW: "128000"

  COUCHBASE_CONNECTION_STRING: "couchbases://couchbase.data.svc.cluster.local"
  COUCHBASE_USERNAME: "data_agent"
  COUCHBASE_BUCKET: "data_agent"

  OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTLP_SERVICE_NAME: "data-agent-runtime"

  JWKS_URL: "https://idp.acme.com/.well-known/jwks.json"
  JWT_ISSUER: "https://idp.acme.com/"
  JWT_AUDIENCE: "data-agent"
  TOKEN_SERVICE_URL: "https://idp.acme.com/token"

  # The warehouse tenant this deployment reads as. Required by the MCP on EVERY
  # call (403 MISSING_TENANT_CLAIM otherwise); TENANT_JTI is also the principal the
  # offline golden replay runs as, so it must be one the row policies grant rows to.
  TENANT_CLIENT_CODE: "ACME"
  TENANT_PROC_CENTER: "PC42"
  TENANT_JTI: "svc-data-agent"

  NEO4J_URL: "bolt://neo4j.data.svc.cluster.local:7687"
  NEO4J_USERNAME: "neo4j"

  EMBEDDING_API_URL: "http://embedding.ml.svc.cluster.local:8080/embed"
  EMBEDDING_MODEL: "text-embedding-3-small"
  RERANKER_API_URL: "http://reranker.ml.svc.cluster.local:8080/rerank"
  RERANKER_MODEL: "rerank-english-v3"
  RETRIEVAL_ENABLED: "true"
  SESSION_TTL_SECONDS: "3600"

  # Learning loop backing services.
  LEARNING_REDIS_URL: "redis://redis-master.data.svc.cluster.local:6379/0"
  LEARNING_JOBS_STREAM: "learning:jobs"
  LEARNING_CONSUMER_GROUP: "learning-consumers"
  LEARNING_IDLE_THRESHOLD_SECONDS: "900"
  LEARNING_SWEEP_INTERVAL_SECONDS: "60"
  LEARNING_ENABLED: "true"
  LEARNING_EXTRACTOR_MODEL: "gpt-4o"
  LEARNING_AUDIT_CONNECTION_STRING: "couchbases://couchbase.data.svc.cluster.local"
  LEARNING_AUDIT_BUCKET: "learning_audit"
  LEARNING_AUDIT_USERNAME: "learning_audit"
  LEARNING_CANDIDATES_CONNECTION_STRING: "couchbases://couchbase.data.svc.cluster.local"
  LEARNING_CANDIDATES_BUCKET: "learning_candidates"
  LEARNING_CANDIDATES_USERNAME: "learning_candidates"
  LEARNING_CORPUS_CONNECTION_STRING: "couchbases://couchbase.data.svc.cluster.local"
  LEARNING_CORPUS_BUCKET: "learning_corpus"
  LEARNING_CORPUS_USERNAME: "learning_corpus"

  UPLOAD_MAX_BYTES: "8388608"
  # RUNTIME_URL / INBOX_SERVICE_URL left empty -> auto-derived from release name.
  RUNTIME_URL: ""
  INBOX_SERVICE_URL: ""

# ---- Secrets: reference a Secret you created out-of-band ----
# Create it first, e.g.:
#   kubectl create secret generic data-agent-secrets \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=COUCHBASE_PASSWORD=... \
#     --from-literal=NEO4J_PASSWORD=... \
#     --from-literal=TOKEN_ISSUER_API_KEY=... \
#     --from-literal=EMBEDDING_API_KEY=... \
#     --from-literal=RERANKER_API_KEY=... \
#     --from-literal=LEARNING_EXTRACTOR_API_KEY=... \
#     --from-literal=LEARNING_AUDIT_PASSWORD=... \
#     --from-literal=LEARNING_CANDIDATES_PASSWORD=... \
#     --from-literal=LEARNING_CORPUS_PASSWORD=... \
#     --from-literal=REVIEWER_TOKEN=...
# The chart-managed Secret is NOT rendered when existingSecret is set.
secrets:
  existingSecret: data-agent-secrets

# ---- Per-workload sizing ----
components:
  runtime:
    replicaCount: 2            # ignored because autoscaling is enabled below
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  ui:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  learningSweeper:
    # Keep at 1 replica (periodic idle-scan sweeper).
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi

  learningConsumer:
    replicaCount: 2            # scale the Redis Streams consumer group to 2
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    autoscaling:
      enabled: true            # enable the consumer HPA
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 75

  inbox:
    # Enable if you run the human review-inbox flow.
    enabled: false

# ---- Expose the UI via Ingress + TLS ----
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  hosts:
    - host: data-agent.acme.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: data-agent-tls
      hosts:
        - data-agent.acme.com

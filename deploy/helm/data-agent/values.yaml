# Default values for data-agent.
# This is a YAML-formatted file.
# Every value is documented inline. See deploy/helm/README.md for the big picture.
#
# IMPORTANT: All of the first-party workloads in THIS chart (runtime, ui,
# hydrator) run from ONE image built from this repo. External backing services
# (ClickHouse, MCP/clickhouse-api, token IdP, OpenAI, Couchbase, Neo4j,
# embedding/reranker APIs) are NOT deployed by this chart — provision them
# separately and point to them via `config` + `secrets`.
#
# THE OFFLINE LEARNING PLANE LIVES IN A SEPARATE CHART:
# `deploy/helm/data-agent-learning` (learning sweeper/consumer/scheduler, the
# review-inbox service, and the reviewer UI). It ships the SAME image and shares
# the same Couchbase cluster + tenant identity — see the shared-secret note on
# `secrets` below before installing the two side by side.

# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full name of resources (defaults to <release>-data-agent).
fullnameOverride: ""

image:
  # -- Container image repository for ALL workloads.
  #    There is no published image yet — you MUST build and push your own image
  #    from this repo (see deploy/helm/README.md) and set this value.
  repository: ghcr.io/example/data-agent
  # -- Image tag. Defaults to the chart appVersion when left empty.
  tag: ""
  # -- Image pull policy (IfNotPresent | Always | Never).
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries (list of {name: <secret>}).
imagePullSecrets: []
#  - name: regcred

serviceAccount:
  # -- Create a dedicated ServiceAccount used by all pods.
  create: true
  # -- Name of the ServiceAccount. Generated from the fullname when empty.
  name: ""
  # -- Annotations to add to the ServiceAccount (e.g. IRSA / workload identity).
  annotations: {}
  # -- Automount the ServiceAccount API token into pods. Default false: no
  #    workload talks to the Kubernetes API, so the token is not needed. Also
  #    enforced at the pod level so the posture holds when create=false.
  automount: false

# -- Global pod annotations applied to every workload (merged with the ConfigMap
#    checksum annotation and any per-component podAnnotations). There is no
#    secret checksum — the Secret is out-of-band and the chart cannot hash it.
podAnnotations: {}

# -- Global pod-level securityContext (fsGroup etc.). Sensible non-root defaults.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Global container-level securityContext. Hardened by default; the app runs
#    read-only-root with an emptyDir mounted at /tmp for scratch writes.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Global default resource requests/limits. Override per component under
#    `components.<name>.resources`. Empty by default so the chart installs on
#    small clusters; SET THESE in production (see values-example.yaml).
resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    cpu: "1"
#    memory: 1Gi

# -- Global scheduling controls; each is overridable per component.
nodeSelector: {}
tolerations: []
affinity: {}

# -- Global extra environment variables (list of core-v1 EnvVar), applied to
#    every workload. Explicit `env` entries always take precedence over values
#    from envFrom (ConfigMap/Secret), regardless of ordering. Per-component
#    `env` is concatenated after these. Example:
#    - name: LOG_LEVEL
#      value: info
env: []

# ---------------------------------------------------------------------------
# Non-secret configuration -> rendered into a shared ConfigMap and mounted via
# `envFrom` into every workload. 1:1 with the app's pydantic-settings fields
# (uppercased env-var names). Leave a value empty ("") to omit it and fall back
# to the application's built-in default.
# ---------------------------------------------------------------------------
config:
  # --- runtime / agent core ---
  # -- URL of the MCP (clickhouse-api) service. EXTERNAL.
  MCP_URL: "http://clickhouse-api:8000/mcp"
  # -- Where the semantic catalog is sourced from: "mcp" (live GET
  #    /catalog/export off the MCP host) or "fixture" (offline JSON on disk).
  CATALOG_SOURCE: "mcp"
  # -- Explicit base URL of the MCP catalog export (…/catalog; /export is
  #    appended). Empty = derive scheme+host from MCP_URL. SET THIS when the MCP
  #    is behind a path-routed ingress (e.g. https://host/prefix/mcp), because
  #    the derivation DISCARDS the path prefix and would otherwise target
  #    https://host/catalog.
  CATALOG_API_URL: ""
  # -- Path to the offline catalog-export JSON, used only when
  #    CATALOG_SOURCE="fixture". Empty = the committed repo fixture.
  CATALOG_FIXTURE_PATH: ""
  # -- Enable the scratch workspace feature.
  SCRATCH_ENABLED: "true"
  # -- OpenAI (or compatible) chat model name.
  OPENAI_MODEL: "gpt-4o"
  # -- OpenAI (or compatible) base URL. Empty = OpenAI default.
  OPENAI_BASE_URL: ""
  # -- Model context window (tokens) the runtime plans against.
  MODEL_CONTEXT_WINDOW: "128000"
  # -- Couchbase connection string (primary session store). EXTERNAL.
  #    SHARED WITH THE LEARNING CHART: the learning sweeper scans THIS KEYSPACE for
  #    idle sessions, so `data-agent-learning` must point at the same cluster,
  #    credentials and — since the sweeper builds a three-part
  #    `bucket`.`scope`.`collection` for its N1QL scan — the same bucket, scope AND
  #    sessions collection. A mismatch in ANY of the four is silent: the sweeper just
  #    never finds a session to learn from. Changing the scope/collection below
  #    without changing them on the learning side is exactly that failure.
  COUCHBASE_CONNECTION_STRING: "couchbase://couchbase"
  # -- Couchbase username.
  COUCHBASE_USERNAME: "data_agent"
  # -- Couchbase bucket for sessions.
  COUCHBASE_BUCKET: "data_agent"
  # -- Scope + the two collections inside it. The session store binds
  #    `bucket.scope(SCOPE).collection(...)`, and `_default` is the same handle
  #    `bucket.default_collection()` returns — so leaving SCOPE at "_default" is
  #    byte-identical to a deployment predating these keys.
  #    Set them for a CONSOLIDATED bucket, where every store lives in one bucket
  #    separated by named scopes, e.g.
  #      COUCHBASE_BUCKET: "pcm_iwant"
  #      COUCHBASE_SCOPE: "sessions"
  #    alongside the learning chart's `learning` and `user` scopes. Provisioning must
  #    create the scope + BOTH collections and grant this credential on them; the
  #    shared bucket must also be created with maxTTL=0 (see the learning chart's
  #    values.yaml for why — the durable corpus/user-knowledge docs are capped by it).
  COUCHBASE_SCOPE: "_default"
  # -- Session documents (`session::<id>`), and the D46 full tool results
  #    (`result::<uuid>`) the preview shape points at. TWO collections, one scope.
  COUCHBASE_SESSIONS_COLLECTION: "sessions"
  COUCHBASE_RESULTS_COLLECTION: "session_results"
  # -- OTLP traces endpoint. Empty disables OTLP export.
  OTLP_ENDPOINT: ""
  # -- Service name reported to the OTLP collector.
  OTLP_SERVICE_NAME: "data-agent-runtime"
  # -- JWKS URL used to validate inbound JWTs. EXTERNAL (token IdP).
  JWKS_URL: "http://token:8000/.well-known/jwks.json"
  # -- Expected JWT issuer.
  JWT_ISSUER: "https://token.example.com"
  # -- Expected JWT audience.
  JWT_AUDIENCE: "data-agent"
  # -- Token service (IdP) token endpoint. EXTERNAL.
  TOKEN_SERVICE_URL: "http://token:8000/token"
  # The three warehouse tenant claims. DELIBERATELY BLANK IN THIS CHART — there is
  # no safe default for "which tenant is this?", and the previous defaults were the
  # LOCAL DEV SEED (CLIENT_A / PC01 / TESTJTI001, see
  # docker/clickhouse-init/hr-4tables-snake-migration.sql). Shipping those meant a
  # deployment that simply forgot to configure a tenant still MINTED one: row
  # policies FILTER rather than error, so the golden replay would match zero rows
  # and its grain check would read 0 == 0 and pass — every replay a silent
  # structural pass against nobody's data. Blank instead makes the readiness gates
  # in `scripts/run_learning_scheduler.py` and `learning/inbox/service.py` fire, and
  # the deployment drops into its LOGGED dormant posture (nothing auto-promotes)
  # rather than into a green that means nothing.
  # `values-example.yaml` carries the configured shape; the code defaults in
  # `runtime/config.py` keep the dev seed for a local `uv run`.
  #
  # TWO CHARTS, ONE TENANT. The learning chart (`data-agent-learning`) carries the
  # SAME three keys, because its offline golden replay mints its own token and must
  # replay as the tenant this agent reads as. Setting them in only one chart — or to
  # different values in the two — is SILENT: row policies filter rather than error, so
  # the replay simply matches a different (or empty) row set and its grain check still
  # passes. Wire BOTH charts to the SAME `secrets.existingSecret` (see the note on
  # `secrets` below) and keep the two `config` blocks' TENANT_* values identical.
  #
  # -- Warehouse tenant claim 'clientcode' (→ ClickHouse setting paycom_client_code).
  #    Required by the MCP on every call; a token without it is rejected 403
  #    MISSING_TENANT_CLAIM. Read by BOTH the UI BFF (per-request mint) and the
  #    offline learning replay. Must be a tenant whose data this deployment reads.
  TENANT_CLIENT_CODE: ""
  # -- Warehouse tenant claim 'proc_center' (→ paycom_proc_center).
  TENANT_PROC_CENTER: ""
  # -- Warehouse tenant claim 'jti' (→ paycom_authenticated_user). The PRINCIPAL the
  #    offline golden replay runs as: the employee/payroll row policies gate on it,
  #    so the replay sees exactly this principal's employee set.
  TENANT_JTI: ""
  # -- Neo4j bolt URL (retrieval graph). EXTERNAL.
  NEO4J_URL: "bolt://neo4j:7687"
  # -- Neo4j username.
  NEO4J_USERNAME: "neo4j"
  # -- Embedding API base URL. EXTERNAL.
  EMBEDDING_API_URL: "http://embedding:8080/embed"
  # -- Embedding model name.
  EMBEDDING_MODEL: "text-embedding-3-small"
  # -- Hydrator daemon re-check cadence (seconds between MCP export polls).
  HYDRATOR_POLL_INTERVAL_SECONDS: "60"
  # -- Master kill-switch for the singleton hydrator daemon (read fresh per cycle).
  HYDRATOR_ENABLED: "true"
  # -- Reranker API base URL. EXTERNAL.
  RERANKER_API_URL: "http://reranker:8080/rerank"
  # -- Reranker model name.
  RERANKER_MODEL: "rerank-english-v3"
  # -- Enable retrieval-augmented planning.
  RETRIEVAL_ENABLED: "true"
  # -- Session TTL in seconds.
  SESSION_TTL_SECONDS: "3600"

  # --- ui (backend-for-frontend) ---
  # -- Max upload size (bytes) accepted by the UI BFF. Default 8 MiB.
  UPLOAD_MAX_BYTES: "8388608"
  # -- RUNTIME_URL for the UI. Leave empty to auto-derive the in-cluster runtime
  #    Service URL from the release name. Override to point elsewhere.
  RUNTIME_URL: ""
  # NOTE: this chart deliberately sets NO `REVIEW_INBOX_ENABLED` and NO
  # `INBOX_SERVICE_URL`. `ui/server.py` carries the reviewer surface (GET /inbox,
  # /api/inbox/*) in the same app, gated OFF unless REVIEW_INBOX_ENABLED=1 — so
  # here every inbox route 404s and the agent UI cannot reach the review queue.
  # The reviewer surface is deployed by the `data-agent-learning` chart, which runs
  # the SAME image with the flag on and its own Ingress.

# ---------------------------------------------------------------------------
# Secret configuration.
#
# THIS CHART DOES NOT RENDER A SECRET. Secret material never passes through
# values, a rendered manifest, or `helm get values` output. Create the Secret
# OUT-OF-BAND (vault / external-secrets / sealed-secrets) with the keys listed
# below, and either:
#   * name it `<fullname>-secret` — i.e. `<release>-data-agent-secret`, truncated
#     to fit 63 chars — and leave `existingSecret` empty, or
#   * set `secrets.existingSecret: <name>` and call it whatever you like.
# Every workload mounts it wholesale via envFrom, so the Secret must EXIST before
# the pods start: envFrom against a missing Secret leaves them wedged in
# CreateContainerConfigError, not failing loudly.
#
# NO CHECKSUM, NO AUTO-ROLL. The chart cannot see the Secret's contents, so
# rotating a key does not restart the pods (the ConfigMap checksum still does its
# half). Roll them yourself:
#   kubectl rollout restart deploy -l app.kubernetes.io/instance=<release>
#
# RECOMMENDED WITH THE LEARNING CHART: point BOTH `data-agent` and
# `data-agent-learning` at the SAME Secret. `COUCHBASE_PASSWORD`,
# `NEO4J_PASSWORD` and the tenant identity they authenticate are the same identity
# in both planes — the learning replay reads the agent's warehouse as the agent's
# tenant. Two independently-edited Secrets drift, and the drift is SILENT: the
# warehouse row policies FILTER rather than error, so the learning plane keeps
# running and verifies promotions against the wrong (or an empty) row set. Unused
# keys in a shared Secret are harmless; each pod only reads what it needs.
#
# Keys this chart's workloads read:
#
#   OPENAI_API_KEY
#   COUCHBASE_PASSWORD
#   NEO4J_PASSWORD
#   MCP_SERVICE_KEY
#       Static service key for the MCP export routes (sent as X-Service-Key). Read
#       via the shared envFrom Secret, so it reaches BOTH the hydrator daemon
#       (which seeds neo4j with it) and the runtime (its decoupled catalog-handle
#       fetch). ABSENT ⇒ the hydrator REFUSES to start, neo4j is never seeded, and
#       every runtime pod fails its /ready gate forever.
#   TOKEN_ISSUER_API_KEY
#   EMBEDDING_API_KEY
#   RERANKER_API_KEY
# ---------------------------------------------------------------------------
secrets:
  # -- Name of the pre-existing Secret to mount via envFrom. Empty = the
  #    conventional `<fullname>-secret`, which you still have to create yourself.
  existingSecret: ""

# ---------------------------------------------------------------------------
# Per-workload configuration.
#
# Each component may override: enabled, replicaCount, image, resources,
# nodeSelector, tolerations, affinity, podAnnotations, podSecurityContext,
# securityContext, and env (extra). Anything left null/empty falls back to the
# global values above.
# ---------------------------------------------------------------------------
components:

  # ----- runtime: the core agent API (main scalable Deployment) -----
  runtime:
    enabled: true
    # -- Replica count (ignored when autoscaling.enabled=true).
    replicaCount: 1
    image: {}          # {repository, tag, pullPolicy} override; falls back to global
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    # -- Extra env (list of core-v1 EnvVar), appended after envFrom.
    env: []
    service:
      # -- Service type for the runtime API.
      type: ClusterIP
      # -- Service port (also the container port; readiness/liveness TCP probe).
      port: 8000
      annotations: {}
    autoscaling:
      # -- Enable an HPA for the runtime Deployment.
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      # -- Optional memory target (set to enable a memory metric).
      targetMemoryUtilizationPercentage: 0
    podDisruptionBudget:
      # -- Enable a PodDisruptionBudget for the runtime Deployment.
      enabled: false
      minAvailable: 1
      # maxUnavailable: 1   # set one of minAvailable / maxUnavailable

  # ----- ui: thin backend-for-frontend (gets the optional Ingress) -----
  ui:
    enabled: true
    replicaCount: 1
    image: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    env: []
    service:
      type: ClusterIP
      port: 3000
      annotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1

  # ----- hydrator: singleton neo4j seeder daemon (DO NOT scale) -----
  # Replica count is hardcoded to 1 in the template: this is the SINGLETON graph seeder
  # that owns the destructive nuke/rebuild; running >1 replica would race the graph write
  # path. No replicaCount/autoscaling knobs by design.
  hydrator:
    enabled: true
    image: {}
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
    securityContext: {}
    env: []

# ---------------------------------------------------------------------------
# Ingress for the RUNTIME API (templates/runtime-ingress.yaml).
#
# This publishes the core agent API itself, not the UI — every route behind it
# is authenticated by the runtime's own JWT validation (JWKS_URL / JWT_ISSUER /
# JWT_AUDIENCE above), so leave it disabled unless something outside the cluster
# genuinely has to call the API directly. The browser surface is `uiIngress`.
#
# Adding an entry to `tls` switches the rules to HTTPS. `secretName` in an entry
# is OPTIONAL: omit it to use the ingress controller's DEFAULT certificate;
# set it for a BYO certificate, or when cert-manager should provision one — its
# ingress-shim reads the cluster-issuer annotation below but needs a `secretName`
# to write the issued certificate into. An annotation alone provisions nothing.
# ---------------------------------------------------------------------------
ingress:
  # -- Enable an Ingress in front of the runtime Service.
  enabled: false
  # -- IngressClass name (e.g. nginx, traefik).
  className: ""
  # -- Ingress annotations.
  annotations: {}
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: data-agent-api.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration (list of {hosts[], secretName?}). `secretName` is
  #    optional — omit it for the controller's default certificate.
  tls: []
    # - hosts:
    #     - data-agent-api.example.com
    #   secretName: data-agent-api-tls

# ---------------------------------------------------------------------------
# Ingress for the AGENT UI backend-for-frontend (templates/ui-ingress.yaml).
#
# Same shape as `ingress` above, pointed at the ui Service. This is the
# browser-facing door: the BFF mints the warehouse token server-side, so anyone
# who reaches this host is an agent user. Put your human authn (OIDC /
# forward-auth / IP allowlist) in the annotations — the app authenticates the
# BFF→runtime hop, not the person.
#
# NOTE: the reviewer surface is NOT here. `ui/server.py` carries GET /inbox and
# /api/inbox/* in the same app, but this release sets no REVIEW_INBOX_ENABLED,
# so those routes 404. The reviewer Ingress belongs to `data-agent-learning`.
#
# `tls[].secretName` is optional, exactly as on `ingress` above — omit it for the
# controller's default certificate, set it for BYO or for cert-manager to write
# the issued certificate into.
# ---------------------------------------------------------------------------
uiIngress:
  # -- Enable an Ingress in front of the ui Service.
  enabled: false
  # -- IngressClass name (e.g. nginx, traefik).
  className: ""
  # -- Ingress annotations. Put your reviewer/user authn here.
  annotations: {}
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: data-agent.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration (list of {hosts[], secretName?}). `secretName` is
  #    optional — omit it for the controller's default certificate.
  tls: []
    # - hosts:
    #     - data-agent.example.com
    #   secretName: data-agent-tls

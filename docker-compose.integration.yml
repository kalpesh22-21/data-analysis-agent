# Layer-2 integration stack: real ClickHouse (seeded HR warehouse) + token IdP + the
# D83-enabled ClickHouse MCP. Lets the skip-guarded runtime integration tests run against
# real infra instead of fakes. DEV/TEST only (plain HTTP, ephemeral token-signing key).
#
# Usage:
#   docker compose -f docker-compose.integration.yml up -d --build
#   MCP_TEST_URL=http://localhost:18090/mcp uv run pytest tests/integration -v
#   docker compose -f docker-compose.integration.yml down -v
#
# The token/mcp images are BUILT from the clickhouse-api repo (../clickhouse-api).
name: data-agent-l2

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: l2-ch
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      # HR warehouse seed (this repo owns the Semantic Catalog it matches).
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro
      # Register the SQL_ custom-settings prefix so the MCP's SQL_tenant setting is accepted.
      - /Users/kalpeshmulye/Development/clickhouse-api/docker/clickhouse-config/custom-settings.xml:/etc/clickhouse-server/config.d/custom-settings.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "localhost", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  token:
    build:
      context: /Users/kalpeshmulye/Development/clickhouse-api
      dockerfile: Dockerfile
    container_name: l2-token
    environment:
      MODE: "token"
      TOKEN_ISSUER: "http://token:8000/"
      TOKEN_AUDIENCE: "clickhouse-api"
      TOKEN_TTL_SECONDS: "3600"
      TOKEN_ISSUER_API_KEY: "issuer-key-abc123"
      TOKEN_DEV_MODE: "true"
      APP_PORT: "8000"
      LOG_LEVEL: "INFO"
    ports:
      - "19000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  mcp:
    build:
      context: /Users/kalpeshmulye/Development/clickhouse-api
      dockerfile: Dockerfile
    container_name: l2-mcp
    depends_on:
      clickhouse: { condition: service_healthy }
      token: { condition: service_healthy }
    environment:
      MODE: "mcp"
      MCP_TRANSPORT: "http"
      MCP_PORT: "8000"
      MCP_PATH: "/mcp"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "dbpcm_warehouse"
      OIDC_JWKS_URL: "http://token:8000/.well-known/jwks.json"
      OIDC_ISSUER: "http://token:8000/"
      OIDC_AUDIENCE: "clickhouse-api"
      API_KEY: "test-key-abc123"
      ALLOWED_DATABASES: "*"
      LOG_LEVEL: "INFO"
      # D93 scratch-write side-channel (table-intermediate Slice 2). The scratch-only
      # credential (provisioned in docker/clickhouse-init/scratch-user.sql, GRANTed on
      # `scratch.*` ONLY — invariant #1) makes /scratch/v1/materialize + /drop live
      # over HTTP. Distinct from CLICKHOUSE_* so the warehouse read path stays on the
      # read-only `default` account and the write path can never touch the warehouse.
      SCRATCH_CH_HOST: "clickhouse"
      SCRATCH_CH_PORT: "8123"
      SCRATCH_CH_SECURE: "false"
      SCRATCH_CH_USER: "scratch_writer"
      SCRATCH_CH_PASSWORD: "scratch-pass"
      SCRATCH_DATABASE: "scratch"
      SCRATCH_TTL_SECONDS: "3600"
      SCRATCH_MAX_ROWS: "100000"
    ports:
      - "18090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Custom embedding + reranker APIs (D71). The Dockerfiles + mock services live in the
  # SQL repo (/Users/kalpeshmulye/Development/SQL) and are AUTHORITATIVE for the real API
  # contract; we build them here to run the skip-guarded Layer-2 tests against real weights.
  # NOTE: an absolute build context (the SQL repo) is intentional for this local-dev-only
  # compose — the images are not published and the SQL repo is a sibling checkout, not vendored.
  # Model weights (~440 MB embedding / ~85 MB reranker) are pre-downloaded at build time, so
  # the first build is slow (several minutes) but the first request is fast.
  embedding-api:
    build:
      context: /Users/kalpeshmulye/Development/SQL
      dockerfile: docker/Dockerfile.embedding
    container_name: l2-embedding
    ports:
      - "18003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      # Extra time for the first model load (weights pre-downloaded at build; startup
      # still deserializes ~440 MB into memory, ~10-30s).
      start_period: 60s

  reranker-api:
    build:
      context: /Users/kalpeshmulye/Development/SQL
      dockerfile: docker/Dockerfile.reranker
    container_name: l2-reranker
    ports:
      - "18004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      # Extra time for the first model load (weights pre-downloaded at build).
      start_period: 60s

  # neo4j retrieval corpus (D60/D86, neo4j-corpus-design §4.1). LTS with native
  # vector indexes GA (no APOC/GDS plugin needed — native vector search is core).
  # Community edition, single default `neo4j` database. DEV/TEST only (ephemeral
  # password). The Layer-2 test session owns schema + seed via the loader.
  neo4j:
    image: neo4j:5.26
    container_name: l2-neo4j
    environment:
      NEO4J_AUTH: "neo4j/testpassword"
      NEO4J_server_memory_pagecache_size: "512M"
    ports:
      - "7474:7474"   # http/browser
      - "7687:7687"   # bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Learning-loop transport (Track-B Slice 1, D30/D96). Redis Streams work +
  # dead-letter streams for the sweeper/consumer. DEV/TEST only. The sweeper and
  # consumer entrypoints read LEARNING_REDIS_URL=redis://localhost:6379/0 (host
  # port 6379); inside the compose network the service is reachable as `l2-redis`.
  l2-redis:
    image: redis:7-alpine
    container_name: l2-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Session store (D22/D44/D45) + the Slice-2 learning_audit store (D95) + the
  # Slice-3 learning_candidates store (D101). Init is done out-of-band after the
  # node reports healthy (Couchbase init is not fully declarative in the base
  # image): run ALL THREE
  #   scripts/couchbase-init.sh            (agent_sessions bucket + sessions/session_results)
  #   scripts/learning-audit-init.sh       (learning_audit bucket + learning_audit_writer RBAC)
  #   scripts/learning-candidates-init.sh  (learning_candidates bucket + writer RBAC + status index)
  # The consumer / Layer-2 tests then read the audit + candidate env:
  #   LEARNING_AUDIT_CONNECTION_STRING=couchbase://localhost
  #   LEARNING_AUDIT_BUCKET=learning_audit
  #   LEARNING_AUDIT_USERNAME=learning_audit_writer          LEARNING_AUDIT_PASSWORD=audit-writer-pass
  #   LEARNING_CANDIDATES_CONNECTION_STRING=couchbase://localhost
  #   LEARNING_CANDIDATES_BUCKET=learning_candidates
  #   LEARNING_CANDIDATES_USERNAME=learning_candidates_writer LEARNING_CANDIDATES_PASSWORD=candidates-writer-pass
  # (matching the credentials the init scripts provision). The single l2-cb node
  # hosts all three buckets; each learning bucket keeps its OWN retention/RBAC clock.
  couchbase:
    image: couchbase/server:7.6.5
    container_name: l2-cb
    ports:
      - "8091:8091"   # admin/REST
      - "8093:8093"   # query
      - "11210:11210" # KV
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/pools"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-agent"
version = "0.1.0"
description = "HR data-analysis agent — Phase 0 walking skeleton"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the 30.12.x line (D102/D48): the blueprint dedup `canonical_key` is
    # a hash of sqlglot's normalized AST render; a minor bump can change that render,
    # silently mint a different key, and degrade a dedup `increment` into a spurious
    # `insert` (a duplicate blueprint). Bump this deliberately + re-freeze the S4
    # `canonical_ast_norm` fixture together, never incidentally.
    "sqlglot~=30.12.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "mcp>=1.0",
    "couchbase>=4.0",
    "pyjwt[crypto]>=2.8",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "openinference-instrumentation-openai>=0.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "neo4j>=5.26,<6",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "extractor_tool_schema_complete: guards that build_extractor_tool() emits the fully-specified blueprint payload (kind + slot-type enum + FQ binds_to) a real LLM needs",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest-playwright>=0.8.0",
]

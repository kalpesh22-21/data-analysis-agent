# A1 case 11 — two blueprint intents, TWO tables on one answer (08 §H).
#
# Case 2 is the same routing shape and deliberately stays on the top-level `sql:`
# shorthand: that is the 6/6 path, and it now has a regression test by accident.
# This case is the multi-table half — same two blueprints, same two intents, but
# the answer designates BOTH results instead of one.
#
# WHAT A FIXTURE CANNOT FAKE HERE, which is the only reason the case earns its
# keep: the per-table `verification` blocks. A fixture can write a `tables` array;
# it cannot make `blueprint_gate` pass. Each block exists only because that
# blueprint's D56 verify came back clean, and the envelope's AND roll-up is
# computed from them, not declared.
#
# `runQuery` is scripted PER TOOL NAME and consumed IN ORDER — the executor's own
# dispatch sequence:
#   b1 (grain `[Department]`) -> node SQL, then the grain probe;
#   b2 (`result_grain: []`)   -> node SQL only, teeth skipped.
id: case-11-two-tables
question: Give me the active headcount by department and the projected hires over the next 6 months, as tables.
ground_truth:
  multi_intent: true
  intent_count: 2
column_scope:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.hire_date
corpus:
  - bp-active-headcount-by-department
  - bp-hires-projection
embedding:
  Give me the active headcount by department and the projected hires over the next 6 months, as tables.: [1.0, 0.0]
mcp_tools: [runQuery]
mcp_script:
  runQuery:
    - columns: [department, headcount]
      rows: [[Sales, 4], [Support, 3]]
      row_count: 2
      truncated: false
    - columns: [__bp_n, __bp_d]
      rows: [[2, 2]]
      row_count: 1
      truncated: false
    - columns: [hires_in_window, avg_monthly_hires, projected_next_n_hires]
      rows: [[12, 2.0, 12]]
      row_count: 1
      truncated: false
model_script:
  # Round 1 — declare the intents and EXPAND both blueprints (the runtime refuses a
  # runBlueprint for an id this turn has not expanded).
  - tool_calls:
      - name: updateAnalysisState
        id: s1
        args:
          intents:
            - description: Active headcount by department
            - description: Projected hires over the next 6 months
      - name: getBlueprint
        id: g1
        args: {id: bp-active-headcount-by-department}
      - name: getBlueprint
        id: g2
        args: {id: bp-hires-projection}
  # Round 2 — run them both.
  - tool_calls:
      - name: runBlueprint
        id: b1
        serves_intent: i1
        args:
          id: bp-active-headcount-by-department
          slot_bindings: {}
      - name: runBlueprint
        id: b2
        serves_intent: i2
        args:
          id: bp-hires-projection
          slot_bindings: {window_months: 6, horizon_months: 6}
  # Round 3 — close both intents and designate ONE TABLE PER PART. Note the
  # placeholder `sql: ""` beside each `blueprint_id`: that is the serialisation the
  # live model actually emits (03 §C.3.1 — it cannot omit a declared key), so the
  # fixture uses it rather than the tidy shape no model sends.
  - tool_calls:
      - name: updateAnalysisState
        id: s2
        args:
          intents:
            - {intent_id: i1, status: completed, evidence_tool_call_id: b1}
            - {intent_id: i2, status: completed, evidence_tool_call_id: b2}
      - name: answerWithTable
        id: a1
        args:
          answer: Sales has 4 active employees and Support 3; we project about 12 more hires.
          tables:
            - {sql: "", blueprint_id: bp-active-headcount-by-department, caption: Active headcount by department}
            - {sql: "", blueprint_id: bp-hires-projection, caption: "Projected hires, next 6 months"}
expect:
  intents_terminal: 2
  re_derivation: false
  answer_tables: 2
  # Both tables are a verified blueprint's result, so the AND roll-up is green.
  envelope_verification_passed: true

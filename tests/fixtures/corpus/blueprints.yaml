- id: bp-compensation-ranking
  intent: Top N highest-paid employees separately within Salary and Hourly pay types. Rank Salary by recorded
    annual_salary and Hourly by recorded hourly_salary. Show annual salary and hourly rate in separate
    columns; never annualize hourly pay. Defaults to Active + On Leave; top_n applies separately to each
    pay type.
  slots_summary: top_n, employee_status, department
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
    description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that
      ranking. It does not accept order_by or order_direction. A different selection or display order
      requires a separate query.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  result_grain:
  - Pay Type
  - Rank
  sql_template: "WITH compensation AS (\n  SELECT\n    e.employee_code,\n    e.employee_name,\n    e.department_name,\n\
    \    e.pay_type,\n    e.hourly_salary,\n    CASE\n      WHEN e.pay_type = 'Salary' AND e.annual_salary\
    \ > 0\n      THEN e.annual_salary\n      WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n    \
    \  THEN e.hourly_salary\n      ELSE NULL\n    END AS recorded_pay\n  FROM dbpcm_warehouse.employee\
    \ AS e\n  WHERE\n    (\n      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n\
    \    )\n    AND e.department_name IN ({department})\n), ranked AS (\n  SELECT\n    employee_code,\n\
    \    employee_name,\n    department_name,\n    pay_type,\n    hourly_salary,\n    recorded_pay,\n\
    \    row_number() OVER (PARTITION BY pay_type ORDER BY recorded_pay DESC, employee_code) AS compensation_rank\n\
    \  FROM compensation\n  WHERE\n    NOT (\n      recorded_pay IS NULL\n    )\n)\nSELECT\n  pay_type\
    \ AS \"Pay Type\",\n  compensation_rank AS \"Rank\",\n  employee_code AS \"Employee Code\",\n  employee_name\
    \ AS \"Employee Name\",\n  department_name AS \"Department\",\n  CASE WHEN pay_type = 'Salary' THEN\
    \ recorded_pay ELSE NULL END AS \"Annual Salary\",\n  CASE WHEN pay_type = 'Hourly' AND hourly_salary\
    \ > 0 THEN hourly_salary ELSE NULL END AS \"Hourly Rate\"\nFROM ranked\nWHERE\n  compensation_rank\
    \ <= {top_n}\nORDER BY\n  pay_type,\n  compensation_rank\n"
  uses_rules:
  - default_employee_population
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Rank:
      kind: integer
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-departments-above-company-average-salary
  intent: Departments above the corresponding company average, separately comparing recorded Salary annual
    salaries and Hourly hourly rates in their original units. Never annualize hourly pay. Defaults to
    Active + On Leave.
  slots_summary: employee_status, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  result_grain:
  - Department
  - Pay Type
  composes:
  - order: 0
    output:
      company_salary_avg: scalar
      company_hourly_avg: scalar
    sql_template: "SELECT\n  avg(\n    CASE WHEN pay_type = 'Salary' AND annual_salary > 0 THEN annual_salary\
      \ ELSE NULL END\n  ) AS company_salary_avg,\n  avg(\n    CASE WHEN pay_type = 'Hourly' AND hourly_salary\
      \ > 0 THEN hourly_salary ELSE NULL END\n  ) AS company_hourly_avg\nFROM dbpcm_warehouse.employee\n\
      WHERE\n  (\n    employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\n"
  - order: 1
    feeds_from:
    - 0
    consumes:
      company_salary_avg: $0.company_salary_avg
      company_hourly_avg: $0.company_hourly_avg
    output: {}
    sql_template: "SELECT\n  department_name AS \"Department\",\n  pay_type AS \"Pay Type\",\n  CASE\n\
      \    WHEN pay_type = 'Hourly'\n    THEN 'Recorded hourly rate (per hour)'\n    ELSE 'Recorded annual\
      \ salary'\n  END AS \"Compensation Basis\",\n  avg(\n    CASE WHEN pay_type = 'Salary' AND annual_salary\
      \ > 0 THEN annual_salary ELSE NULL END\n  ) AS \"Department Average Annual Salary\",\n  avg(\n \
      \   CASE WHEN pay_type = 'Hourly' AND hourly_salary > 0 THEN hourly_salary ELSE NULL END\n  ) AS\
      \ \"Department Average Hourly Rate\",\n  avg(\n    CASE WHEN pay_type = 'Hourly' AND hourly_salary\
      \ > 0 THEN hourly_salary ELSE NULL END\n  ) AS \"Average Hourly Rate\"\nFROM dbpcm_warehouse.employee\n\
      WHERE\n  (\n    employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\nGROUP\
      \ BY\n  department_name,\n  pay_type\nHAVING\n  avg(\n    CASE\n      WHEN pay_type = 'Salary' AND\
      \ annual_salary > 0\n      THEN annual_salary\n      WHEN pay_type = 'Hourly' AND hourly_salary\
      \ > 0\n      THEN hourly_salary\n      ELSE NULL\n    END\n  ) > CASE\n    WHEN pay_type = 'Salary'\n\
      \    THEN {company_salary_avg}\n    WHEN pay_type = 'Hourly'\n    THEN {company_hourly_avg}\n  \
      \  ELSE NULL\n  END\nORDER BY {order_by}\n"
  slots:
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    multiple: true
    default:
    - Active
    - On Leave
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Department Average Annual Salary DESC. Applies before LIMIT;
      no implicit secondary sort.
    default:
    - column: Department Average Annual Salary
      direction: DESC
    allowed_columns:
    - Department
    - Pay Type
    - Compensation Basis
    - Department Average Annual Salary
    - Department Average Hourly Rate
    - Average Hourly Rate
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Department:
      kind: text
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Department Average Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Department Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-earnings-by-department-via-scratch-join
  intent: Total earnings by department, materializing per-employee earnings and joining departments
  slots_summary: department, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: true
    binds_to: dbpcm_warehouse.department.department_name
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Total Earnings
      direction: DESC
    allowed_columns:
    - Department
    - Total Earnings
  result_grain:
  - Department
  composes:
  - order: 0
    output:
      emp_earnings: table
    sql_template: "SELECT toString(p.employee_code) AS employee_code,\n       toFloat64(SUM(p.amount))\
      \ AS earnings\nFROM dbpcm_warehouse.payroll AS p\nWHERE p.register_type = 'EARN'\nGROUP BY p.employee_code\n"
  - order: 1
    feeds_from:
    - 0
    consumes:
      emp_earnings: $0
    output: {}
    sql_template: "SELECT\n  e.department_name AS \"Department\",\n  SUM(x.earnings) AS \"Total Earnings\"\
      \nFROM scratch.emp_earnings AS x\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = x.employee_code\n\
      WHERE\n  e.department_name IN ({department})\nGROUP BY\n  e.department_name\nORDER BY {order_by}\n"
  column_formats:
    Department:
      kind: text
    Total Earnings:
      kind: currency
      currency: USD
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Total Earnings
- id: bp-employee-check-detail-for-period
  intent: A single employee's paycheck line items for one pay period, with per-item amount and hours
  slots_summary: employee, period, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.type_code_description
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  slots:
  - name: employee
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.employee_code
  - name: period
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Register Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Register Type
      direction: ASC
    allowed_columns:
    - Register Type
    - Type Code
    - Type Code Description
    - Employee Name
    - Department Name
    - Amount
    - Hours
  result_grain:
  - Register Type
  - Type Code
  sql_template: "SELECT\n  toString(p.register_type) AS \"Register Type\",\n  toString(p.type_code) AS\
    \ \"Type Code\",\n  any(toString(p.type_code_description)) AS \"Type Code Description\",\n  e.employee_name\
    \ AS \"Employee Name\",\n  e.department_name AS \"Department Name\",\n  toFloat64(SUM(p.amount)) AS\
    \ \"Amount\",\n  toFloat64(SUM(p.type_hours)) AS \"Hours\"\nFROM dbpcm_warehouse.payroll AS p\nLEFT\
    \ JOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = p.employee_code\nWHERE\n  p.employee_code\
    \ = {employee} AND p.pay_period_end_date = {period}\nGROUP BY\n  p.register_type,\n  p.type_code,\n\
    \  e.employee_name,\n  e.department_name\nORDER BY {order_by}\n"
  column_formats:
    Register Type:
      kind: text
    Type Code:
      kind: identifier
    Type Code Description:
      kind: text
    Employee Name:
      kind: text
    Department Name:
      kind: text
    Amount:
      kind: currency
      currency: USD
      precision: 2
    Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: table
- id: bp-employee-date-summary
  intent: Counts of distinct employees with recorded original hire, most recent hire or termination dates
    in an explicit half-open period. Group by company, department, current status or event month. These
    are current employee records, not a complete employment-event history or turnover rate. Current-status
    filter is optional and may exclude rehired employees. No implicit active/terminated filter; no zero-filled
    months.
  slots_summary: date_basis, group_by, period, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: date_basis
    type: enum
    required: true
    enum_values:
    - original_hire
    - most_recent_hire
    - termination
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
    - month
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Employee Count
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'month'\n    THEN SUBSTRING(\n      toString(\n\
    \        CASE\n          WHEN {date_basis} = 'most_recent_hire'\n          THEN e.most_recent_hire_date\n\
    \          WHEN {date_basis} = 'termination'\n          THEN e.termination_date\n          ELSE e.hire_date\n\
    \        END\n      ),\n      1,\n      7\n    )\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n\
    \    WHEN {group_by} = 'status'\n    THEN e.employee_status\n    ELSE 'Company'\n  END AS \"Group\"\
    ,\n  uniqExact(e.employee_code) AS \"Employee Count\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n\
    \  e.employee_status IN ({employee_status})\n  AND e.department_name IN ({department})\n  AND e.employee_code\
    \ = {employee}\n  AND (\n    CASE\n      WHEN {date_basis} = 'most_recent_hire'\n      THEN e.most_recent_hire_date\n\
    \      WHEN {date_basis} = 'termination'\n      THEN e.termination_date\n      ELSE e.hire_date\n\
    \    END\n  ) >= toDate({period_start})\n  AND (\n    CASE\n      WHEN {date_basis} = 'most_recent_hire'\n\
    \      THEN e.most_recent_hire_date\n      WHEN {date_basis} = 'termination'\n      THEN e.termination_date\n\
    \      ELSE e.hire_date\n    END\n  ) < toDate({period_end})\nGROUP BY\n  \"Group\"\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Employee Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Employee Count
    by_group_by:
      company: figure
      month: line
- id: bp-employee-day-clock-span
  intent: Employee-day first recorded In time, last recorded Out time and matched-pair count, with paid
    hours. Clock span may contain unpaid gaps; it is not hours worked, a single shift or a lateness finding.
    Days are assigned by recorded punch_date; midnight ownership is not inferred. Optional punch-type
    filters restrict which pairs contribute. Required half-open punch-date period and resolved table_source
    prevent accidental cross-source double counting. FINAL deduplicates storage versions, not overlapping
    real-world events. Department means recorded labor-allocation department code, not current home department.
    No scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove
    completeness; missing days/months are not zero-filled. Salaried approved leave and automatic pay-period-end

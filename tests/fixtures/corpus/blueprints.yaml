    \ Line Count`, uniqExact(p.employee_code) AS `Employee Count`\nFROM p LEFT JOIN dbpcm_warehouse.employee e ON\
    \ p.employee_code = e.employee_code\nWHERE e.employee_status = {employee_status} AND e.department_name = {department}\
    \ AND e.employee_code = {employee}\nGROUP BY CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'month'\

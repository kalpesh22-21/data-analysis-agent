    employee, allocated department, day, month or hours type. Did this employee have punches in the period? Paid
    hours use earn_hours, not elapsed clock duration. Single-argument distinct counts. Required half-open punch-date
    period and resolved table_source prevent accidental cross-source double counting. FINAL deduplicates storage
    versions, not overlapping real-world events. Department means recorded labor-allocation department code, not
    current home department. No scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates
    do not prove completeness; missing days/months are not zero-filled.

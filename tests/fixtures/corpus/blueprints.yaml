    type_code, employee status, department and employee. Earnings represent finalized total_earning after period
    close; use total_earning for in-progress earnings and never add both for the same covered earnings. Preaggregate
    payroll per employee/month before LEFT JOIN; unmatched employees retained unless employee filters supplied.

    \ 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  department_name AS \"Department\"\
    ,\n  AVG(\n    (\n      CASE WHEN pay_type = 'Salary' AND annual_salary > 0 THEN annual_salary ELSE\

  sql_template: "SELECT CASE {group_by} WHEN 'employee' THEN employee_code WHEN 'department' THEN department_code\
    \ WHEN 'day' THEN toString(punch_date) WHEN 'month' THEN substring(toString(punch_date),1,7) WHEN 'hours_type'\
    \ THEN hours_type ELSE 'Company' END AS `Group`,\ncount(*) AS `Pair Count`, count(DISTINCT employee_code) AS\
    \ `Employee Count`, count(DISTINCT punch_date) AS `Observed Days`,\n sum(earn_hours) AS `Paid Hours`, sum(earn_amount)\
    \ AS `Pair Earning Amount`, min(punch_date) AS `First Observed Date`, max(punch_date) AS `Last Observed Date`\n\
    FROM dbpcm_warehouse.punch_pair FINAL\nWHERE punch_date >= toDate({period_start}) AND punch_date < toDate({period_end})\
    \ AND table_source = {source} AND employee_code = {employee} AND department_code = {department} AND hours_type\

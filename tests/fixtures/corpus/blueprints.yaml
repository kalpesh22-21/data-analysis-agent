# Hand-authored blueprint seed corpus (neo4j-corpus-design §3.2, extended with the
# full DAG by runblueprint-design §1.2).
#
# `uses` strings are BYTE-EXACT `"database.table.column"` scope keys of the HR
# warehouse the Layer-2 ClickHouse seed (docker/clickhouse-init/hr-warehouse.sql)
# + the Semantic Catalog describe — so scope filtering against a real scope is
# genuinely exercised. Any format skew here silently drops the blueprint via the
# set-subset scope pre-filter (§8 highest-risk contract), so these are curated
# against the real `dbpcm_warehouse.<table>.<Column>` names.
#
# Each seed is an EXECUTABLE SINGLE-NODE blueprint (runblueprint-design §Q7 Slice
# A): a top-level `sql_template` with `{slot}` bind sites, typed `slots`, and a
# declared `result_grain` (D56 checks the result against it). The corpus loader's
# write-time validation (§1.2) proves every `{slot}` is declared, each template
# parses under ClickHouse, and the template's column footprint ⊆ `uses`.
- id: bp-overtime-by-department
  intent: Total overtime pay by department for a given pay period
  slots_summary: department, pay_period
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.payroll.EmployeeCode
    - dbpcm_warehouse.payroll.RegisterType
    - dbpcm_warehouse.payroll.Amount
    - dbpcm_warehouse.payroll.PayPeriodEndDate
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
  resolves:
    overtime: gross_earnings
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
    - { name: pay_period, type: period, required: true, binds_to: dbpcm_warehouse.payroll.PayPeriodEndDate }
  uses_rules:
    - gross_earnings
  result_grain: [ Department ]
  sql_template: |
    SELECT e.Department AS department, SUM(p.Amount) AS overtime_pay
    FROM dbpcm_warehouse.payroll AS p
    JOIN dbpcm_warehouse.employee AS e ON e.EmployeeCode = p.EmployeeCode
    WHERE p.RegisterType = 'EARN'
      AND e.Department = {department}
      AND p.PayPeriodEndDate = {pay_period}
    GROUP BY e.Department

- id: bp-active-headcount-by-department
  intent: Active employee headcount by department
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
    - dbpcm_warehouse.employee.EmployeeStatus
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  uses_rules:
    - active_employee
  result_grain: [ Department ]
  sql_template: |
    SELECT Department AS department, COUNT(DISTINCT EmployeeCode) AS headcount
    FROM dbpcm_warehouse.employee
    WHERE EmployeeStatus = 'A' AND Department = {department}
    GROUP BY Department

- id: bp-average-salary-by-department
  intent: Average annual salary by department
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
    - dbpcm_warehouse.employee.AnnualSalary
  resolves:
    salary: AnnualSalary
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  result_grain: [ Department ]
  sql_template: |
    SELECT Department AS department,
           AVG(AnnualSalary) AS avg_salary,
           COUNT(DISTINCT EmployeeCode) AS headcount
    FROM dbpcm_warehouse.employee
    WHERE Department = {department}
    GROUP BY Department

# Slice-C SINGLE-NODE `resolve_via` blueprint (D67, runblueprint-design §3.4): the
# `earnings_only` rule maps the concept "earnings" → the earnings RegisterType code
# set via the typed `resolveValues.resolve()` hook (NO model round-trip), and the
# executor folds the ranked codes into the `{earn_codes}` predicate as a typed AST
# IN-list (F1/D10 — never interpolated). Value-only ranking (RegisterType has no
# sibling description column) against the real embedder + the DISTINCT-domain freq.
# The seed has EARN (4 rows) + DEDUCTION (1 row); "earnings" must rank EARN first.
- id: bp-total-earnings-by-department
  intent: Total earnings for a department, resolving the earnings register codes dynamically
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.payroll.EmployeeCode
    - dbpcm_warehouse.payroll.RegisterType
    - dbpcm_warehouse.payroll.Amount
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  uses_rules:
    - { id: earnings_only, resolve_via: "resolveValues(RegisterType, 'earnings')", table: dbpcm_warehouse.payroll, binds: earn_codes }
  result_grain: [ Department ]
  sql_template: |
    SELECT e.Department AS department, SUM(p.Amount) AS total_earnings
    FROM dbpcm_warehouse.payroll AS p
    JOIN dbpcm_warehouse.employee AS e ON e.EmployeeCode = p.EmployeeCode
    WHERE p.RegisterType IN {earn_codes}
      AND e.Department = {department}
    GROUP BY e.Department

# Slice-C multi-node SCALAR-passing DAG (runblueprint-design §2.4/§Q7 Slice C):
# node 0 computes the company-wide average as a SCALAR; node 1 consumes it as a
# typed AST literal (F1/D10 — never interpolated) to select the departments above
# it. No table intermediate (F2-clean); the declared result grain is Department.
- id: bp-departments-above-company-average-salary
  intent: Departments whose average salary exceeds the company-wide average
  slots_summary: ""
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
    - dbpcm_warehouse.employee.AnnualSalary
  result_grain: [ Department ]
  composes:
    - order: 0
      output: { company_avg: scalar }
      sql_template: |
        SELECT AVG(AnnualSalary) AS company_avg
        FROM dbpcm_warehouse.employee
    - order: 1
      feeds_from: [ 0 ]
      consumes: { company_avg: "$0.company_avg" }
      output: {}
      sql_template: |
        SELECT Department AS department, AVG(AnnualSalary) AS dept_avg
        FROM dbpcm_warehouse.employee
        GROUP BY Department
        HAVING AVG(AnnualSalary) > {company_avg}

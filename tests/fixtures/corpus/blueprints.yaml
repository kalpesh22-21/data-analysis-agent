    binds_to: dbpcm_warehouse.punch_pair.department_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: hours_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.hours_type
    optional_pattern: 'TRUE'
    multiple: true
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.pay_class_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: in_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.in_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - ID
    - IL
    - IB
    - IX
    multiple: true
  - name: out_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.out_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - OD
    - OL
    - OB
    - OX
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Punch Date ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Punch Date
      direction: ASC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Department
    - Punch Date
    - First Recorded In
    - Last Recorded Out
    - Pair Count
    - Paid Hours
  result_grain:
  - Employee Code
  - Punch Date
  sql_template: "SELECT\n  p.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  e.department_name AS \"Department\",\n  p.punch_date AS \"Punch Date\",\n  min(p.in_punch_time)\
    \ AS \"First Recorded In\",\n  max(p.out_punch_time) AS \"Last Recorded Out\",\n  count(*) AS \"Pair\
    \ Count\",\n  sum(p.earn_hours) AS \"Paid Hours\"\nFROM dbpcm_warehouse.punch_pair AS p\nLEFT JOIN\
    \ dbpcm_warehouse.employee AS e\n  ON e.employee_code = p.employee_code\nWHERE\n  p.punch_date >=\
    \ toDate({period_start})\n  AND p.punch_date < toDate({period_end})\n  AND p.table_source IN ({source})\n\
    \  AND p.employee_code = {employee}\n  AND p.department_code IN ({department})\n  AND p.hours_type\
    \ IN ({hours_type})\n  AND p.pay_class_code IN ({pay_class})\n  AND p.in_punch_type IN ({in_type})\n\
    \  AND p.out_punch_type IN ({out_type})\nGROUP BY\n  p.employee_code,\n  e.employee_name,\n  e.department_name,\n\
    \  p.punch_date\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Punch Date:
      kind: date
    First Recorded In:
      kind: datetime
    Last Recorded Out:
      kind: datetime
    Pair Count:
      kind: integer
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: table
- id: bp-employee-summary
  intent: Headcount and recorded pay statistics by company, department or status and pay type. Annual
    salary statistics apply only to Salary employees; hourly rate statistics apply only to Hourly employees,
    in separate columns. Never annualize hourly pay or sum hourly rates. Unknown pay remains NULL. Defaults
    to Active + On Leave.
  slots_summary: group_by, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Group
    - Employee Count
    - Known Compensation Count
    - Annual Salary Sum
    - Average Annual Salary
    - Minimum Annual Salary
    - Minimum Hourly Rate
    - Maximum Annual Salary
    - Maximum Hourly Rate
    - Average Hourly Rate
  result_grain:
  - Group
  - Pay Type
  sql_template: "SELECT\n  e.pay_type AS \"Pay Type\",\n  CASE\n    WHEN e.pay_type = 'Hourly'\n    THEN\
    \ 'Recorded hourly rate (per hour)'\n    WHEN e.pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n\
    \    ELSE 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  CASE\n    WHEN {group_by}\
    \ = 'department'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n    THEN e.employee_status\n\
    \    ELSE 'Company'\n  END AS \"Group\",\n  uniqExact(e.employee_code) AS \"Employee Count\",\n  count(\n\
    \    (\n      CASE\n        WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n        THEN e.annual_salary\n\
    \        WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n        THEN e.hourly_salary\n      \
    \  ELSE NULL\n      END\n    )\n  ) AS \"Known Compensation Count\",\n  CASE\n    WHEN e.pay_type\
    \ = 'Salary'\n    THEN sum(\n      (\n        CASE\n          WHEN e.pay_type = 'Salary' AND e.annual_salary\
    \ > 0\n          THEN e.annual_salary\n          ELSE NULL\n        END\n      )\n    )\n    ELSE\
    \ NULL\n  END AS \"Annual Salary Sum\",\n  avg(\n    (\n      CASE\n        WHEN e.pay_type = 'Salary'\
    \ AND e.annual_salary > 0\n        THEN e.annual_salary\n        ELSE NULL\n      END\n    )\n  )\
    \ AS \"Average Annual Salary\",\n  min(\n    (\n      CASE\n        WHEN e.pay_type = 'Salary' AND\
    \ e.annual_salary > 0\n        THEN e.annual_salary\n        ELSE NULL\n      END\n    )\n  ) AS \"\
    Minimum Annual Salary\",\n  min(\n    (\n      CASE\n        WHEN e.pay_type = 'Hourly' AND e.hourly_salary\
    \ > 0\n        THEN e.hourly_salary\n        ELSE NULL\n      END\n    )\n  ) AS \"Minimum Hourly\
    \ Rate\",\n  max(\n    (\n      CASE\n        WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n\
    \        THEN e.annual_salary\n        ELSE NULL\n      END\n    )\n  ) AS \"Maximum Annual Salary\"\
    ,\n  max(\n    (\n      CASE\n        WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n       \
    \ THEN e.hourly_salary\n        ELSE NULL\n      END\n    )\n  ) AS \"Maximum Hourly Rate\",\n  avg(\n\
    \    CASE\n      WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n      THEN e.hourly_salary\n\
    \      ELSE NULL\n    END\n  ) AS \"Average Hourly Rate\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n\
    \  (\n    e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\n  AND e.department_name\
    \ IN ({department})\n  AND e.employee_code = {employee}\nGROUP BY\n  e.pay_type,\n  CASE\n    WHEN\
    \ {group_by} = 'department'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n    THEN\
    \ e.employee_status\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Group:
      kind: text
    Employee Count:
      kind: integer
    Known Compensation Count:
      kind: integer
    Annual Salary Sum:
      kind: currency
      currency: USD
      precision: 2
    Average Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Minimum Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Minimum Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Maximum Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Maximum Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-employee-tenure-summary
  intent: Elapsed years from original or most recent hire date to a supplied ISO YYYY-MM-DD reference_date,
    using calendar days / 365.25. Company/department/current-status groups, average/min/max and valid-date
    count. Excludes NULL, dates at/before 1900-01-01 and future hire dates. all-status elapsed time does
    NOT stop at termination and is not historical active headcount. Date is explicit, not inferred from
    today. Defaults to Active + On Leave; employee_status selects another status or All to remove the
    filter.
  slots_summary: group_by, hire_basis, reference_date, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: hire_basis
    type: enum
    required: true
    enum_values:
    - original_hire
    - most_recent_hire
  - name: reference_date
    type: string
    temporal_type: date
    required: true
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Valid Hire Date Count
    - Average Elapsed Years
    - Minimum Elapsed Years
    - Maximum Elapsed Years
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n    WHEN\
    \ {group_by} = 'status'\n    THEN e.employee_status\n    ELSE 'Company'\n  END AS \"Group\",\n  count(*)\
    \ AS \"Valid Hire Date Count\",\n  avg(\n    DATE_DIFF(\n      DAY,\n      CASE\n        WHEN {hire_basis}\
    \ = 'most_recent_hire'\n        THEN e.most_recent_hire_date\n        ELSE e.hire_date\n      END,\n\
    \      toDate({reference_date})\n    ) / 365.25\n  ) AS \"Average Elapsed Years\",\n  min(\n    DATE_DIFF(\n\
    \      DAY,\n      CASE\n        WHEN {hire_basis} = 'most_recent_hire'\n        THEN e.most_recent_hire_date\n\
    \        ELSE e.hire_date\n      END,\n      toDate({reference_date})\n    ) / 365.25\n  ) AS \"Minimum\
    \ Elapsed Years\",\n  max(\n    DATE_DIFF(\n      DAY,\n      CASE\n        WHEN {hire_basis} = 'most_recent_hire'\n\
    \        THEN e.most_recent_hire_date\n        ELSE e.hire_date\n      END,\n      toDate({reference_date})\n\
    \    ) / 365.25\n  ) AS \"Maximum Elapsed Years\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n  (\n\
    \    e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\n  AND e.department_name\
    \ IN ({department})\n  AND e.employee_code = {employee}\n  AND (\n    CASE\n      WHEN {hire_basis}\
    \ = 'most_recent_hire'\n      THEN e.most_recent_hire_date\n      ELSE e.hire_date\n    END\n  ) >\
    \ toDate('1900-01-01')\n  AND (\n    CASE\n      WHEN {hire_basis} = 'most_recent_hire'\n      THEN\
    \ e.most_recent_hire_date\n      ELSE e.hire_date\n    END\n  ) <= toDate({reference_date})\nGROUP\
    \ BY\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n    WHEN {group_by}\
    \ = 'status'\n    THEN e.employee_status\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Valid Hire Date Count:
      kind: integer
    Average Elapsed Years:
      kind: number
      unit: years
      precision: 2
    Minimum Elapsed Years:
      kind: number
      unit: years
      precision: 2
    Maximum Elapsed Years:
      kind: number
      unit: years
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Valid Hire Date Count
    by_group_by:
      company: figure
- id: bp-hires-in-range
  intent: New hires per month within an explicit start/end date range — counts by original hire date;
    rehires are not re-counted
  slots_summary: hire_window, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: hire_window
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Hires
  result_grain:
  - Month
  window_anchor: calendar
  sql_template: "SELECT\n  dateTrunc('MONTH', hire_date) AS \"Month\",\n  COUNT(DISTINCT employee_code)\
    \ AS \"Hires\"\nFROM dbpcm_warehouse.employee\nWHERE\n  hire_date >= {hire_window_start}\n  AND hire_date\
    \ < {hire_window_end}\n  AND (\n    employee_status <> 'Not Hired' OR employee_status IS NULL\n  )\n\
    GROUP BY\n  dateTrunc('MONTH', hire_date)\nORDER BY {order_by}\n"
  column_formats:
    Month:
      kind: date
    Hires:
      kind: integer
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Hires
- id: bp-hires-per-month
  intent: New hires per month over a trailing window of the last N months — counts by original hire date;
    rehires are not re-counted
  slots_summary: window_months, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 36
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Hires
  result_grain:
  - Month
  window_anchor: data
  sql_template: "SELECT\n  dateTrunc('MONTH', hire_date) AS \"Month\",\n  COUNT(DISTINCT employee_code)\
    \ AS \"Hires\"\nFROM dbpcm_warehouse.employee\nWHERE\n  hire_date >= (\n    SELECT\n      dateTrunc('MONTH',\
    \ max(hire_date))\n    FROM dbpcm_warehouse.employee\n    WHERE\n      employee_status <> 'N' OR employee_status\
    \ IS NULL\n  ) - INTERVAL (\n    {window_months}\n  ) MONTH\n  AND (\n    employee_status <> 'N' OR\
    \ employee_status IS NULL\n  )\nGROUP BY\n  dateTrunc('MONTH', hire_date)\nORDER BY {order_by}\n"
  column_formats:
    Month:
      kind: date
    Hires:
      kind: integer
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Hires
- id: bp-hires-projection
  intent: Projected number of hires over the next N months at the current hiring pace (run-rate over a
    trailing window) — counts by original hire date; rehires are not re-counted
  slots_summary: window_months, horizon_months, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 2
    max_value: 36
  - name: horizon_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 24
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Hires In Window ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Hires In Window
      direction: ASC
    allowed_columns:
    - Hires In Window
    - Average Monthly Hires
    - Projected Hires
  result_grain: []
  window_anchor: data
  sql_template: "SELECT\n  COUNT(DISTINCT employee_code) AS \"Hires In Window\",\n  round(COUNT(DISTINCT\
    \ employee_code) / {window_months}, 1) AS \"Average Monthly Hires\",\n  round(COUNT(DISTINCT employee_code)\
    \ / {window_months} * {horizon_months}) AS \"Projected Hires\"\nFROM dbpcm_warehouse.employee\nWHERE\n\
    \  hire_date >= addMonths(\n    (\n      SELECT\n        dateTrunc('MONTH', max(hire_date))\n    \
    \  FROM dbpcm_warehouse.employee\n      WHERE\n        employee_status <> 'N' OR employee_status IS\
    \ NULL\n    ),\n    1\n  ) - INTERVAL (\n    {window_months}\n  ) MONTH\n  AND (\n    employee_status\
    \ <> 'N' OR employee_status IS NULL\n  )\nORDER BY {order_by}\n"
  column_formats:
    Hires In Window:
      kind: integer
    Average Monthly Hires:
      kind: number
    Projected Hires:
      kind: number
  presentation:
    kind: facts
    measure_columns:
    - Hires In Window
    - Average Monthly Hires
    - Projected Hires
- id: bp-latest-hired-employees
  intent: Latest hired employee list ordered by most recent hire date, including rehires. Defaults to
    Active + On Leave. Excludes missing/sentinel and future hire dates. row_limit is the requested top
    N; original hire is not the ranking date.
  slots_summary: row_limit, employee_status, department
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
    description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that
      ranking. It does not accept order_by or order_direction. A different selection or display order
      requires a separate query.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  result_grain:
  - Employee Code
  sql_template: "SELECT\n  e.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  e.department_name AS \"Department\",\n  e.employee_status AS \"Status\",\n  e.most_recent_hire_date\
    \ AS \"Most Recent Hire Date\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n  (\n    e.employee_status\
    \ IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\n  AND e.department_name IN ({department})\n\
    \  AND e.most_recent_hire_date > toDate('1900-01-01')\n  AND e.most_recent_hire_date <= now()\nORDER\
    \ BY\n  e.most_recent_hire_date DESC,\n  e.employee_code\nLIMIT {row_limit}\n"
  uses_rules:
  - default_employee_population
  - missing_date_sentinel
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Status:
      kind: text
    Most Recent Hire Date:
      kind: datetime
  presentation:
    kind: table
- id: bp-overtime-by-department
  intent: Earnings by department for a given pay period, filtered to a specific pay type (type_code) such
    as overtime
  slots_summary: top_n, department, pay_period, type_code, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: department
    type: string
    required: true
    binds_to: dbpcm_warehouse.department.department_name
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: pay_period
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  - name: type_code
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.type_code
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Earnings DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Earnings
      direction: DESC
    allowed_columns:
    - Department
    - Earnings
  uses_rules:
  - gross_earnings
  result_grain:
  - Department
  sql_template: "SELECT\n  e.department_name AS \"Department\",\n  SUM(p.amount) AS \"Earnings\"\nFROM\
    \ dbpcm_warehouse.payroll AS p\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = p.employee_code\n\
    WHERE\n  p.register_type = 'EARN'\n  AND p.type_code IN ({type_code})\n  AND e.department_name IN\
    \ ({department})\n  AND p.pay_period_end_date = {pay_period}\nGROUP BY\n  e.department_name\nORDER\
    \ BY {order_by}\nLIMIT {top_n}\n\n"
  column_formats:
    Department:
      kind: text
    Earnings:
      kind: currency
      currency: USD
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Earnings
- id: bp-payroll-summary
  intent: Payroll amount and distinct employee count by company, department or pay-date month. Required
    register_type enum and half-open pay-date period [start,end); select EARN for gross earnings. Optional
    type_code, employee status, department and employee. Earnings represent finalized total_earning after
    period close; use total_earning for in-progress earnings and never add both for the same covered earnings.
    Preaggregate payroll per employee/month before LEFT JOIN; unmatched employees retained unless employee
    filters supplied. Does not prove complete months or zero-fill missing months; no implicit earnings
    filter.
  slots_summary: group_by, register_type, period, type_code, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_date
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - month
  - name: register_type
    type: enum
    required: true
    enum_values:
    - EARN
    - EETAX
    - DDUCT
    - NETPAYDIST
    - EEBEN
    - ERTAX
    binds_to: dbpcm_warehouse.payroll.register_type
    multiple: true
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: type_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.payroll.type_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Payroll Amount
    - Employee Count
  result_grain:
  - Group
  sql_template: "WITH p AS (\n  SELECT\n    employee_code,\n    SUBSTRING(toString(pay_date), 1, 7) AS\
    \ month,\n    sum(amount) AS amount\n  FROM dbpcm_warehouse.payroll\n  WHERE\n    register_type IN\
    \ ({register_type})\n    AND type_code IN ({type_code})\n    AND toDate(pay_date) >= toDate({period_start})\n\
    \    AND toDate(pay_date) < toDate({period_end})\n  GROUP BY\n    employee_code,\n    SUBSTRING(toString(pay_date),\
    \ 1, 7)\n)\nSELECT\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n    WHEN\
    \ {group_by} = 'month'\n    THEN toString(p.month)\n    ELSE 'Company'\n  END AS \"Group\",\n  sum(CAST(p.amount\
    \ AS Nullable(Decimal(38, 2)))) AS \"Payroll Amount\",\n  uniqExact(p.employee_code) AS \"Employee\
    \ Count\"\nFROM p\nLEFT JOIN dbpcm_warehouse.employee AS e\n  ON p.employee_code = e.employee_code\n\
    WHERE\n  e.employee_status IN ({employee_status})\n  AND e.department_name IN ({department})\n  AND\
    \ e.employee_code = {employee}\nGROUP BY\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n\
    \    WHEN {group_by} = 'month'\n    THEN toString(p.month)\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Payroll Amount:
      kind: currency
      currency: USD
      precision: 2
    Employee Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Payroll Amount
    by_group_by:
      company: figure
      month: line
- id: bp-punch-pair-summary
  intent: Matched punch-pair counts, distinct employees, observed days, paid hours and pair earning amount
    by company, employee, allocated department, day, month or hours type. Did this employee have punches
    in the period? Paid hours use earn_hours, not elapsed clock duration. Single-argument distinct counts.
    Required half-open punch-date period and resolved table_source prevent accidental cross-source double
    counting. FINAL deduplicates storage versions, not overlapping real-world events. Department means
    recorded labor-allocation department code, not current home department. No scheduled shift, tardiness
    or overtime policy is inferred. Observed first/last dates do not prove completeness; missing days/months
    are not zero-filled.
  slots_summary: group_by, period, source, employee, department, hours_type, pay_class, in_type, out_type,
    order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.punch_pair.department_code
  - dbpcm_warehouse.punch_pair.earn_amount
  - dbpcm_warehouse.punch_pair.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.hours_type
  - dbpcm_warehouse.punch_pair.in_punch_type
  - dbpcm_warehouse.punch_pair.out_punch_type
  - dbpcm_warehouse.punch_pair.pay_class_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - hours_type
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.punch_pair.table_source
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.department_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: hours_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.hours_type
    optional_pattern: 'TRUE'
    multiple: true
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.pay_class_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: in_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.in_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - ID
    - IL
    - IB
    - IX
    multiple: true
  - name: out_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.out_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - OD
    - OL
    - OB
    - OX
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Pair Count
    - Employee Count
    - Observed Days
    - Paid Hours
    - Pair Earning Amount
    - First Observed Date
    - Last Observed Date
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'employee'\n    THEN employee_code\n    WHEN {group_by}\
    \ = 'department'\n    THEN department_code\n    WHEN {group_by} = 'day'\n    THEN toString(punch_date)\n\
    \    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date), 1, 7)\n    WHEN {group_by}\
    \ = 'hours_type'\n    THEN hours_type\n    ELSE 'Company'\n  END AS \"Group\",\n  count(*) AS \"Pair\
    \ Count\",\n  count(DISTINCT employee_code) AS \"Employee Count\",\n  count(DISTINCT punch_date) AS\
    \ \"Observed Days\",\n  sum(earn_hours) AS \"Paid Hours\",\n  sum(earn_amount) AS \"Pair Earning Amount\"\
    ,\n  min(punch_date) AS \"First Observed Date\",\n  max(punch_date) AS \"Last Observed Date\"\nFROM\
    \ dbpcm_warehouse.punch_pair\nWHERE\n  punch_date >= toDate({period_start})\n  AND punch_date < toDate({period_end})\n\
    \  AND table_source IN ({source})\n  AND employee_code = {employee}\n  AND department_code IN ({department})\n\
    \  AND hours_type IN ({hours_type})\n  AND pay_class_code IN ({pay_class})\n  AND in_punch_type IN\
    \ ({in_type})\n  AND out_punch_type IN ({out_type})\nGROUP BY\n  CASE\n    WHEN {group_by} = 'employee'\n\
    \    THEN employee_code\n    WHEN {group_by} = 'department'\n    THEN department_code\n    WHEN {group_by}\
    \ = 'day'\n    THEN toString(punch_date)\n    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date),\
    \ 1, 7)\n    WHEN {group_by} = 'hours_type'\n    THEN hours_type\n    ELSE 'Company'\n  END\nORDER\
    \ BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Pair Count:
      kind: integer
    Employee Count:
      kind: integer
    Observed Days:
      kind: integer
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
    Pair Earning Amount:
      kind: currency
      currency: USD
    First Observed Date:
      kind: date
    Last Observed Date:
      kind: date
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Pair Count
    by_group_by:
      company: figure
      day: line
      month: line
- id: bp-salary-exact-median
  intent: Exact median, average, minimum and maximum recorded annual salary and recorded hourly rate,
    separately by pay type and company, department or status. salary_population selects positive values
    by default or recorded values including zeros; NULLs excluded. Never annualize hourly rates. Defaults
    to Active + On Leave.
  slots_summary: group_by, salary_population, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: salary_population
    type: enum
    required: true
    enum_values:
    - recorded
    - positive
    description: Use positive unless the user explicitly asks to include recorded zeros. A zero is not
      a recorded rate; an Hourly employee with hourly_salary 0 or a Salary employee with annual_salary
      0 has no compensation on record.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Group
    - Known Compensation Count
    - Exact Median Annual Salary
    - Exact Median Hourly Rate
    - Average Annual Salary
    - Minimum Annual Salary
    - Minimum Hourly Rate
    - Maximum Annual Salary
    - Maximum Hourly Rate
    - Average Hourly Rate
  result_grain:
  - Group
  - Pay Type
  sql_template: "SELECT\n  e.pay_type AS \"Pay Type\",\n  CASE\n    WHEN e.pay_type = 'Hourly'\n    THEN\
    \ 'Recorded hourly rate (per hour)'\n    WHEN e.pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n\
    \    ELSE 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  CASE\n    WHEN {group_by}\
    \ = 'department'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n    THEN e.employee_status\n\
    \    ELSE 'Company'\n  END AS \"Group\",\n  count(\n    (\n      CASE\n        WHEN e.pay_type = 'Salary'\n\
    \        THEN e.annual_salary\n        WHEN e.pay_type = 'Hourly'\n        THEN e.hourly_salary\n\
    \        ELSE NULL\n      END\n    )\n  ) AS \"Known Compensation Count\",\n  (\n    quantileExactLow(0.5)((\n\
    \      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n    )) + quantileExactHigh(0.5)((\n\
    \      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n    ))\n  ) / 2 AS \"Exact\
    \ Median Annual Salary\",\n  (\n    quantileExactLow(0.5)((\n      CASE WHEN e.pay_type = 'Hourly'\
    \ THEN e.hourly_salary ELSE NULL END\n    )) + quantileExactHigh(0.5)((\n      CASE WHEN e.pay_type\
    \ = 'Hourly' THEN e.hourly_salary ELSE NULL END\n    ))\n  ) / 2 AS \"Exact Median Hourly Rate\",\n\
    \  avg((\n    CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n  )) AS \"Average\
    \ Annual Salary\",\n  min((\n    CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n\
    \  )) AS \"Minimum Annual Salary\",\n  min((\n    CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary\
    \ ELSE NULL END\n  )) AS \"Minimum Hourly Rate\",\n  max((\n    CASE WHEN e.pay_type = 'Salary' THEN\
    \ e.annual_salary ELSE NULL END\n  )) AS \"Maximum Annual Salary\",\n  max((\n    CASE WHEN e.pay_type\
    \ = 'Hourly' THEN e.hourly_salary ELSE NULL END\n  )) AS \"Maximum Hourly Rate\",\n  avg(CASE WHEN\
    \ e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END) AS \"Average Hourly Rate\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nWHERE\n  (\n    e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n\
    \  )\n  AND e.department_name IN ({department})\n  AND e.employee_code = {employee}\n  AND NOT (\n\
    \    (\n      CASE\n        WHEN e.pay_type = 'Salary'\n        THEN e.annual_salary\n        WHEN\
    \ e.pay_type = 'Hourly'\n        THEN e.hourly_salary\n        ELSE NULL\n      END\n    ) IS NULL\n\
    \  )\n  AND (\n    {salary_population} = 'recorded'\n    OR (\n      CASE\n        WHEN e.pay_type\
    \ = 'Salary'\n        THEN e.annual_salary\n        WHEN e.pay_type = 'Hourly'\n        THEN e.hourly_salary\n\
    \        ELSE NULL\n      END\n    ) > 0\n  )\nGROUP BY\n  e.pay_type,\n  CASE\n    WHEN {group_by}\
    \ = 'department'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n    THEN e.employee_status\n\
    \    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Group:
      kind: text
    Known Compensation Count:
      kind: integer
    Exact Median Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Exact Median Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Average Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Minimum Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Minimum Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Maximum Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Maximum Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-salary-threshold-count
  intent: 'Recorded annual salary counts for Salary employees matching a whole-currency annual salary
    threshold. Hourly employees are excluded: hourly rates are not annual salaries. Defaults to Active
    + On Leave.'
  slots_summary: comparison, salary, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: comparison
    type: enum
    required: true
    enum_values:
    - above
    - at_least
    - equal
    - below
  - name: salary
    type: nonnegative_integer
    required: true
    min_value: 0
    max_value: 1000000000
    description: Recorded annual salary threshold for Salary employees only; never apply to hourly rates.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Pay Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Pay Type
      direction: ASC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Employee Count
  result_grain:
  - Pay Type
  sql_template: "SELECT\n  e.pay_type AS \"Pay Type\",\n  CASE\n    WHEN e.pay_type = 'Hourly'\n    THEN\
    \ 'Recorded hourly rate (per hour)'\n    WHEN e.pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n\
    \    ELSE 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  count(DISTINCT e.employee_code)\
    \ AS \"Employee Count\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n  (\n    (\n      e.employee_status\
    \ IN ({employee_status}) OR 'All' IN ({employee_status})\n    )\n    AND e.department_name IN ({department})\n\
    \    AND e.employee_code = {employee}\n    AND (\n      (\n        {comparison} = 'above'\n      \
    \  AND (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n       \
    \     THEN e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n     \
    \       THEN e.hourly_salary\n            ELSE NULL\n          END\n        ) > {salary}\n      )\n\
    \      OR (\n        {comparison} = 'at_least'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) >= {salary}\n      )\n      OR (\n        {comparison} = 'equal'\n       \
    \ AND (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n        \
    \    THEN e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n      \
    \      THEN e.hourly_salary\n            ELSE NULL\n          END\n        ) = {salary}\n      )\n\
    \      OR (\n        {comparison} = 'below'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) < {salary}\n      )\n    )\n  )\n  AND e.pay_type = 'Salary'\nGROUP BY\n \
    \ e.pay_type\nORDER BY {order_by}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Employee Count:
      kind: integer
  presentation:
    kind: table
- id: bp-salary-threshold-directory
  intent: 'Recorded annual salary directory for Salary employees matching a whole-currency annual salary
    threshold. Hourly employees are excluded: hourly rates are not annual salaries. Defaults to Active
    + On Leave.'
  slots_summary: comparison, salary, row_limit, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: comparison
    type: enum
    required: true
    enum_values:
    - above
    - at_least
    - equal
    - below
  - name: salary
    type: nonnegative_integer
    required: true
    min_value: 0
    max_value: 1000000000
    description: Recorded annual salary threshold for Salary employees only; never apply to hourly rates.
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Annual Salary DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Annual Salary
      direction: DESC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Employee Code
    - Department
    - Status
    - Annual Salary
    - Hourly Rate
  result_grain:
  - Employee Code
  sql_template: "SELECT\n  e.pay_type AS \"Pay Type\",\n  CASE\n    WHEN e.pay_type = 'Hourly'\n    THEN\
    \ 'Recorded hourly rate (per hour)'\n    WHEN e.pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n\
    \    ELSE 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  e.employee_code AS \"\
    Employee Code\",\n  e.department_name AS \"Department\",\n  e.employee_status AS \"Status\",\n  (\n\
    \    CASE\n      WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n      THEN e.annual_salary\n\
    \      ELSE NULL\n    END\n  ) AS \"Annual Salary\",\n  e.hourly_salary AS \"Hourly Rate\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nWHERE\n  (\n    (\n      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n\
    \    )\n    AND e.department_name IN ({department})\n    AND e.employee_code = {employee}\n    AND\
    \ (\n      (\n        {comparison} = 'above'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) > {salary}\n      )\n      OR (\n        {comparison} = 'at_least'\n     \
    \   AND (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n      \
    \      THEN e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n    \
    \        THEN e.hourly_salary\n            ELSE NULL\n          END\n        ) >= {salary}\n     \
    \ )\n      OR (\n        {comparison} = 'equal'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) = {salary}\n      )\n      OR (\n        {comparison} = 'below'\n        AND\
    \ (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n            THEN\
    \ e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n            THEN\
    \ e.hourly_salary\n            ELSE NULL\n          END\n        ) < {salary}\n      )\n    )\n  )\n\
    \  AND e.pay_type = 'Salary'\nORDER BY {order_by}\nLIMIT {row_limit}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Employee Code:
      kind: identifier
    Department:
      kind: text
    Status:
      kind: text
    Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-termination-family
  intent: Employees with a recorded termination date in a half-open period, with the total matching employee
    count before the display limit. Includes same-day/later rehires and employees no longer currently
    Terminated. Apply current status only when explicitly requested. For counts/grouped summaries use
    bp-employee-date-summary with date_basis=termination.
  slots_summary: period, row_limit, employee_status, department, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for all recorded terminations in the period; set only when current status is explicitly
      requested.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Termination Date DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Termination Date
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Department
    - Current Status
    - Termination Date
    - Total Matching Employees
  result_grain:
  - Employee Code
  sql_template: "SELECT\n  e.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  e.department_name AS \"Department\",\n  e.employee_status AS \"Current Status\",\n  e.termination_date\
    \ AS \"Termination Date\",\n  count(*) OVER () AS \"Total Matching Employees\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nWHERE\n  e.termination_date >= {period_start}\n  AND e.termination_date < {period_end}\n \
    \ AND (\n    e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\n  AND\
    \ e.department_name IN ({department})\nORDER BY {order_by}\nLIMIT {row_limit}\n\n"
  uses_rules:
  - terminations_in_period
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Current Status:
      kind: text
    Termination Date:
      kind: date
    Total Matching Employees:
      kind: integer
  presentation:
    kind: table
- id: bp-timecard-earnings-summary
  intent: 'Total timecard earnings, paid hours, entry counts and employee counts by company, employee,
    allocated department, day, month or earning code. Supports per-person hours and pay in a period and
    monthly labor-cost trends. Uses daily total_earning entries: in-progress earnings finalized and moved
    to payroll after period close. Use payroll earnings for finalized periods. Do not add both lifecycle
    stages for the same earnings. This template does not infer period-close status or switch sources.
    Amount is not net pay, annual salary or proof of payment. Optional earning_code is client-defined:
    resolve regular/overtime concepts, never hardcode a universal OT code. No average-rate calculation
    across unlike earning codes. Required half-open punch-date period and resolved table_source prevent
    accidental cross-source double counting. MCP handles storage-version deduplication; this does not
    remove overlapping real-world events. Department means recorded labor-allocation department code,
    not current home department. No scheduled shift, tardiness or overtime policy is inferred. Observed
    first/last dates do not prove completeness; missing days/months are not zero-filled.'
  slots_summary: group_by, period, source, employee, department, earning_code, pay_class, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.total_earning.department_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.pay_class_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - earning_code
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.total_earning.table_source
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.department_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: earning_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.earn_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.pay_class_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Timecard Earning Amount
    - Paid Hours
    - Entry Count
    - Employee Count
    - Observed Days
    - First Observed Date
    - Last Observed Date
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'employee'\n    THEN employee_code\n    WHEN {group_by}\
    \ = 'department'\n    THEN department_code\n    WHEN {group_by} = 'day'\n    THEN toString(punch_date)\n\
    \    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date), 1, 7)\n    WHEN {group_by}\
    \ = 'earning_code'\n    THEN earn_code\n    ELSE 'Company'\n  END AS \"Group\",\n  sum(earn_amount)\
    \ AS \"Timecard Earning Amount\",\n  sum(earn_hours) AS \"Paid Hours\",\n  count(*) AS \"Entry Count\"\
    ,\n  count(DISTINCT employee_code) AS \"Employee Count\",\n  count(DISTINCT punch_date) AS \"Observed\
    \ Days\",\n  min(punch_date) AS \"First Observed Date\",\n  max(punch_date) AS \"Last Observed Date\"\
    \nFROM dbpcm_warehouse.total_earning\nWHERE\n  punch_date >= toDate({period_start})\n  AND punch_date\
    \ < toDate({period_end})\n  AND table_source IN ({source})\n  AND employee_code = {employee}\n  AND\
    \ department_code IN ({department})\n  AND earn_code IN ({earning_code})\n  AND pay_class_code IN\
    \ ({pay_class})\nGROUP BY\n  CASE\n    WHEN {group_by} = 'employee'\n    THEN employee_code\n    WHEN\
    \ {group_by} = 'department'\n    THEN department_code\n    WHEN {group_by} = 'day'\n    THEN toString(punch_date)\n\
    \    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date), 1, 7)\n    WHEN {group_by}\
    \ = 'earning_code'\n    THEN earn_code\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Timecard Earning Amount:
      kind: currency
      currency: USD
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
    Entry Count:
      kind: integer
    Employee Count:
      kind: integer
    Observed Days:
      kind: integer
    First Observed Date:
      kind: date
    Last Observed Date:
      kind: date
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Timecard Earning Amount
    by_group_by:
      company: figure
      day: line
      month: line
- id: bp-total-earnings-by-department
  intent: Total earnings for a department, resolving the earnings register codes dynamically
  slots_summary: top_n, department, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: department
    type: string
    required: true
    binds_to: dbpcm_warehouse.department.department_name
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Total Earnings
      direction: DESC
    allowed_columns:
    - Department
    - Total Earnings
  uses_rules:
  - id: gross_earnings
    resolve_via: resolveValues(register_type, 'earnings')
    table: dbpcm_warehouse.payroll
    binds: earn_codes
  result_grain:
  - Department
  sql_template: "SELECT\n  e.department_name AS \"Department\",\n  SUM(p.amount) AS \"Total Earnings\"\
    \nFROM dbpcm_warehouse.payroll AS p\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = p.employee_code\n\
    WHERE\n  p.register_type IN {earn_codes} AND e.department_name IN ({department})\nGROUP BY\n  e.department_name\n\
    ORDER BY {order_by}\nLIMIT {top_n}\n\n"
  column_formats:
    Department:
      kind: text
    Total Earnings:
      kind: currency
      currency: USD
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Total Earnings

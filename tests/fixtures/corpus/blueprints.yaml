- id: bp-accrual-balance-summary
  intent: 'Recorded beginning, accrued, awarded and taken plan balances by company, department or plan. Optional
    accrual plan code, employee status, department and employee. Uses taken_amount, never approved event hours.
    No implicit PTO filter: resolve plan code for PTO. No event-date restriction, current-balance formula or assumed
    units. Cross-plan sums require compatible units; otherwise use plan grouping/filter. Preaggregate balance rows
    by employee/plan before LEFT JOIN; preserve source row count without assuming unique plan rows.'
  slots_summary: group_by, accrual_code, employee_status, department, employee
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.time_off_balance.employee_code
  - dbpcm_warehouse.time_off_balance.accrual_code
  - dbpcm_warehouse.time_off_balance.beginning_balance
  - dbpcm_warehouse.time_off_balance.accrued_amount
  - dbpcm_warehouse.time_off_balance.awarded_amount
  - dbpcm_warehouse.time_off_balance.taken_amount
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - plan
  - name: accrual_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_balance.accrual_code
    optional_pattern: 'TRUE'
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  result_grain:
  - Group
  sql_template: "WITH b AS (\n SELECT employee_code, accrual_code, sum(beginning_balance) AS beginning,\n sum(accrued_amount)\
    \ AS accrued, sum(awarded_amount) AS awarded,\n sum(taken_amount) AS taken, count(*) AS balance_rows\n FROM\
    \ dbpcm_warehouse.time_off_balance WHERE accrual_code = {accrual_code}\n GROUP BY employee_code, accrual_code\n\
    )\nSELECT CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'plan' THEN b.accrual_code ELSE 'Company'\
    \ END AS `Group`, sum(CAST(b.beginning AS Nullable(Decimal(38, 6)))) AS `Beginning Balance`,\n sum(CAST(b.accrued\
    \ AS Nullable(Decimal(38, 6)))) AS `Accrued Amount`, sum(CAST(b.awarded AS Nullable(Decimal(38, 6)))) AS `Awarded\
    \ Amount`,\n sum(CAST(b.taken AS Nullable(Decimal(38, 6)))) AS `Taken Amount`, sum(CAST(b.balance_rows AS Nullable(Decimal(20,\
    \ 0)))) AS `Source Balance Rows`,\n uniqExact(b.employee_code) AS `Employee Count`\nFROM b LEFT JOIN dbpcm_warehouse.employee\
    \ e ON b.employee_code = e.employee_code\nWHERE e.employee_status = {employee_status} AND e.department_name\
    \ = {department} AND e.employee_code = {employee}\nGROUP BY CASE {group_by} WHEN 'department' THEN e.department_name\
    \ WHEN 'plan' THEN b.accrual_code ELSE 'Company' END\nORDER BY `Group`\n"
- id: bp-accrual-event-summary
  intent: Accrual event/day row counts, event hours and distinct employees by company, department, workflow status,
    event type, event-date month or department_status (department and status together). Includes all event types
    and leave categories unless explicitly filtered. Required half-open requested-for-date period [start,end); optional
    workflow status enum, resolved event_type and earn_code strings, employee status, department and employee. No
    implicit Approved or PTO filter. COUNT counts event/day rows, not distinct multi-day requests. Approved hours
    are not taken balance usage. LEFT JOIN preserves unmatched events unless employee filters supplied; does not
    zero-fill periods or prove full coverage. For time-off-taken questions bind event_status=Approved and event_type=Time
    Off Request, plus the requested category/date scope; assume these requests were taken and disclose it. Offer
    a separate payroll-paid-hours check without executing it unless requested.
  slots_summary: group_by, period, event_status, event_type, earn_code, employee_status, department, employee
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
    - event_type
    - month
    - department_status
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: event_status
    type: enum
    required: false
    enum_values:
    - Approved
    - Requested
    - Denied
    - Removed
    - Calendar Only
    binds_to: dbpcm_warehouse.time_off_request.status
    optional_pattern: 'TRUE'
  - name: event_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_request.event_type
    optional_pattern: 'TRUE'
  - name: earn_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_request.earn_code
    optional_pattern: 'TRUE'
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  result_grain:
  - Group
  - Event Status
  sql_template: "WITH a AS (\n SELECT employee_code, status, event_type, substring(toString(request_date), 1, 7)\
    \ AS month,\n count(*) AS event_rows, sum(hours) AS hours\n FROM dbpcm_warehouse.time_off_request\n WHERE status\
    \ = {event_status} AND event_type = {event_type} AND earn_code = {earn_code}\n AND toDate(request_date) >= toDate({period_start})\
    \ AND toDate(request_date) < toDate({period_end})\n GROUP BY employee_code, status, event_type, substring(toString(request_date),\
    \ 1, 7)\n)\nSELECT CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'department_status' THEN e.department_name\
    \ WHEN 'status' THEN a.status WHEN 'event_type' THEN a.event_type WHEN 'month' THEN toString(a.month) ELSE 'Company'\
    \ END AS `Group`, CASE WHEN {group_by} = 'department_status' THEN a.status ELSE 'All selected statuses' END\
    \ AS `Event Status`, sum(CAST(a.event_rows AS Nullable(Decimal(20, 0)))) AS `Event Day Rows`,\n sum(CAST(a.hours\
    \ AS Nullable(Decimal(38, 6)))) AS `Event Hours`, uniqExact(a.employee_code) AS `Employee Count`\nFROM a LEFT\
    \ JOIN dbpcm_warehouse.employee e ON a.employee_code = e.employee_code\nWHERE e.employee_status = {employee_status}\
    \ AND e.department_name = {department} AND e.employee_code = {employee}\nGROUP BY CASE {group_by} WHEN 'department'\
    \ THEN e.department_name WHEN 'department_status' THEN e.department_name WHEN 'status' THEN a.status WHEN 'event_type'\
    \ THEN a.event_type WHEN 'month' THEN toString(a.month) ELSE 'Company' END\n, CASE WHEN {group_by} = 'department_status'\
    \ THEN a.status ELSE 'All selected statuses' END\nORDER BY `Group`, `Event Status`\n"
- id: bp-active-headcount-by-department
  intent: Employee headcount by department, including departments with no matching employees. Defaults to Active
    + On Leave; employee_status selects another status or All to remove the filter.
  slots_summary: department, employee_status
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.department.department_code
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    optional_pattern: employee_status IN ('Active', 'On Leave')
  uses_rules:
  - default_employee_population
  result_grain:
  - department_code
  sql_template: "SELECT\n    d.department_code AS department_code,\n    d.department_name AS department,\n    coalesce(e.active_count,\
    \ 0) AS headcount\nFROM dbpcm_warehouse.department AS d\nLEFT JOIN (\n    SELECT department_code, uniqExact(employee_code)\
    \ AS active_count\n    FROM dbpcm_warehouse.employee\n    WHERE (employee_status = {employee_status} OR {employee_status}\
    \ = 'All')\n    GROUP BY department_code\n) AS e ON d.department_code = e.department_code\nWHERE d.department_name\
    \ = {department}\nORDER BY headcount, department, department_code\n"
- id: bp-approved-timeoff-ranking
  intent: Rank employees by approved time-off request hours in a half-open requested-for-date period. Assume approved
    requests were taken and disclose that assumption. Include all accessible request records, retain ties at the
    requested rank, and offer a separate payroll-paid-hours check. Days are distinct requested calendar dates, not
    punch days.
  slots_summary: period, top_n
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 100
  result_grain:
  - Employee Code
  sql_template: 'WITH totals AS (

    SELECT employee_code, sum(hours) AS approved_hours, uniqExact(toDate(request_date)) AS requested_days

    FROM dbpcm_warehouse.time_off_request

    WHERE status = ''Approved'' AND event_type = ''Time Off Request''

    AND request_date >= {period_start} AND request_date < {period_end}

    GROUP BY employee_code

    ), ranked AS (

    SELECT employee_code, approved_hours, requested_days, dense_rank() OVER (ORDER BY approved_hours DESC) AS hours_rank
    FROM totals

    )

    SELECT employee_code AS `Employee Code`, approved_hours AS `Approved Time-Off Hours`, requested_days AS `Requested
    Days`, hours_rank AS `Rank`

    FROM ranked WHERE hours_rank <= {top_n} ORDER BY hours_rank, employee_code'
  uses_rules: []
- id: bp-average-annual-salary-by-status
  intent: Average annual compensation by pay type, filtered by employee status. Salary uses annual_salary; Hourly
    uses hourly_salary and estimated annual compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes
    overtime). Keep pay types separate. Defaults to Active + On Leave; employee_status overrides or All removes
    the filter.
  slots_summary: employee_status
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  slots:
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    optional_pattern: employee_status IN ('Active', 'On Leave')
  sql_template: SELECT employee_pay_type AS `Pay Type`, CASE WHEN employee_pay_type = 'Hourly' THEN 'Estimated annual
    compensation (2080 hours)' WHEN employee_pay_type = 'Salary' THEN 'Recorded annual salary' ELSE 'Unknown compensation
    basis' END AS `Compensation Basis`, avg(CASE WHEN employee_pay_type = 'Salary' THEN annual_salary WHEN employee_pay_type
    = 'Hourly' THEN hourly_salary * 2080 ELSE NULL END) AS `Average Annual Compensation`, avg(CASE WHEN employee_pay_type
    = 'Hourly' THEN hourly_salary ELSE NULL END) AS `Average Hourly Rate` FROM dbpcm_warehouse.employee WHERE (employee_status
    = {employee_status} OR {employee_status} = 'All') GROUP BY employee_pay_type
  result_grain:
  - Pay Type
  uses_rules:
  - compensation_by_pay_type
- id: bp-average-salary-by-department
  intent: Average annual compensation and headcount by department and pay type. Averages exclude unknown compensation;
    headcount includes it. Salary uses annual_salary; Hourly uses hourly_salary and estimated annual compensation
    = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes overtime). Keep pay types separate. Defaults
    to Active + On Leave; employee_status overrides or All removes the filter.
  slots_summary: department, employee_status
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: employee_status IN ('Active', 'On Leave')
  result_grain:
  - Department
  - Pay Type
  sql_template: "SELECT employee_pay_type AS `Pay Type`, CASE WHEN employee_pay_type = 'Hourly' THEN 'Estimated\
    \ annual compensation (2080 hours)' WHEN employee_pay_type = 'Salary' THEN 'Recorded annual salary' ELSE 'Unknown\
    \ compensation basis' END AS `Compensation Basis`, department_name AS department,\n       AVG((CASE WHEN employee_pay_type\
    \ = 'Salary' THEN annual_salary WHEN employee_pay_type = 'Hourly' THEN hourly_salary * 2080 ELSE NULL END))\
    \ AS average_annual_compensation,\n       COUNT(DISTINCT employee_code) AS headcount, avg(CASE WHEN employee_pay_type\
    \ = 'Hourly' THEN hourly_salary ELSE NULL END) AS `Average Hourly Rate`\nFROM dbpcm_warehouse.employee\nWHERE\
    \ department_name = {department}\n  AND (employee_status = {employee_status} OR {employee_status} = 'All')\n\
    GROUP BY employee_pay_type, department_name\n"
  uses_rules:
  - compensation_by_pay_type
- id: bp-compare-employee-check-detail-two-periods
  intent: Compare a single employee's two paychecks line-item by line-item across two pay periods, with per-item
    deltas
  slots_summary: employee, period_a, period_b
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.type_code_description
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  slots:
  - name: employee
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.employee_code
  - name: period_a
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  - name: period_b
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  result_grain:
  - register_type
  - type_code
  composes:
  - order: 0
    output:
      detail_a: table
    ref:
      blueprint: bp-employee-check-detail-for-period
      slots:
        employee: employee
        period: period_a
  - order: 1
    output:
      detail_b: table
    ref:
      blueprint: bp-employee-check-detail-for-period
      slots:
        employee: employee
        period: period_b
  - order: 2
    feeds_from:
    - 0
    - 1
    consumes:
      detail_a: $0
      detail_b: $1
    output: {}
    sql_template: "SELECT coalesce(a.register_type, b.register_type) AS register_type,\n       coalesce(a.type_code,\
      \ b.type_code) AS type_code,\n       coalesce(a.type_code_description, b.type_code_description) AS type_code_description,\n\
      \       coalesce(a.amount, 0) AS amount_a,\n       coalesce(b.amount, 0) AS amount_b,\n       coalesce(b.amount,\
      \ 0) - coalesce(a.amount, 0) AS amount_delta,\n       coalesce(a.hours, 0) AS hours_a,\n       coalesce(b.hours,\
      \ 0) AS hours_b\nFROM scratch.detail_a AS a\nFULL OUTER JOIN scratch.detail_b AS b\n  ON a.register_type =\
      \ b.register_type AND a.type_code = b.type_code\nORDER BY coalesce(a.register_type, b.register_type),\n  \
      \       coalesce(a.type_code, b.type_code)\n"
- id: bp-compensation-ranking
  intent: Top N highest-paid employees separately within Salary and Hourly pay types. Salary uses recorded annual
    salary; Hourly uses hourly_salary * 2080 estimated annual compensation (40 hours/week, 52 weeks/year, excludes
    overtime). This is current compensation, not actual payroll earnings. Defaults to Active + On Leave; top_n applies
    to each pay type.
  slots_summary: top_n, employee_status, department
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  result_grain:
  - Pay Type
  - Rank
  sql_template: 'WITH compensation AS (

    SELECT e.employee_code, e.employee_name, e.department_name, e.employee_pay_type, e.hourly_salary,

    CASE WHEN e.employee_pay_type = ''Salary'' THEN e.annual_salary WHEN e.employee_pay_type = ''Hourly'' THEN e.hourly_salary
    * 2080 ELSE NULL END AS annual_compensation

    FROM dbpcm_warehouse.employee e WHERE (e.employee_status = {employee_status} OR {employee_status} = ''All'')
    AND e.department_name = {department}

    ), ranked AS (

    SELECT employee_code, employee_name, department_name, employee_pay_type, hourly_salary, annual_compensation,
    row_number() OVER (PARTITION BY employee_pay_type ORDER BY annual_compensation DESC, employee_code) AS compensation_rank

    FROM compensation WHERE annual_compensation IS NOT NULL

    )

    SELECT employee_pay_type AS `Pay Type`, compensation_rank AS `Rank`, employee_code AS `Employee Code`, employee_name
    AS `Employee Name`, department_name AS `Department`, annual_compensation AS `Annual Compensation`, hourly_salary
    AS `Hourly Rate`

    FROM ranked WHERE compensation_rank <= {top_n} ORDER BY employee_pay_type, compensation_rank'
  uses_rules:
  - default_employee_population
  - compensation_by_pay_type
- id: bp-departments-above-company-average-salary
  intent: Departments above the corresponding company average, separately for Salary annual salaries and Hourly
    annual estimates (hourly rate * 2080, 40 hours/week, 52 weeks/year). Defaults to Active + On Leave; employee_status
    overrides or All removes the filter.
  slots_summary: employee_status
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  result_grain:
  - Department
  - Pay Type
  composes:
  - order: 0
    output:
      company_salary_avg: scalar
      company_hourly_avg: scalar
    sql_template: SELECT avg(CASE WHEN employee_pay_type = 'Salary' THEN annual_salary ELSE NULL END) AS company_salary_avg,
      avg(CASE WHEN employee_pay_type = 'Hourly' THEN hourly_salary * 2080 ELSE NULL END) AS company_hourly_avg
      FROM dbpcm_warehouse.employee WHERE (employee_status = {employee_status} OR {employee_status} = 'All')
  - order: 1
    feeds_from:
    - 0
    consumes:
      company_salary_avg: $0.company_salary_avg
      company_hourly_avg: $0.company_hourly_avg
    output: {}
    sql_template: SELECT department_name AS `Department`, employee_pay_type AS `Pay Type`, CASE WHEN employee_pay_type
      = 'Hourly' THEN 'Estimated annual compensation (2080 hours)' ELSE 'Recorded annual salary' END AS `Compensation
      Basis`, avg(CASE WHEN employee_pay_type = 'Salary' THEN annual_salary WHEN employee_pay_type = 'Hourly' THEN
      hourly_salary * 2080 ELSE NULL END) AS `Department Average Annual Compensation`, avg(CASE WHEN employee_pay_type
      = 'Hourly' THEN hourly_salary ELSE NULL END) AS `Average Hourly Rate` FROM dbpcm_warehouse.employee WHERE
      (employee_status = {employee_status} OR {employee_status} = 'All') GROUP BY department_name, employee_pay_type
      HAVING avg(CASE WHEN employee_pay_type = 'Salary' THEN annual_salary WHEN employee_pay_type = 'Hourly' THEN
      hourly_salary * 2080 ELSE NULL END) > CASE WHEN employee_pay_type = 'Salary' THEN {company_salary_avg} WHEN
      employee_pay_type = 'Hourly' THEN {company_hourly_avg} ELSE NULL END
  slots:

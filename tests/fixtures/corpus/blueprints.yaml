  sql_template: 'SELECT e.employee_pay_type AS `Pay Type`, CASE WHEN e.employee_pay_type = ''Hourly'' THEN ''Estimated
    annual compensation (2080 hours)'' WHEN e.employee_pay_type = ''Salary'' THEN ''Recorded annual salary'' ELSE
    ''Unknown compensation basis'' END AS `Compensation Basis`, e.employee_code AS `Employee Code`, e.department_name
    AS `Department`, e.employee_status AS `Status`, (CASE WHEN e.employee_pay_type = ''Salary'' THEN e.annual_salary
    WHEN e.employee_pay_type = ''Hourly'' THEN e.hourly_salary * 2080 ELSE NULL END) AS `Annual Compensation`, e.hourly_salary
    AS `Hourly Rate`

    FROM dbpcm_warehouse.employee e WHERE (e.employee_status = {employee_status} OR {employee_status} = ''All'')
    AND e.department_name = {department} AND e.employee_code = {employee} AND (({comparison} = ''above'' AND (CASE
    WHEN e.employee_pay_type = ''Salary'' THEN e.annual_salary WHEN e.employee_pay_type = ''Hourly'' THEN e.hourly_salary
    * 2080 ELSE NULL END) > {salary}) OR ({comparison} = ''at_least'' AND (CASE WHEN e.employee_pay_type = ''Salary''
    THEN e.annual_salary WHEN e.employee_pay_type = ''Hourly'' THEN e.hourly_salary * 2080 ELSE NULL END) >= {salary})
    OR ({comparison} = ''equal'' AND (CASE WHEN e.employee_pay_type = ''Salary'' THEN e.annual_salary WHEN e.employee_pay_type
    = ''Hourly'' THEN e.hourly_salary * 2080 ELSE NULL END) = {salary}) OR ({comparison} = ''below'' AND (CASE WHEN
    e.employee_pay_type = ''Salary'' THEN e.annual_salary WHEN e.employee_pay_type = ''Hourly'' THEN e.hourly_salary
    * 2080 ELSE NULL END) < {salary}))

    ORDER BY e.employee_pay_type, (CASE WHEN e.employee_pay_type = ''Salary'' THEN e.annual_salary WHEN e.employee_pay_type
    = ''Hourly'' THEN e.hourly_salary * 2080 ELSE NULL END) DESC, e.employee_code LIMIT {row_limit}'
  uses_rules:
  - compensation_by_pay_type
- id: bp-termination-family
  intent: Employees with a recorded termination date in a half-open period, with total matching record count before
    the display limit. Includes same-day/later rehires and employees no longer currently Terminated. Apply current
    status only when explicitly requested. For counts/grouped summaries use bp-employee-date-summary with date_basis=termination.
  slots_summary: period, row_limit, employee_status, department
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for all recorded terminations in the period; set only when current status is explicitly requested.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  result_grain:
  - Employee Code
  sql_template: 'SELECT e.employee_code AS `Employee Code`, e.employee_name AS `Employee Name`, e.department_name
    AS `Department`, e.employee_status AS `Current Status`, e.termination_date AS `Termination Date`, count(*) OVER
    () AS `Total Matching Records`

    FROM dbpcm_warehouse.employee e

    WHERE e.termination_date >= {period_start} AND e.termination_date < {period_end}

    AND (e.employee_status = {employee_status} OR {employee_status} = ''All'') AND e.department_name = {department}

    ORDER BY e.termination_date DESC, e.employee_code LIMIT {row_limit}'
  uses_rules:
  - terminations_in_period
- id: bp-timecard-earnings-summary
  intent: 'Total timecard earnings, paid hours, entry counts and employee counts by company, employee, allocated
    department, day, month or earning code. Supports per-person hours and pay in a period and monthly labor-cost
    trends. Uses daily total_earning entries: in-progress earnings finalized and moved to payroll after period close.
    Use payroll earnings for finalized periods. Do not add both lifecycle stages for the same earnings. This template
    does not infer period-close status or switch sources. Amount is not net pay, annual salary or proof of payment.
    Optional earning_code is client-defined: resolve regular/overtime concepts, never hardcode a universal OT code.
    No average-rate calculation across unlike earning codes. Required half-open punch-date period and resolved table_source
    prevent accidental cross-source double counting. FINAL deduplicates storage versions, not overlapping real-world
    events. Department means recorded labor-allocation department code, not current home department. No scheduled
    shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove completeness; missing
    days/months are not zero-filled.'
  slots_summary: group_by, period, source, employee, department, earning_code, pay_class
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.total_earning.department_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.pay_class_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - earning_code
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.total_earning.table_source
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.department_code
    optional_pattern: 'TRUE'
  - name: earning_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.earn_code
    optional_pattern: 'TRUE'
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.pay_class_code
    optional_pattern: 'TRUE'
  result_grain:
  - Group
  sql_template: 'SELECT CASE {group_by} WHEN ''employee'' THEN employee_code WHEN ''department'' THEN department_code
    WHEN ''day'' THEN toString(punch_date) WHEN ''month'' THEN substring(toString(punch_date),1,7) WHEN ''earning_code''
    THEN earn_code ELSE ''Company'' END AS `Group`,

    sum(earn_amount) AS `Timecard Earning Amount`, sum(earn_hours) AS `Paid Hours`, count(*) AS `Entry Count`, count(DISTINCT
    employee_code) AS `Employee Count`, count(DISTINCT punch_date) AS `Observed Days`, min(punch_date) AS `First
    Observed Date`, max(punch_date) AS `Last Observed Date`

    FROM dbpcm_warehouse.total_earning FINAL

    WHERE punch_date >= toDate({period_start}) AND punch_date < toDate({period_end}) AND table_source = {source}
    AND employee_code = {employee} AND department_code = {department} AND earn_code = {earning_code} AND pay_class_code
    = {pay_class}

    GROUP BY CASE {group_by} WHEN ''employee'' THEN employee_code WHEN ''department'' THEN department_code WHEN
    ''day'' THEN toString(punch_date) WHEN ''month'' THEN substring(toString(punch_date),1,7) WHEN ''earning_code''
    THEN earn_code ELSE ''Company'' END ORDER BY `Group`'
- id: bp-total-earnings-by-department
  intent: Total earnings for a department, resolving the earnings register codes dynamically
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: true
    binds_to: dbpcm_warehouse.department.department_name
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  uses_rules:
  - id: gross_earnings
    resolve_via: resolveValues(register_type, 'earnings')
    table: dbpcm_warehouse.payroll
    binds: earn_codes
  result_grain:
  - Department
  sql_template: "SELECT e.department_name AS department, SUM(p.amount) AS total_earnings\nFROM dbpcm_warehouse.payroll\
    \ AS p\nJOIN dbpcm_warehouse.employee AS e ON e.employee_code = p.employee_code\nWHERE p.register_type IN {earn_codes}\n\
    \  AND e.department_name = {department}\nGROUP BY e.department_name\n"

  sql_template: "WITH p AS (\n SELECT employee_code, substring(toString(pay_date), 1, 7) AS month,\n sum(amount)\
    \ AS amount, count(*) AS line_count\n FROM dbpcm_warehouse.payroll\n WHERE register_type = {register_type} AND\
    \ type_code = {type_code}\n AND toDate(pay_date) >= toDate({period_start}) AND toDate(pay_date) < toDate({period_end})\n\
    \ GROUP BY employee_code, substring(toString(pay_date), 1, 7)\n)\nSELECT CASE {group_by} WHEN 'department' THEN\
    \ e.department_name WHEN 'month' THEN toString(p.month) ELSE 'Company' END AS `Group`, sum(CAST(p.amount AS\

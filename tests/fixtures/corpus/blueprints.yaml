    - OL
    - OB
    - OX
  result_grain:
  - Employee Code
  - Punch Date
  sql_template: 'SELECT employee_code AS `Employee Code`, punch_date AS `Punch Date`, min(in_punch_time) AS `First
    Recorded In`, max(out_punch_time) AS `Last Recorded Out`, count(*) AS `Pair Count`, sum(earn_hours) AS `Paid
    Hours`

    FROM dbpcm_warehouse.punch_pair FINAL

    WHERE punch_date >= toDate({period_start}) AND punch_date < toDate({period_end}) AND table_source = {source}
    AND employee_code = {employee} AND department_code = {department} AND hours_type = {hours_type} AND pay_class_code
    = {pay_class} AND in_punch_type = {in_type} AND out_punch_type = {out_type}

    GROUP BY employee_code, punch_date ORDER BY employee_code, punch_date'
- id: bp-employee-summary
  intent: Headcount and annual compensation sum, average, minimum, maximum and known-compensation count by company,
    department or status, separately by pay type. Unknown compensation is NULL; headcount retains other and unknown
    pay types. Salary uses annual_salary; Hourly uses hourly_salary and estimated annual compensation = hourly_salary
    * 2080 (40 hours/week, 52 weeks/year; excludes overtime). Keep pay types separate. Defaults to Active + On Leave;
    employee_status overrides or All removes the filter.
  slots_summary: group_by, employee_status, department, employee
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  result_grain:
  - Group
  - Pay Type
  sql_template: "SELECT e.employee_pay_type AS `Pay Type`, CASE WHEN e.employee_pay_type = 'Hourly' THEN 'Estimated\
    \ annual compensation (2080 hours)' WHEN e.employee_pay_type = 'Salary' THEN 'Recorded annual salary' ELSE 'Unknown\
    \ compensation basis' END AS `Compensation Basis`, CASE WHEN {group_by} = 'department' THEN e.department_name\
    \ WHEN {group_by} = 'status' THEN e.employee_status ELSE 'Company' END AS `Group`,\n uniqExact(e.employee_code)\
    \ AS `Employee Count`,\n count((CASE WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080 ELSE NULL END)) AS `Known Compensation Count`,\n sum((CASE WHEN e.employee_pay_type\
    \ = 'Salary' THEN e.annual_salary WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080 ELSE NULL\
    \ END)) AS `Annual Compensation Sum`, avg((CASE WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary WHEN\
    \ e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080 ELSE NULL END)) AS `Average Annual Compensation`,\n\
    \ min((CASE WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary WHEN e.employee_pay_type = 'Hourly' THEN\
    \ e.hourly_salary * 2080 ELSE NULL END)) AS `Minimum Annual Compensation`, max((CASE WHEN e.employee_pay_type\
    \ = 'Salary' THEN e.annual_salary WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080 ELSE NULL\
    \ END)) AS `Maximum Annual Compensation`, avg(CASE WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\
    \ ELSE NULL END) AS `Average Hourly Rate`\nFROM dbpcm_warehouse.employee e\nWHERE (e.employee_status = {employee_status}\
    \ OR {employee_status} = 'All') AND e.department_name = {department} AND e.employee_code = {employee}\nGROUP\
    \ BY e.employee_pay_type, CASE WHEN {group_by} = 'department' THEN e.department_name WHEN {group_by} = 'status'\
    \ THEN e.employee_status ELSE 'Company' END\nORDER BY `Group`\n"
  uses_rules:
  - compensation_by_pay_type
- id: bp-employee-tenure-summary
  intent: Elapsed years from original or most recent hire date to a supplied ISO YYYY-MM-DD reference_date, using
    calendar days / 365.25. Company/department/current-status groups, average/min/max and valid-date count. Excludes
    NULL, dates at/before 1900-01-01 and future hire dates. all-status elapsed time does NOT stop at termination
    and is not historical active headcount. Date is explicit, not inferred from today. Defaults to Active + On Leave;
    employee_status selects another status or All to remove the filter.
  slots_summary: group_by, hire_basis, reference_date, employee_status, department, employee
  status: validated
  drift_status: clean
  catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
  uses:
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: hire_basis
    type: enum
    required: true
    enum_values:
    - original_hire
    - most_recent_hire
  - name: reference_date
    type: string
    temporal_type: date
    required: true
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may have no matching
      employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  result_grain:
  - Group
  sql_template: "SELECT CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'status' THEN e.employee_status\
    \ ELSE 'Company' END AS `Group`, count(*) AS `Valid Hire Date Count`,\n avg(dateDiff('day', CASE {hire_basis}\
    \ WHEN 'most_recent_hire' THEN e.most_recent_hire_date ELSE e.hire_date END, toDate({reference_date})) / 365.25)\
    \ AS `Average Elapsed Years`,\n min(dateDiff('day', CASE {hire_basis} WHEN 'most_recent_hire' THEN e.most_recent_hire_date\
    \ ELSE e.hire_date END, toDate({reference_date})) / 365.25) AS `Minimum Elapsed Years`,\n max(dateDiff('day',\
    \ CASE {hire_basis} WHEN 'most_recent_hire' THEN e.most_recent_hire_date ELSE e.hire_date END, toDate({reference_date}))\
    \ / 365.25) AS `Maximum Elapsed Years`\nFROM dbpcm_warehouse.employee e WHERE (e.employee_status = {employee_status}\
    \ OR {employee_status} = 'All') AND e.department_name = {department} AND e.employee_code = {employee} AND (CASE\
    \ {hire_basis} WHEN 'most_recent_hire' THEN e.most_recent_hire_date ELSE e.hire_date END) > toDate('1900-01-01')\
    \ AND (CASE {hire_basis} WHEN 'most_recent_hire' THEN e.most_recent_hire_date ELSE e.hire_date END) <= toDate({reference_date})\n\
    GROUP BY CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'status' THEN e.employee_status ELSE\
    \ 'Company' END ORDER BY `Group`"
- id: bp-hires-in-range
  intent: "New hires per month within an explicit start/end date range \u2014 counts by original hire date; rehires\
    \ are not re-counted"
  slots_summary: hire_window
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: hire_window
    type: period_range
    temporal_type: date
    required: true
  result_grain:
  - month
  window_anchor: calendar
  sql_template: "SELECT toStartOfMonth(hire_date) AS month,\n       COUNT(DISTINCT employee_code) AS hires\nFROM\
    \ dbpcm_warehouse.employee\nWHERE hire_date >= {hire_window_start}\n  AND hire_date < {hire_window_end}\n  AND\
    \ (employee_status != 'Not Hired' OR employee_status IS NULL)\nGROUP BY toStartOfMonth(hire_date)\n"
- id: bp-hires-per-month
  intent: "New hires per month over a trailing window of the last N months \u2014 counts by original hire date;\
    \ rehires are not re-counted"
  slots_summary: window_months
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 36
  result_grain:
  - month
  window_anchor: data
  sql_template: "SELECT toStartOfMonth(hire_date) AS month,\n       COUNT(DISTINCT employee_code) AS hires\nFROM\
    \ dbpcm_warehouse.employee\nWHERE hire_date >= (\n        SELECT toStartOfMonth(max(hire_date))\n        FROM\
    \ dbpcm_warehouse.employee\n        WHERE employee_status != 'N' OR employee_status IS NULL\n      ) - INTERVAL\
    \ {window_months} MONTH\n  AND (employee_status != 'N' OR employee_status IS NULL)\nGROUP BY toStartOfMonth(hire_date)\n"
- id: bp-hires-projection
  intent: "Projected number of hires over the next N months at the current hiring pace (run-rate over a trailing\
    \ window) \u2014 counts by original hire date; rehires are not re-counted"
  slots_summary: window_months, horizon_months
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 2
    max_value: 36
  - name: horizon_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 24
  result_grain: []
  window_anchor: data
  sql_template: "SELECT\n  COUNT(DISTINCT employee_code) AS hires_in_window,\n  round(COUNT(DISTINCT employee_code)\
    \ / {window_months}, 1) AS avg_monthly_hires,\n  round(COUNT(DISTINCT employee_code) / {window_months} * {horizon_months})\
    \ AS projected_next_n_hires\nFROM dbpcm_warehouse.employee\nWHERE hire_date >= addMonths((\n        SELECT toStartOfMonth(max(hire_date))\n\
    \        FROM dbpcm_warehouse.employee\n        WHERE employee_status != 'N' OR employee_status IS NULL\n  \
    \    ), 1) - INTERVAL {window_months} MONTH\n  AND (employee_status != 'N' OR employee_status IS NULL)\n"

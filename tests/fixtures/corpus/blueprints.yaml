# Hand-authored blueprint seed corpus (neo4j-corpus-design §3.2, extended with the
# full DAG by runblueprint-design §1.2).
#
# `uses` strings are BYTE-EXACT `"database.table.column"` scope keys of the HR
# warehouse the Layer-2 ClickHouse seed (docker/clickhouse-init/hr-warehouse.sql)
# + the Semantic Catalog describe — so scope filtering against a real scope is
# genuinely exercised. Any format skew here silently drops the blueprint via the
# set-subset scope pre-filter (§8 highest-risk contract), so these are curated
# against the real `dbpcm_warehouse.<table>.<Column>` names.
#
# Each seed is an EXECUTABLE SINGLE-NODE blueprint (runblueprint-design §Q7 Slice
# A): a top-level `sql_template` with `{slot}` bind sites, typed `slots`, and a
# declared `result_grain` (D56 checks the result against it). The corpus loader's
# write-time validation (§1.2) proves every `{slot}` is declared, each template
# parses under ClickHouse, and the template's column footprint ⊆ `uses`.
- id: bp-overtime-by-department
  intent: Total overtime pay by department for a given pay period
  slots_summary: department, pay_period
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.payroll.EmployeeCode
    - dbpcm_warehouse.payroll.RegisterType
    - dbpcm_warehouse.payroll.Amount
    - dbpcm_warehouse.payroll.PayPeriodEndDate
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
  resolves:
    overtime: gross_earnings
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
    - { name: pay_period, type: period, required: true, binds_to: dbpcm_warehouse.payroll.PayPeriodEndDate }
  uses_rules:
    - gross_earnings
  result_grain: [ Department ]
  sql_template: |
    SELECT e.Department AS department, SUM(p.Amount) AS overtime_pay
    FROM dbpcm_warehouse.payroll AS p
    JOIN dbpcm_warehouse.employee AS e ON e.EmployeeCode = p.EmployeeCode
    WHERE p.RegisterType = 'EARN'
      AND e.Department = {department}
      AND p.PayPeriodEndDate = {pay_period}
    GROUP BY e.Department

- id: bp-active-headcount-by-department
  intent: Active employee headcount by department
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
    - dbpcm_warehouse.employee.EmployeeStatus
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  uses_rules:
    - active_employee
  result_grain: [ Department ]
  sql_template: |
    SELECT Department AS department, COUNT(DISTINCT EmployeeCode) AS headcount
    FROM dbpcm_warehouse.employee
    WHERE EmployeeStatus = 'A' AND Department = {department}
    GROUP BY Department

- id: bp-average-salary-by-department
  intent: Average annual salary by department
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
    - dbpcm_warehouse.employee.AnnualSalary
  resolves:
    salary: AnnualSalary
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  result_grain: [ Department ]
  sql_template: |
    SELECT Department AS department,
           AVG(AnnualSalary) AS avg_salary,
           COUNT(DISTINCT EmployeeCode) AS headcount
    FROM dbpcm_warehouse.employee
    WHERE Department = {department}
    GROUP BY Department

# Slice-C SINGLE-NODE `resolve_via` blueprint (D67, runblueprint-design §3.4): the
# `earnings_only` rule maps the concept "earnings" → the earnings RegisterType code
# set via the typed `resolveValues.resolve()` hook (NO model round-trip), and the
# executor folds the ranked codes into the `{earn_codes}` predicate as a typed AST
# IN-list (F1/D10 — never interpolated). Value-only ranking (RegisterType has no
# sibling description column) against the real embedder + the DISTINCT-domain freq.
# The seed's catalog-faithful RegisterType domain is {EARN, EETAX, DDUCT,
# NETPAYDIST, EEBEN, ERTAX} (EARN has one row per paid employee); "earnings" must
# rank EARN first, above deduction/tax codes such as DDUCT/EETAX.
- id: bp-total-earnings-by-department
  intent: Total earnings for a department, resolving the earnings register codes dynamically
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.payroll.EmployeeCode
    - dbpcm_warehouse.payroll.RegisterType
    - dbpcm_warehouse.payroll.Amount
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  uses_rules:
    - { id: earnings_only, resolve_via: "resolveValues(RegisterType, 'earnings')", table: dbpcm_warehouse.payroll, binds: earn_codes }
  result_grain: [ Department ]
  sql_template: |
    SELECT e.Department AS department, SUM(p.Amount) AS total_earnings
    FROM dbpcm_warehouse.payroll AS p
    JOIN dbpcm_warehouse.employee AS e ON e.EmployeeCode = p.EmployeeCode
    WHERE p.RegisterType IN {earn_codes}
      AND e.Department = {department}
    GROUP BY e.Department

# Slice-C multi-node SCALAR-passing DAG (runblueprint-design §2.4/§Q7 Slice C):
# node 0 computes the company-wide average as a SCALAR; node 1 consumes it as a
# typed AST literal (F1/D10 — never interpolated) to select the departments above
# it. No table intermediate (F2-clean); the declared result grain is Department.
- id: bp-departments-above-company-average-salary
  intent: Departments whose average salary exceeds the company-wide average
  slots_summary: ""
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
    - dbpcm_warehouse.employee.AnnualSalary
  result_grain: [ Department ]
  composes:
    - order: 0
      output: { company_avg: scalar }
      sql_template: |
        SELECT AVG(AnnualSalary) AS company_avg
        FROM dbpcm_warehouse.employee
    - order: 1
      feeds_from: [ 0 ]
      consumes: { company_avg: "$0.company_avg" }
      output: {}
      sql_template: |
        SELECT Department AS department, AVG(AnnualSalary) AS dept_avg
        FROM dbpcm_warehouse.employee
        GROUP BY Department
        HAVING AVG(AnnualSalary) > {company_avg}

# Table-intermediate DAG (table-intermediate-design §2.2/§Q2, Slice 2). Genuinely
# NOT scalar-converging: node 0 produces a per-EMPLOYEE earnings TABLE (many rows,
# one per employee), which node 1 ROW-JOINs against the warehouse `employee` table
# to aggregate by department. A scalar pass cannot carry a per-employee table, so
# this exercises the D93 materialize-and-join path — node 0's result is
# materialized to `scratch.s_<sid>_bp_<uuid>` and node 1's `scratch.emp_earnings`
# FROM token is AST-rewritten to it (runtime-controlled identifier, never model
# text). The join key is CAST to a stable type (`toString(EmployeeCode)` — matches
# the String warehouse key) and the measure to `toFloat64` (§Q2/OQ-A). The scratch
# columns are session-gated (excluded from `uses`, D69/OQ-4); the warehouse columns
# stay ⊆ uses. The terminal grain (Department) is D56-verified.
- id: bp-earnings-by-department-via-scratch-join
  intent: Total earnings by department, materializing per-employee earnings and joining departments
  slots_summary: department
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.payroll.EmployeeCode
    - dbpcm_warehouse.payroll.RegisterType
    - dbpcm_warehouse.payroll.Amount
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.Department
  slots:
    - { name: department, type: string, required: true, binds_to: dbpcm_warehouse.employee.Department }
  result_grain: [ Department ]
  composes:
    - order: 0
      output: { emp_earnings: table }
      sql_template: |
        SELECT toString(p.EmployeeCode) AS EmployeeCode,
               toFloat64(SUM(p.Amount)) AS earnings
        FROM dbpcm_warehouse.payroll AS p
        WHERE p.RegisterType = 'EARN'
        GROUP BY p.EmployeeCode
    - order: 1
      feeds_from: [ 0 ]
      consumes: { emp_earnings: "$0" }
      output: {}
      sql_template: |
        SELECT e.Department AS department, SUM(x.earnings) AS total_earnings
        FROM scratch.emp_earnings AS x
        JOIN dbpcm_warehouse.employee AS e ON e.EmployeeCode = x.EmployeeCode
        WHERE e.Department = {department}
        GROUP BY e.Department

# Windowed-period slot — `relative_window` (a trailing "last N months", D41/D49):
# the runtime resolves the raw value to a BOUNDED integer and binds it as an
# `INTERVAL {n} MONTH` NUMBER literal (F1/D10 — never interpolated). `min_value`/
# `max_value` narrow the safety bounds (default 1..120); an out-of-range or
# non-integer value → askUser, never an absurd `INTERVAL 999999 MONTH`.
- id: bp-hires-per-month
  intent: New hires per month over a trailing window of the last N months
  slots_summary: window_months
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.MostRecentHireDate
    - dbpcm_warehouse.employee.EmployeeStatus
  slots:
    - { name: window_months, type: relative_window, required: true, min_value: 1, max_value: 36 }
  result_grain: [ month ]
  # Anchor the trailing window on the DATA (the latest hire month present), not the
  # wall clock — so the fixture doesn't decay to empty as real time passes. The
  # window yields N whole months PLUS the current partial (latest) bucket (harmless
  # here — this is a per-month listing, no division by N). exclude_not_hired_default:
  # drop 'N' (pre-hire) records — in BOTH the outer WHERE and the anchor subquery, so
  # a future-dated 'N' hire date can never become max() and drag the anchor. The
  # `OR IS NULL` matters: EmployeeStatus is Nullable(String), a bare `!= 'N'` drops NULLs.
  sql_template: |
    SELECT toStartOfMonth(MostRecentHireDate) AS month,
           COUNT(DISTINCT EmployeeCode) AS hires
    FROM dbpcm_warehouse.employee
    WHERE MostRecentHireDate >= (
            SELECT toStartOfMonth(max(MostRecentHireDate))
            FROM dbpcm_warehouse.employee
            WHERE EmployeeStatus != 'N' OR EmployeeStatus IS NULL
          ) - INTERVAL {window_months} MONTH
      AND (EmployeeStatus != 'N' OR EmployeeStatus IS NULL)
    GROUP BY toStartOfMonth(MostRecentHireDate)

# Windowed-period slot — `period_range` (an explicit {start, end}, D41/D49): the
# ONE slot expands to TWO bind tokens `{hire_window_start}` / `{hire_window_end}`,
# each bound as a TYPED string literal (F1/D10). BOTH tokens must be referenced or
# the loader rejects the blueprint (a dropped bound is a dropped filter, the D56
# wrong-answer class). The resolver does NO relative→concrete date math — an
# explicit ISO {start,end} is required; a deictic word ("last month") → askUser.
- id: bp-hires-in-range
  intent: New hires per month within an explicit start/end date range
  slots_summary: hire_window
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.MostRecentHireDate
    - dbpcm_warehouse.employee.EmployeeStatus
  slots:
    - { name: hire_window, type: period_range, required: true }
  result_grain: [ month ]
  # exclude_not_hired_default: drop 'N' (pre-hire) records. `OR IS NULL` matters —
  # EmployeeStatus is Nullable(String), a bare `!= 'N'` drops NULL rows.
  sql_template: |
    SELECT toStartOfMonth(MostRecentHireDate) AS month,
           COUNT(DISTINCT EmployeeCode) AS hires
    FROM dbpcm_warehouse.employee
    WHERE MostRecentHireDate >= {hire_window_start}
      AND MostRecentHireDate < {hire_window_end}
      AND (EmployeeStatus != 'N' OR EmployeeStatus IS NULL)
    GROUP BY toStartOfMonth(MostRecentHireDate)

# Second-order (D103/D104, second-order-analysis-design §2–§3): a run-rate PROJECTION.
# The pivot away from a bespoke `projectSeries` tool — the projection math is plain
# ClickHouse (sum-of-hires-in-window ÷ window_months × horizon_months), so it lives in
# a VERIFIED blueprint that rides the existing D56-verify + provenance path, not a new
# tool. A single-row aggregate (no GROUP BY / CTE / WITH FILL): `sum/N` counts zero-hire
# months correctly BY CONSTRUCTION (a zero-hire month adds 0; the denominator is the
# fixed window N), so the empty months never need materializing. `result_grain: []` → a
# single-row aggregate, so D56 grain-verify is vacuously skipped.
- id: bp-hires-projection
  intent: Projected number of hires over the next N months at the current hiring pace (run-rate over a trailing window)
  slots_summary: window_months, horizon_months
  status: validated
  drift_status: clean
  catalog_sha: ""
  uses:
    - dbpcm_warehouse.employee.EmployeeCode
    - dbpcm_warehouse.employee.MostRecentHireDate
    - dbpcm_warehouse.employee.EmployeeStatus
  slots:
    - { name: window_months,  type: relative_window, required: true, min_value: 2, max_value: 36 }
    - { name: horizon_months, type: relative_window, required: true, min_value: 1, max_value: 24 }
  result_grain: []
  # Run-rate projection: avg monthly hires over the trailing window, projected forward.
  # Denominator/span alignment: the anchor is shifted FORWARD one month (addMonths(...,1))
  # before subtracting {window_months}, so the window spans EXACTLY N monthly buckets
  # ending at the latest hire month — NOT N+1 (latest + N prior), which would divide N+1
  # buckets' hires by N and bias the rate high (+50% at the min window). sum/N then counts
  # zero-hire months correctly (a zero-hire month adds 0; denominator is the fixed N).
  # Window anchored on the DATA (latest hire month), matching bp-hires-per-month, so it
  # does not decay to empty as wall-clock time passes. exclude_not_hired_default: drop
  # 'N' (pre-hire) records in BOTH the outer WHERE and the anchor subquery (a future-dated
  # 'N' hire could otherwise become max() and drag the anchor). `OR IS NULL` matters —
  # EmployeeStatus is Nullable(String), a bare `!= 'N'` drops NULL rows.
  sql_template: |
    SELECT
      COUNT(DISTINCT EmployeeCode) AS hires_in_window,
      round(COUNT(DISTINCT EmployeeCode) / {window_months}, 1) AS avg_monthly_hires,
      round(COUNT(DISTINCT EmployeeCode) / {window_months} * {horizon_months}) AS projected_next_n_hires
    FROM dbpcm_warehouse.employee
    WHERE MostRecentHireDate >= addMonths((
            SELECT toStartOfMonth(max(MostRecentHireDate))
            FROM dbpcm_warehouse.employee
            WHERE EmployeeStatus != 'N' OR EmployeeStatus IS NULL
          ), 1) - INTERVAL {window_months} MONTH
      AND (EmployeeStatus != 'N' OR EmployeeStatus IS NULL)

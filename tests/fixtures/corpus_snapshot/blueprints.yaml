- id: bp-expense-approval-backlog
  intent: Expenses awaiting approval longest, by submission age, with optional minimum wait threshold
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  employee_code AS \"Employee Code\",\n  count() AS \"Pending Expenses\",\n \
    \ round(toFloat64(SUM(amount_approved)), 2) AS \"Pending Amount\",\n  round(AVG(DATE_DIFF(DAY, date_time_submitted,\
    \ today())), 1) AS \"Avg Days Pending\"\nFROM dbpcm_warehouse.expense\nWHERE\n  expense_status = 'Pending\
    \ Approval'\n  AND NOT (\n    date_time_submitted IS NULL\n  )\n  AND toDate32(date_time_submitted)\
    \ > toDate32('1900-01-01')\n  AND DATE_DIFF(DAY, date_time_submitted, today()) >= {min_age}\nGROUP\
    \ BY\n  employee_code\nORDER BY\n  \"Avg Days Pending\" DESC,\n  \"Employee Code\"\nLIMIT {top_n}\n"
  slots:
  - name: min_age
    type: nonnegative_integer
    required: true
  - name: top_n
    type: positive_integer
    required: true
    description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that
      ranking. It does not accept order_by or order_direction. A different selection or display order
      requires a separate query.
  slots_summary: min_age, top_n
  uses:
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.expense.date_time_submitted
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.employee_code
  column_formats:
    Employee Code:
      kind: identifier
    Pending Expenses:
      kind: integer
    Pending Amount:
      kind: currency
      currency: USD
      precision: 2
    Avg Days Pending:
      kind: number
      unit: days
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Employee Code
    measure_columns:
    - Pending Expenses
- id: bp-expense-approval-trim

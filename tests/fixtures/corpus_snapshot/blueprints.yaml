  - dbpcm_warehouse.time_off_request.date_added
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Request Date:
      kind: date
    Pending Hours:
      kind: number
      unit: hours
      precision: 2
    Days Waiting:
      kind: number
      unit: days
      precision: 2
- id: bp-placeholder-category-audit
  intent: Total timecard earnings dollars and paid hours flowing through the Select Category placeholder
    bucket for a punch date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT count(DISTINCT te.earn_code) AS \"Distinct Earn Codes\",\n       round(SUM(te.earn_amount),\
    \ 2) AS \"Total Dollars\",\n       round(SUM(te.earn_hours), 2) AS \"Total Hours\"\nFROM\n  (SELECT\
    \ punch_date,\n          earn_amount,\n          earn_hours,\n          earn_code\n   FROM dbpcm_warehouse.total_earning)\
    \ AS te\nJOIN\n  (SELECT earn_code,\n          category_name\n   FROM dbpcm_warehouse.earning_category\
    \ FINAL) AS ec ON ec.earn_code = te.earn_code\nWHERE ec.category_name = 'Select Category'\n  AND te.punch_date\
    \ BETWEEN {window_start} AND {window_end}\n"

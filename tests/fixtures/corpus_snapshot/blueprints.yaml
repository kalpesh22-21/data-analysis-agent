- id: bp-payroll-summary
  intent: Payroll amount and distinct employee count by company, department or pay-date month. Required
    register_type enum and half-open pay-date period [start,end); select EARN for gross earnings. Optional
    type_code, employee status, department and employee. Earnings represent finalized total_earning after
    period close; use total_earning for in-progress earnings and never add both for the same covered earnings.
    Preaggregate payroll per employee/month before LEFT JOIN; unmatched employees retained unless employee
    filters supplied. Does not prove complete months or zero-fill missing months; no implicit earnings
    filter.
  slots_summary: group_by, register_type, period, type_code, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_date
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - month
  - name: register_type
    type: enum
    required: true
    enum_values:
    - EARN
    - EETAX
    - DDUCT
    - NETPAYDIST
    - EEBEN
    - ERTAX
    binds_to: dbpcm_warehouse.payroll.register_type
    multiple: true
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: type_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.payroll.type_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Payroll Amount
    - Employee Count
  result_grain:
  - Group
  sql_template: "WITH p AS (\n  SELECT\n    employee_code,\n    SUBSTRING(toString(pay_date), 1, 7) AS\
    \ month,\n    sum(amount) AS amount\n  FROM dbpcm_warehouse.payroll\n  WHERE\n    register_type IN\
    \ ({register_type})\n    AND type_code IN ({type_code})\n    AND toDate(pay_date) >= toDate({period_start})\n\
    \    AND toDate(pay_date) < toDate({period_end})\n  GROUP BY\n    employee_code,\n    SUBSTRING(toString(pay_date),\
    \ 1, 7)\n)\nSELECT\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n    WHEN\
    \ {group_by} = 'month'\n    THEN toString(p.month)\n    ELSE 'Company'\n  END AS \"Group\",\n  sum(CAST(p.amount\
    \ AS Nullable(Decimal(38, 2)))) AS \"Payroll Amount\",\n  uniqExact(p.employee_code) AS \"Employee\
    \ Count\"\nFROM p\nLEFT JOIN dbpcm_warehouse.employee AS e\n  ON p.employee_code = e.employee_code\n\
    WHERE\n  e.employee_status IN ({employee_status})\n  AND e.department_name IN ({department})\n  AND\
    \ e.employee_code = {employee}\nGROUP BY\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n\
    \    WHEN {group_by} = 'month'\n    THEN toString(p.month)\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Payroll Amount:
      kind: currency
      currency: USD
      precision: 2
    Employee Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Payroll Amount
    by_group_by:
      company: figure
      month: line
- id: bp-pending-timeoff-queue
  intent: Pending time-off requests queue with days waiting since submission, optionally filtered by department;
    Days Waiting is the oldest pending submission in each employee/request-date group
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  t.employee_code AS \"Employee Code\",\n  any(e.employee_name) AS \"Employee\
    \ Name\",\n  any(e.department_name) AS \"Department\",\n  toDate32(t.request_date) AS \"Request Date\"\
    ,\n  round(SUM(t.hours), 2) AS \"Pending Hours\",\n  max(DATE_DIFF(DAY, t.date_added, today())) AS\
    \ \"Days Waiting\"\nFROM dbpcm_warehouse.time_off_request AS t\nJOIN dbpcm_warehouse.employee AS e\n\
    \  ON e.employee_code = t.employee_code\nWHERE\n  t.status = 'Requested'\n  AND t.event_type IN ({event_type})\n\
    \  AND e.department_name IN ({dept})\n  AND DATE_DIFF(DAY, t.date_added, today()) >= {min_wait}\n\
    GROUP BY\n  t.employee_code,\n  toDate32(t.request_date)\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: dept
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: min_wait
    type: nonnegative_integer
    required: false
    optional_pattern: 'TRUE'
  - name: event_type
    type: enum
    required: false
    enum_values:
    - Time Off Request
    - Payout Request
    default:
    - Time Off Request
    description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only
      when payouts are explicitly requested.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Days Waiting DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Days Waiting
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Department
    - Request Date
    - Pending Hours
    - Days Waiting
  slots_summary: top_n, dept, min_wait, event_type, order_by
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.date_added
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Request Date:
      kind: date
    Pending Hours:
      kind: number
      unit: hours
      precision: 2
    Days Waiting:
      kind: number
      unit: days
      precision: 2
  presentation:
    kind: table
- id: bp-placeholder-category-audit
  intent: Total timecard earnings dollars and paid hours flowing through the Select Category placeholder
    bucket for a punch date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  count(DISTINCT te.earn_code) AS \"Distinct Earn Codes\",\n  round(SUM(te.earn_amount),\
    \ 2) AS \"Total Dollars\",\n  round(SUM(te.earn_hours), 2) AS \"Total Hours\"\nFROM (\n  SELECT\n\
    \    punch_date,\n    earn_amount,\n    earn_hours,\n    earn_code\n  FROM dbpcm_warehouse.total_earning\n\
    ) AS te\nJOIN (\n  SELECT\n    earn_code,\n    category_name\n  FROM dbpcm_warehouse.earning_category\n\
    ) AS ec\n  ON ec.earn_code = te.earn_code\nWHERE\n  ec.category_name = 'Select Category'\n  AND (\n\
    \    te.punch_date >= {window_start} AND te.punch_date < {window_end}\n  )\nORDER BY {order_by}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Distinct Earn Codes ASC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Distinct Earn Codes
      direction: ASC
    allowed_columns:
    - Distinct Earn Codes
    - Total Dollars
    - Total Hours
  slots_summary: window, order_by
  uses:
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Distinct Earn Codes:
      kind: integer
    Total Dollars:
      kind: currency
      currency: USD
    Total Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: facts
    measure_columns:
    - Distinct Earn Codes
    - Total Dollars
    - Total Hours
- id: bp-position-change-activity
  intent: Employee master-data change counts by department and changed field, useful for auditing position
    seat, title, level, and family churn
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "/* Output aliases are Title-Case display names; consumers keying on column names */\n\
    /* must use the quoted aliases. */\nSELECT\n  any(e.department_name) AS \"Department\",\n  ec.changed_field\
    \ AS \"Changed Field\",\n  count() AS \"Change Events\"\nFROM (\n  SELECT\n    employee_code,\n  \
    \  changed_field,\n    change_time_added\n  FROM dbpcm_warehouse.employee_change\n) AS ec\nJOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = ec.employee_code\nWHERE\n  ec.change_time_added >= addMonths(today(),\
    \ -{win})\n  AND ec.changed_field IN ({changed_field})\nGROUP BY\n  e.department_name,\n  ec.changed_field\n\
    ORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: changed_field
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee_change.changed_field
    optional_pattern: 'TRUE'
    multiple: true
  - name: win
    type: relative_window
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Change Events DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Change Events
      direction: DESC
    allowed_columns:
    - Department
    - Changed Field
    - Change Events
  slots_summary: changed_field, win, max_rows, order_by
  uses:
  - dbpcm_warehouse.employee_change.employee_code
  - dbpcm_warehouse.employee_change.changed_field
  - dbpcm_warehouse.employee_change.change_time_added
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Changed Field:
      kind: text
    Change Events:
      kind: integer
  presentation:
    kind: table
- id: bp-post-termination-accrual-audit
  intent: Terminated employees with time-off balance accrual activity dated after their termination date,
    rehire-aware
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  b.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  b.accrual_code AS \"Accrual Code\",\n  b.accrual_date AS \"Accrual Date\",\n  e.termination_date\
    \ AS \"Termination Date\",\n  round(toFloat64(SUM(b.accrued_amount)), 2) AS \"Accrual Amount\"\nFROM\
    \ dbpcm_warehouse.time_off_balance AS b\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code\
    \ = b.employee_code\nWHERE\n  NOT (\n    e.termination_date IS NULL\n  )\n  AND toDate32(e.termination_date)\
    \ > toDate32('1900-01-01')\n  AND NOT (\n    b.accrual_date IS NULL\n  )\n  AND b.accrual_date > toDate32(e.termination_date)\n\
    \  AND (\n    e.most_recent_hire_date IS NULL\n    OR toDate32(e.most_recent_hire_date) <= toDate32('1900-01-01')\n\
    \    OR e.most_recent_hire_date <= e.termination_date\n  )\n  AND b.accrued_amount > 0\n  AND b.accrual_date\
    \ >= {accrual_window_start}\n  AND b.accrual_date < {accrual_window_end}\nGROUP BY\n  b.employee_code,\n\
    \  e.employee_name,\n  b.accrual_code,\n  b.accrual_date,\n  e.termination_date\nORDER BY {order_by}\n\
    LIMIT {max_rows}\n\n"
  slots:
  - name: accrual_window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Accrual Date DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Accrual Date
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Accrual Code
    - Accrual Date
    - Termination Date
    - Accrual Amount
  slots_summary: accrual_window, max_rows, order_by
  uses:
  - dbpcm_warehouse.time_off_balance.employee_code
  - dbpcm_warehouse.time_off_balance.accrual_date
  - dbpcm_warehouse.time_off_balance.accrued_amount
  - dbpcm_warehouse.time_off_balance.accrual_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Accrual Code:
      kind: identifier
    Accrual Date:
      kind: datetime
    Termination Date:
      kind: date
    Accrual Amount:
      kind: number
  presentation:
    kind: table
- id: bp-post-termination-changes
  intent: Employee master-data changes with an effective date after the employee's termination date, flagged
    as a post-termination audit anomaly
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "/* Output aliases are Title-Case display names; consumers keying on column names */\n\
    /* must use the quoted aliases. */\nSELECT\n  ec.employee_code AS \"Employee Code\",\n  any(e.employee_name)\
    \ AS \"Name\",\n  ec.changed_field AS \"Changed Field\",\n  count() AS \"Post-Termination Changes\"\
    \nFROM (\n  SELECT\n    employee_code,\n    effective_date,\n    change_time_added,\n    changed_field\n\
    \  FROM dbpcm_warehouse.employee_change\n) AS ec\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code\
    \ = ec.employee_code\nWHERE\n  NOT (\n    ec.effective_date IS NULL\n  )\n  AND (\n    ec.change_time_added\
    \ >= {window_start}\n    AND ec.change_time_added < {window_end}\n  )\n  AND NOT (\n    e.termination_date\
    \ IS NULL\n  )\n  AND toDate32(e.termination_date) > toDate32('1900-01-01')\n  AND ec.effective_date\
    \ > e.termination_date\nGROUP BY\n  ec.employee_code,\n  ec.changed_field\nORDER BY {order_by}\nLIMIT\
    \ {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01

- id: bp-expense-concept-spend
  intent: Expense spend matched to a user-supplied concept via rule or account descriptions for a payment
    date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  coalesce(expense_rule_description, expense_account_description) AS \"Matched\
    \ Description\",\n  round(toFloat64(SUM(amount_approved)), 2) AS \"Approved Spend\"\nFROM dbpcm_warehouse.expense\n\

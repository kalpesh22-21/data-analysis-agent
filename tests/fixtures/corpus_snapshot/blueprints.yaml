- id: bp-top-timeoff-users
  intent: Top-N employees by approved time-off hours in a window, joined with their current accrual balance
    totals
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT req.\"Employee Code\",\n       req.\"Employee Name\",\n       req.\"Department\"\
    ,\n       req.\"Approved Hours\",\n       round(COALESCE(bal.balance_total, 0), 2) AS \"Current Balance\
    \ Hours\"\nFROM\n  (SELECT t.employee_code AS \"Employee Code\",\n          any(e.employee_name) AS\
    \ \"Employee Name\",\n          any(e.department_name) AS \"Department\",\n          round(SUM(t.hours),\
    \ 2) AS \"Approved Hours\"\n   FROM dbpcm_warehouse.time_off_request AS t\n   JOIN dbpcm_warehouse.employee\
    \ AS e ON e.employee_code = t.employee_code\n   WHERE t.status = 'Approved'\n     AND t.hours IS NOT\
    \ NULL\n     AND toDate32(t.request_date) BETWEEN {window_start} AND {window_end}\n   GROUP BY t.employee_code)\
    \ AS req\nLEFT JOIN\n  (SELECT employee_code,\n          round(SUM(beginning_balance + accrued_amount\
    \ - taken_amount), 2) AS balance_total\n   FROM dbpcm_warehouse.time_off_balance\n   GROUP BY employee_code)\
    \ AS bal ON bal.employee_code = req.\"Employee Code\"\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Approved Hours\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Approved Hours\"\n                   END ASC\nLIMIT {top_n}\n"
  slots:
  - name: top_n
    type: relative_window
    required: true
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: top_n, window, order_direction
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.status

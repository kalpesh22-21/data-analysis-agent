    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  result_grain:
  - register_type
  - type_code
  sql_template: "SELECT toString(p.register_type) AS register_type,\n       toString(p.type_code) AS type_code,\n\
    \       any(toString(p.type_code_description)) AS type_code_description,\n       e.employee_name AS\
    \ employee_name,\n       e.department_name AS department_name,\n       toFloat64(SUM(p.amount)) AS\
    \ amount,\n       toFloat64(SUM(p.type_hours)) AS hours\nFROM dbpcm_warehouse.payroll p\nLEFT JOIN\
    \ dbpcm_warehouse.employee e ON e.employee_code = p.employee_code\nWHERE p.employee_code = {employee}\n\
    \  AND p.pay_period_end_date = {period}\nGROUP BY p.register_type,\n         p.type_code,\n      \
    \   e.employee_name,\n         e.department_name\n"
  column_formats:
    register_type:
      kind: text
    type_code:
      kind: identifier
    type_code_description:
      kind: text
    employee_name:
      kind: text
    department_name:
      kind: text
    amount:
      kind: currency
      currency: USD
      precision: 2
    hours:
      kind: number
      unit: hours
      precision: 2
- id: bp-employee-coverage-matrix
  intent: Multi-source employee coverage matrix showing which employees have roster entries, punch pairs,
    payroll lines, and timecard earnings, ordered by coverage gap count descending
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH punchers AS\n  (SELECT DISTINCT employee_code AS employee_code,\n              \
    \     1 AS has_punches\n   FROM dbpcm_warehouse.punch_pair\n   WHERE punch_date >= addMonths(today(),\
    \ -12)),\n     payrollers AS\n  (SELECT DISTINCT employee_code AS employee_code,\n               \
    \    1 AS has_payroll\n   FROM dbpcm_warehouse.payroll\n   WHERE pay_period_end_date >= addMonths(today(),\
    \ -12)),\n     earners AS\n  (SELECT DISTINCT employee_code AS employee_code,\n                  \
    \ 1 AS has_earnings\n   FROM dbpcm_warehouse.total_earning\n   WHERE punch_date >= addMonths(today(),\
    \ -12))\nSELECT e.employee_code AS \"Employee Code\",\n       e.employee_name AS \"Employee Name\"\
    ,\n       e.department_name AS \"Department\",\n       e.employee_status AS \"Employee Status\",\n\
    \       1 AS \"Has Roster\",\n       COALESCE(p.has_punches, 0) AS \"Has Punches\",\n       COALESCE(pl.has_payroll,\
    \ 0) AS \"Has Payroll\",\n       COALESCE(te.has_earnings, 0) AS \"Has Earnings\",\n       (COALESCE(p.has_punches,\
    \ 0) + COALESCE(pl.has_payroll, 0) + COALESCE(te.has_earnings, 0)) AS \"Coverage Score\",\n      \
    \ (3 - COALESCE(p.has_punches, 0) - COALESCE(pl.has_payroll, 0) - COALESCE(te.has_earnings, 0)) AS\
    \ \"Gap Count\"\nFROM dbpcm_warehouse.employee e\nLEFT JOIN punchers p ON p.employee_code = e.employee_code\n\
    LEFT JOIN payrollers pl ON pl.employee_code = e.employee_code\nLEFT JOIN earners te ON te.employee_code\
    \ = e.employee_code\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Gap Count\"\
    \n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Gap Count\"\
    \n                   END ASC, e.employee_code\n"
  slots:
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Employee Status:
      kind: text
    Has Roster:
      kind: integer
    Has Punches:
      kind: integer
    Has Payroll:
      kind: integer
    Has Earnings:
      kind: integer
    Coverage Score:
      kind: integer
    Gap Count:
      kind: integer
- id: bp-employee-date-summary
  intent: Counts of distinct employees with recorded original hire, most recent hire or termination dates
    in an explicit half-open period. Group by company, department, current status or event month. These
    are current employee records, not a complete employment-event history or turnover rate. Current-status
    filter is optional and may exclude rehired employees. No implicit active/terminated filter; no zero-filled
    months.
  slots_summary: date_basis, group_by, period, employee_status, department, employee, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: date_basis
    type: enum
    required: true
    enum_values:
    - original_hire
    - most_recent_hire
    - termination
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
    - month
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  sql_template: "SELECT CASE\n           WHEN {group_by} = 'month' THEN substring(toString(CASE\n\
    \                                                    WHEN {date_basis} = 'most_recent_hire' THEN e.most_recent_hire_date\n\
    \                                                    WHEN {date_basis} = 'termination' THEN e.termination_date\n\
    \                                                    ELSE e.hire_date\n                          \
    \                      END), 1, 7)\n           WHEN {group_by} = 'department' THEN e.department_name\n        \
    \   WHEN {group_by} = 'status' THEN e.employee_status\n           ELSE 'Company'\n       END AS `Group`,\n    \
    \   uniqExact(e.employee_code) AS `Employee Count`\nFROM dbpcm_warehouse.employee e\nWHERE e.employee_status\
    \ = {employee_status}\n  AND e.department_name = {department}\n  AND e.employee_code = {employee}\n\
    \  AND (CASE\n           WHEN {date_basis} = 'most_recent_hire' THEN e.most_recent_hire_date\n     \
    \      WHEN {date_basis} = 'termination' THEN e.termination_date\n           ELSE e.hire_date\n       END) >= toDate({period_start})\n\
    \  AND (CASE\n           WHEN {date_basis} = 'most_recent_hire' THEN e.most_recent_hire_date\n     \
    \      WHEN {date_basis} = 'termination' THEN e.termination_date\n           ELSE e.hire_date\n       END) < toDate({period_end})\n\
    GROUP BY `Group`\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN `Group`\n     \
    \    END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN `Group`\n        \
    \           END ASC\n"
  column_formats:
    Group:
      kind: text
    Employee Count:
      kind: integer
- id: bp-employee-day-clock-span
  intent: Employee-day first recorded In time, last recorded Out time and matched-pair count, with paid
    hours. Clock span may contain unpaid gaps; it is not hours worked, a single shift or a lateness finding.
    Days are assigned by recorded punch_date; midnight ownership is not inferred. Optional punch-type
    filters restrict which pairs contribute. Required half-open punch-date period and resolved table_source
    prevent accidental cross-source double counting. FINAL deduplicates storage versions, not overlapping
    real-world events. Department means recorded labor-allocation department code, not current home department.
    No scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove
    completeness; missing days/months are not zero-filled. Salaried approved leave and automatic pay-period-end
    entries can generate these records; this blueprint does not establish physical attendance or current
    clock-in.
  slots_summary: period, source, employee, department, hours_type, pay_class, in_type, out_type, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.punch_pair.department_code
  - dbpcm_warehouse.punch_pair.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.hours_type
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.in_punch_type
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_type
  - dbpcm_warehouse.punch_pair.pay_class_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.table_source
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.punch_pair.table_source
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.department_code
    optional_pattern: 'TRUE'
  - name: hours_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.hours_type
    optional_pattern: 'TRUE'
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.pay_class_code
    optional_pattern: 'TRUE'
  - name: in_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.in_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - ID
    - IL
    - IB
    - IX
  - name: out_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.out_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - OD
    - OL
    - OB
    - OX
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Employee Code
  - Punch Date
  sql_template: "SELECT p.employee_code AS `Employee Code`,\n       e.employee_name AS `Employee Name`,\n\
    \       e.department_name AS `Department`,\n       p.punch_date AS `Punch Date`,\n       min(p.in_punch_time)\
    \ AS `First Recorded In`,\n       max(p.out_punch_time) AS `Last Recorded Out`,\n       count(*) AS\
    \ `Pair Count`,\n       sum(p.earn_hours) AS `Paid Hours`\nFROM dbpcm_warehouse.punch_pair AS p\n\
    LEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = p.employee_code\nWHERE p.punch_date >= toDate({period_start})\n\
    \  AND p.punch_date < toDate({period_end})\n  AND p.table_source = {source}\n  AND p.employee_code\
    \ = {employee}\n  AND p.department_code = {department}\n  AND p.hours_type = {hours_type}\n  AND p.pay_class_code\
    \ = {pay_class}\n  AND p.in_punch_type = {in_type}\n  AND p.out_punch_type = {out_type}\nGROUP BY\
    \ p.employee_code,\n         e.employee_name,\n         e.department_name,\n         p.punch_date\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN p.employee_code\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN p.employee_code\n             \
    \      END ASC, p.punch_date\n"
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Punch Date:
      kind: date
    First Recorded In:
      kind: datetime
    Last Recorded Out:
      kind: datetime
    Pair Count:
      kind: integer
    Paid Hours:
      kind: number
      unit: hours
      precision: 2

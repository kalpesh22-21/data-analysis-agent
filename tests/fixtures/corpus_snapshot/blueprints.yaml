    WHERE\n  (\n    submitted_miles > 0 OR approved_miles > 0\n  )\n  AND expense_status IN ('Approved',\
    \ 'Paid', 'Marked as Paid')\n  AND expense_paid_date >= {expense_window_start}\n  AND expense_paid_date\
    \ < {expense_window_end}\nGROUP BY\n  expense_rule_description\nORDER BY {order_by}\nLIMIT {max_rows}\n\
    \n"

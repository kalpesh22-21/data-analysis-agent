    \        FROM dbpcm_warehouse.punch_pair\n        WHERE punch_date >= addMonths(today(), -{win})))\
    \ AS results\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Employee Code\"\n\

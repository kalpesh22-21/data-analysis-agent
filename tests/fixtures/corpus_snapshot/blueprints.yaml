- id: bp-timeoff-vs-paid-leave-tieout
  intent: Reconcile approved time-off request hours against paid leave hours from total_earning per employee
    per month, showing variance and percentage difference
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH tor_monthly AS (\n  SELECT\n    employee_code,\n    formatDateTime(dateTrunc('MONTH',\
    \ request_date), '%Y-%m') AS month,\n    round(SUM(hours), 2) AS tor_hours\n  FROM dbpcm_warehouse.time_off_request\n\
    \  WHERE\n    status = 'Approved'\n    AND event_type IN ({event_type})\n    AND request_date >= addMonths(today(),\
    \ -{win})\n    AND earn_code IN (\n      SELECT\n        earn_code\n      FROM dbpcm_warehouse.earning_category\n\
    \      WHERE\n        category_name IN ({timeoff_category})\n    )\n  GROUP BY\n    employee_code,\n\
    \    formatDateTime(dateTrunc('MONTH', request_date), '%Y-%m')\n), te_monthly AS (\n  SELECT\n   \
    \ employee_code,\n    formatDateTime(addDays(punch_date, 1 - toDayOfMonth(punch_date)), '%Y-%m') AS\
    \ month,\n    round(SUM(earn_hours), 2) AS te_hours\n  FROM (\n    SELECT\n      employee_code,\n\
    \      punch_date,\n      earn_code,\n      earn_hours\n    FROM dbpcm_warehouse.total_earning\n \
    \ )\n  WHERE\n    punch_date >= addMonths(today(), -{win})\n    AND earn_code IN (\n      SELECT\n\
    \        earn_code\n      FROM dbpcm_warehouse.earning_category\n      WHERE\n        category_name\
    \ IN ({timeoff_category})\n    )\n  GROUP BY\n    employee_code,\n    formatDateTime(addDays(punch_date,\
    \ 1 - toDayOfMonth(punch_date)), '%Y-%m')\n)\nSELECT\n  COALESCE(r.employee_code, t.employee_code)\
    \ AS \"Employee Code\",\n  max(e.employee_name) AS \"Employee Name\",\n  COALESCE(r.month, t.month)\
    \ AS \"Month\",\n  round(COALESCE(r.tor_hours, 0), 2) AS \"Approved Timeoff Hours\",\n  round(COALESCE(t.te_hours,\
    \ 0), 2) AS \"Paid Leave Hours\",\n  round(COALESCE(r.tor_hours, 0) - COALESCE(t.te_hours, 0), 2)\
    \ AS \"Difference\",\n  round(\n    abs(COALESCE(r.tor_hours, 0) - COALESCE(t.te_hours, 0)) / nullIf(COALESCE(t.te_hours,\
    \ 0), 0) * 100,\n    2\n  ) AS \"Pct Diff\",\n  ABS(round(COALESCE(r.tor_hours, 0) - COALESCE(t.te_hours,\
    \ 0), 2)) AS \"Absolute Difference\"\nFROM tor_monthly AS r\nFULL OUTER JOIN te_monthly AS t\n  ON\
    \ t.employee_code = r.employee_code AND t.month = r.month\nLEFT JOIN dbpcm_warehouse.employee AS e\n\
    \  ON e.employee_code = COALESCE(r.employee_code, t.employee_code)\nGROUP BY\n  COALESCE(r.employee_code,\
    \ t.employee_code),\n  COALESCE(r.month, t.month),\n  r.tor_hours,\n  t.te_hours\nORDER BY {order_by}\n\
    LIMIT {top_n}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: top_n
    type: positive_integer
    required: true
  - name: timeoff_category
    type: entity
    required: true
    binds_to: dbpcm_warehouse.earning_category.category_name
    description: Resolve the requested timeoff concept to this client's category label; do not invent
      earning codes.
    multiple: true
  - name: event_type
    type: enum
    required: false
    enum_values:
    - Time Off Request
    - Payout Request
    default:
    - Time Off Request
    description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only
      when payouts are explicitly requested.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Absolute Difference DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Absolute Difference
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Month
    - Approved Timeoff Hours
    - Paid Leave Hours
    - Difference
    - Pct Diff
    - Absolute Difference
  slots_summary: win, top_n, timeoff_category, event_type, order_by
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Month:
      kind: text
    Approved Timeoff Hours:
      kind: number
      unit: hours
      precision: 2
    Paid Leave Hours:
      kind: number
      unit: hours
      precision: 2
    Difference:
      kind: number
      unit: hours
      precision: 2
    Pct Diff:
      kind: percent
      scale: percent
      precision: 2
    Absolute Difference:
      kind: number
  presentation:
    kind: table
- id: bp-timeoff-withdrawal-rate
  intent: Removed or withdrawn time-off request rate by department, with denominator counting all active
    workflow statuses
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  e.department_name AS \"Department\",\n  COUNT(*) AS \"Total Requests\",\n \
    \ countIf(t.status = 'Removed') AS \"Removed Requests\",\n  round((\n    countIf(t.status = 'Removed')\
    \ / nullIf(COUNT(*), 0)\n  ) * 100, 2) AS \"Withdrawal Rate Pct\"\nFROM dbpcm_warehouse.time_off_request\
    \ AS t\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = t.employee_code\nWHERE\n  t.status\
    \ IN ('Approved', 'Denied', 'Removed', 'Requested')\n  AND t.event_type IN ({event_type})\n  AND (\n\
    \    toDate32(t.request_date) >= {window_start}\n    AND toDate32(t.request_date) < {window_end}\n\
    \  )\nGROUP BY\n  e.department_name\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: event_type
    type: enum
    required: false
    enum_values:
    - Time Off Request
    - Payout Request
    default:
    - Time Off Request
    description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only
      when payouts are explicitly requested.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Withdrawal Rate Pct DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Withdrawal Rate Pct
      direction: DESC
    allowed_columns:
    - Department
    - Total Requests
    - Removed Requests
    - Withdrawal Rate Pct
  slots_summary: top_n, window, event_type, order_by
  uses:
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:

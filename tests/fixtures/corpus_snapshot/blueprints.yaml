- id: bp-expense-payroll-recon
  intent: Reconcile approved expense amounts against payroll deduction reimbursement lines by payroll
    transaction number for a pay period
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH exp_agg AS\n  (SELECT payroll_transaction_number AS txn,\n          round(toFloat64(SUM(amount_approved)),\
    \ 2) AS exp_amount\n   FROM dbpcm_warehouse.expense\n   WHERE expense_status IN ('Approved',\n   \
    \                         'Paid',\n                            'Marked as Paid')\n     AND payroll_transaction_number\
    \ != ''\n   GROUP BY payroll_transaction_number),\n     pay_agg AS\n  (SELECT transaction_number AS\
    \ txn,\n          round(toFloat64(SUM(amount)), 2) AS pay_amount\n   FROM dbpcm_warehouse.payroll\n\
    \   WHERE register_type = 'DDUCT'\n     AND pay_period_end_date = {period}\n   GROUP BY transaction_number)\n\
    SELECT COALESCE(e.txn, p.txn) AS \"Transaction Number\",\n       round(COALESCE(e.exp_amount, 0),\
    \ 2) AS \"Expense Amount\",\n       round(COALESCE(p.pay_amount, 0), 2) AS \"Payroll Amount\",\n \
    \      round(COALESCE(e.exp_amount, 0) - COALESCE(p.pay_amount, 0), 2) AS \"Difference\",\n      \
    \ round(abs(COALESCE(e.exp_amount, 0) - COALESCE(p.pay_amount, 0)) / nullIf(COALESCE(p.pay_amount,\
    \ 0), 0) * 100, 2) AS \"Pct Diff\"\nFROM exp_agg e\nFULL OUTER JOIN pay_agg p ON p.txn = e.txn\nORDER\
    \ BY CASE\n             WHEN {order_direction} = 'DESC' THEN abs(COALESCE(e.exp_amount, 0) - COALESCE(p.pay_amount,\
    \ 0))\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN abs(COALESCE(e.exp_amount,\
    \ 0) - COALESCE(p.pay_amount, 0))\n                   END ASC\n"
  slots:
  - name: period
    type: period
    required: false
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: period, order_direction
  uses:
  - dbpcm_warehouse.expense.payroll_transaction_number
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.payroll.transaction_number
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.pay_period_end_date
  column_formats:
    Transaction Number:
      kind: identifier
    Expense Amount:
      kind: currency
      currency: USD
      precision: 2
    Payroll Amount:
      kind: currency
      currency: USD
      precision: 2
    Difference:
      kind: currency
      currency: USD
      precision: 2
    Pct Diff:
      kind: percent
      scale: percent
      precision: 2
- id: bp-expense-per-capita
  intent: Per-capita approved expense spend by department for a payment date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT COALESCE(e.department_name, x.department_description) AS \"Department\",\n   \
    \    round(toFloat64(SUM(x.amount_approved)), 2) AS \"Approved Spend\",\n       count(DISTINCT e.employee_code)\
    \ AS \"Active Headcount\",\n       round(toFloat64(SUM(x.amount_approved)) / nullIf(count(DISTINCT\
    \ e.employee_code), 0), 2) AS \"Per Capita Spend\"\nFROM dbpcm_warehouse.expense AS x\nLEFT JOIN dbpcm_warehouse.employee\
    \ AS e ON e.employee_code = x.employee_code\nAND e.employee_status = 'Active'\nWHERE x.expense_status\
    \ IN ('Approved',\n                           'Paid',\n                           'Marked as Paid')\n\
    \  AND x.expense_paid_date >= {expense_window_start}\n  AND x.expense_paid_date <= {expense_window_end}\n\
    GROUP BY COALESCE(e.department_name, x.department_description)\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Per Capita Spend\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Per Capita Spend\"\n                   END ASC, \"Department\"\n"
  slots:
  - name: expense_window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: expense_window, order_direction
  uses:
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.expense.expense_paid_date
  - dbpcm_warehouse.expense.department_description
  - dbpcm_warehouse.expense.employee_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:

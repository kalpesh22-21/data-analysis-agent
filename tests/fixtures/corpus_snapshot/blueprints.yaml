- id: bp-workforce-diversity-profile
  intent: Active headcount distribution across gender, marital status, age band, EEO-1 category and leadership
    cohort
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  multiIf(gender = '', 'Not Reported', gender) AS \"Gender\",\n  ifNull(nullIf(marital_status_description,\
    \ ''), 'Not Reported') AS \"Marital Status\",\n  multiIf(\n    NOT (\n      NOT (\n        date_of_birth\
    \ IS NULL\n      )\n      AND toDate32(date_of_birth) > toDate32('1900-01-01')\n    ),\n    'Unknown',\n\
    \    DATE_DIFF(YEAR, date_of_birth, now()) < 20,\n    'Under 20',\n    DATE_DIFF(YEAR, date_of_birth,\
    \ now()) < 30,\n    '20-29',\n    DATE_DIFF(YEAR, date_of_birth, now()) < 40,\n    '30-39',\n    DATE_DIFF(YEAR,\
    \ date_of_birth, now()) < 50,\n    '40-49',\n    DATE_DIFF(YEAR, date_of_birth, now()) < 60,\n   \
    \ '50-59',\n    DATE_DIFF(YEAR, date_of_birth, now()) < 70,\n    '60-69',\n    '70+'\n  ) AS \"Age\
    \ Band\",\n  eeo1_category AS \"EEO-1 Category\",\n  multiIf(\n    eeo1_category IN (\n      'Executive/Senior\
    \ Level Officials and Managers',\n      'First/Mid-Level Officials and Managers'\n    ),\n    'Leadership',\n\
    \    'All Other'\n  ) AS \"Leadership Cohort\",\n  count(DISTINCT employee_code) AS \"Headcount\"\
    ,\n  round(\n    100 * count(DISTINCT employee_code) / sum(count(DISTINCT employee_code)) OVER (),\n\
    \    2\n  ) AS \"Share Pct\"\nFROM dbpcm_warehouse.employee\nWHERE\n  employee_status = 'Active' AND\
    \ department_name IN ({department})\nGROUP BY\n  \"Gender\",\n  \"Marital Status\",\n  \"Age Band\"\
    ,\n  \"EEO-1 Category\",\n  \"Leadership Cohort\"\nORDER BY {order_by}\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by

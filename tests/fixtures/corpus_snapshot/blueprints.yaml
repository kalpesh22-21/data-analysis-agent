    \         ec.changed_field\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Change\
    \ Events\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"\
    Change Events\"\n                   END ASC, \"Department\",\n                            \"Changed\

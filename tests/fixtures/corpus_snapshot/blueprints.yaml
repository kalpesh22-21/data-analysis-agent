- id: bp-regular-vs-premium-hours-ratio
  intent: Monthly regular versus premium paid hours ratio from timecard earnings, bucketed by punch date
    month, showing regular share and premium share
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(addDays(te.punch_date, 1 - toDayOfMonth(te.punch_date)), '%Y-%m')\
    \ AS \"Month\",\n  round(SUMIf(te.earn_hours, ec.category_name = 'Regular'), 2) AS \"Regular Hours\"\
    ,\n  round(SUMIf(te.earn_hours, ec.category_name <> 'Regular' OR ec.category_name IS NULL), 2) AS\
    \ \"Premium Hours\",\n  round(\n    SUMIf(te.earn_hours, ec.category_name = 'Regular') * 100.0 / nullIf(SUM(te.earn_hours),\
    \ 0),\n    2\n  ) AS \"Regular Pct\"\nFROM (\n  SELECT\n    punch_date,\n    earn_hours,\n    earn_code\n\
    \  FROM dbpcm_warehouse.total_earning\n) AS te\nLEFT JOIN (\n  SELECT\n    earn_code,\n    category_name\n\
    \  FROM dbpcm_warehouse.earning_category\n) AS ec\n  ON ec.earn_code = te.earn_code\nWHERE\n  te.punch_date\
    \ >= addMonths(\n    (\n      SELECT\n        CASE WHEN count() = 0 THEN NULL ELSE max(punch_date)\
    \ END\n      FROM dbpcm_warehouse.total_earning\n    ),\n    -{win}\n  )\nGROUP BY\n  \"Month\"\n\
    ORDER BY {order_by}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Regular Hours
    - Premium Hours
    - Regular Pct
  slots_summary: win, order_by
  uses:
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Month:
      kind: text
    Regular Hours:
      kind: number
      unit: hours
      precision: 2
    Premium Hours:
      kind: number
      unit: hours
      precision: 2
    Regular Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Regular Hours
    - Premium Hours
    - Regular Pct
- id: bp-rehired-employees
  intent: Terminated-then-rehired employees with rehire event history — employees who left and came back,
    showing previous termination and rehire dates within a calendar window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  employee_code AS \"Employee Code\",\n  employee_name AS \"Name\",\n  department_name\
    \ AS \"Department\",\n  old_termination_date AS \"Old Termination Date\",\n  ifNull(rehire_date, most_recent_hire_date)\
    \ AS \"Rehire Date\",\n  DATE_DIFF(DAY, old_termination_date, ifNull(rehire_date, most_recent_hire_date))\
    \ AS \"Days Between\"\nFROM dbpcm_warehouse.employee\nWHERE\n  NOT (\n    old_termination_date IS\
    \ NULL\n  )\n  AND toDate32(old_termination_date) > toDate32('1900-01-01')\n  AND (\n    (\n     \
    \ NOT (\n        rehire_date IS NULL\n      )\n      AND toDate32(rehire_date) > toDate32('1900-01-01')\n\
    \      AND rehire_date > old_termination_date\n    )\n    OR (\n      NOT (\n        most_recent_hire_date\
    \ IS NULL\n      )\n      AND most_recent_hire_date > old_termination_date\n    )\n  )\n  AND ifNull(rehire_date,\
    \ most_recent_hire_date) >= {window_start}\n  AND ifNull(rehire_date, most_recent_hire_date) < {window_end}\n\
    ORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Rehire Date DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Rehire Date
      direction: DESC
    allowed_columns:
    - Employee Code
    - Name
    - Department
    - Old Termination Date
    - Rehire Date
    - Days Between
  slots_summary: top_n, window, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.old_termination_date
  - dbpcm_warehouse.employee.rehire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Employee Code:
      kind: identifier
    Name:
      kind: text
    Department:
      kind: text
    Old Termination Date:
      kind: datetime
    Rehire Date:
      kind: datetime
    Days Between:
      kind: number
      unit: days
      precision: 2
  presentation:
    kind: table
- id: bp-retroactive-change-share
  intent: Count and share of retroactive employee master-data changes where the effective date precedes
    the record date by more than a specified number of days, grouped by changed field
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "/* Output aliases are Title-Case display names; consumers keying on column names */\n\
    /* must use the quoted aliases. */\nSELECT\n  changed_field AS \"Changed Field\",\n  count() AS \"\
    Retroactive Changes\",\n  round(\n    count() * 100.0 / nullIf(\n      (\n        SELECT\n       \
    \   count()\n        FROM dbpcm_warehouse.employee_change\n        WHERE\n          change_time_added\
    \ >= addMonths(today(), -{win})\n          AND NOT (\n            effective_date IS NULL\n       \
    \   )\n      ),\n      0\n    ),\n    2\n  ) AS \"Share Pct\"\nFROM dbpcm_warehouse.employee_change\n\
    WHERE\n  change_time_added >= addMonths(today(), -{win})\n  AND NOT (\n    effective_date IS NULL\n\
    \  )\n  AND DATE_DIFF(DAY, effective_date, change_time_added) > {lag_days}\nGROUP BY\n  changed_field\n\
    ORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: lag_days
    type: positive_integer
    required: true
  - name: win
    type: relative_window
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Retroactive Changes DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Retroactive Changes
      direction: DESC
    allowed_columns:
    - Changed Field
    - Retroactive Changes
    - Share Pct
  slots_summary: lag_days, win, max_rows, order_by
  uses:
  - dbpcm_warehouse.employee_change.effective_date
  - dbpcm_warehouse.employee_change.change_time_added
  - dbpcm_warehouse.employee_change.changed_field
  column_formats:
    Changed Field:
      kind: text
    Retroactive Changes:
      kind: integer
    Share Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Changed Field
    measure_columns:
    - Retroactive Changes
- id: bp-salary-exact-median
  intent: Exact median, average, minimum and maximum recorded annual salary and recorded hourly rate,
    separately by pay type and company, department or status. salary_population selects positive values
    by default or recorded values including zeros; NULLs excluded. Never annualize hourly rates. Defaults
    to Active + On Leave.
  slots_summary: group_by, salary_population, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: salary_population
    type: enum
    required: true
    enum_values:
    - recorded
    - positive
    description: Use positive unless the user explicitly asks to include recorded zeros. A zero is not
      a recorded rate; an Hourly employee with hourly_salary 0 or a Salary employee with annual_salary
      0 has no compensation on record.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Group
    - Known Compensation Count
    - Exact Median Annual Salary
    - Exact Median Hourly Rate
    - Average Annual Salary
    - Minimum Annual Salary
    - Minimum Hourly Rate
    - Maximum Annual Salary
    - Maximum Hourly Rate
    - Average Hourly Rate
  result_grain:
  - Group
  - Pay Type
  sql_template: "SELECT\n  e.pay_type AS \"Pay Type\",\n  CASE\n    WHEN e.pay_type = 'Hourly'\n    THEN\
    \ 'Recorded hourly rate (per hour)'\n    WHEN e.pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n\
    \    ELSE 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  CASE\n    WHEN {group_by}\
    \ = 'department'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n    THEN e.employee_status\n\
    \    ELSE 'Company'\n  END AS \"Group\",\n  count(\n    (\n      CASE\n        WHEN e.pay_type = 'Salary'\n\
    \        THEN e.annual_salary\n        WHEN e.pay_type = 'Hourly'\n        THEN e.hourly_salary\n\
    \        ELSE NULL\n      END\n    )\n  ) AS \"Known Compensation Count\",\n  (\n    quantileExactLow(0.5)((\n\
    \      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n    )) + quantileExactHigh(0.5)((\n\
    \      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n    ))\n  ) / 2 AS \"Exact\
    \ Median Annual Salary\",\n  (\n    quantileExactLow(0.5)((\n      CASE WHEN e.pay_type = 'Hourly'\
    \ THEN e.hourly_salary ELSE NULL END\n    )) + quantileExactHigh(0.5)((\n      CASE WHEN e.pay_type\
    \ = 'Hourly' THEN e.hourly_salary ELSE NULL END\n    ))\n  ) / 2 AS \"Exact Median Hourly Rate\",\n\
    \  avg((\n    CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n  )) AS \"Average\
    \ Annual Salary\",\n  min((\n    CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END\n\
    \  )) AS \"Minimum Annual Salary\",\n  min((\n    CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary\
    \ ELSE NULL END\n  )) AS \"Minimum Hourly Rate\",\n  max((\n    CASE WHEN e.pay_type = 'Salary' THEN\
    \ e.annual_salary ELSE NULL END\n  )) AS \"Maximum Annual Salary\",\n  max((\n    CASE WHEN e.pay_type\
    \ = 'Hourly' THEN e.hourly_salary ELSE NULL END\n  )) AS \"Maximum Hourly Rate\",\n  avg(CASE WHEN\
    \ e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END) AS \"Average Hourly Rate\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nWHERE\n  (\n    e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n\
    \  )\n  AND e.department_name IN ({department})\n  AND e.employee_code = {employee}\n  AND NOT (\n\
    \    (\n      CASE\n        WHEN e.pay_type = 'Salary'\n        THEN e.annual_salary\n        WHEN\
    \ e.pay_type = 'Hourly'\n        THEN e.hourly_salary\n        ELSE NULL\n      END\n    ) IS NULL\n\
    \  )\n  AND (\n    {salary_population} = 'recorded'\n    OR (\n      CASE\n        WHEN e.pay_type\
    \ = 'Salary'\n        THEN e.annual_salary\n        WHEN e.pay_type = 'Hourly'\n        THEN e.hourly_salary\n\
    \        ELSE NULL\n      END\n    ) > 0\n  )\nGROUP BY\n  e.pay_type,\n  CASE\n    WHEN {group_by}\
    \ = 'department'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n    THEN e.employee_status\n\
    \    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Group:
      kind: text
    Known Compensation Count:
      kind: integer
    Exact Median Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Exact Median Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Average Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Minimum Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Minimum Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Maximum Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Maximum Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-salary-threshold-count
  intent: 'Recorded annual salary counts for Salary employees matching a whole-currency annual salary
    threshold. Hourly employees are excluded: hourly rates are not annual salaries. Defaults to Active
    + On Leave.'
  slots_summary: comparison, salary, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: comparison
    type: enum
    required: true
    enum_values:
    - above
    - at_least
    - equal
    - below
  - name: salary
    type: nonnegative_integer
    required: true
    min_value: 0
    max_value: 1000000000
    description: Recorded annual salary threshold for Salary employees only; never apply to hourly rates.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Pay Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Pay Type
      direction: ASC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Employee Count
  result_grain:
  - Pay Type
  sql_template: "SELECT\n  e.pay_type AS \"Pay Type\",\n  CASE\n    WHEN e.pay_type = 'Hourly'\n    THEN\
    \ 'Recorded hourly rate (per hour)'\n    WHEN e.pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n\
    \    ELSE 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  count(DISTINCT e.employee_code)\
    \ AS \"Employee Count\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n  (\n    (\n      e.employee_status\
    \ IN ({employee_status}) OR 'All' IN ({employee_status})\n    )\n    AND e.department_name IN ({department})\n\
    \    AND e.employee_code = {employee}\n    AND (\n      (\n        {comparison} = 'above'\n      \
    \  AND (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n       \
    \     THEN e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n     \
    \       THEN e.hourly_salary\n            ELSE NULL\n          END\n        ) > {salary}\n      )\n\
    \      OR (\n        {comparison} = 'at_least'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) >= {salary}\n      )\n      OR (\n        {comparison} = 'equal'\n       \
    \ AND (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n        \
    \    THEN e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n      \
    \      THEN e.hourly_salary\n            ELSE NULL\n          END\n        ) = {salary}\n      )\n\
    \      OR (\n        {comparison} = 'below'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) < {salary}\n      )\n    )\n  )\n  AND e.pay_type = 'Salary'\nGROUP BY\n \
    \ e.pay_type\nORDER BY {order_by}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Employee Count:
      kind: integer
  presentation:
    kind: table

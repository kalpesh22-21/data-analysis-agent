  sql_template: "SELECT\n  b.employee_code AS \"Employee Code\",\n  any(e.employee_name) AS \"Employee\
    \ Name\",\n  any(e.department_name) AS \"Department\",\n  b.accrual_code AS \"Accrual Code\",\n  any(b.accrual_description)\
    \ AS \"Accrual Description\",\n  round(SUM(b.beginning_balance + b.accrued_amount - b.taken_amount),\
    \ 2) AS \"Balance Hours\"\nFROM dbpcm_warehouse.time_off_balance AS b\nLEFT JOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = b.employee_code\nWHERE\n  b.beginning_balance + b.accrued_amount -\

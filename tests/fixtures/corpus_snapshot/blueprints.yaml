    \ AS e\n  ON e.employee_code = te.employee_code\nWHERE\n  ec.category_name IN ({concept})\n  AND (\n\
    \    te.punch_date >= {window_start} AND te.punch_date < {window_end}\n  )\nGROUP BY\n  te.employee_code\n\

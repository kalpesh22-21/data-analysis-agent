  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  round(SUM(te.earn_amount), 2) AS \"Total Earnings\",\n  round(SUM(te.earn_hours),\
    \ 2) AS \"Total Hours\"\nFROM (\n  SELECT\n    punch_date,\n    earn_amount,\n    earn_hours,\n  \
    \  earn_code\n  FROM dbpcm_warehouse.total_earning\n) AS te\nJOIN (\n  SELECT\n    earn_code,\n  \
    \  category_name\n  FROM dbpcm_warehouse.earning_category\n) AS ec\n  ON ec.earn_code = te.earn_code\n\
    WHERE\n  ec.category_name IN ({concept})\n  AND te.punch_date >= toDate({period_start})\n  AND te.punch_date\
    \ < toDate({period_end})\nORDER BY {order_by}\n"

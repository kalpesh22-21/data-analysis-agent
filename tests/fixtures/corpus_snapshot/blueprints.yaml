- id: bp-departments-above-company-average-salary
  intent: Departments above the corresponding company average, separately for Salary annual salaries and
    Hourly annual estimates (hourly rate * 2080, 40 hours/week, 52 weeks/year). Defaults to Active + On
    Leave; employee_status overrides or All removes the filter.
  slots_summary: employee_status
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  result_grain:
  - Department
  - Pay Type
  composes:
  - order: 0
    output:
      company_salary_avg: scalar
      company_hourly_avg: scalar
    sql_template: "SELECT avg(CASE\n               WHEN employee_pay_type = 'Salary' THEN annual_salary\n\
      \               ELSE NULL\n           END) AS company_salary_avg,\n       avg(CASE\n           \
      \    WHEN employee_pay_type = 'Hourly' THEN hourly_salary * 2080\n               ELSE NULL\n   \
      \        END) AS company_hourly_avg\nFROM dbpcm_warehouse.employee\nWHERE (employee_status = {employee_status}\n\
      \       OR {employee_status} = 'All')\n"
  - order: 1
    feeds_from:
    - 0
    consumes:
      company_salary_avg: $0.company_salary_avg
      company_hourly_avg: $0.company_hourly_avg
    output: {}
    sql_template: "SELECT department_name AS `Department`,\n       employee_pay_type AS `Pay Type`,\n\
      \       CASE\n           WHEN employee_pay_type = 'Hourly' THEN 'Estimated annual compensation (2080\
      \ hours)'\n           ELSE 'Recorded annual salary'\n       END AS `Compensation Basis`,\n     \
      \  avg(CASE\n               WHEN employee_pay_type = 'Salary' THEN annual_salary\n             \
      \  WHEN employee_pay_type = 'Hourly' THEN hourly_salary * 2080\n               ELSE NULL\n     \
      \      END) AS `Department Average Annual Compensation`,\n       avg(CASE\n               WHEN employee_pay_type\
      \ = 'Hourly' THEN hourly_salary\n               ELSE NULL\n           END) AS `Average Hourly Rate`\n\
      FROM dbpcm_warehouse.employee\nWHERE (employee_status = {employee_status}\n       OR {employee_status}\
      \ = 'All')\nGROUP BY department_name,\n         employee_pay_type\nHAVING avg(CASE\n           \
      \    WHEN employee_pay_type = 'Salary' THEN annual_salary\n               WHEN employee_pay_type\
      \ = 'Hourly' THEN hourly_salary * 2080\n               ELSE NULL\n           END) > CASE\n     \
      \                 WHEN employee_pay_type = 'Salary' THEN {company_salary_avg}\n                \
      \      WHEN employee_pay_type = 'Hourly' THEN {company_hourly_avg}\n                      ELSE NULL\n\
      \                  END\n"
  slots:
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    optional_pattern: employee_status IN ('Active', 'On Leave')
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Department:
      kind: text
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Department Average Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
- id: bp-dol-status-per-work-location

- id: bp-expense-payroll-recon
  intent: Reconcile approved expense amounts against payroll deduction reimbursement lines by payroll
    transaction number for a pay period
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH exp_agg AS (\n  SELECT\n    payroll_transaction_number AS txn,\n    round(toFloat64(SUM(amount_approved)),\
    \ 2) AS exp_amount\n  FROM dbpcm_warehouse.expense\n  WHERE\n    expense_status IN ('Approved', 'Paid',\
    \ 'Marked as Paid')\n    AND payroll_transaction_number <> ''\n  GROUP BY\n    payroll_transaction_number\n\
    ), pay_agg AS (\n  SELECT\n    transaction_number AS txn,\n    round(toFloat64(SUM(amount)), 2) AS\
    \ pay_amount\n  FROM dbpcm_warehouse.payroll\n  WHERE\n    register_type = 'DDUCT' AND pay_period_end_date\
    \ = {period}\n  GROUP BY\n    transaction_number\n)\nSELECT\n  COALESCE(e.txn, p.txn) AS \"Transaction\
    \ Number\",\n  round(COALESCE(e.exp_amount, 0), 2) AS \"Expense Amount\",\n  round(COALESCE(p.pay_amount,\
    \ 0), 2) AS \"Payroll Amount\",\n  round(COALESCE(e.exp_amount, 0) - COALESCE(p.pay_amount, 0), 2)\
    \ AS \"Difference\",\n  round(\n    abs(COALESCE(e.exp_amount, 0) - COALESCE(p.pay_amount, 0)) / nullIf(COALESCE(p.pay_amount,\
    \ 0), 0) * 100,\n    2\n  ) AS \"Pct Diff\",\n  ABS(round(COALESCE(e.exp_amount, 0) - COALESCE(p.pay_amount,\
    \ 0), 2)) AS \"Absolute Difference\"\nFROM exp_agg AS e\nFULL OUTER JOIN pay_agg AS p\n  ON p.txn\
    \ = e.txn\nORDER BY {order_by}\n"
  slots:
  - name: period
    type: period
    required: false
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Absolute Difference DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Absolute Difference
      direction: DESC
    allowed_columns:
    - Transaction Number
    - Expense Amount
    - Payroll Amount
    - Difference
    - Pct Diff
    - Absolute Difference
  slots_summary: period, order_by
  uses:
  - dbpcm_warehouse.expense.payroll_transaction_number
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.payroll.transaction_number
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.pay_period_end_date
  column_formats:
    Transaction Number:
      kind: identifier
    Expense Amount:
      kind: currency
      currency: USD
      precision: 2
    Payroll Amount:
      kind: currency
      currency: USD
      precision: 2
    Difference:
      kind: currency
      currency: USD
      precision: 2
    Pct Diff:
      kind: percent
      scale: percent
      precision: 2
    Absolute Difference:
      kind: number
  presentation:
    kind: table
- id: bp-expense-per-capita
  intent: Per-capita approved expense spend by department for a payment date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  COALESCE(e.department_name, x.department_description) AS \"Department\",\n\
    \  round(toFloat64(SUM(x.amount_approved)), 2) AS \"Approved Spend\",\n  count(DISTINCT e.employee_code)\
    \ AS \"Active Headcount\",\n  round(toFloat64(SUM(x.amount_approved)) / nullIf(count(DISTINCT e.employee_code),\
    \ 0), 2) AS \"Per Capita Spend\"\nFROM dbpcm_warehouse.expense AS x\nLEFT JOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = x.employee_code AND e.employee_status = 'Active'\nWHERE\n  x.expense_status\
    \ IN ('Approved', 'Paid', 'Marked as Paid')\n  AND x.expense_paid_date >= {expense_window_start}\n\
    \  AND x.expense_paid_date < {expense_window_end}\nGROUP BY\n  COALESCE(e.department_name, x.department_description)\n\
    ORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: expense_window
    type: period_range

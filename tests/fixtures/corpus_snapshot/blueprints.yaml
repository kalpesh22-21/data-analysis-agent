    \  e.labor_allocation_key_1 IS NULL OR e.labor_allocation_key_1 = ''\n    )\n    OR (\n      e.labor_allocation_key_2\
    \ IS NULL OR e.labor_allocation_key_2 = ''\n    )\n    OR (\n      e.labor_allocation_key_3 IS NULL\
    \ OR e.labor_allocation_key_3 = ''\n    )\n  ) AS \"Unallocated\"\nFROM dbpcm_warehouse.employee AS\
    \ e\nLEFT JOIN dbpcm_warehouse.labor_allocation AS la1\n  ON e.labor_allocation_key_1 = la1.join_key\n\
    LEFT JOIN dbpcm_warehouse.labor_allocation AS la2\n  ON e.labor_allocation_key_2 = la2.join_key\n\
    LEFT JOIN dbpcm_warehouse.labor_allocation AS la3\n  ON e.labor_allocation_key_3 = la3.join_key\n\
    WHERE\n  e.employee_status = 'Active' AND e.department_name IN ({department})\nORDER BY {order_by}\n\
    LIMIT {max_rows}\n\n"

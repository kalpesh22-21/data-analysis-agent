- id: bp-earnings-category-mix
  intent: Category mix showing percent share of total earnings dollars and paid hours by earning category
    for a punch date window, preserving uncategorized rows
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH totals AS\n  (SELECT SUM(earn_amount) AS all_dollars,\n          SUM(earn_hours)\
    \ AS all_hours\n   FROM dbpcm_warehouse.total_earning\n   WHERE punch_date >= toDate({period_start})\n\
    \     AND punch_date < toDate({period_end}))\nSELECT ifNull(ec.category_name, 'Uncategorized') AS\
    \ `Category`,\n       round(SUM(te.earn_amount), 2) AS `Total Dollars`,\n       round(SUM(te.earn_hours),\
    \ 2) AS `Total Hours`,\n       round(SUM(te.earn_amount) * 100.0 / nullIf(\n                     \
    \                               (SELECT all_dollars\n                                            \
    \         FROM totals), 0), 2) AS `Dollar Pct`,\n       round(SUM(te.earn_hours) * 100.0 / nullIf(\n\
    \                                                   (SELECT all_hours\n                          \
    \                          FROM totals), 0), 2) AS `Hours Pct`\nFROM\n  (SELECT punch_date,\n    \
    \      earn_amount,\n          earn_hours,\n          earn_code\n   FROM dbpcm_warehouse.total_earning)\
    \ AS te\nLEFT JOIN\n  (SELECT earn_code,\n          category_name\n   FROM dbpcm_warehouse.earning_category\
    \ FINAL) AS ec ON ec.earn_code = te.earn_code\nWHERE te.punch_date >= toDate({period_start})\n  AND\
    \ te.punch_date < toDate({period_end})\n  AND ({metric} = 'dollars'\n       OR {metric} = 'hours')\n\
    GROUP BY ifNull(ec.category_name, 'Uncategorized')\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN `Dollar Pct`\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN `Dollar Pct`\n                   END ASC, `Category`\n"
  slots:
  - name: period
    type: period_range
    required: true
    temporal_type: date
  - name: metric
    type: enum
    required: true
    enum_values:
    - dollars
    - hours
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: period, metric, order_direction
  uses:
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Category:
      kind: text
    Total Dollars:
      kind: currency
      currency: USD
    Total Hours:
      kind: number
      unit: hours
      precision: 2
    Dollar Pct:
      kind: percent
      scale: percent
      precision: 2
    Hours Pct:
      kind: percent
      scale: percent
      precision: 2

- id: bp-accrual-event-summary
  intent: Accrual event days, event hours and distinct employees by company, department, workflow status,
    event type, event-date month or department_status (department and status together). Includes all event
    types and leave categories unless explicitly filtered. Required half-open requested-for-date period
    [start,end); optional workflow status enum, resolved event_type and earn_code strings, employee status,
    department and employee. No implicit Approved or PTO filter. COUNT counts event/day rows, not distinct
    multi-day requests. Approved hours are not taken balance usage. LEFT JOIN preserves unmatched events
    unless employee filters supplied; does not zero-fill periods or prove full coverage. For time-off-taken
    questions bind event_status=Approved and event_type=Time Off Request, plus the requested category/date
    scope; assume these requests were taken and disclose it. Offer a separate payroll-paid-hours check
    without executing it unless requested.
  slots_summary: group_by, period, event_status, event_type, earn_code, employee_status, department, employee,
    order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
    - event_type
    - month
    - department_status
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: event_status
    type: enum
    required: false
    enum_values:
    - Approved
    - Requested
    - Denied
    - Removed
    - Calendar Only
    binds_to: dbpcm_warehouse.time_off_request.status
    optional_pattern: 'TRUE'
    multiple: true
  - name: event_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_request.event_type
    optional_pattern: 'TRUE'
    multiple: true
  - name: earn_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_request.earn_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Event Status
    - Event Days
    - Event Hours
    - Employee Count
  result_grain:
  - Group
  - Event Status
  sql_template: "WITH a AS (\n  SELECT\n    employee_code,\n    status,\n    event_type,\n    SUBSTRING(toString(request_date),\
    \ 1, 7) AS month,\n    count(*) AS event_rows,\n    sum(hours) AS hours\n  FROM dbpcm_warehouse.time_off_request\n\
    \  WHERE\n    status IN ({event_status})\n    AND event_type IN ({event_type})\n    AND earn_code\
    \ IN ({earn_code})\n    AND toDate(request_date) >= toDate({period_start})\n    AND toDate(request_date)\
    \ < toDate({period_end})\n  GROUP BY\n    employee_code,\n    status,\n    event_type,\n    SUBSTRING(toString(request_date),\
    \ 1, 7)\n)\nSELECT\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n    WHEN\
    \ {group_by} = 'department_status'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n \
    \   THEN a.status\n    WHEN {group_by} = 'event_type'\n    THEN a.event_type\n    WHEN {group_by}\
    \ = 'month'\n    THEN toString(a.month)\n    ELSE 'Company'\n  END AS \"Group\",\n  CASE\n    WHEN\
    \ {group_by} = 'department_status'\n    THEN a.status\n    ELSE 'All selected statuses'\n  END AS\
    \ \"Event Status\",\n  sum(CAST(a.event_rows AS Nullable(Decimal(20, 0)))) AS \"Event Days\",\n  sum(CAST(a.hours\
    \ AS Nullable(Decimal(38, 6)))) AS \"Event Hours\",\n  uniqExact(a.employee_code) AS \"Employee Count\"\
    \nFROM a\nLEFT JOIN dbpcm_warehouse.employee AS e\n  ON a.employee_code = e.employee_code\nWHERE\n\
    \  e.employee_status IN ({employee_status})\n  AND e.department_name IN ({department})\n  AND e.employee_code\
    \ = {employee}\nGROUP BY\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n\
    \    WHEN {group_by} = 'department_status'\n    THEN e.department_name\n    WHEN {group_by} = 'status'\n\
    \    THEN a.status\n    WHEN {group_by} = 'event_type'\n    THEN a.event_type\n    WHEN {group_by}\
    \ = 'month'\n    THEN toString(a.month)\n    ELSE 'Company'\n  END,\n  CASE\n    WHEN {group_by} =\
    \ 'department_status'\n    THEN a.status\n    ELSE 'All selected statuses'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Event Status:
      kind: text
    Event Days:
      kind: integer
    Event Hours:
      kind: number
      unit: hours
      precision: 2
    Employee Count:
      kind: integer
  presentation:
    kind: table
- id: bp-active-headcount-by-department
  intent: Employee headcount by department, highest first and excluding departments with zero matching
    employees by default. Defaults to Active + On Leave; employee_status selects another status or All
    to remove the status filter. zero_headcount selects Include to also show departments with no matching
    employees.
  slots_summary: top_n, department, employee_status, zero_headcount, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.department.department_code
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    multiple: true
    default:
    - Active
    - On Leave
  - name: zero_headcount
    type: enum
    required: false
    enum_values:
    - Exclude
    - Include
    default: Exclude
    description: Exclude departments with zero employees matching the selected status by default. Select
      Include to show all departments, including unstaffed departments.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Headcount
      direction: DESC
    allowed_columns:
    - Department Code
    - Department
    - Headcount
  uses_rules:
  - default_employee_population
  result_grain:
  - Department Code
  sql_template: "SELECT\n  d.department_code AS \"Department Code\",\n  d.department_name AS \"Department\"\
    ,\n  coalesce(e.active_count, 0) AS \"Headcount\"\nFROM dbpcm_warehouse.department AS d\nLEFT JOIN\
    \ (\n  SELECT\n    department_code,\n    uniqExact(employee_code) AS active_count\n  FROM dbpcm_warehouse.employee\n\
    \  WHERE\n    (\n      employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  \
    \  )\n  GROUP BY\n    department_code\n) AS e\n  ON d.department_code = e.department_code\nWHERE\n\
    \  d.department_name IN ({department})\n  AND (\n    {zero_headcount} = 'Include' OR coalesce(e.active_count,\
    \ 0) > 0\n  )\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  column_formats:
    Department Code:
      kind: identifier
    Department:
      kind: text
    Headcount:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Headcount
- id: bp-adjustment-line-volume
  intent: Volume of negative payroll earnings pay items per month, counting adjustment and reversal activity
    over the last N pay periods
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(addDays(pay_period_end_date, 1 - toDayOfMonth(pay_period_end_date)),\
    \ '%Y-%m') AS \"Month\",\n  count() AS \"Adjustment Pay Items\",\n  round(SUM(amount), 2) AS \"Adjustment\
    \ Amount\"\nFROM dbpcm_warehouse.payroll\nWHERE\n  register_type = 'EARN'\n  AND amount < 0\n  AND\
    \ pay_period_end_date >= addMonths((\n    SELECT\n      max(pay_period_end_date)\n    FROM dbpcm_warehouse.payroll\n\
    \  ), -{win})\nGROUP BY\n  \"Month\"\nORDER BY {order_by}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Adjustment Pay Items
    - Adjustment Amount
  slots_summary: win, order_by
  uses:
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date
  column_formats:
    Month:
      kind: text
    Adjustment Pay Items:
      kind: integer
    Adjustment Amount:
      kind: currency
      currency: USD
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Adjustment Pay Items
    - Adjustment Amount
- id: bp-age-band-distribution
  intent: Active employee headcount by age band with average and median workforce age, computed from date
    of birth at query time
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  multiIf(\n    age < 25,\n    'Under 25',\n    age < 35,\n    '25-34',\n   \
    \ age < 45,\n    '35-44',\n    age < 55,\n    '45-54',\n    age < 65,\n    '55-64',\n    '65+'\n \
    \ ) AS \"Age Band\",\n  count(DISTINCT employee_code) AS \"Headcount\",\n  round(avg(age), 1) AS \"\
    Avg Age In Band\",\n  round(\n    (\n      quantileExactLow(0.5)(toFloat64(age)) + quantileExactHigh(0.5)(toFloat64(age))\n\
    \    ) / 2,\n    1\n  ) AS \"Median Age In Band\",\n  MIN(age) AS \"Band Start\"\nFROM (\n  SELECT\n\
    \    employee_code,\n    department_name,\n    DATE_DIFF(YEAR, date_of_birth, now()) AS age\n  FROM\
    \ dbpcm_warehouse.employee\n  WHERE\n    employee_status = 'Active'\n    AND NOT (\n      date_of_birth\
    \ IS NULL\n    )\n    AND toDate32(date_of_birth) > toDate32('1900-01-01')\n    AND department_name\
    \ IN ({department})\n)\nGROUP BY\n  \"Age Band\"\nORDER BY {order_by}\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Band Start ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Band Start
      direction: ASC
    allowed_columns:
    - Age Band
    - Headcount
    - Avg Age In Band
    - Median Age In Band
    - Band Start
  slots_summary: department, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.date_of_birth
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Age Band:
      kind: text
    Headcount:
      kind: integer
    Avg Age In Band:
      kind: number
      unit: years
      precision: 2
    Median Age In Band:
      kind: number
      unit: years
      precision: 2
    Band Start:
      kind: number
      unit: years
  presentation:
    kind: bars
    category_columns:
    - Age Band
    measure_columns:
    - Headcount
- id: bp-approved-timeoff-hours
  intent: Approved time-off hours by department or company-wide for a request-date window, counting only
    Approved status Time Off Request events
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  e.department_name AS \"Department\",\n  round(SUM(t.hours), 2) AS \"Approved\
    \ Hours\"\nFROM dbpcm_warehouse.time_off_request AS t\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code\
    \ = t.employee_code\nWHERE\n  t.status = 'Approved'\n  AND t.event_type = 'Time Off Request'\n  AND\
    \ NOT (\n    t.hours IS NULL\n  )\n  AND (\n    toDate32(t.request_date) >= {window_start}\n    AND\
    \ toDate32(t.request_date) < {window_end}\n  )\n  AND e.department_name IN ({dept})\nGROUP BY\n  e.department_name\n\
    ORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: dept
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Approved Hours DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Approved Hours
      direction: DESC
    allowed_columns:
    - Department
    - Approved Hours
  slots_summary: top_n, window, dept, order_by
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Approved Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Approved Hours
- id: bp-approved-timeoff-ranking
  intent: Rank employees by approved time-off request hours in a half-open requested-for-date period.
    Assume approved requests were taken and disclose that assumption. Include all accessible request records,
    retain ties at the requested rank, and offer a separate payroll-paid-hours check. Days are distinct
    requested calendar dates, not punch days.
  slots_summary: period, top_n
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 100
    description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that
      ranking. It does not accept order_by or order_direction. A different selection or display order
      requires a separate query.
  result_grain:
  - Employee Code
  sql_template: "WITH totals AS (\n  SELECT\n    employee_code,\n    sum(hours) AS approved_hours,\n \
    \   uniqExact(toDate(request_date)) AS requested_days\n  FROM dbpcm_warehouse.time_off_request\n \
    \ WHERE\n    status = 'Approved'\n    AND event_type = 'Time Off Request'\n    AND request_date >=\
    \ {period_start}\n    AND request_date < {period_end}\n  GROUP BY\n    employee_code\n), ranked AS\
    \ (\n  SELECT\n    employee_code,\n    approved_hours,\n    requested_days,\n    dense_rank() OVER\
    \ (ORDER BY approved_hours DESC) AS hours_rank\n  FROM totals\n)\nSELECT\n  r.employee_code AS \"\
    Employee Code\",\n  e.employee_name AS \"Employee Name\",\n  e.department_name AS \"Department\",\n\
    \  r.approved_hours AS \"Approved Time-Off Hours\",\n  r.requested_days AS \"Requested Days\",\n \
    \ r.hours_rank AS \"Rank\"\nFROM ranked AS r\nLEFT JOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code\
    \ = r.employee_code\nWHERE\n  r.hours_rank <= {top_n}\nORDER BY\n  r.hours_rank,\n  r.employee_code\n"
  uses_rules: []
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Approved Time-Off Hours:
      kind: number
      unit: hours
      precision: 2
    Requested Days:
      kind: integer
    Rank:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Employee Name
    measure_columns:
    - Approved Time-Off Hours
- id: bp-average-annual-salary-by-status
  intent: Average recorded annual salary for Salary employees and recorded hourly rate for Hourly employees,
    separately by pay type, filtered by employee status. Never annualize hourly pay. Defaults to Active
    + On Leave.
  slots_summary: employee_status, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.hourly_salary
  slots:
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    multiple: true
    default:
    - Active
    - On Leave
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Pay Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Pay Type
      direction: ASC
    allowed_columns:
    - Pay Type
    - Compensation Basis
    - Average Annual Salary
    - Average Hourly Rate
  sql_template: "SELECT\n  pay_type AS \"Pay Type\",\n  CASE\n    WHEN pay_type = 'Hourly'\n    THEN 'Recorded\
    \ hourly rate (per hour)'\n    WHEN pay_type = 'Salary'\n    THEN 'Recorded annual salary'\n    ELSE\
    \ 'Unknown compensation basis'\n  END AS \"Compensation Basis\",\n  avg(\n    CASE WHEN pay_type =\
    \ 'Salary' AND annual_salary > 0 THEN annual_salary ELSE NULL END\n  ) AS \"Average Annual Salary\"\
    ,\n  avg(\n    CASE WHEN pay_type = 'Hourly' AND hourly_salary > 0 THEN hourly_salary ELSE NULL END\n\
    \  ) AS \"Average Hourly Rate\"\nFROM dbpcm_warehouse.employee\nWHERE\n  (\n    employee_status IN\
    \ ({employee_status}) OR 'All' IN ({employee_status})\n  )\nGROUP BY\n  pay_type\nORDER BY {order_by}\n"
  result_grain:
  - Pay Type
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Average Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table

    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Median Lead Days DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Median Lead Days
      direction: DESC
    allowed_columns:
    - Leave Type
    - Earn Code
    - Median Lead Days
    - Request Days
  slots_summary: top_n, window, event_type, order_by
  uses:

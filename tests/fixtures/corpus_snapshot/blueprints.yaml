- id: bp-ot-two-basis-tieout
  intent: Reconcile payroll register overtime dollars against timecard overtime category dollars per pay
    period per employee, with variance and percentage difference
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH period_bounds AS\n  (SELECT any(pay_period_start_date) AS start_dt,\n          any(pay_period_end_date)\
    \ AS end_dt\n   FROM dbpcm_warehouse.payroll\n   WHERE pay_period_end_date = {period}),\n     register_ot\
    \ AS\n  (SELECT employee_code,\n          round(toFloat64(SUM(amount)), 2) AS reg_amount\n   FROM\
    \ dbpcm_warehouse.payroll\n   WHERE register_type = 'EARN'\n     AND type_code IN\n       (SELECT\
    \ earn_code\n        FROM dbpcm_warehouse.earning_category FINAL\n        WHERE category_name = {overtime_category})\n\
    \     AND pay_period_end_date = {period}\n   GROUP BY employee_code),\n     te_ot AS\n  (SELECT te.employee_code,\n\
    \          round(toFloat64(SUM(te.earn_amount)), 2) AS te_amount\n   FROM\n     (SELECT employee_code,\n\
    \             punch_date,\n             earn_amount,\n             earn_code\n      FROM dbpcm_warehouse.total_earning)\
    \ AS te\n   CROSS JOIN period_bounds pb\n   WHERE te.earn_code IN\n       (SELECT earn_code\n    \
    \    FROM dbpcm_warehouse.earning_category FINAL\n        WHERE category_name = {overtime_category})\n\
    \     AND te.punch_date BETWEEN pb.start_dt AND pb.end_dt\n   GROUP BY te.employee_code)\nSELECT COALESCE(r.employee_code,\
    \ t.employee_code) AS \"Employee Code\",\n       max(e.employee_name) AS \"Employee Name\", {period}\
    \ AS \"Pay Period End\",\n                                                 round(COALESCE(r.reg_amount,\
    \ 0), 2) AS \"Register OT\",\n                                                 round(COALESCE(t.te_amount,\
    \ 0), 2) AS \"Timecard OT\",\n                                                 round(COALESCE(t.te_amount,\
    \ 0) - COALESCE(r.reg_amount, 0), 2) AS \"Difference\",\n                                        \
    \         round(abs(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount, 0)) / nullIf(COALESCE(r.reg_amount,\
    \ 0), 0) * 100, 2) AS \"Pct Diff\"\nFROM register_ot r\nFULL OUTER JOIN te_ot t ON t.employee_code\
    \ = r.employee_code\nLEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = COALESCE(r.employee_code,\
    \ t.employee_code)\nGROUP BY COALESCE(r.employee_code, t.employee_code), {period}, r.reg_amount,\n\
    \                                                               t.te_amount\nORDER BY CASE\n     \
    \        WHEN {order_direction} = 'DESC' THEN abs(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount,\
    \ 0))\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN abs(COALESCE(t.te_amount,\
    \ 0) - COALESCE(r.reg_amount, 0))\n                   END ASC\nLIMIT {top_n}\n"
  slots:
  - name: period
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  - name: overtime_category
    type: entity
    required: true
    binds_to: dbpcm_warehouse.earning_category.category_name
    description: Resolve the requested overtime concept to this client's category label; do not invent
      earning codes.
  slots_summary: period, top_n, order_direction, overtime_category

- id: bp-timecard-earnings-summary
  intent: 'Total timecard earnings, paid hours, entry counts and employee counts by company, employee,
    allocated department, day, month or earning code. Supports per-person hours and pay in a period and
    monthly labor-cost trends. Uses daily total_earning entries: in-progress earnings finalized and moved
    to payroll after period close. Use payroll earnings for finalized periods. Do not add both lifecycle
    stages for the same earnings. This template does not infer period-close status or switch sources.
    Amount is not net pay, annual salary or proof of payment. Optional earning_code is client-defined:
    resolve regular/overtime concepts, never hardcode a universal OT code. No average-rate calculation
    across unlike earning codes. Required half-open punch-date period and resolved table_source prevent
    accidental cross-source double counting. MCP handles storage-version deduplication; this does not
    remove overlapping real-world events. Department means recorded labor-allocation department code,
    not current home department. No scheduled shift, tardiness or overtime policy is inferred. Observed
    first/last dates do not prove completeness; missing days/months are not zero-filled.'
  slots_summary: group_by, period, source, employee, department, earning_code, pay_class, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.total_earning.department_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.pay_class_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - earning_code
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.total_earning.table_source
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.department_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: earning_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.earn_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.pay_class_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Timecard Earning Amount
    - Paid Hours
    - Entry Count
    - Employee Count
    - Observed Days
    - First Observed Date
    - Last Observed Date
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'employee'\n    THEN employee_code\n    WHEN {group_by}\
    \ = 'department'\n    THEN department_code\n    WHEN {group_by} = 'day'\n    THEN toString(punch_date)\n\
    \    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date), 1, 7)\n    WHEN {group_by}\
    \ = 'earning_code'\n    THEN earn_code\n    ELSE 'Company'\n  END AS \"Group\",\n  sum(earn_amount)\
    \ AS \"Timecard Earning Amount\",\n  sum(earn_hours) AS \"Paid Hours\",\n  count(*) AS \"Entry Count\"\
    ,\n  count(DISTINCT employee_code) AS \"Employee Count\",\n  count(DISTINCT punch_date) AS \"Observed\
    \ Days\",\n  min(punch_date) AS \"First Observed Date\",\n  max(punch_date) AS \"Last Observed Date\"\
    \nFROM dbpcm_warehouse.total_earning\nWHERE\n  punch_date >= toDate({period_start})\n  AND punch_date\
    \ < toDate({period_end})\n  AND table_source IN ({source})\n  AND employee_code = {employee}\n  AND\
    \ department_code IN ({department})\n  AND earn_code IN ({earning_code})\n  AND pay_class_code IN\
    \ ({pay_class})\nGROUP BY\n  CASE\n    WHEN {group_by} = 'employee'\n    THEN employee_code\n    WHEN\
    \ {group_by} = 'department'\n    THEN department_code\n    WHEN {group_by} = 'day'\n    THEN toString(punch_date)\n\
    \    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date), 1, 7)\n    WHEN {group_by}\
    \ = 'earning_code'\n    THEN earn_code\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Timecard Earning Amount:
      kind: currency
      currency: USD
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
    Entry Count:
      kind: integer
    Employee Count:
      kind: integer
    Observed Days:
      kind: integer
    First Observed Date:
      kind: date
    Last Observed Date:
      kind: date
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Timecard Earning Amount
    by_group_by:
      company: figure
      day: line
      month: line
- id: bp-timecard-vs-register-recon
  intent: Reconcile total_earning timecard hours against payroll register paid hours per employee for
    a single pay period, showing variance and percentage difference
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH period_bounds AS (\n  SELECT\n    any(pay_period_start_date) AS start_dt,\n    any(pay_period_end_date)\
    \ AS end_dt\n  FROM dbpcm_warehouse.payroll\n  WHERE\n    pay_period_end_date = {period}\n), register_hours\
    \ AS (\n  SELECT\n    employee_code,\n    SUM(type_hours) AS register_hours\n  FROM dbpcm_warehouse.payroll\n\
    \  WHERE\n    register_type = 'EARN' AND pay_period_end_date = {period}\n  GROUP BY\n    employee_code\n\
    ), te_hours AS (\n  SELECT\n    te.employee_code,\n    SUM(te.earn_hours) AS te_hours\n  FROM (\n\
    \    SELECT\n      employee_code,\n      punch_date,\n      earn_hours\n    FROM dbpcm_warehouse.total_earning\n\
    \  ) AS te\n  CROSS JOIN period_bounds AS pb\n  WHERE\n    te.punch_date BETWEEN pb.start_dt AND pb.end_dt\n\
    \  GROUP BY\n    te.employee_code\n)\nSELECT\n  COALESCE(r.employee_code, t.employee_code) AS \"Employee\
    \ Code\",\n  max(e.employee_name) AS \"Employee Name\",\n  {period} AS \"Pay Period End\",\n  round(COALESCE(r.register_hours,\
    \ 0), 2) AS \"Register Hours\",\n  round(COALESCE(t.te_hours, 0), 2) AS \"Timecard Hours\",\n  round(COALESCE(t.te_hours,\
    \ 0) - COALESCE(r.register_hours, 0), 2) AS \"Difference\",\n  round(\n    abs(COALESCE(t.te_hours,\
    \ 0) - COALESCE(r.register_hours, 0)) / nullIf(COALESCE(r.register_hours, 0), 0) * 100,\n    2\n \
    \ ) AS \"Pct Diff\",\n  ABS(round(COALESCE(t.te_hours, 0) - COALESCE(r.register_hours, 0), 2)) AS\
    \ \"Absolute Difference\"\nFROM register_hours AS r\nFULL OUTER JOIN te_hours AS t\n  ON t.employee_code\
    \ = r.employee_code\nLEFT JOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = COALESCE(r.employee_code,\
    \ t.employee_code)\nGROUP BY\n  COALESCE(r.employee_code, t.employee_code),\n  {period},\n  r.register_hours,\n\
    \  t.te_hours\nORDER BY {order_by}\nLIMIT {top_n}\n"
  slots:
  - name: period
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: top_n
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Absolute Difference DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Absolute Difference
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Pay Period End
    - Register Hours
    - Timecard Hours
    - Difference
    - Pct Diff
    - Absolute Difference
  slots_summary: period, top_n, order_by
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_start_date
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Pay Period End:
      kind: date
    Register Hours:
      kind: number
      unit: hours
      precision: 2
    Timecard Hours:
      kind: number
      unit: hours
      precision: 2
    Difference:
      kind: number
      unit: hours
      precision: 2
    Pct Diff:
      kind: percent
      scale: percent
      precision: 2
    Absolute Difference:
      kind: number
  presentation:
    kind: table
- id: bp-timeoff-by-leave-type
  intent: Approved time-off hours grouped by earn code concept resolved dynamically via earn_code, or
    all earn codes when no concept is provided
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  t.earn_description AS \"Earn Description\",\n  t.earn_code AS \"Earn Code\"\
    ,\n  round(SUM(t.hours), 2) AS \"Approved Hours\"\nFROM dbpcm_warehouse.time_off_request AS t\nWHERE\n\
    \  t.status = 'Approved'\n  AND t.event_type IN ({event_type})\n  AND NOT (\n    t.hours IS NULL\n\
    \  )\n  AND (\n    toDate32(t.request_date) >= {window_start}\n    AND toDate32(t.request_date) <\
    \ {window_end}\n  )\n  AND t.earn_description IN ({concept})\nGROUP BY\n  t.earn_description,\n  t.earn_code\n\
    ORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: concept
    type: string
    required: false
    binds_to: dbpcm_warehouse.time_off_request.earn_description
    optional_pattern: 'TRUE'
    multiple: true
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: event_type
    type: enum
    required: false
    enum_values:
    - Time Off Request
    - Payout Request
    default:
    - Time Off Request
    description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only
      when payouts are explicitly requested.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Approved Hours DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Approved Hours
      direction: DESC
    allowed_columns:
    - Earn Description
    - Earn Code
    - Approved Hours
  slots_summary: top_n, concept, window, event_type, order_by
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.earn_description
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.request_date
  column_formats:
    Earn Description:
      kind: text
    Earn Code:
      kind: identifier
    Approved Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Earn Description
    measure_columns:
    - Approved Hours
- id: bp-timeoff-denial-rate
  intent: Time-off denial rate by department for decided requests (Approved plus Denied) over a request-date
    window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  d.\"Department\" AS \"Department\",\n  d.\"Decided Requests\" AS \"Decided\
    \ Requests\",\n  d.\"Denied Requests\" AS \"Denied Requests\",\n  round((\n    d.\"Denied Requests\"\
    \ / nullIf(d.\"Decided Requests\", 0)\n  ) * 100, 2) AS \"Denial Rate Pct\"\nFROM (\n  SELECT\n  \
    \  e.department_name AS \"Department\",\n    COUNT(*) AS \"Decided Requests\",\n    countIf(t.status\
    \ = 'Denied') AS \"Denied Requests\"\n  FROM dbpcm_warehouse.time_off_request AS t\n  JOIN dbpcm_warehouse.employee\
    \ AS e\n    ON e.employee_code = t.employee_code\n  WHERE\n    t.status IN ('Approved', 'Denied')\n\
    \    AND t.event_type IN ({event_type})\n    AND (\n      toDate32(t.request_date) >= {window_start}\n\
    \      AND toDate32(t.request_date) < {window_end}\n    )\n  GROUP BY\n    e.department_name\n) AS\
    \ d\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per

  catalog_sha: ''
  sql_template: "SELECT\n  \"Employee Code\",\n  \"Name\",\n  \"Department\",\n  \"Movement Type\",\n\
    \  \"Movement Date\",\n  \"Gap Days\"\nFROM (\n  SELECT\n    employee_code AS \"Employee Code\",\n\
    \    employee_name AS \"Name\",\n    department_name AS \"Department\",\n    'Recent Hire' AS \"Movement\
    \ Type\",\n    most_recent_hire_date AS \"Movement Date\",\n    CAST(NULL AS Nullable(Int32)) AS \"\
    Gap Days\"\n  FROM dbpcm_warehouse.employee\n  WHERE\n    (\n      employee_status <> 'Not Hired'\
    \ OR employee_status IS NULL\n    )\n    AND most_recent_hire_date >= {move_window_start}\n    AND\
    \ most_recent_hire_date < {move_window_end}\n  UNION ALL\n  SELECT\n    employee_code AS \"Employee\
    \ Code\",\n    employee_name AS \"Name\",\n    department_name AS \"Department\",\n    'Boomerang\
    \ Hire' AS \"Movement Type\",\n    most_recent_hire_date AS \"Movement Date\",\n    DATE_DIFF(DAY,\
    \ old_termination_date, most_recent_hire_date) AS \"Gap Days\"\n  FROM dbpcm_warehouse.employee\n\
    \  WHERE\n    (\n      employee_status <> 'Not Hired' OR employee_status IS NULL\n    )\n    AND NOT\
    \ (\n      old_termination_date IS NULL\n    )\n    AND toDate32(old_termination_date) > toDate32('1900-01-01')\n\
    \    AND NOT (\n      most_recent_hire_date IS NULL\n    )\n    AND toDate32(most_recent_hire_date)\
    \ > toDate32('1900-01-01')\n    AND most_recent_hire_date > old_termination_date\n    AND most_recent_hire_date\
    \ >= {move_window_start}\n    AND most_recent_hire_date < {move_window_end}\n    AND DATE_DIFF(DAY,\
    \ old_termination_date, most_recent_hire_date) >= {min_gap_days}\n  UNION ALL\n  SELECT\n    employee_code\
    \ AS \"Employee Code\",\n    employee_name AS \"Name\",\n    department_name AS \"Department\",\n\
    \    'FT To PT' AS \"Movement Type\",\n    full_time_to_part_time_date AS \"Movement Date\",\n   \
    \ CAST(NULL AS Nullable(Int32)) AS \"Gap Days\"\n  FROM dbpcm_warehouse.employee\n  WHERE\n    (\n\
    \      employee_status <> 'Not Hired' OR employee_status IS NULL\n    )\n    AND NOT (\n      full_time_to_part_time_date\
    \ IS NULL\n    )\n    AND toDate32(full_time_to_part_time_date) > toDate32('1900-01-01')\n    AND\
    \ full_time_to_part_time_date >= {move_window_start}\n    AND full_time_to_part_time_date < {move_window_end}\n\
    )\nWHERE\n  \"Department\" IN ({department})\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: move_window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: min_gap_days
    type: nonnegative_integer
    required: false
    optional_pattern: 'TRUE'
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Movement Date DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Movement Date
      direction: DESC
    allowed_columns:
    - Employee Code
    - Name
    - Department
    - Movement Type
    - Movement Date
    - Gap Days
  slots_summary: move_window, min_gap_days, department, max_rows, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.old_termination_date
  - dbpcm_warehouse.employee.full_time_to_part_time_date
  column_formats:
    Employee Code:
      kind: identifier
    Name:
      kind: text
    Department:
      kind: text
    Movement Type:
      kind: text
    Movement Date:
      kind: date
    Gap Days:
      kind: number
      unit: days
      precision: 2
  presentation:
    kind: table
- id: bp-ytd-earnings-per-employee
  intent: Year-to-date gross earnings, net pay, and paid hours per employee from the payroll register,
    optionally filtered by employee or department
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  p.employee_code AS \"Employee Code\",\n  any(e.employee_name) AS \"Employee\
    \ Name\",\n  round(SUMIf(p.amount, p.register_type = 'EARN'), 2) AS \"Gross Earnings\",\n  round(SUMIf(p.amount,\
    \ p.register_type = 'NETPAYDIST'), 2) AS \"Net Pay\",\n  round(SUMIf(p.type_hours, p.register_type\
    \ = 'EARN'), 2) AS \"Paid Hours\"\nFROM dbpcm_warehouse.payroll AS p\nJOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = p.employee_code\nWHERE\n  p.employee_code = {ee} AND e.department_name\
    \ IN ({dept})\nGROUP BY\n  p.employee_code\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: ee
    type: string
    required: false
    binds_to: dbpcm_warehouse.payroll.employee_code
    optional_pattern: 'TRUE'
  - name: dept
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: top_n
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Gross Earnings DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Gross Earnings
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Gross Earnings
    - Net Pay
    - Paid Hours
  slots_summary: ee, dept, top_n, order_by
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Gross Earnings:
      kind: currency
      currency: USD
    Net Pay:
      kind: currency
      currency: USD
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Employee Name
    measure_columns:
    - Gross Earnings
- id: bp-zero-net-pay-employees
  intent: Employees with exactly $0.00 net pay in a pay period, distinguishing those with no net-pay-distribution
    rows from those with a zero net-pay amount
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  employee_code AS \"Employee Code\"\nFROM dbpcm_warehouse.payroll\nWHERE\n \
    \ pay_period_end_date = {period}\nGROUP BY\n  employee_code\nHAVING\n  SUMIf(amount, register_type\
    \ = 'EARN') > 0\n  AND SUMIf(amount, register_type = 'NETPAYDIST') = 0\nORDER BY {order_by}\nLIMIT\
    \ {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: period
    type: period
    required: false
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Employee Code
      direction: ASC
    allowed_columns:
    - Employee Code
  slots_summary: top_n, period, order_by
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date
  column_formats:
    Employee Code:
      kind: identifier
  presentation:
    kind: table

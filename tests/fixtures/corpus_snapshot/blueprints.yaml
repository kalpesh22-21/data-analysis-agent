- id: bp-avg-request-size
  intent: Average approved time-off hours per request day by leave type over a request-date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  t.earn_description AS \"Leave Type\",\n  t.earn_code AS \"Earn Code\",\n  round(AVG(t.hours),\
    \ 2) AS \"Average Hours\",\n  COUNT(*) AS \"Request Days\"\nFROM dbpcm_warehouse.time_off_request\
    \ AS t\nWHERE\n  t.status = 'Approved'\n  AND t.event_type IN ({event_type})\n  AND NOT (\n    t.hours\
    \ IS NULL\n  )\n  AND (\n    toDate32(t.request_date) >= {window_start}\n    AND toDate32(t.request_date)\
    \ < {window_end}\n  )\nGROUP BY\n  t.earn_description,\n  t.earn_code\nORDER BY {order_by}\nLIMIT\
    \ {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01

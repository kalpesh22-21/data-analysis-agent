- id: bp-unused-leave-roster
  intent: Employees holding positive accrual balances who have zero approved time-off requests year-to-date
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT b.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\

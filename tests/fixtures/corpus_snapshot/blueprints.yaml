  sql_template: "SELECT la.code AS \"Allocation Code\",\n       la.description AS \"Allocation Description\"\
    ,\n       count(DISTINCT e.employee_code) AS \"Usage Count\"\nFROM\n  (SELECT employee_code,\n   \
    \       employee_status,\n          CASE {slot}\n              WHEN 1 THEN labor_allocation_key_1\n\

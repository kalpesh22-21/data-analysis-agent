- id: bp-ot-two-basis-tieout
  intent: Reconcile payroll register overtime dollars against timecard overtime category dollars per pay
    period per employee, with variance and percentage difference
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH period_bounds AS (\n  SELECT\n    any(pay_period_start_date) AS start_dt,\n    any(pay_period_end_date)\
    \ AS end_dt\n  FROM dbpcm_warehouse.payroll\n  WHERE\n    pay_period_end_date = {period}\n), register_ot\
    \ AS (\n  SELECT\n    employee_code,\n    round(toFloat64(SUM(amount)), 2) AS reg_amount\n  FROM dbpcm_warehouse.payroll\n\
    \  WHERE\n    register_type = 'EARN'\n    AND type_code IN (\n      SELECT\n        earn_code\n  \
    \    FROM dbpcm_warehouse.earning_category\n      WHERE\n        category_name IN ({overtime_category})\n\
    \    )\n    AND pay_period_end_date = {period}\n  GROUP BY\n    employee_code\n), te_ot AS (\n  SELECT\n\
    \    te.employee_code,\n    round(toFloat64(SUM(te.earn_amount)), 2) AS te_amount\n  FROM (\n    SELECT\n\
    \      employee_code,\n      punch_date,\n      earn_amount,\n      earn_code\n    FROM dbpcm_warehouse.total_earning\n\
    \  ) AS te\n  CROSS JOIN period_bounds AS pb\n  WHERE\n    te.earn_code IN (\n      SELECT\n     \
    \   earn_code\n      FROM dbpcm_warehouse.earning_category\n      WHERE\n        category_name IN\
    \ ({overtime_category})\n    )\n    AND te.punch_date BETWEEN pb.start_dt AND pb.end_dt\n  GROUP BY\n\
    \    te.employee_code\n)\nSELECT\n  COALESCE(r.employee_code, t.employee_code) AS \"Employee Code\"\
    ,\n  max(e.employee_name) AS \"Employee Name\",\n  {period} AS \"Pay Period End\",\n  round(COALESCE(r.reg_amount,\
    \ 0), 2) AS \"Register OT\",\n  round(COALESCE(t.te_amount, 0), 2) AS \"Timecard OT\",\n  round(COALESCE(t.te_amount,\
    \ 0) - COALESCE(r.reg_amount, 0), 2) AS \"Difference\",\n  round(\n    abs(COALESCE(t.te_amount, 0)\
    \ - COALESCE(r.reg_amount, 0)) / nullIf(COALESCE(r.reg_amount, 0), 0) * 100,\n    2\n  ) AS \"Pct\
    \ Diff\",\n  ABS(round(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount, 0), 2)) AS \"Absolute Difference\"\
    \nFROM register_ot AS r\nFULL OUTER JOIN te_ot AS t\n  ON t.employee_code = r.employee_code\nLEFT\
    \ JOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = COALESCE(r.employee_code, t.employee_code)\n\
    GROUP BY\n  COALESCE(r.employee_code, t.employee_code),\n  {period},\n  r.reg_amount,\n  t.te_amount\n\
    ORDER BY {order_by}\nLIMIT {top_n}\n"
  slots:
  - name: period
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: top_n
    type: positive_integer
    required: true
  - name: overtime_category
    type: entity
    required: true
    binds_to: dbpcm_warehouse.earning_category.category_name
    description: Resolve the requested overtime concept to this client's category label; do not invent
      earning codes.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Absolute Difference DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Absolute Difference
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Pay Period End
    - Register OT
    - Timecard OT
    - Difference
    - Pct Diff
    - Absolute Difference
  slots_summary: period, top_n, overtime_category, order_by
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.pay_period_start_date
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date

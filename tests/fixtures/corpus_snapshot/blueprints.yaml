- id: bp-timeoff-seasonality
  intent: Approved time-off hours bucketed by month and by day-of-week over a trailing N-month window
    based on request date
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(dateTrunc('MONTH', t.request_date), '%Y-%m') AS \"Month\",\n\
    \  round(SUM(t.hours), 2) AS \"Approved Hours\"\nFROM dbpcm_warehouse.time_off_request AS t\nWHERE\n\
    \  t.status = 'Approved'\n  AND t.event_type IN ({event_type})\n  AND NOT (\n    t.hours IS NULL\n\
    \  )\n  AND t.request_date >= (\n    SELECT\n      MAX(request_date)\n    FROM dbpcm_warehouse.time_off_request\n\
    \  ) - INTERVAL (\n    {win}\n  ) MONTH\nGROUP BY\n  \"Month\"\nORDER BY {order_by}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: event_type
    type: enum
    required: false
    enum_values:

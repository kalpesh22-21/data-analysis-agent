- id: bp-employee-record-dq-flags
  intent: Per-employee data-quality flags across SUI state, hire date and date of birth
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       employee_name AS \"Name\",\n     \
    \  department_name AS \"Department\",\n       works_in_state AS \"Works In State\",\n       sui_state\
    \ AS \"SUI State\",\n       hire_date AS \"Hire Date\",\n       date_of_birth AS \"Date Of Birth\"\
    ,\n       flag AS \"DQ Flag\"\nFROM dbpcm_warehouse.employee\nCROSS JOIN\n  (SELECT arrayJoin(['Age\
    \ Over 90', 'Age Under 16', 'Missing Or Sentinel DOB', 'SUI Mismatch', 'Future Hire Date']) AS flag)\
    \ AS flags\nWHERE ((flag = 'Age Over 90'\n        AND (employee_status = 'Active'\n             AND\
    \ NOT (date_of_birth IS NULL)\n             AND toDate32(date_of_birth) > toDate32('1900-01-01')\n\
    \             AND DATE_DIFF(YEAR, date_of_birth, now()) > 90))\n       OR (flag = 'Age Under 16'\n\
    \           AND (employee_status = 'Active'\n                AND NOT (date_of_birth IS NULL)\n   \
    \             AND toDate32(date_of_birth) > toDate32('1900-01-01')\n                AND DATE_DIFF(YEAR,\
    \ date_of_birth, now()) < 16))\n       OR (flag = 'Missing Or Sentinel DOB'\n           AND (employee_status\
    \ = 'Active'\n                AND NOT (NOT (date_of_birth IS NULL)\n                         AND toDate32(date_of_birth)\
    \ > toDate32('1900-01-01'))))\n       OR (flag = 'SUI Mismatch'\n           AND (employee_status =\
    \ 'Active'\n                AND NOT (lives_in_state IS NULL)\n                AND lives_in_state <>\
    \ ''\n                AND NOT (works_in_state IS NULL)\n                AND works_in_state <> ''\n\
    \                AND NOT (sui_state IS NULL)\n                AND sui_state <> ''\n              \
    \  AND works_in_state <> sui_state))\n       OR (flag = 'Future Hire Date'\n           AND (employee_status\
    \ = 'Active'\n                AND hire_date > now())))\n  AND department_name = {department}\nORDER\
    \ BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Employee Code\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Employee Code\"\n           \
    \        END ASC, \"DQ Flag\"\nLIMIT {max_rows}\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: department, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code

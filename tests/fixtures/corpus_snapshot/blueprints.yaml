      kind: integer
- id: bp-top-codes-in-category
  intent: Top-N earn codes by earnings dollars within a specific earning category, using earn descriptions
    for display labels
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT te.earn_code AS \"Earn Code\",\n       any(te.earn_code_description) AS \"Description\"\
    ,\n       round(SUM(te.earn_amount), 2) AS \"Total Dollars\",\n       round(SUM(te.earn_hours), 2)\
    \ AS \"Total Hours\"\nFROM\n  (SELECT punch_date,\n          earn_amount,\n          earn_code,\n\
    \          earn_code_description,\n          earn_hours\n   FROM dbpcm_warehouse.total_earning) AS\
    \ te\nJOIN\n  (SELECT earn_code,\n          category_name\n   FROM dbpcm_warehouse.earning_category\
    \ FINAL) AS ec ON ec.earn_code = te.earn_code\nWHERE ec.category_name = {concept}\n  AND te.punch_date\
    \ >= toDate('2023-01-01')\n  AND te.punch_date <= toDate('2026-12-31')\nGROUP BY te.earn_code\nORDER\
    \ BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Total Dollars\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Total Dollars\"\n           \
    \        END ASC, \"Earn Code\"\nLIMIT {top_n}\n"
  slots:
  - name: concept
    type: string
    required: true
    binds_to: dbpcm_warehouse.earning_category.category_name
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: concept, top_n, order_direction
  uses:
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_code_description
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Earn Code:
      kind: identifier
    Description:
      kind: text
    Total Dollars:

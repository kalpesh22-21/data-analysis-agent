- id: bp-pay-timing-exceptions
  intent: Employees paid after termination or active employees not paid within N days
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  employee_code AS \"Employee Code\",\n  department_name AS \"Department\",\n\
    \  employee_status AS \"Status\",\n  termination_date AS \"Termination Date\",\n  last_check_date\
    \ AS \"Last Check Date\",\n  multiIf(employee_status = 'Terminated', 'Paid After Termination', 'Active\
    \ Not Paid') AS \"Exception Type\"\nFROM dbpcm_warehouse.employee\nWHERE\n  department_name IN ({department})\n\
    \  AND (\n    (\n      employee_status = 'Terminated'\n      AND (\n        most_recent_hire_date\
    \ IS NULL OR most_recent_hire_date < termination_date\n      )\n      AND NOT (\n        last_check_date\
    \ IS NULL\n      )\n      AND toDate32(last_check_date) > toDate32('1900-01-01')\n      AND NOT (\n\
    \        termination_date IS NULL\n      )\n      AND toDate32(termination_date) > toDate32('1900-01-01')\n\
    \      AND last_check_date > termination_date\n    )\n    OR (\n      employee_status = 'Active'\n\
    \      AND (\n        NOT (\n          NOT (\n            last_check_date IS NULL\n          )\n \
    \         AND toDate32(last_check_date) > toDate32('1900-01-01')\n        )\n        OR last_check_date\
    \ < now() - INTERVAL (\n          {days_since_pay}\n        ) DAY\n      )\n    )\n  )\nORDER BY {order_by}\n\
    LIMIT {max_rows}\n\n"
  slots:
  - name: days_since_pay
    type: positive_integer
    required: true
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Exception Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Exception Type
      direction: ASC
    allowed_columns:
    - Employee Code
    - Department

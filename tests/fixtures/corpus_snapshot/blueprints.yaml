- id: bp-employee-record-dq-flags
  intent: Per-employee data-quality flags across SUI state, hire date and date of birth
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  employee_code AS \"Employee Code\",\n  employee_name AS \"Name\",\n  department_name\
    \ AS \"Department\",\n  works_in_state AS \"Works In State\",\n  sui_state AS \"SUI State\",\n  hire_date\
    \ AS \"Hire Date\",\n  date_of_birth AS \"Date Of Birth\",\n  flag AS \"DQ Flag\"\nFROM dbpcm_warehouse.employee\n\
    CROSS JOIN (\n  SELECT\n    arrayJoin(\n      [\n        'Age Over 90',\n        'Age Under 16',\n\
    \        'Missing Or Sentinel DOB',\n        'SUI Mismatch',\n        'Future Hire Date'\n      ]\n\
    \    ) AS flag\n) AS flags\nWHERE\n  (\n    (\n      flag = 'Age Over 90'\n      AND (\n        employee_status\
    \ = 'Active'\n        AND NOT (\n          date_of_birth IS NULL\n        )\n        AND toDate32(date_of_birth)\
    \ > toDate32('1900-01-01')\n        AND DATE_DIFF(YEAR, date_of_birth, now()) > 90\n      )\n    )\n\
    \    OR (\n      flag = 'Age Under 16'\n      AND (\n        employee_status = 'Active'\n        AND\
    \ NOT (\n          date_of_birth IS NULL\n        )\n        AND toDate32(date_of_birth) > toDate32('1900-01-01')\n\
    \        AND DATE_DIFF(YEAR, date_of_birth, now()) < 16\n      )\n    )\n    OR (\n      flag = 'Missing\
    \ Or Sentinel DOB'\n      AND (\n        employee_status = 'Active'\n        AND NOT (\n         \
    \ NOT (\n            date_of_birth IS NULL\n          )\n          AND toDate32(date_of_birth) > toDate32('1900-01-01')\n\
    \        )\n      )\n    )\n    OR (\n      flag = 'SUI Mismatch'\n      AND (\n        employee_status\
    \ = 'Active'\n        AND NOT (\n          lives_in_state IS NULL\n        )\n        AND lives_in_state\
    \ <> ''\n        AND NOT (\n          works_in_state IS NULL\n        )\n        AND works_in_state\
    \ <> ''\n        AND NOT (\n          sui_state IS NULL\n        )\n        AND sui_state <> ''\n\
    \        AND works_in_state <> sui_state\n      )\n    )\n    OR (\n      flag = 'Future Hire Date'\n\
    \      AND (\n        employee_status = 'Active' AND hire_date > now()\n      )\n    )\n  )\n  AND\
    \ department_name IN ({department})\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Employee Code
      direction: ASC
    allowed_columns:
    - Employee Code
    - Name
    - Department
    - Works In State
    - SUI State
    - Hire Date
    - Date Of Birth
    - DQ Flag
  slots_summary: department, max_rows, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.works_in_state
  - dbpcm_warehouse.employee.sui_state
  - dbpcm_warehouse.employee.lives_in_state
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.date_of_birth
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Employee Code:
      kind: identifier
    Name:
      kind: text
    Department:
      kind: text
    Works In State:
      kind: text
    SUI State:
      kind: text

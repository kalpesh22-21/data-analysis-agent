- id: bp-latest-hired-employees
  intent: Latest hired employee list ordered by most recent hire date, including rehires. Defaults to
    Active + On Leave. Excludes missing/sentinel and future hire dates. row_limit is the requested top
    N; original hire is not the ranking date.
  slots_summary: row_limit, employee_status, department, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  result_grain:
  - Employee Code
  sql_template: "SELECT e.employee_code AS `Employee Code`,\n       e.employee_name AS `Employee Name`,\n\
    \       e.department_name AS `Department`,\n       e.employee_status AS `Status`,\n       e.most_recent_hire_date\
    \ AS `Most Recent Hire Date`\nFROM dbpcm_warehouse.employee e\nWHERE (e.employee_status = {employee_status}\n\
    \       OR {employee_status} = 'All')\n  AND e.department_name = {department}\n  AND e.most_recent_hire_date\
    \ > toDate('1900-01-01')\n  AND e.most_recent_hire_date <= now()\nORDER BY CASE\n             WHEN\
    \ {order_direction} = 'DESC' THEN e.most_recent_hire_date\n         END DESC, CASE\n             \
    \          WHEN {order_direction} = 'ASC' THEN e.most_recent_hire_date\n                   END ASC,\
    \ e.employee_code\nLIMIT {row_limit}\n"
  uses_rules:
  - default_employee_population
  - missing_date_sentinel
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Status:
      kind: text
    Most Recent Hire Date:
      kind: datetime
- id: bp-long-shift-days
  intent: Employees whose total paid hours across all timecard entries in a single day exceed a configurable
    threshold, using total_ earning as the authoritative hours source, ranked by daily hours
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT te.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\
    \ Name\",\n       te.punch_date AS \"Punch Date\",\n       round(SUM(te.earn_hours), 2) AS \"Daily\
    \ Hours\",\n       count() AS \"Line Count\"\nFROM\n  (SELECT employee_code,\n          punch_date,\n\
    \          earn_hours\n   FROM dbpcm_warehouse.total_earning) AS te\nJOIN dbpcm_warehouse.employee\
    \ e ON e.employee_code = te.employee_code\nWHERE te.punch_date BETWEEN {window_start} AND {window_end}\n\
    GROUP BY te.employee_code,\n         te.punch_date\nHAVING SUM(te.earn_hours) > {threshold}\nORDER\
    \ BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Daily Hours\"\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN \"Daily Hours\"\n                   END\
    \ ASC, \"Employee Code\"\nLIMIT {max_rows}\n"
  slots:
  - name: threshold
    type: positive_integer
    required: true
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: threshold, window, max_rows, order_direction
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Punch Date:
      kind: date
    Daily Hours:
      kind: number
      unit: hours
      precision: 2
    Line Count:
      kind: integer
- id: bp-longest-tenured-employees

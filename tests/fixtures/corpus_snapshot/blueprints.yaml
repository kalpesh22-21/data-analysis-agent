- id: bp-workforce-diversity-profile
  intent: Active headcount distribution across gender, marital status, age band, EEO-1 category and leadership
    cohort
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT multiIf(gender = '', 'Not Reported', gender) AS \"Gender\",\n       ifNull(nullIf(marital_status_description,\
    \ ''), 'Not Reported') AS \"Marital Status\",\n       multiIf(NOT (date_of_birth IS NOT NULL\n   \
    \                 AND toDate32(date_of_birth) > toDate32('1900-01-01')), 'Unknown', date_diff('year',\
    \ date_of_birth, now()) < 20, 'Under 20', date_diff('year', date_of_birth, now()) < 30, '20-29', date_diff('year',\
    \ date_of_birth, now()) < 40, '30-39', date_diff('year', date_of_birth, now()) < 50, '40-49', date_diff('year',\
    \ date_of_birth, now()) < 60, '50-59', date_diff('year', date_of_birth, now()) < 70, '60-69', '70+')\
    \ AS \"Age Band\",\n       eeo1_category AS \"EEO-1 Category\",\n       multiIf(eeo1_category IN ('Executive/Senior\
    \ Level Officials and Managers', 'First/Mid-Level Officials and Managers'), 'Leadership', 'All Other')\
    \ AS \"Leadership Cohort\",\n       count(DISTINCT employee_code) AS \"Headcount\",\n       round(100\
    \ * count(DISTINCT employee_code) / sum(count(DISTINCT employee_code)) OVER (), 2) AS \"Share Pct\"\
    \nFROM dbpcm_warehouse.employee\nWHERE employee_status = 'Active'\n  AND department_name = {department}\n\
    GROUP BY \"Gender\",\n         \"Marital Status\",\n         \"Age Band\",\n         \"EEO-1 Category\"\
    ,\n         \"Leadership Cohort\"\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN\
    \ \"Headcount\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN\
    \ \"Headcount\"\n                   END ASC\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: department, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.gender
  - dbpcm_warehouse.employee.marital_status_description
  - dbpcm_warehouse.employee.date_of_birth
  - dbpcm_warehouse.employee.eeo1_category
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Gender:
      kind: text
    Marital Status:
      kind: text
    Age Band:
      kind: text
    EEO-1 Category:
      kind: text
    Leadership Cohort:
      kind: text
    Headcount:
      kind: integer
    Share Pct:
      kind: percent
      scale: percent
      precision: 2
- id: bp-workforce-kpi-bundle
  intent: Single-row executive KPI bundle with current-state metrics plus hires, terms and turnover for
    one window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT count(DISTINCT CASE\n                          WHEN employee_status = 'Active'\
    \ THEN employee_code\n                          ELSE NULL\n                      END) AS \"Active\
    \ Headcount\",\n       count() AS \"Total Records\",\n       round(100 * count(DISTINCT CASE\n   \
    \                                   WHEN employee_status = 'Active'\n                            \
    \               AND employment_type = 'W2' THEN employee_code\n                                  \
    \    ELSE NULL\n                                  END) / nullIf(count(DISTINCT CASE\n            \
    \                                                       WHEN employee_status = 'Active' THEN employee_code\n\
    \                                                                   ELSE NULL\n                  \
    \                                             END), 0), 2) AS \"W2 Share Pct\",\n       round((quantileExactLow(0.5)(CASE\n\
    \                                        WHEN employee_status = 'Active'\n                       \
    \                      AND NOT (annual_salary IS NULL) THEN toFloat64(annual_salary)\n           \
    \                             ELSE NULL\n                                    END) + quantileExactHigh(0.5)(CASE\n\
    \                                                                      WHEN employee_status = 'Active'\n\
    \                                                                           AND NOT (annual_salary\
    \ IS NULL) THEN toFloat64(annual_salary)\n                                                       \
    \               ELSE NULL\n                                                                  END))\
    \ / 2, 2) AS \"Median Annual Salary\",\n       round(avg(CASE\n                     WHEN employee_status\
    \ = 'Active' THEN DATE_DIFF(DAY, hire_date, now()) / 365.25\n                     ELSE NULL\n    \
    \             END), 1) AS \"Avg Tenure Years\",\n       round(100 * count(DISTINCT CASE\n        \
    \                              WHEN employee_status = 'Active'\n                                 \
    \          AND dol_status_description = 'Full Time' THEN employee_code\n                         \
    \             ELSE NULL\n                                  END) / nullIf(count(DISTINCT CASE\n   \
    \                                                                WHEN employee_status = 'Active' THEN\
    \ employee_code\n                                                                   ELSE NULL\n  \
    \                                                             END), 0), 2) AS \"Pct Full Time\",\n\
    \       round(100 * count(DISTINCT CASE\n                                      WHEN employee_status\
    \ = 'Active'\n                                           AND direct_deposit = 1 THEN employee_code\n\
    \                                      ELSE NULL\n                                  END) / nullIf(count(DISTINCT\
    \ CASE\n                                                                   WHEN employee_status =\
    \ 'Active' THEN employee_code\n                                                                  \
    \ ELSE NULL\n                                                               END), 0), 2) AS \"Pct\
    \ Direct Deposit\",\n       count(DISTINCT CASE\n                          WHEN (employee_status <>\
    \ 'Not Hired'\n                                OR employee_status IS NULL)\n                     \
    \          AND hire_date >= {kpi_window_start}\n                               AND hire_date < {kpi_window_end}\
    \ THEN employee_code\n                          ELSE NULL\n                      END) AS \"Hires In\
    \ Window\",\n       count(DISTINCT CASE\n                          WHEN employee_status = 'Terminated'\n\
    \                               AND NOT (termination_date IS NULL)\n                             \
    \  AND toDate32(termination_date) > toDate32('1900-01-01')\n                               AND (most_recent_hire_date\
    \ IS NULL\n                                    OR most_recent_hire_date < termination_date)\n    \
    \                           AND termination_date >= {kpi_window_start}\n                         \
    \      AND termination_date < {kpi_window_end} THEN employee_code\n                          ELSE\
    \ NULL\n                      END) AS \"Terms In Window\",\n       round(count(DISTINCT CASE\n   \
    \                             WHEN employee_status = 'Terminated'\n                              \
    \       AND NOT (termination_date IS NULL)\n                                     AND toDate32(termination_date)\
    \ > toDate32('1900-01-01')\n                                     AND (most_recent_hire_date IS NULL\n\
    \                                          OR most_recent_hire_date < termination_date)\n        \
    \                             AND termination_date >= {kpi_window_start}\n                       \
    \              AND termination_date < {kpi_window_end} THEN employee_code\n                      \
    \          ELSE NULL\n                            END) / nullIf(count(DISTINCT CASE\n            \
    \                                                 WHEN employee_status = 'Active' THEN employee_code\n\
    \                                                             ELSE NULL\n                        \
    \                                 END), 0), 4) AS \"Turnover Rate In Window\",\n       count(DISTINCT\
    \ CASE\n                          WHEN employee_status = 'On Leave' THEN employee_code\n         \
    \                 ELSE NULL\n                      END) AS \"On Leave\",\n       count(DISTINCT CASE\n\
    \                          WHEN employee_status = 'Active'\n                               AND (primary_emergency_contact_phone\
    \ IS NULL\n                                    OR primary_emergency_contact_phone = '') THEN employee_code\n\
    \                          ELSE NULL\n                      END) AS \"Missing Emergency Contacts\"\
    \nFROM dbpcm_warehouse.employee\n"
  slots:
  - name: kpi_window
    type: period_range
    required: true
    temporal_type: date
  slots_summary: kpi_window
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employment_type
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.dol_status_description
  - dbpcm_warehouse.employee.direct_deposit
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.primary_emergency_contact_phone
  column_formats:
    Active Headcount:
      kind: integer
    Total Records:
      kind: integer
    W2 Share Pct:
      kind: percent
      scale: percent
      precision: 2
    Median Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Avg Tenure Years:
      kind: number
      unit: years
      precision: 2
    Pct Full Time:
      kind: percent
      scale: percent
      precision: 2
    Pct Direct Deposit:
      kind: percent
      scale: percent
      precision: 2
    Hires In Window:
      kind: integer
    Terms In Window:
      kind: integer
    Turnover Rate In Window:
      kind: percent
      scale: ratio
      precision: 2
    On Leave:
      kind: integer
    Missing Emergency Contacts:
      kind: integer
- id: bp-workforce-movements
  intent: Recent-hire, boomerang-return and full-to-part-time movements within one window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT \"Employee Code\",\n       \"Name\",\n       \"Department\",\n       \"Movement\
    \ Type\",\n       \"Movement Date\",\n       \"Gap Days\"\nFROM\n  (SELECT employee_code AS \"Employee\
    \ Code\",\n          employee_name AS \"Name\",\n          department_name AS \"Department\",\n  \
    \        'Recent Hire' AS \"Movement Type\",\n          most_recent_hire_date AS \"Movement Date\"\
    ,\n          CAST(NULL AS Nullable(Int32)) AS \"Gap Days\"\n   FROM dbpcm_warehouse.employee\n   WHERE\
    \ (employee_status != 'Not Hired'\n          OR employee_status IS NULL)\n     AND most_recent_hire_date\
    \ >= {move_window_start}\n     AND most_recent_hire_date < {move_window_end}\n   UNION ALL SELECT\
    \ employee_code AS \"Employee Code\",\n                    employee_name AS \"Name\",\n          \
    \          department_name AS \"Department\",\n                    'Boomerang Hire' AS \"Movement\
    \ Type\",\n                    most_recent_hire_date AS \"Movement Date\",\n                    date_diff('day',\
    \ old_termination_date, most_recent_hire_date) AS \"Gap Days\"\n   FROM dbpcm_warehouse.employee\n\
    \   WHERE (employee_status != 'Not Hired'\n          OR employee_status IS NULL)\n     AND old_termination_date\
    \ IS NOT NULL\n     AND toDate32(old_termination_date) > toDate32('1900-01-01')\n     AND most_recent_hire_date\
    \ IS NOT NULL\n     AND toDate32(most_recent_hire_date) > toDate32('1900-01-01')\n     AND most_recent_hire_date\
    \ > old_termination_date\n     AND most_recent_hire_date >= {move_window_start}\n     AND most_recent_hire_date\
    \ < {move_window_end}\n     AND date_diff('day', old_termination_date, most_recent_hire_date) >= {min_gap_days}\n\
    \   UNION ALL SELECT employee_code AS \"Employee Code\",\n                    employee_name AS \"\
    Name\",\n                    department_name AS \"Department\",\n                    'FT To PT' AS\
    \ \"Movement Type\",\n                    full_time_to_part_time_date AS \"Movement Date\",\n    \
    \                CAST(NULL AS Nullable(Int32)) AS \"Gap Days\"\n   FROM dbpcm_warehouse.employee\n\
    \   WHERE (employee_status != 'Not Hired'\n          OR employee_status IS NULL)\n     AND full_time_to_part_time_date\
    \ IS NOT NULL\n     AND toDate32(full_time_to_part_time_date) > toDate32('1900-01-01')\n     AND full_time_to_part_time_date\
    \ >= {move_window_start}\n     AND full_time_to_part_time_date < {move_window_end})\nWHERE \"Department\"\
    \ = {department}\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Movement Date\"\
    \n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Movement Date\"\
    \n                   END ASC, \"Employee Code\"\nLIMIT {max_rows}\n"
  slots:
  - name: move_window
    type: period_range
    required: true
    temporal_type: date
  - name: min_gap_days
    type: nonnegative_integer
    required: false
    optional_pattern: 'TRUE'
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: move_window, min_gap_days, department, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.old_termination_date
  - dbpcm_warehouse.employee.full_time_to_part_time_date
  column_formats:
    Employee Code:
      kind: identifier
    Name:

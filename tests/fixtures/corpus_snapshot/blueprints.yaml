- id: bp-category-mom-volatility
  intent: Month-over-month earnings dollar volatility by earning category, comparing the last two completed
    punch-date months via adjacent month self-join
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH monthly AS\n  (SELECT toStartOfMonth(te.punch_date) AS month,\n          ifNull(ec.category_name,\
    \ 'Uncategorized') AS category,\n          SUM(te.earn_amount) AS dollars\n   FROM\n     (SELECT punch_date,\n\
    \             earn_code,\n             earn_amount\n      FROM dbpcm_warehouse.total_earning) AS te\n\
    \   LEFT JOIN\n     (SELECT earn_code,\n             category_name\n      FROM dbpcm_warehouse.earning_category\
    \ FINAL) AS ec ON ec.earn_code = te.earn_code\n   WHERE te.punch_date >= addMonths(\n            \
    \                          (SELECT CASE\n                                                  WHEN count()\
    \ = 0 THEN NULL\n                                                  ELSE max(punch_date)\n        \
    \                                      END\n                                       FROM dbpcm_warehouse.total_earning),\
    \ -2)\n   GROUP BY toStartOfMonth(te.punch_date),\n            ifNull(ec.category_name, 'Uncategorized'))\n\
    SELECT curr.category AS \"Category\",\n       round(curr.dollars, 2) AS \"Current Month Dollars\"\
    ,\n       round(prior.dollars, 2) AS \"Prior Month Dollars\",\n       round((curr.dollars - prior.dollars),\
    \ 2) AS \"Dollar Change\",\n       round((curr.dollars - prior.dollars) * 100.0 / nullIf(prior.dollars,\
    \ 0), 2) AS \"Pct Change\"\nFROM monthly AS curr\nJOIN monthly AS\nprior ON curr.category = prior.category\n\
    AND prior.month = date_add(month, -1, curr.month)\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN abs(round((curr.dollars - prior.dollars) * 100.0 / nullIf(prior.dollars, 0), 2))\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN abs(round((curr.dollars\
    \ - prior.dollars) * 100.0 / nullIf(prior.dollars, 0), 2))\n                   END ASC, \"Category\"\
    \n"
  slots:
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: order_direction
  uses:
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Category:
      kind: text
    Current Month Dollars:
      kind: currency
      currency: USD
    Prior Month Dollars:
      kind: currency
      currency: USD
    Dollar Change:
      kind: currency
      currency: USD
    Pct Change:
      kind: percent
      scale: percent
      precision: 2

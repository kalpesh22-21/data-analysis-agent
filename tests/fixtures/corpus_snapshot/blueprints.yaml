- id: bp-change-velocity-spikes
  intent: Days with unusually high employee master-data change volume within a trailing window, flagged
    when daily counts exceed one standard deviation above the mean
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "/* Output aliases are Title-Case display names; consumers keying on column names */\n\
    /* must use the quoted aliases. */\nWITH daily_counts AS (\n  SELECT\n    toDate(change_time_added)\
    \ AS day,\n    count() AS cnt\n  FROM dbpcm_warehouse.employee_change\n  WHERE\n    change_time_added\
    \ >= addMonths(today(), -{win})\n  GROUP BY\n    toDate(change_time_added)\n), stats AS (\n  SELECT\n\
    \    avg(cnt) AS avg_cnt,\n    stddevPop(cnt) AS sd_cnt\n  FROM daily_counts\n)\nSELECT\n  toString(d.day)\
    \ AS \"Day\",\n  d.cnt AS \"Change Events\",\n  round(s.avg_cnt, 2) AS \"Daily Mean\",\n  round(s.sd_cnt,\
    \ 2) AS \"Daily Std Dev\"\nFROM daily_counts AS d\nCROSS JOIN stats AS s\nWHERE\n  d.cnt > s.avg_cnt\
    \ + s.sd_cnt\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Change Events DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Change Events
      direction: DESC
    allowed_columns:
    - Day
    - Change Events
    - Daily Mean
    - Daily Std Dev
  slots_summary: win, max_rows, order_by
  uses:
  - dbpcm_warehouse.employee_change.change_time_added
  column_formats:
    Day:
      kind: date
    Change Events:
      kind: integer

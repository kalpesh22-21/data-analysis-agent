- id: bp-punch-anomalies
  intent: Matched In/Out punch pairs with a missing In punch or missing Out punch edge detected via sentinel
    timestamps
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT \"Employee Code\",\n       \"Employee Name\",\n       \"Punch Date\",\n      \
    \ \"Anomaly Type\"\nFROM\n  (SELECT pp.employee_code AS \"Employee Code\",\n          any(e.employee_name)\
    \ AS \"Employee Name\",\n          pp.punch_date AS \"Punch Date\",\n          'Missing Out Punch'\
    \ AS \"Anomaly Type\"\n   FROM\n     (SELECT employee_code,\n             punch_date,\n          \
    \   in_punch_time,\n             out_punch_time\n      FROM dbpcm_warehouse.punch_pair) AS pp\n  \
    \ LEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = pp.employee_code\n   WHERE pp.in_punch_time\
    \ IS NOT NULL\n     AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n     AND NOT (pp.out_punch_time\
    \ IS NOT NULL\n              AND toDate32(pp.out_punch_time) > toDate32('1900-01-01'))\n     AND pp.punch_date\
    \ BETWEEN {window_start} AND {window_end}\n   GROUP BY pp.employee_code,\n            pp.punch_date\n\
    \   UNION ALL SELECT pp.employee_code AS \"Employee Code\",\n                    any(e.employee_name)\
    \ AS \"Employee Name\",\n                    pp.punch_date AS \"Punch Date\",\n                  \
    \  'Missing In Punch' AS \"Anomaly Type\"\n   FROM\n     (SELECT employee_code,\n             punch_date,\n\
    \             in_punch_time,\n             out_punch_time\n      FROM dbpcm_warehouse.punch_pair)\
    \ AS pp\n   LEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = pp.employee_code\n   WHERE pp.out_punch_time\
    \ IS NOT NULL\n     AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')\n     AND NOT (pp.in_punch_time\
    \ IS NOT NULL\n              AND toDate32(pp.in_punch_time) > toDate32('1900-01-01'))\n     AND pp.punch_date\
    \ BETWEEN {window_start} AND {window_end}\n   GROUP BY pp.employee_code,\n            pp.punch_date)\
    \ AS anomalies\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Punch Date\"\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Punch Date\"\
    \n                   END ASC, \"Employee Code\"\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, max_rows, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Punch Date:
      kind: date
    Anomaly Type:
      kind: text
- id: bp-punch-coverage-gap
  intent: Coverage metric showing the share of active employees who had at least one punch in the last
    N days, with counts of punchers and non-punchers
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT count(DISTINCT e.employee_code) AS \"Active Employees\",\n       count(DISTINCT\
    \ pp.employee_code) AS \"Employees With Punches\",\n       count(DISTINCT e.employee_code) - count(DISTINCT\
    \ pp.employee_code) AS \"Employees Without Punches\",\n       round(100.0 * count(DISTINCT pp.employee_code)\
    \ / nullIf(count(DISTINCT e.employee_code), 0), 2) AS \"Coverage Pct\"\nFROM dbpcm_warehouse.employee\
    \ e\nLEFT JOIN\n  (SELECT DISTINCT employee_code\n   FROM dbpcm_warehouse.punch_pair\n   WHERE punch_date\
    \ >= today() - {win}) pp ON pp.employee_code = e.employee_code\nWHERE e.employee_status = 'Active'\n"
  slots:
  - name: win
    type: relative_window
    required: true
  slots_summary: win
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Active Employees:
      kind: integer
    Employees With Punches:
      kind: integer
    Employees Without Punches:
      kind: integer
    Coverage Pct:
      kind: percent
      scale: percent
      precision: 2
- id: bp-punch-pair-summary
  intent: Matched punch-pair counts, distinct employees, observed days, paid hours and pair earning amount
    by company, employee, allocated department, day, month or hours type. Did this employee have punches
    in the period? Paid hours use earn_hours, not elapsed clock duration. Single-argument distinct counts.
    Required half-open punch-date period and resolved table_source prevent accidental cross-source double
    counting. FINAL deduplicates storage versions, not overlapping real-world events. Department means
    recorded labor-allocation department code, not current home department. No scheduled shift, tardiness
    or overtime policy is inferred. Observed first/last dates do not prove completeness; missing days/months
    are not zero-filled.
  slots_summary: group_by, period, source, employee, department, hours_type, pay_class, in_type, out_type,
    order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.punch_pair.department_code
  - dbpcm_warehouse.punch_pair.earn_amount
  - dbpcm_warehouse.punch_pair.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.hours_type
  - dbpcm_warehouse.punch_pair.in_punch_type
  - dbpcm_warehouse.punch_pair.out_punch_type
  - dbpcm_warehouse.punch_pair.pay_class_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - hours_type
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.punch_pair.table_source
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.department_code
    optional_pattern: 'TRUE'
  - name: hours_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.hours_type
    optional_pattern: 'TRUE'
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.pay_class_code
    optional_pattern: 'TRUE'
  - name: in_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.in_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - ID
    - IL
    - IB
    - IX
  - name: out_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.out_punch_type
    optional_pattern: 'TRUE'
    enum_values:

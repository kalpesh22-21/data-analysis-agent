- id: bp-new-hire-90d-attrition
  intent: New hires in a window who terminated within 90 days of hire, with the 90-day attrition rate
    as a ratio
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  count(DISTINCT employee_code) AS \"Hires In Window\",\n  COUNT(\n    DISTINCT\
    \ CASE\n      WHEN NOT (\n        termination_date IS NULL\n      )\n      AND toDate32(termination_date)\
    \ > toDate32('1900-01-01')\n      AND DATE_DIFF(DAY, hire_date, termination_date) <= 90\n      AND\
    \ (\n        most_recent_hire_date IS NULL OR most_recent_hire_date < termination_date\n      )\n\
    \      THEN employee_code\n      ELSE NULL\n    END\n  ) AS \"Terms Within 90 Days\",\n  round(\n\
    \    100 * COUNT(\n      DISTINCT CASE\n        WHEN NOT (\n          termination_date IS NULL\n \
    \       )\n        AND toDate32(termination_date) > toDate32('1900-01-01')\n        AND DATE_DIFF(DAY,\
    \ hire_date, termination_date) <= 90\n        AND (\n          most_recent_hire_date IS NULL OR most_recent_hire_date\
    \ < termination_date\n        )\n        THEN employee_code\n        ELSE NULL\n      END\n    ) /\
    \ nullIf(count(DISTINCT employee_code), 0),\n    2\n  ) AS \"90-Day Attrition Pct\"\nFROM dbpcm_warehouse.employee\n\
    WHERE\n  NOT (\n    hire_date IS NULL\n  )\n  AND toDate32(hire_date) > toDate32('1900-01-01')\n \
    \ AND hire_date >= {window_start}\n  AND hire_date < {window_end}\nORDER BY {order_by}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Hires In Window ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Hires In Window
      direction: ASC
    allowed_columns:
    - Hires In Window
    - Terms Within 90 Days
    - 90-Day Attrition Pct
  slots_summary: window, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Hires In Window:
      kind: integer
    Terms Within 90 Days:
      kind: integer
    90-Day Attrition Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: facts
    measure_columns:
    - Hires In Window
    - Terms Within 90 Days
    - 90-Day Attrition Pct
- id: bp-night-shift-share
  intent: Night-shift hours share by department using total_earning earn_hours where the shift date is
    identified by In punch time between configurable night-start and night-end hours
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH night_dates AS (\n  SELECT DISTINCT\n    pp.employee_code,\n    pp.punch_date\n\
    \  FROM (\n    SELECT\n      employee_code,\n      punch_date,\n      in_punch_time\n    FROM dbpcm_warehouse.punch_pair\n\
    \  ) AS pp\n  WHERE\n    (\n      pp.punch_date >= {window_start} AND pp.punch_date < {window_end}\n\
    \    )\n    AND NOT (\n      pp.in_punch_time IS NULL\n    )\n    AND toDate32(pp.in_punch_time) >\
    \ toDate32('1900-01-01')\n    AND (\n      toHour(pp.in_punch_time) >= {night_start}\n      OR toHour(pp.in_punch_time)\
    \ < {night_end}\n    )\n), dept_total AS (\n  SELECT\n    e.department_name AS dept,\n    SUM(te.earn_hours)\
    \ AS total_hours\n  FROM (\n    SELECT\n      employee_code,\n      punch_date,\n      earn_hours\n\
    \    FROM dbpcm_warehouse.total_earning\n  ) AS te\n  JOIN dbpcm_warehouse.employee AS e\n    ON e.employee_code\
    \ = te.employee_code\n  WHERE\n    (\n      te.punch_date >= {window_start} AND te.punch_date < {window_end}\n\
    \    )\n  GROUP BY\n    e.department_name\n), dept_night AS (\n  SELECT\n    e.department_name AS\
    \ dept,\n    SUM(te.earn_hours) AS night_hours\n  FROM night_dates AS nd\n  JOIN (\n    SELECT\n \
    \     employee_code,\n      punch_date,\n      earn_hours\n    FROM dbpcm_warehouse.total_earning\n\
    \  ) AS te\n    ON te.employee_code = nd.employee_code AND te.punch_date = nd.punch_date\n  JOIN dbpcm_warehouse.employee\
    \ AS e\n    ON e.employee_code = te.employee_code\n  GROUP BY\n    e.department_name\n)\nSELECT\n\
    \  COALESCE(d.dept, n.dept) AS \"Department\",\n  round(COALESCE(d.total_hours, 0), 2) AS \"Total\
    \ Hours\",\n  round(COALESCE(n.night_hours, 0), 2) AS \"Night Hours\",\n  round(100.0 * COALESCE(n.night_hours,\
    \ 0) / nullIf(COALESCE(d.total_hours, 0), 0), 2) AS \"Night Share Pct\"\nFROM dept_total AS d\nFULL\
    \ OUTER JOIN dept_night AS n\n  ON n.dept = d.dept\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: night_start
    type: positive_integer
    required: true
  - name: night_end
    type: positive_integer
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Night Share Pct DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Night Share Pct
      direction: DESC
    allowed_columns:
    - Department
    - Total Hours
    - Night Hours
    - Night Share Pct
  slots_summary: window, night_start, night_end, max_rows, order_by
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Total Hours:
      kind: number
      unit: hours
      precision: 2
    Night Hours:
      kind: number
      unit: hours
      precision: 2
    Night Share Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Total Hours

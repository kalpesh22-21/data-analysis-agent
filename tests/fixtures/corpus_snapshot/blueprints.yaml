    \ 1) AS \"Tenure Years\"\nFROM dbpcm_warehouse.employee\nWHERE\n  employee_status = 'Active'\nORDER\
    \ BY\n  hire_date ASC,\n  employee_code\nLIMIT {top_n}\n"

- id: bp-hires-per-month
  intent: New hires per month over a trailing window of the last N months — counts by original hire date;
    rehires are not re-counted
  slots_summary: window_months
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 36
  result_grain:
  - month
  window_anchor: data
  sql_template: "SELECT toStartOfMonth(hire_date) AS month,\n       COUNT(DISTINCT employee_code) AS hires\n\
    FROM dbpcm_warehouse.employee\nWHERE hire_date >=\n    (SELECT toStartOfMonth(max(hire_date))\n  \
    \   FROM dbpcm_warehouse.employee\n     WHERE employee_status != 'N'\n       OR employee_status IS\
    \ NULL) - INTERVAL {window_months} MONTH\n  AND (employee_status != 'N'\n       OR employee_status\
    \ IS NULL)\nGROUP BY toStartOfMonth(hire_date)\n"
  column_formats:
    month:
      kind: date
    hires:
      kind: integer
- id: bp-hires-projection
  intent: Projected number of hires over the next N months at the current hiring pace (run-rate over a
    trailing window) — counts by original hire date; rehires are not re-counted
  slots_summary: window_months, horizon_months
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 2
    max_value: 36
  - name: horizon_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 24
  result_grain: []
  window_anchor: data
  sql_template: "SELECT COUNT(DISTINCT employee_code) AS hires_in_window,\n       round(COUNT(DISTINCT\
    \ employee_code) / {window_months}, 1) AS avg_monthly_hires,\n       round(COUNT(DISTINCT employee_code)\
    \ / {window_months} * {horizon_months}) AS projected_next_n_hires\nFROM dbpcm_warehouse.employee\n\
    WHERE hire_date >= addMonths(\n                               (SELECT toStartOfMonth(max(hire_date))\n\
    \                                FROM dbpcm_warehouse.employee\n                                WHERE\
    \ employee_status != 'N'\n                                  OR employee_status IS NULL), 1) - INTERVAL\
    \ {window_months} MONTH\n  AND (employee_status != 'N'\n       OR employee_status IS NULL)\n"
  column_formats:
    hires_in_window:
      kind: integer
    avg_monthly_hires:
      kind: number
    projected_next_n_hires:
      kind: number

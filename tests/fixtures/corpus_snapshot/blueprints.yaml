    \ = te.earn_code\nWHERE\n  ec.category_name IN ({concept})\n  AND te.punch_date >= addMonths((\n \
    \   SELECT\n      max(punch_date)\n    FROM dbpcm_warehouse.total_earning\n  ), -{win})\nGROUP BY\n\

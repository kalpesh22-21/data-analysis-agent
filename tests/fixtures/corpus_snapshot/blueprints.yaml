- id: bp-upcoming-timeoff-roster
  intent: Roster of employees with approved time-off requests in the next N days for coverage planning,
    optionally filtered by department
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  t.employee_code AS \"Employee Code\",\n  any(e.employee_name) AS \"Employee\
    \ Name\",\n  any(e.department_name) AS \"Department\",\n  toDate32(t.request_date) AS \"Request Date\"\
    ,\n  t.earn_description AS \"Leave Type\",\n  round(SUM(t.hours), 2) AS \"Hours\"\nFROM dbpcm_warehouse.time_off_request\
    \ AS t\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = t.employee_code\nWHERE\n  t.status\
    \ = 'Approved'\n  AND t.event_type IN ({event_type})\n  AND toDate32(t.request_date) >= today()\n\
    \  AND toDate32(t.request_date) <= today() + INTERVAL (\n    {win}\n  ) DAY\n  AND e.department_name\
    \ IN ({dept})\nGROUP BY\n  t.employee_code,\n  toDate32(t.request_date),\n  t.earn_description\nORDER\
    \ BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: win

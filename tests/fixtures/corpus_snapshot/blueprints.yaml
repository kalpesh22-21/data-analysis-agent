    - Change Events
- id: bp-clock-time-profile
  intent: Time-of-day clock-in and clock-out distribution per employee home department using punch_pair
    event timestamps, showing typical shift start and end profiles
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  e.department_name AS \"Department\",\n  round(\n    (\n      quantileExactLow(0.5)(toHour(pp.in_punch_time)\
    \ * 60 + toMinute(pp.in_punch_time)) + quantileExactHigh(0.5)(toHour(pp.in_punch_time) * 60 + toMinute(pp.in_punch_time))\n\
    \    ) / 2,\n    0\n  ) AS \"Median Clock-In Min\",\n  round(\n    (\n      quantileExactLow(0.5)(toHour(pp.out_punch_time)\
    \ * 60 + toMinute(pp.out_punch_time)) + quantileExactHigh(0.5)(toHour(pp.out_punch_time) * 60 + toMinute(pp.out_punch_time))\n\
    \    ) / 2,\n    0\n  ) AS \"Median Clock-Out Min\",\n  count() AS \"Pair Count\"\nFROM (\n  SELECT\n\
    \    employee_code,\n    punch_date,\n    in_punch_time,\n    out_punch_time\n  FROM dbpcm_warehouse.punch_pair\n\
    ) AS pp\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = pp.employee_code\nWHERE\n  (\n\
    \    pp.punch_date >= {window_start} AND pp.punch_date < {window_end}\n  )\n  AND NOT (\n    pp.in_punch_time\
    \ IS NULL\n  )\n  AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n  AND NOT (\n    pp.out_punch_time\
    \ IS NULL\n  )\n  AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')\nGROUP BY\n  e.department_name\n\
    ORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Median Clock-In Min ASC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Median Clock-In Min
      direction: ASC
    allowed_columns:
    - Department
    - Median Clock-In Min
    - Median Clock-Out Min
    - Pair Count
  slots_summary: window, max_rows, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Median Clock-In Min:
      kind: number
      unit: minutes after midnight
      precision: 2
    Median Clock-Out Min:
      kind: number
      unit: minutes after midnight
      precision: 2
    Pair Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Median Clock-In Min

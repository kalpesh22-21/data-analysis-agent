- id: bp-accrual-balance-summary
  intent: 'Recorded beginning, accrued, awarded and taken plan balances by company, department or plan.
    Optional accrual plan code, employee status, department and employee. Uses taken_amount, never approved
    event hours. No implicit PTO filter: resolve plan code for PTO. No event-date restriction, current-balance
    formula or assumed units. Cross-plan sums require compatible units; otherwise use plan grouping/filter.
    Preaggregate balance rows by employee/plan before LEFT JOIN without assuming unique plan rows.'
  slots_summary: group_by, accrual_code, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.time_off_balance.employee_code
  - dbpcm_warehouse.time_off_balance.accrual_code
  - dbpcm_warehouse.time_off_balance.beginning_balance
  - dbpcm_warehouse.time_off_balance.accrued_amount
  - dbpcm_warehouse.time_off_balance.awarded_amount
  - dbpcm_warehouse.time_off_balance.taken_amount
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - plan
  - name: accrual_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_balance.accrual_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Beginning Balance
    - Accrued Amount
    - Awarded Amount
    - Taken Amount
    - Employee Count
  result_grain:
  - Group
  sql_template: "WITH b AS (\n  SELECT\n    employee_code,\n    accrual_code,\n    sum(beginning_balance)\
    \ AS beginning,\n    sum(accrued_amount) AS accrued,\n    sum(awarded_amount) AS awarded,\n    sum(taken_amount)\
    \ AS taken\n  FROM dbpcm_warehouse.time_off_balance\n  WHERE\n    accrual_code IN ({accrual_code})\n\
    \  GROUP BY\n    employee_code,\n    accrual_code\n)\nSELECT\n  CASE\n    WHEN {group_by} = 'department'\n\
    \    THEN e.department_name\n    WHEN {group_by} = 'plan'\n    THEN b.accrual_code\n    ELSE 'Company'\n\
    \  END AS \"Group\",\n  sum(CAST(b.beginning AS Nullable(Decimal(38, 6)))) AS \"Beginning Balance\"\
    ,\n  sum(CAST(b.accrued AS Nullable(Decimal(38, 6)))) AS \"Accrued Amount\",\n  sum(CAST(b.awarded\
    \ AS Nullable(Decimal(38, 6)))) AS \"Awarded Amount\",\n  sum(CAST(b.taken AS Nullable(Decimal(38,\
    \ 6)))) AS \"Taken Amount\",\n  uniqExact(b.employee_code) AS \"Employee Count\"\nFROM b\nLEFT JOIN\
    \ dbpcm_warehouse.employee AS e\n  ON b.employee_code = e.employee_code\nWHERE\n  e.employee_status\
    \ IN ({employee_status})\n  AND e.department_name IN ({department})\n  AND e.employee_code = {employee}\n\
    GROUP BY\n  CASE\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n    WHEN {group_by}\
    \ = 'plan'\n    THEN b.accrual_code\n    ELSE 'Company'\n  END\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Beginning Balance:
      kind: number
    Accrued Amount:
      kind: number
    Awarded Amount:
      kind: number
    Taken Amount:
      kind: number
    Employee Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Beginning Balance
    by_group_by:
      company: figure

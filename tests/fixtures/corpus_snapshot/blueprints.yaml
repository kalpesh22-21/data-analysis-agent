- id: bp-employee-summary
  intent: Headcount and annual compensation sum, average, minimum, maximum and known-compensation count
    by company, department or status, separately by pay type. Unknown compensation is NULL; headcount
    retains other and unknown pay types. Salary uses annual_salary; Hourly uses hourly_salary and estimated
    annual compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes overtime). Keep
    pay types separate. Defaults to Active + On Leave; employee_status overrides or All removes the filter.
  slots_summary: group_by, employee_status, department, employee, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  - Pay Type
  sql_template: "SELECT e.employee_pay_type AS `Pay Type`,\n       CASE\n           WHEN e.employee_pay_type\
    \ = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'\n           WHEN e.employee_pay_type\
    \ = 'Salary' THEN 'Recorded annual salary'\n           ELSE 'Unknown compensation basis'\n       END\
    \ AS `Compensation Basis`,\n       CASE\n           WHEN {group_by} = 'department' THEN e.department_name\n\
    \           WHEN {group_by} = 'status' THEN e.employee_status\n           ELSE 'Company'\n       END\
    \ AS `Group`,\n       uniqExact(e.employee_code) AS `Employee Count`,\n       count((CASE\n      \
    \            WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                  WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n                  ELSE NULL\n              END)) AS `Known\
    \ Compensation Count`,\n       sum((CASE\n                WHEN e.employee_pay_type = 'Salary' THEN\
    \ e.annual_salary\n                WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n\
    \                ELSE NULL\n            END)) AS `Annual Compensation Sum`,\n       avg((CASE\n  \
    \              WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n                ELSE NULL\n            END)) AS `Average\
    \ Annual Compensation`,\n       min((CASE\n                WHEN e.employee_pay_type = 'Salary' THEN\
    \ e.annual_salary\n                WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n\
    \                ELSE NULL\n            END)) AS `Minimum Annual Compensation`,\n       max((CASE\n\
    \                WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n                ELSE NULL\n            END)) AS `Maximum\
    \ Annual Compensation`,\n       avg(CASE\n               WHEN e.employee_pay_type = 'Hourly' THEN\
    \ e.hourly_salary\n               ELSE NULL\n           END) AS `Average Hourly Rate`\nFROM dbpcm_warehouse.employee\
    \ e\nWHERE (e.employee_status = {employee_status}\n       OR {employee_status} = 'All')\n  AND e.department_name\
    \ = {department}\n  AND e.employee_code = {employee}\nGROUP BY e.employee_pay_type,\n         CASE\n\
    \             WHEN {group_by} = 'department' THEN e.department_name\n             WHEN {group_by}\
    \ = 'status' THEN e.employee_status\n             ELSE 'Company'\n         END\nORDER BY CASE\n  \
    \           WHEN {order_direction} = 'DESC' THEN `Group`\n         END DESC, CASE\n              \
    \         WHEN {order_direction} = 'ASC' THEN `Group`\n                   END ASC\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Group:
      kind: text
    Employee Count:
      kind: integer
    Known Compensation Count:
      kind: integer
    Annual Compensation Sum:
      kind: currency
      currency: USD
      precision: 2
    Average Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Minimum Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Maximum Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour

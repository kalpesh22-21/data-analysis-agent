- id: bp-timeoff-denial-rate
  intent: Time-off denial rate by department for decided requests (Approved plus Denied) over a request-date
    window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT d.\"Department\" AS \"Department\",\n       d.\"Decided Requests\" AS \"Decided\
    \ Requests\",\n       d.\"Denied Requests\" AS \"Denied Requests\",\n       round((d.\"Denied Requests\"\
    \ / nullIf(d.\"Decided Requests\", 0)) * 100, 2) AS \"Denial Rate Pct\"\nFROM\n  (SELECT e.department_name\
    \ AS \"Department\",\n          COUNT(*) AS \"Decided Requests\",\n          COUNTIf(t.status = 'Denied')\
    \ AS \"Denied Requests\"\n   FROM dbpcm_warehouse.time_off_request AS t\n   JOIN dbpcm_warehouse.employee\
    \ AS e ON e.employee_code = t.employee_code\n   WHERE t.status IN ('Approved',\n                 \
    \     'Denied')\n     AND toDate32(t.request_date) BETWEEN {window_start} AND {window_end}\n   GROUP\
    \ BY e.department_name) AS d\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"\
    Denial Rate Pct\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC'\
    \ THEN \"Denial Rate Pct\"\n                   END ASC, \"Department\"\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, order_direction
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Decided Requests:
      kind: integer
    Denied Requests:
      kind: integer
    Denial Rate Pct:
      kind: percent
      scale: percent
      precision: 2

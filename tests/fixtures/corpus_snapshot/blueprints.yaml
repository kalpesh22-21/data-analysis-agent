- id: bp-regular-vs-premium-hours-ratio
  intent: Monthly regular versus premium paid hours ratio from timecard earnings, bucketed by punch date
    month, showing regular share and premium share
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(te.punch_date), '%Y-%m') AS \"Month\",\n       round(SUMIf(te.earn_hours,\
    \ ec.category_name = 'Regular'), 2) AS \"Regular Hours\",\n       round(SUMIf(te.earn_hours, ec.category_name\
    \ != 'Regular'\n                   OR ec.category_name IS NULL), 2) AS \"Premium Hours\",\n      \
    \ round(SUMIf(te.earn_hours, ec.category_name = 'Regular') * 100.0 / nullIf(SUM(te.earn_hours), 0),\
    \ 2) AS \"Regular Pct\"\nFROM\n  (SELECT punch_date,\n          earn_hours,\n          earn_code\n\
    \   FROM dbpcm_warehouse.total_earning) AS te\nLEFT JOIN\n  (SELECT earn_code,\n          category_name\n\
    \   FROM dbpcm_warehouse.earning_category FINAL) AS ec ON ec.earn_code = te.earn_code\nWHERE te.punch_date\
    \ >= addMonths(\n                                   (SELECT CASE\n                               \
    \                WHEN count() = 0 THEN NULL\n                                               ELSE max(punch_date)\n\
    \                                           END\n                                    FROM dbpcm_warehouse.total_earning),\
    \ -{win})\nGROUP BY \"Month\"\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"\
    Month\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Month\"\
    \n                   END ASC\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Month:
      kind: text
    Regular Hours:
      kind: number
      unit: hours
      precision: 2
    Premium Hours:
      kind: number
      unit: hours
      precision: 2
    Regular Pct:
      kind: percent
      scale: percent
      precision: 2
- id: bp-rehired-employees
  intent: Terminated-then-rehired employees with rehire event history — employees who left and came back,
    showing previous termination and rehire dates within a calendar window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       employee_name AS \"Name\",\n     \
    \  department_name AS \"Department\",\n       old_termination_date AS \"Old Termination Date\",\n\
    \       ifNull(rehire_date, most_recent_hire_date) AS \"Rehire Date\",\n       date_diff('day', old_termination_date,\
    \ ifNull(rehire_date, most_recent_hire_date)) AS \"Days Between\"\nFROM dbpcm_warehouse.employee\n\
    WHERE old_termination_date IS NOT NULL\n  AND toDate32(old_termination_date) > toDate32('1900-01-01')\n\
    \  AND ((rehire_date IS NOT NULL\n        AND toDate32(rehire_date) > toDate32('1900-01-01')\n   \
    \     AND rehire_date > old_termination_date)\n       OR (most_recent_hire_date IS NOT NULL\n    \
    \       AND most_recent_hire_date > old_termination_date))\n  AND ifNull(rehire_date, most_recent_hire_date)\
    \ >= {window_start}\n  AND ifNull(rehire_date, most_recent_hire_date) < {window_end}\nORDER BY CASE\n\
    \             WHEN {order_direction} = 'DESC' THEN \"Rehire Date\"\n         END DESC, CASE\n    \
    \                   WHEN {order_direction} = 'ASC' THEN \"Rehire Date\"\n                   END ASC,\
    \ \"Employee Code\"\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.old_termination_date
  - dbpcm_warehouse.employee.rehire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Employee Code:
      kind: identifier

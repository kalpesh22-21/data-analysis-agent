- id: bp-expense-cycle-time
  intent: Median expense reimbursement cycle time by month, submission to approval and approval to payment
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(dateTrunc('MONTH', expense_paid_date), '%Y-%m') AS \"Month\"\
    ,\n  count() AS \"Expense Count\",\n  round(\n    (\n      quantileExactLow(0.5)(DATE_DIFF(DAY, date_time_submitted,\
    \ approved_date)) + quantileExactHigh(0.5)(DATE_DIFF(DAY, date_time_submitted, approved_date))\n \
    \   ) / 2,\n    1\n  ) AS \"Median Submission To Approval\",\n  round(\n    (\n      quantileExactLow(0.5)(DATE_DIFF(DAY,\
    \ approved_date, expense_paid_date)) + quantileExactHigh(0.5)(DATE_DIFF(DAY, approved_date, expense_paid_date))\n\
    \    ) / 2,\n    1\n  ) AS \"Median Approval To Payment\"\nFROM dbpcm_warehouse.expense\nWHERE\n \
    \ expense_status IN ('Approved', 'Paid', 'Marked as Paid')\n  AND NOT (\n    date_time_submitted IS\
    \ NULL\n  )\n  AND toDate32(date_time_submitted) > toDate32('1900-01-01')\n  AND NOT (\n    approved_date\
    \ IS NULL\n  )\n  AND toDate32(approved_date) > toDate32('1900-01-01')\n  AND NOT (\n    expense_paid_date\
    \ IS NULL\n  )\n  AND toDate32(expense_paid_date) > toDate32('1900-01-01')\n  AND expense_paid_date\
    \ >= (\n    SELECT\n      addMonths(dateTrunc('MONTH', max(expense_paid_date)), -{window_months})\n\
    \    FROM dbpcm_warehouse.expense\n    WHERE\n      expense_status IN ('Approved', 'Paid', 'Marked\
    \ as Paid')\n      AND NOT (\n        expense_paid_date IS NULL\n      )\n      AND toDate32(expense_paid_date)\
    \ > toDate32('1900-01-01')\n  )\nGROUP BY\n  \"Month\"\nORDER BY {order_by}\n"
  slots:
  - name: window_months
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Expense Count
    - Median Submission To Approval
    - Median Approval To Payment
  slots_summary: window_months, order_by
  uses:
  - dbpcm_warehouse.expense.date_time_submitted
  - dbpcm_warehouse.expense.approved_date
  - dbpcm_warehouse.expense.expense_paid_date
  - dbpcm_warehouse.expense.expense_status
  column_formats:
    Month:
      kind: text
    Expense Count:
      kind: integer
    Median Submission To Approval:
      kind: number
      unit: days
      precision: 2
    Median Approval To Payment:
      kind: number
      unit: days
      precision: 2
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Expense Count
    - Median Submission To Approval
    - Median Approval To Payment
- id: bp-expense-line-size-distribution
  intent: Size distribution of approved expense amounts in fixed amount bands for a payment date window,
    one row per band in amount order. Expenses without an approved amount are excluded. Optional single-account
    filter.
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  CONCAT(\n    '$',\n    toString(toInt32(FLOOR(toFloat64(amount_approved) /\
    \ {band}) * {band})),\n    ' to under $',\n    toString(toInt32(FLOOR(toFloat64(amount_approved) /\
    \ {band}) * {band} + {band}))\n  ) AS \"Amount Band\",\n  count() AS \"Expense Count\",\n  toInt32(FLOOR(toFloat64(amount_approved)\
    \ / {band}) * {band}) AS \"Band Start\"\nFROM dbpcm_warehouse.expense\nWHERE\n  expense_status IN\
    \ ('Approved', 'Paid', 'Marked as Paid')\n  AND expense_paid_date >= {expense_window_start}\n  AND\
    \ expense_paid_date < {expense_window_end}\n  AND NOT (\n    amount_approved IS NULL\n  )\n  AND expense_account_description\
    \ IN ({account})\nGROUP BY\n  FLOOR(toFloat64(amount_approved) / {band})\nORDER BY {order_by}\n"
  slots:
  - name: expense_window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: band
    type: positive_integer
    required: true
    description: Whole-dollar band width. Use the requested width; otherwise choose one that gives roughly
      10 to 25 bands.
  - name: account
    type: entity
    required: false
    binds_to: dbpcm_warehouse.expense.expense_account_description
    optional_pattern: 'TRUE'
    description: Omit for all accounts. Bind one expense account description to show that account's line
      sizes only.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Band Start ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Band Start
      direction: ASC
    allowed_columns:
    - Amount Band
    - Expense Count
    - Band Start
  result_grain:
  - Amount Band
  slots_summary: expense_window, band, account, order_by
  uses:
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.expense_account_description
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.expense.expense_paid_date
  column_formats:
    Amount Band:
      kind: text
    Expense Count:
      kind: integer
    Band Start:
      kind: number
  presentation:
    kind: bars
    category_columns:
    - Amount Band
    measure_columns:
    - Expense Count

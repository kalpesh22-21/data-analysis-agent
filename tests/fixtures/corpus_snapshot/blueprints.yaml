- id: bp-weekend-work-share
  intent: Weekend versus weekday paid hours share by month from total_earning, the authoritative hours
    source, showing weekend percentage and totals
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(addDays(punch_date, 1 - toDayOfMonth(punch_date)), '%Y-%m')\
    \ AS \"Month\",\n  round(SUM(earn_hours), 2) AS \"Total Hours\",\n  round(SUMIf(earn_hours, dayOfWeek(punch_date)\
    \ IN (6, 7)), 2) AS \"Weekend Hours\",\n  round(SUMIf(earn_hours, NOT (\n    dayOfWeek(punch_date)\
    \ IN (6, 7)\n  )), 2) AS \"Weekday Hours\",\n  round(\n    100 * SUMIf(earn_hours, dayOfWeek(punch_date)\
    \ IN (6, 7)) / nullIf(SUM(earn_hours), 0),\n    2\n  ) AS \"Weekend Share Pct\"\nFROM (\n  SELECT\n\
    \    punch_date,\n    earn_hours\n  FROM dbpcm_warehouse.total_earning\n)\nWHERE\n  punch_date >=\
    \ today() - toIntervalMonth({win})\nGROUP BY\n  \"Month\"\nORDER BY {order_by}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Total Hours
    - Weekend Hours
    - Weekday Hours
    - Weekend Share Pct
  slots_summary: win, order_by
  uses:
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  column_formats:
    Month:
      kind: text
    Total Hours:
      kind: number
      unit: hours
      precision: 2
    Weekend Hours:
      kind: number
      unit: hours
      precision: 2
    Weekday Hours:
      kind: number
      unit: hours
      precision: 2
    Weekend Share Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Total Hours
    - Weekend Hours
    - Weekday Hours
    - Weekend Share Pct
- id: bp-weekly-overtime-hours
  intent: Overtime hours per employee per work week based on total_earning earn_hours, the authoritative
    hours source, with a configurable weekly threshold
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH weekly AS (\n  SELECT\n    employee_code,\n    addDays(punch_date, -(\n      DATE_DIFF(DAY,\
    \ toDate32('1900-01-01'), punch_date) % 7\n    )) AS week_start,\n    SUM(earn_hours) AS weekly_hours\n\
    \  FROM (\n    SELECT\n      employee_code,\n      punch_date,\n      earn_hours\n    FROM dbpcm_warehouse.total_earning\n\
    \  )\n  WHERE\n    (\n      punch_date >= {window_start} AND punch_date < {window_end}\n    )\n  GROUP\
    \ BY\n    employee_code,\n    addDays(punch_date, -(\n      DATE_DIFF(DAY, toDate32('1900-01-01'),\
    \ punch_date) % 7\n    ))\n)\nSELECT\n  w.employee_code AS \"Employee Code\",\n  max(e.employee_name)\
    \ AS \"Employee Name\",\n  w.week_start AS \"Week Start\",\n  round(w.weekly_hours, 2) AS \"Weekly\
    \ Hours\",\n  round(greatest(w.weekly_hours - {threshold}, 0), 2) AS \"Overtime Hours\"\nFROM weekly\
    \ AS w\nLEFT JOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = w.employee_code\nWHERE\n \
    \ w.weekly_hours > {threshold}\nGROUP BY\n  w.employee_code,\n  w.week_start,\n  w.weekly_hours\n\
    ORDER BY {order_by}\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: threshold
    type: positive_integer
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Overtime Hours DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Overtime Hours
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Week Start
    - Weekly Hours
    - Overtime Hours
  slots_summary: window, threshold, max_rows, order_by
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Week Start:
      kind: date
    Weekly Hours:
      kind: number
      unit: hours
      precision: 2
    Overtime Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: table

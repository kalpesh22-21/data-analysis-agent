  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: era_window, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Hire Era:
      kind: text
    Headcount:
      kind: integer
    Avg Tenure Years:
      kind: number
      unit: years
      precision: 2

- id: bp-punch-anomalies
  intent: Matched In/Out punch pairs with a missing In punch or missing Out punch edge detected via sentinel
    timestamps
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  \"Employee Code\",\n  \"Employee Name\",\n  \"Punch Date\",\n  \"Anomaly Type\"\
    \nFROM (\n  SELECT\n    pp.employee_code AS \"Employee Code\",\n    any(e.employee_name) AS \"Employee\
    \ Name\",\n    pp.punch_date AS \"Punch Date\",\n    'Missing Out Punch' AS \"Anomaly Type\"\n  FROM\
    \ (\n    SELECT\n      employee_code,\n      punch_date,\n      in_punch_time,\n      out_punch_time\n\
    \    FROM dbpcm_warehouse.punch_pair\n  ) AS pp\n  LEFT JOIN dbpcm_warehouse.employee AS e\n    ON\
    \ e.employee_code = pp.employee_code\n  WHERE\n    NOT (\n      pp.in_punch_time IS NULL\n    )\n\
    \    AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n    AND NOT (\n      NOT (\n       \
    \ pp.out_punch_time IS NULL\n      )\n      AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')\n\
    \    )\n    AND (\n      pp.punch_date >= {window_start} AND pp.punch_date < {window_end}\n    )\n\
    \  GROUP BY\n    pp.employee_code,\n    pp.punch_date\n  UNION ALL\n  SELECT\n    pp.employee_code\
    \ AS \"Employee Code\",\n    any(e.employee_name) AS \"Employee Name\",\n    pp.punch_date AS \"Punch\
    \ Date\",\n    'Missing In Punch' AS \"Anomaly Type\"\n  FROM (\n    SELECT\n      employee_code,\n\
    \      punch_date,\n      in_punch_time,\n      out_punch_time\n    FROM dbpcm_warehouse.punch_pair\n\
    \  ) AS pp\n  LEFT JOIN dbpcm_warehouse.employee AS e\n    ON e.employee_code = pp.employee_code\n\
    \  WHERE\n    NOT (\n      pp.out_punch_time IS NULL\n    )\n    AND toDate32(pp.out_punch_time) >\
    \ toDate32('1900-01-01')\n    AND NOT (\n      NOT (\n        pp.in_punch_time IS NULL\n      )\n\
    \      AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n    )\n    AND (\n      pp.punch_date\
    \ >= {window_start} AND pp.punch_date < {window_end}\n    )\n  GROUP BY\n    pp.employee_code,\n \
    \   pp.punch_date\n) AS anomalies\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Punch Date DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Punch Date
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Punch Date
    - Anomaly Type
  slots_summary: window, max_rows, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Punch Date:
      kind: date
    Anomaly Type:
      kind: text
  presentation:
    kind: table
- id: bp-punch-coverage-gap
  intent: Coverage metric showing the share of active employees who had at least one punch in the last
    N days, with counts of punchers and non-punchers
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  count(DISTINCT e.employee_code) AS \"Active Employees\",\n  count(DISTINCT\
    \ pp.employee_code) AS \"Employees With Punches\",\n  count(DISTINCT e.employee_code) - count(DISTINCT\
    \ pp.employee_code) AS \"Employees Without Punches\",\n  round(\n    100.0 * count(DISTINCT pp.employee_code)\
    \ / nullIf(count(DISTINCT e.employee_code), 0),\n    2\n  ) AS \"Coverage Pct\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nLEFT JOIN (\n  SELECT DISTINCT\n    employee_code\n  FROM dbpcm_warehouse.punch_pair\n  WHERE\n\
    \    punch_date >= today() - {win}\n) AS pp\n  ON pp.employee_code = e.employee_code\nWHERE\n  e.employee_status\
    \ = 'Active'\nORDER BY {order_by}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Active Employees ASC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Active Employees
      direction: ASC
    allowed_columns:
    - Active Employees
    - Employees With Punches
    - Employees Without Punches
    - Coverage Pct
  slots_summary: win, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Active Employees:
      kind: integer
    Employees With Punches:
      kind: integer
    Employees Without Punches:
      kind: integer
    Coverage Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: facts
    measure_columns:
    - Active Employees
    - Employees With Punches
    - Employees Without Punches
    - Coverage Pct
- id: bp-punch-pair-summary
  intent: Matched punch-pair counts, distinct employees, observed days, paid hours and pair earning amount
    by company, employee, allocated department, day, month or hours type. Did this employee have punches
    in the period? Paid hours use earn_hours, not elapsed clock duration. Single-argument distinct counts.
    Required half-open punch-date period and resolved table_source prevent accidental cross-source double
    counting. FINAL deduplicates storage versions, not overlapping real-world events. Department means
    recorded labor-allocation department code, not current home department. No scheduled shift, tardiness
    or overtime policy is inferred. Observed first/last dates do not prove completeness; missing days/months
    are not zero-filled.
  slots_summary: group_by, period, source, employee, department, hours_type, pay_class, in_type, out_type,
    order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.punch_pair.department_code
  - dbpcm_warehouse.punch_pair.earn_amount
  - dbpcm_warehouse.punch_pair.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.hours_type
  - dbpcm_warehouse.punch_pair.in_punch_type
  - dbpcm_warehouse.punch_pair.out_punch_type
  - dbpcm_warehouse.punch_pair.pay_class_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - hours_type
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.punch_pair.table_source
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.department_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: hours_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.hours_type
    optional_pattern: 'TRUE'
    multiple: true
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.pay_class_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: in_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.in_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - ID
    - IL
    - IB
    - IX
    multiple: true
  - name: out_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.out_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - OD
    - OL
    - OB
    - OX
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Pair Count
    - Employee Count
    - Observed Days
    - Paid Hours
    - Pair Earning Amount
    - First Observed Date
    - Last Observed Date
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'employee'\n    THEN employee_code\n    WHEN {group_by}\
    \ = 'department'\n    THEN department_code\n    WHEN {group_by} = 'day'\n    THEN toString(punch_date)\n\
    \    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date), 1, 7)\n    WHEN {group_by}\
    \ = 'hours_type'\n    THEN hours_type\n    ELSE 'Company'\n  END AS \"Group\",\n  count(*) AS \"Pair\
    \ Count\",\n  count(DISTINCT employee_code) AS \"Employee Count\",\n  count(DISTINCT punch_date) AS\
    \ \"Observed Days\",\n  sum(earn_hours) AS \"Paid Hours\",\n  sum(earn_amount) AS \"Pair Earning Amount\"\
    ,\n  min(punch_date) AS \"First Observed Date\",\n  max(punch_date) AS \"Last Observed Date\"\nFROM\
    \ dbpcm_warehouse.punch_pair\nWHERE\n  punch_date >= toDate({period_start})\n  AND punch_date < toDate({period_end})\n\
    \  AND table_source IN ({source})\n  AND employee_code = {employee}\n  AND department_code IN ({department})\n\
    \  AND hours_type IN ({hours_type})\n  AND pay_class_code IN ({pay_class})\n  AND in_punch_type IN\
    \ ({in_type})\n  AND out_punch_type IN ({out_type})\nGROUP BY\n  CASE\n    WHEN {group_by} = 'employee'\n\
    \    THEN employee_code\n    WHEN {group_by} = 'department'\n    THEN department_code\n    WHEN {group_by}\
    \ = 'day'\n    THEN toString(punch_date)\n    WHEN {group_by} = 'month'\n    THEN SUBSTRING(toString(punch_date),\
    \ 1, 7)\n    WHEN {group_by} = 'hours_type'\n    THEN hours_type\n    ELSE 'Company'\n  END\nORDER\
    \ BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Pair Count:
      kind: integer
    Employee Count:
      kind: integer
    Observed Days:
      kind: integer
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
    Pair Earning Amount:
      kind: currency
      currency: USD
    First Observed Date:
      kind: date
    Last Observed Date:
      kind: date
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Pair Count
    by_group_by:
      company: figure
      day: line
      month: line
- id: bp-punch-plus-timeoff-overlap
  intent: Employees with punch pair entries on days that also have approved time-off requests, a same-day
    double-dip audit with configurable overlap-day threshold
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH punch_days AS (\n  SELECT DISTINCT\n    employee_code,\n    punch_date\n  FROM dbpcm_warehouse.punch_pair\n\
    \  WHERE\n    (\n      punch_date >= {window_start} AND punch_date < {window_end}\n    )\n), overlap\
    \ AS (\n  SELECT\n    pd.employee_code,\n    pd.punch_date AS overlap_date\n  FROM punch_days AS pd\n\
    \  JOIN dbpcm_warehouse.time_off_request AS tor\n    ON tor.employee_code = pd.employee_code\n  WHERE\n\
    \    tor.status = 'Approved'\n    AND tor.event_type IN ({event_type})\n    AND toDate32(tor.request_date)\
    \ = pd.punch_date\n)\nSELECT\n  e.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee\
    \ Name\",\n  e.department_name AS \"Department\",\n  count(DISTINCT o.overlap_date) AS \"Overlap Days\"\
    \nFROM overlap AS o\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = o.employee_code\n\
    GROUP BY\n  e.employee_code,\n  e.employee_name,\n  e.department_name\nHAVING\n  count(DISTINCT o.overlap_date)\
    \ >= {threshold}\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: threshold
    type: positive_integer
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: event_type
    type: enum
    required: false
    enum_values:
    - Time Off Request
    - Payout Request
    default:
    - Time Off Request
    description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only
      when payouts are explicitly requested.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Overlap Days DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Overlap Days
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Department
    - Overlap Days
  slots_summary: window, threshold, max_rows, event_type, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Overlap Days:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Employee Name
    measure_columns:
    - Overlap Days
- id: bp-punch-source-audit
  intent: Monthly count of punch pairs by ingestion source ARCHIVED versus FREEZE, showing pair counts
    per source per month
  status: validated

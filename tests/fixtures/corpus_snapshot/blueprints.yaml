  catalog_sha: ''
  sql_template: "SELECT employment_type AS \"Employment Type\",\n       dol_status_description AS \"DOL\
    \ Status\",\n       count(DISTINCT employee_code) AS \"Headcount\",\n       round(100 * count(DISTINCT\
    \ employee_code) / sum(count(DISTINCT employee_code)) OVER (), 2) AS \"Share Pct\"\nFROM dbpcm_warehouse.employee\n\
    WHERE employee_status = 'Active'\n  AND department_name = {department}\nGROUP BY employment_type,\n\
    \         dol_status_description\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN\
    \ \"Headcount\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN\

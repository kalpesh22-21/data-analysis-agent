- id: bp-workforce-kpi-bundle
  intent: Single-row executive KPI bundle with current-state metrics plus hires, terms and turnover for
    one window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  count(DISTINCT CASE WHEN employee_status = 'Active' THEN employee_code ELSE\
    \ NULL END) AS \"Active Headcount\",\n  round(\n    100 * count(\n      DISTINCT CASE\n        WHEN\
    \ employee_status = 'Active' AND employment_type = 'W2'\n        THEN employee_code\n        ELSE\
    \ NULL\n      END\n    ) / nullIf(\n      count(DISTINCT CASE WHEN employee_status = 'Active' THEN\
    \ employee_code ELSE NULL END),\n      0\n    ),\n    2\n  ) AS \"W2 Share Pct\",\n  round(\n    (\n\
    \      quantileExactLow(0.5)(CASE\n        WHEN employee_status = 'Active' AND pay_type = 'Salary'\
    \ AND annual_salary > 0\n        THEN toFloat64(annual_salary)\n        ELSE NULL\n      END) + quantileExactHigh(0.5)(CASE\n\
    \        WHEN employee_status = 'Active' AND pay_type = 'Salary' AND annual_salary > 0\n        THEN\
    \ toFloat64(annual_salary)\n        ELSE NULL\n      END)\n    ) / 2,\n    2\n  ) AS \"Median Annual\
    \ Salary\",\n  round(\n    avg(\n      CASE\n        WHEN employee_status = 'Active'\n        THEN\
    \ DATE_DIFF(DAY, hire_date, now()) / 365.25\n        ELSE NULL\n      END\n    ),\n    1\n  ) AS \"\
    Avg Tenure Years\",\n  round(\n    100 * count(\n      DISTINCT CASE\n        WHEN employee_status\
    \ = 'Active' AND dol_status_description = 'Full Time'\n        THEN employee_code\n        ELSE NULL\n\
    \      END\n    ) / nullIf(\n      count(DISTINCT CASE WHEN employee_status = 'Active' THEN employee_code\
    \ ELSE NULL END),\n      0\n    ),\n    2\n  ) AS \"Pct Full Time\",\n  round(\n    100 * count(\n\
    \      DISTINCT CASE\n        WHEN employee_status = 'Active' AND direct_deposit = 1\n        THEN\
    \ employee_code\n        ELSE NULL\n      END\n    ) / nullIf(\n      count(DISTINCT CASE WHEN employee_status\
    \ = 'Active' THEN employee_code ELSE NULL END),\n      0\n    ),\n    2\n  ) AS \"Pct Direct Deposit\"\
    ,\n  count(\n    DISTINCT CASE\n      WHEN (\n        employee_status <> 'Not Hired' OR employee_status\
    \ IS NULL\n      )\n      AND hire_date >= {kpi_window_start}\n      AND hire_date < {kpi_window_end}\n\
    \      THEN employee_code\n      ELSE NULL\n    END\n  ) AS \"Hires In Window\",\n  count(\n    DISTINCT\
    \ CASE\n      WHEN employee_status = 'Terminated'\n      AND NOT (\n        termination_date IS NULL\n\
    \      )\n      AND toDate32(termination_date) > toDate32('1900-01-01')\n      AND (\n        most_recent_hire_date\
    \ IS NULL OR most_recent_hire_date < termination_date\n      )\n      AND termination_date >= {kpi_window_start}\n\
    \      AND termination_date < {kpi_window_end}\n      THEN employee_code\n      ELSE NULL\n    END\n\
    \  ) AS \"Terms In Window\",\n  round(\n    count(\n      DISTINCT CASE\n        WHEN employee_status\
    \ = 'Terminated'\n        AND NOT (\n          termination_date IS NULL\n        )\n        AND toDate32(termination_date)\
    \ > toDate32('1900-01-01')\n        AND (\n          most_recent_hire_date IS NULL OR most_recent_hire_date\
    \ < termination_date\n        )\n        AND termination_date >= {kpi_window_start}\n        AND termination_date\
    \ < {kpi_window_end}\n        THEN employee_code\n        ELSE NULL\n      END\n    ) / nullIf(\n\
    \      count(DISTINCT CASE WHEN employee_status = 'Active' THEN employee_code ELSE NULL END),\n  \
    \    0\n    ),\n    4\n  ) AS \"Turnover Rate In Window\",\n  count(DISTINCT CASE WHEN employee_status\
    \ = 'On Leave' THEN employee_code ELSE NULL END) AS \"On Leave\",\n  count(\n    DISTINCT CASE\n \
    \     WHEN employee_status = 'Active'\n      AND (\n        primary_emergency_contact_phone IS NULL\
    \ OR primary_emergency_contact_phone = ''\n      )\n      THEN employee_code\n      ELSE NULL\n  \
    \  END\n  ) AS \"Missing Emergency Contacts\"\nFROM dbpcm_warehouse.employee\nORDER BY {order_by}\n"
  slots:
  - name: kpi_window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Active Headcount ASC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Active Headcount
      direction: ASC
    allowed_columns:
    - Active Headcount
    - W2 Share Pct
    - Median Annual Salary
    - Avg Tenure Years
    - Pct Full Time
    - Pct Direct Deposit
    - Hires In Window
    - Terms In Window
    - Turnover Rate In Window
    - On Leave
    - Missing Emergency Contacts
  slots_summary: kpi_window, order_by
  uses:
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employment_type
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.dol_status_description
  - dbpcm_warehouse.employee.direct_deposit
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.primary_emergency_contact_phone

    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: employee, period_a, period_b, order_direction
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.type_code_description
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  column_formats:
    Pay Category:
      kind: text
    Pay Code:
      kind: identifier
    Description:
      kind: text
    Recent Amount:
      kind: currency
      currency: USD
      precision: 2
    Recent Hours:
      kind: number
      unit: hours
      precision: 2
    Prior Amount:
      kind: currency
      currency: USD
      precision: 2
    Prior Hours:
      kind: number
      unit: hours
      precision: 2
    Amount Change:
      kind: currency
      currency: USD
      precision: 2
    Hours Change:
      kind: number
      unit: hours
      precision: 2
- id: bp-compensation-ranking
  intent: Top N highest-paid employees separately within Salary and Hourly pay types. Salary uses recorded
    annual salary; Hourly uses hourly_salary * 2080 estimated annual compensation (40 hours/week, 52 weeks/year,
    excludes overtime). This is current compensation, not actual payroll earnings. Defaults to Active
    + On Leave; top_n applies to each pay type.
  slots_summary: top_n, employee_status, department, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  result_grain:
  - Pay Type
  - Rank
  sql_template: "WITH compensation AS\n  (SELECT e.employee_code,\n          e.employee_name,\n      \
    \    e.department_name,\n          e.employee_pay_type,\n          e.hourly_salary,\n          CASE\n\
    \              WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n              WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n              ELSE NULL\n          END AS annual_compensation\n\
    \   FROM dbpcm_warehouse.employee e\n   WHERE (e.employee_status = {employee_status}\n          OR\
    \ {employee_status} = 'All')\n     AND e.department_name = {department}),\n     ranked AS\n  (SELECT\
    \ employee_code,\n          employee_name,\n          department_name,\n          employee_pay_type,\n\
    \          hourly_salary,\n          annual_compensation,\n          row_number() OVER (PARTITION\
    \ BY employee_pay_type\n                             ORDER BY CASE\n                             \
    \             WHEN {order_direction} = 'DESC' THEN annual_compensation\n                         \
    \             END DESC, CASE\n                                                    WHEN {order_direction}\
    \ = 'ASC' THEN annual_compensation\n                                                END ASC, employee_code)\
    \ AS compensation_rank\n   FROM compensation\n   WHERE annual_compensation IS NOT NULL)\nSELECT employee_pay_type\
    \ AS `Pay Type`,\n       compensation_rank AS `Rank`,\n       employee_code AS `Employee Code`,\n\
    \       employee_name AS `Employee Name`,\n       department_name AS `Department`,\n       annual_compensation\
    \ AS `Annual Compensation`,\n       hourly_salary AS `Hourly Rate`\nFROM ranked\nWHERE compensation_rank\
    \ <= {top_n}\nORDER BY employee_pay_type,\n         compensation_rank\n"
  uses_rules:
  - default_employee_population
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Rank:
      kind: integer
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
- id: bp-consecutive-day-streaks
  intent: Employees with N or more consecutive calendar days containing at least one punch pair, showing
    streak length and date range
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH distinct_days AS\n  (SELECT DISTINCT employee_code,\n                   toDate(punch_date)\
    \ AS punch_date\n   FROM dbpcm_warehouse.punch_pair\n   WHERE punch_date BETWEEN {window_start} AND\
    \ {window_end}),\n     streak_groups AS\n  (SELECT employee_code,\n          punch_date,\n       \
    \   dateDiff('day', toDate('1970-01-01'), punch_date) - row_number() OVER (PARTITION BY employee_code\n\
    \                                                                                 ORDER BY punch_date)\
    \ AS grp\n   FROM distinct_days)\nSELECT sg.employee_code AS \"Employee Code\",\n       any(e.employee_name)\
    \ AS \"Employee Name\",\n       min(sg.punch_date) AS \"Streak Start\",\n       max(sg.punch_date)\
    \ AS \"Streak End\",\n       count() AS \"Streak Length\"\nFROM streak_groups sg\nLEFT JOIN dbpcm_warehouse.employee\
    \ e ON e.employee_code = sg.employee_code\nGROUP BY sg.employee_code,\n         sg.grp\nHAVING count()\
    \ >= {streak}\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Streak Length\"\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Streak Length\"\
    \n                   END ASC, \"Employee Code\"\nLIMIT {max_rows}\n"
  slots:
  - name: streak
    type: positive_integer
    required: true
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: streak, window, max_rows, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code

      DESC; no duplicate columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Headcount
      direction: DESC
    allowed_columns:
    - Gender
    - Marital Status
    - Age Band
    - EEO-1 Category
    - Leadership Cohort
    - Headcount
    - Share Pct
  slots_summary: department, order_by
  uses:

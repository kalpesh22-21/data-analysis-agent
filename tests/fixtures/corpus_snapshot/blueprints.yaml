- id: bp-effective-mileage-rate
  intent: Effective mileage rate by expense rule for a payment date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT expense_rule_description AS \"Expense Rule\",\n       round(toFloat64(SUM(amount_approved)),\

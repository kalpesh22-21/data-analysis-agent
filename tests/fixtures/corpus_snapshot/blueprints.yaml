      direction: ASC
    allowed_columns:
    - Department
    - Active Headcount
    - Avg Salary (Active)
    - Avg Tenure Years (Active)
    - Pct Female (Active)
    - Pct Direct Deposit (Active)
    - On Leave
    - On Leave Over 1 Year No End

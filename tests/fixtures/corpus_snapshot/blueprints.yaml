- id: bp-labor-allocation-resolution
  intent: Resolve labor allocation slots 1-3 to codes and descriptions for active employees
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.employee_code AS \"Employee Code\",\n       e.department_name AS \"Department\"\
    ,\n       la1.code AS \"Allocation 1 Code\",\n       la1.description AS \"Allocation 1 Description\"\
    ,\n       la2.code AS \"Allocation 2 Code\",\n       la2.description AS \"Allocation 2 Description\"\
    ,\n       la3.code AS \"Allocation 3 Code\",\n       la3.description AS \"Allocation 3 Description\"\
    ,\n       toUInt8((e.labor_allocation_key_1 IS NULL\n                OR e.labor_allocation_key_1 =\
    \ '')\n               OR (e.labor_allocation_key_2 IS NULL\n                   OR e.labor_allocation_key_2\
    \ = '')\n               OR (e.labor_allocation_key_3 IS NULL\n                   OR e.labor_allocation_key_3\
    \ = '')) AS \"Unallocated\"\nFROM dbpcm_warehouse.employee AS e\nLEFT JOIN dbpcm_warehouse.labor_allocation\
    \ AS la1 ON e.labor_allocation_key_1 = la1.join_key\nLEFT JOIN dbpcm_warehouse.labor_allocation AS\
    \ la2 ON e.labor_allocation_key_2 = la2.join_key\nLEFT JOIN dbpcm_warehouse.labor_allocation AS la3\
    \ ON e.labor_allocation_key_3 = la3.join_key\nWHERE e.employee_status = 'Active'\n  AND e.department_name\
    \ = {department}\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN e.employee_code\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN e.employee_code\n\
    \                   END ASC\nLIMIT {max_rows}\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: department, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.labor_allocation_key_1
  - dbpcm_warehouse.employee.labor_allocation_key_2
  - dbpcm_warehouse.employee.labor_allocation_key_3
  - dbpcm_warehouse.labor_allocation.join_key
  - dbpcm_warehouse.labor_allocation.code
  - dbpcm_warehouse.labor_allocation.description
  column_formats:
    Employee Code:
      kind: identifier
    Department:
      kind: text
    Allocation 1 Code:
      kind: identifier
    Allocation 1 Description:
      kind: text
    Allocation 2 Code:
      kind: identifier
    Allocation 2 Description:
      kind: text
    Allocation 3 Code:
      kind: identifier
    Allocation 3 Description:
      kind: text
    Unallocated:
      kind: integer
- id: bp-labor-allocation-rollup
  intent: Active headcount and average salary grouped by a chosen labor allocation slot value, ranked
    by headcount
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT la.code AS \"Allocation Code\",\n       la.description AS \"Allocation Description\"\
    ,\n       count(DISTINCT e.employee_code) AS \"Active Headcount\",\n       round(avgIf(toFloat64(e.annual_salary),\
    \ e.annual_salary IS NOT NULL\n                   AND toFloat64(e.annual_salary) > 0), 2) AS \"Avg\
    \ Salary\"\nFROM\n  (SELECT employee_code,\n          employee_status,\n          annual_salary,\n\
    \          CASE {slot}\n              WHEN 1 THEN labor_allocation_key_1\n              WHEN 2 THEN\
    \ labor_allocation_key_2\n              WHEN 3 THEN labor_allocation_key_3\n              WHEN 4 THEN\
    \ labor_allocation_key_4\n              WHEN 5 THEN labor_allocation_key_5\n              WHEN 6 THEN\
    \ labor_allocation_key_6\n              WHEN 7 THEN labor_allocation_key_7\n              WHEN 8 THEN\
    \ labor_allocation_key_8\n              WHEN 9 THEN labor_allocation_key_9\n              WHEN 10\
    \ THEN labor_allocation_key_10\n              WHEN 11 THEN labor_allocation_key_11\n             \
    \ WHEN 12 THEN labor_allocation_key_12\n              WHEN 13 THEN labor_allocation_key_13\n     \
    \         WHEN 14 THEN labor_allocation_key_14\n              WHEN 15 THEN labor_allocation_key_15\n\
    \              WHEN 16 THEN labor_allocation_key_16\n              WHEN 17 THEN labor_allocation_key_17\n\
    \              WHEN 18 THEN labor_allocation_key_18\n              WHEN 19 THEN labor_allocation_key_19\n\
    \              ELSE labor_allocation_key_20\n          END AS selected_key\n   FROM dbpcm_warehouse.employee)\
    \ AS e\nLEFT JOIN dbpcm_warehouse.labor_allocation AS la ON la.join_key = e.selected_key\nWHERE e.employee_status\
    \ = 'Active'\n  AND e.selected_key IS NOT NULL\n  AND e.selected_key != ''\nGROUP BY la.code,\n  \
    \       la.description\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Active\
    \ Headcount\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN\
    \ \"Active Headcount\"\n                   END ASC, \"Allocation Code\"\nLIMIT {top_n}\n"
  slots:
  - name: slot
    type: positive_integer
    required: true
  - name: top_n
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: slot, top_n, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.labor_allocation_key_1

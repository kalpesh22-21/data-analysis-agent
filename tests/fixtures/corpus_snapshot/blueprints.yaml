- id: bp-change-actor-mix
  intent: Monthly counts of employee master-data changes grouped by the actor user type, distinguishing
    client administrators from employee users and regular users
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "-- Output aliases are Title-Case display names; consumers keying on column names\n--\
    \ must use the quoted aliases.\n\nSELECT formatDateTime(toStartOfMonth(change_time_added), '%Y-%m')\
    \ AS \"Month\",\n       change_by_usertype AS \"User Type\",\n       count() AS \"Change Events\"\n\
    FROM dbpcm_warehouse.employee_change\nWHERE change_time_added >= addMonths(today(), -{win})\nGROUP\
    \ BY \"Month\",\n         change_by_usertype\nORDER BY CASE\n             WHEN {order_direction} =\
    \ 'DESC' THEN \"Change Events\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Change Events\"\n                   END ASC, \"Month\",\n                       \
    \     \"User Type\"\nLIMIT {max_rows}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee_change.change_by_usertype
  - dbpcm_warehouse.employee_change.change_time_added
  column_formats:
    Month:
      kind: text
    User Type:
      kind: text
    Change Events:
      kind: integer
- id: bp-change-velocity-spikes
  intent: Days with unusually high employee master-data change volume within a trailing window, flagged
    when daily counts exceed one standard deviation above the mean
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "-- Output aliases are Title-Case display names; consumers keying on column names\n--\
    \ must use the quoted aliases.\nWITH daily_counts AS\n  (SELECT toDate(change_time_added) AS day,\n\
    \          count() AS cnt\n   FROM dbpcm_warehouse.employee_change\n   WHERE change_time_added >=\
    \ addMonths(today(), -{win})\n   GROUP BY toDate(change_time_added)),\n     stats AS\n  (SELECT avg(cnt)\
    \ AS avg_cnt,\n          stddevPop(cnt) AS sd_cnt\n   FROM daily_counts)\nSELECT toString(d.day) AS\
    \ \"Day\",\n       d.cnt AS \"Change Events\",\n       round(s.avg_cnt, 2) AS \"Daily Mean\",\n  \
    \     round(s.sd_cnt, 2) AS \"Daily Std Dev\"\nFROM daily_counts AS d\nCROSS JOIN stats AS s\nWHERE\
    \ d.cnt > s.avg_cnt + s.sd_cnt\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN d.cnt\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN d.cnt\n     \
    \              END ASC, d.day\nLIMIT {max_rows}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee_change.change_time_added
  column_formats:
    Day:
      kind: date
    Change Events:
      kind: integer
    Daily Mean:
      kind: number
    Daily Std Dev:
      kind: number
- id: bp-clock-time-profile
  intent: Time-of-day clock-in and clock-out distribution per employee home department using punch_pair
    event timestamps, showing typical shift start and end profiles
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.department_name AS \"Department\",\n       round((quantileExactLow(0.5)(toHour(pp.in_punch_time)\
    \ * 60 + toMinute(pp.in_punch_time)) + quantileExactHigh(0.5)(toHour(pp.in_punch_time) * 60 + toMinute(pp.in_punch_time)))\
    \ / 2, 0) AS \"Median Clock-In Min\",\n       round((quantileExactLow(0.5)(toHour(pp.out_punch_time)\
    \ * 60 + toMinute(pp.out_punch_time)) + quantileExactHigh(0.5)(toHour(pp.out_punch_time) * 60 + toMinute(pp.out_punch_time)))\
    \ / 2, 0) AS \"Median Clock-Out Min\",\n       count() AS \"Pair Count\"\nFROM\n  (SELECT employee_code,\n\
    \          punch_date,\n          in_punch_time,\n          out_punch_time\n   FROM dbpcm_warehouse.punch_pair)\
    \ AS pp\nJOIN dbpcm_warehouse.employee e ON e.employee_code = pp.employee_code\nWHERE pp.punch_date\
    \ BETWEEN {window_start} AND {window_end}\n  AND pp.in_punch_time IS NOT NULL\n  AND toDate32(pp.in_punch_time)\
    \ > toDate32('1900-01-01')\n  AND pp.out_punch_time IS NOT NULL\n  AND toDate32(pp.out_punch_time)\
    \ > toDate32('1900-01-01')\nGROUP BY e.department_name\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Median Clock-In Min\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Median Clock-In Min\"\n                   END ASC\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, max_rows, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Median Clock-In Min:
      kind: number
      unit: minutes after midnight
      precision: 2
    Median Clock-Out Min:
      kind: number
      unit: minutes after midnight
      precision: 2
    Pair Count:
      kind: integer
- id: bp-commission-by-employee
  intent: Commission earnings per employee for a date period, ranked by total dollars, resolved via the
    Commission earning category
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT te.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\
    \ Name\",\n       round(SUM(te.earn_amount), 2) AS \"Total Commission\"\nFROM\n  (SELECT employee_code,\n\
    \          punch_date,\n          earn_amount,\n          earn_code\n   FROM dbpcm_warehouse.total_earning)\
    \ AS te\nJOIN\n  (SELECT earn_code,\n          category_name\n   FROM dbpcm_warehouse.earning_category\
    \ FINAL) AS ec ON ec.earn_code = te.earn_code\nLEFT JOIN dbpcm_warehouse.employee AS e ON e.employee_code\
    \ = te.employee_code\nWHERE ec.category_name = 'Commission'\n  AND te.punch_date BETWEEN {period_start}\
    \ AND {period_end}\nGROUP BY te.employee_code\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Total Commission\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Total Commission\"\n                   END ASC, \"Employee Code\"\nLIMIT {top_n}\n"
  slots:

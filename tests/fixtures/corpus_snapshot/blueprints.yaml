- id: bp-top-timeoff-users
  intent: Top-N employees by approved time-off hours in a window, joined with their current accrual balance
    totals
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  req.\"Employee Code\",\n  req.\"Employee Name\",\n  req.\"Department\",\n \
    \ req.\"Approved Hours\",\n  round(COALESCE(bal.balance_total, 0), 2) AS \"Current Balance Hours\"\
    \nFROM (\n  SELECT\n    t.employee_code AS \"Employee Code\",\n    any(e.employee_name) AS \"Employee\
    \ Name\",\n    any(e.department_name) AS \"Department\",\n    round(SUM(t.hours), 2) AS \"Approved\
    \ Hours\"\n  FROM dbpcm_warehouse.time_off_request AS t\n  JOIN dbpcm_warehouse.employee AS e\n  \
    \  ON e.employee_code = t.employee_code\n  WHERE\n    t.status = 'Approved'\n    AND t.event_type\
    \ IN ({event_type})\n    AND NOT (\n      t.hours IS NULL\n    )\n    AND (\n      toDate32(t.request_date)\
    \ >= {window_start}\n      AND toDate32(t.request_date) < {window_end}\n    )\n  GROUP BY\n    t.employee_code\n\
    ) AS req\nLEFT JOIN (\n  SELECT\n    employee_code,\n    round(SUM(beginning_balance + accrued_amount\
    \ - taken_amount), 2) AS balance_total\n  FROM dbpcm_warehouse.time_off_balance\n  GROUP BY\n    employee_code\n\
    ) AS bal\n  ON bal.employee_code = req.\"Employee Code\"\nORDER BY\n  \"Approved Hours\" DESC\nLIMIT\
    \ {top_n}\n"
  slots:
  - name: top_n
    type: relative_window
    required: true
    description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that
      ranking. It does not accept order_by or order_direction. A different selection or display order
      requires a separate query.
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.

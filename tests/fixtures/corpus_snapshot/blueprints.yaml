  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(addDays(punch_date, 1 - toDayOfMonth(punch_date)), '%Y-%m')\
    \ AS \"Month\",\n  table_source AS \"Table Source\",\n  count() AS \"Pair Count\"\nFROM (\n  SELECT\n\
    \    punch_date,\n    table_source\n  FROM dbpcm_warehouse.punch_pair\n)\nWHERE\n  punch_date >= today()\
    \ - toIntervalMonth({win})\nGROUP BY\n  \"Month\",\n  table_source\nORDER BY {order_by}\n"

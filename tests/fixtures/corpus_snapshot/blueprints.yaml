  catalog_sha: ''
  sql_template: "SELECT\n  p.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  e.department_name AS \"Department\",\n  p.pay_period_end_date AS \"Pay Period End\",\n  round(SUMIf(p.amount,\
    \ p.register_type = 'EARN'), 2) AS \"Gross Earnings\",\n  round(SUMIf(p.amount, p.register_type =\
    \ 'NETPAYDIST'), 2) AS \"Net Pay\"\nFROM dbpcm_warehouse.payroll AS p\nLEFT JOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = p.employee_code\nWHERE\n  (\n    p.pay_period_end_date >= {window_start}\n\
    \    AND p.pay_period_end_date < {window_end}\n  )\nGROUP BY\n  p.employee_code,\n  e.employee_name,\n\
    \  e.department_name,\n  p.pay_period_end_date\nHAVING\n  \"Gross Earnings\" < 0 OR \"Net Pay\" <\
    \ 0\nORDER BY {order_by}\nLIMIT {top_n}\n\n"

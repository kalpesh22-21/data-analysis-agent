- id: bp-pairs-per-day-distribution
  intent: Distribution of punch pair counts per employee per day showing how many days had 1 pair, 2 pairs,
    or 3 or more pairs
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT ppd.ppd AS \"Pairs Per Day\",\n       count() AS \"Employee-Days\"\nFROM\n  (SELECT\
    \ employee_code,\n          punch_date,\n          CASE\n              WHEN count() = 1 THEN '1 pair'\n\
    \              WHEN count() = 2 THEN '2 pairs'\n              ELSE '3+ pairs'\n          END AS ppd\n\
    \   FROM\n     (SELECT employee_code,\n             punch_date\n      FROM dbpcm_warehouse.punch_pair)\n\
    \   WHERE punch_date BETWEEN {window_start} AND {window_end}\n   GROUP BY employee_code,\n       \
    \     punch_date) AS ppd\nGROUP BY ppd\nORDER BY CASE\n             WHEN {order_direction} = 'DESC'\
    \ THEN CASE \"Pairs Per Day\"\n                                                      WHEN '1 pair'\
    \ THEN 1\n                                                      WHEN '2 pairs' THEN 2\n          \
    \                                            ELSE 3\n                                            \
    \      END\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN CASE\
    \ \"Pairs Per Day\"\n                                                               WHEN '1 pair'\
    \ THEN 1\n                                                               WHEN '2 pairs' THEN 2\n \
    \                                                              ELSE 3\n                          \
    \                                 END\n                   END ASC\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: window, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  column_formats:
    Pairs Per Day:
      kind: integer
    Employee-Days:
      kind: integer
- id: bp-pay-timing-exceptions
  intent: Employees paid after termination or active employees not paid within N days
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       department_name AS \"Department\"\
    ,\n       employee_status AS \"Status\",\n       termination_date AS \"Termination Date\",\n     \
    \  last_check_date AS \"Last Check Date\",\n       multiIf(employee_status = 'Terminated', 'Paid After\
    \ Termination', 'Active Not Paid') AS \"Exception Type\"\nFROM dbpcm_warehouse.employee\nWHERE department_name\
    \ = {department}\n  AND ((employee_status = 'Terminated'\n        AND (most_recent_hire_date IS NULL\n\
    \             OR most_recent_hire_date < termination_date)\n        AND last_check_date IS NOT NULL\n\
    \        AND toDate32(last_check_date) > toDate32('1900-01-01')\n        AND termination_date IS NOT\
    \ NULL\n        AND toDate32(termination_date) > toDate32('1900-01-01')\n        AND last_check_date\
    \ > termination_date)\n       OR (employee_status = 'Active'\n           AND (NOT (last_check_date\
    \ IS NOT NULL\n                     AND toDate32(last_check_date) > toDate32('1900-01-01'))\n    \
    \            OR last_check_date < now() - INTERVAL {days_since_pay} DAY)))\nORDER BY CASE\n      \
    \       WHEN {order_direction} = 'DESC' THEN \"Exception Type\"\n         END DESC, CASE\n       \
    \                WHEN {order_direction} = 'ASC' THEN \"Exception Type\"\n                   END ASC,\
    \ employee_code\nLIMIT {max_rows}\n"
  slots:
  - name: days_since_pay
    type: positive_integer
    required: true
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: days_since_pay, department, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.last_check_date
  column_formats:
    Employee Code:
      kind: identifier
    Department:
      kind: text
    Status:
      kind: text
    Termination Date:
      kind: date
    Last Check Date:
      kind: datetime
    Exception Type:
      kind: text

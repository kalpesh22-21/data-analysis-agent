- id: bp-payroll-setup-gap-scorecard
  intent: Missing-payroll-setup flags and gap count per active employee
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       employee_name AS \"Name\",\n     \
    \  department_name AS \"Department\",\n       toUInt8(badge_number IS NULL\n               OR badge_number\
    \ = '') AS \"No Badge\",\n       toUInt8(employee_gl_code IS NULL\n               OR employee_gl_code\
    \ = '') AS \"No GL Code\",\n       toUInt8(paycode_profile_code IS NULL\n               OR paycode_profile_code\
    \ = '') AS \"No Paycode Profile\",\n       toUInt8(earning_profile IS NULL\n               OR earning_profile\
    \ = '') AS \"No Earning Profile\",\n       toUInt8(pay_class IS NULL\n               OR pay_class\
    \ = '') AS \"No Pay Class\",\n       toUInt8(pay_frequency IS NULL\n               OR pay_frequency\
    \ = '') AS \"No Pay Frequency\",\n       toUInt8(schedule_group IS NULL\n               OR schedule_group\
    \ = '') AS \"No Schedule Group\",\n       toUInt8((badge_number IS NULL\n                OR badge_number\
    \ = '')) + toUInt8((employee_gl_code IS NULL\n                                                  OR\
    \ employee_gl_code = '')) + toUInt8((paycode_profile_code IS NULL\n                              \
    \                                                          OR paycode_profile_code = '')) + toUInt8((earning_profile\
    \ IS NULL\n                                                                                      \
    \                                            OR earning_profile = '')) + toUInt8((pay_class IS NULL\n\
    \                                                                                                \
    \                                                                       OR pay_class = '')) + toUInt8((pay_frequency\
    \ IS NULL\n                                                                                      \
    \                                                                                                \
    \                OR pay_frequency = '')) + toUInt8((schedule_group IS NULL\n                     \
    \                                                                                                \
    \                                                                                                \
    \                    OR schedule_group = '')) AS \"Gap Count\"\nFROM dbpcm_warehouse.employee\nWHERE\
    \ employee_status = 'Active'\n  AND department_name = {department}\n  AND (toUInt8((badge_number IS\
    \ NULL\n                OR badge_number = '')) + toUInt8((employee_gl_code IS NULL\n             \
    \                                     OR employee_gl_code = '')) + toUInt8((paycode_profile_code IS\
    \ NULL\n                                                                                        OR\
    \ paycode_profile_code = '')) + toUInt8((earning_profile IS NULL\n                               \
    \                                                                                                \
    \   OR earning_profile = '')) + toUInt8((pay_class IS NULL\n                                     \
    \                                                                                                \
    \                                  OR pay_class = '')) + toUInt8((pay_frequency IS NULL\n        \
    \                                                                                                \
    \                                                                                              OR\
    \ pay_frequency = '')) + toUInt8((schedule_group IS NULL\n                                       \
    \                                                                                                \
    \                                                                                                \
    \  OR schedule_group = ''))) > 0\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN\
    \ \"Gap Count\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN\
    \ \"Gap Count\"\n                   END ASC, employee_code\nLIMIT {max_rows}\n"
  slots:

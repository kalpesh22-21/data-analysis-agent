- id: bp-timeoff-lead-time
  intent: Median days from submission date to requested leave date by leave type for approved requests
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  t.earn_description AS \"Leave Type\",\n  t.earn_code AS \"Earn Code\",\n  round(\n\
    \    (\n      quantileExactLow(0.5)(t.lead_days) + quantileExactHigh(0.5)(t.lead_days)\n    ) / 2,\n\
    \    1\n  ) AS \"Median Lead Days\",\n  COUNT(*) AS \"Request Days\"\nFROM (\n  SELECT\n    earn_description,\n\
    \    earn_code,\n    DATE_DIFF(DAY, date_added, request_date) AS lead_days\n  FROM dbpcm_warehouse.time_off_request\n\
    \  WHERE\n    status = 'Approved'\n    AND event_type IN ({event_type})\n    AND NOT (\n      request_date\
    \ IS NULL\n    )\n    AND toDate32(request_date) > toDate32('1900-01-01')\n    AND (\n      toDate32(request_date)\
    \ >= {window_start}\n      AND toDate32(request_date) < {window_end}\n    )\n) AS t\nGROUP BY\n  t.earn_description,\n\
    \  t.earn_code\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per

    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Register Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Register Type
      direction: ASC
    allowed_columns:
    - Register Type
    - Type Code
    - Type Code Description
    - Amount Period A
    - Amount Period B
    - Amount Change
    - Hours Period A
    - Hours Period B
  result_grain:
  - Register Type
  - Type Code
  composes:
  - order: 0
    output:
      detail_a: table
    ref:
      blueprint: bp-employee-check-detail-for-period
      slots:
        employee: employee
        period: period_a
  - order: 1
    output:
      detail_b: table
    ref:
      blueprint: bp-employee-check-detail-for-period
      slots:
        employee: employee
        period: period_b
  - order: 2
    feeds_from:
    - 0
    - 1
    consumes:
      detail_a: $0
      detail_b: $1
    output: {}
    sql_template: "SELECT\n  coalesce(a.\"Register Type\", b.\"Register Type\") AS \"Register Type\",\n\
      \  coalesce(a.\"Type Code\", b.\"Type Code\") AS \"Type Code\",\n  coalesce(a.\"Type Code Description\"\
      , b.\"Type Code Description\") AS \"Type Code Description\",\n  coalesce(a.\"Amount\", 0) AS \"\
      Amount Period A\",\n  coalesce(b.\"Amount\", 0) AS \"Amount Period B\",\n  coalesce(b.\"Amount\"\
      , 0) - coalesce(a.\"Amount\", 0) AS \"Amount Change\",\n  coalesce(a.\"Hours\", 0) AS \"Hours Period\
      \ A\",\n  coalesce(b.\"Hours\", 0) AS \"Hours Period B\"\nFROM scratch.detail_a AS a\nFULL OUTER\
      \ JOIN scratch.detail_b AS b\n  ON a.\"Register Type\" = b.\"Register Type\" AND a.\"Type Code\"\
      \ = b.\"Type Code\"\nORDER BY {order_by}\n"
  column_formats:
    Register Type:
      kind: text
    Type Code:
      kind: identifier
    Type Code Description:
      kind: text
    Amount Period A:
      kind: currency
      currency: USD
      precision: 2
    Amount Period B:
      kind: currency
      currency: USD
      precision: 2
    Amount Change:
      kind: currency
      currency: USD
      precision: 2
    Hours Period A:
      kind: number
      unit: hours
      precision: 2
    Hours Period B:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: table
- id: bp-compare-employee-paychecks-two-periods
  intent: Compare a single employee's paychecks line-item by line-item across two given pay periods, with
    per-item amounts, hours, and period-over-period change
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  toString(register_type) AS \"Pay Category\",\n  toString(type_code) AS \"Pay\
    \ Code\",\n  any(toString(type_code_description)) AS \"Description\",\n  round(toFloat64(sumIf(amount,\
    \ pay_period_end_date = {period_b})), 2) AS \"Recent Amount\",\n  round(toFloat64(sumIf(type_hours,\
    \ pay_period_end_date = {period_b})), 2) AS \"Recent Hours\",\n  round(toFloat64(sumIf(amount, pay_period_end_date\
    \ = {period_a})), 2) AS \"Prior Amount\",\n  round(toFloat64(sumIf(type_hours, pay_period_end_date\
    \ = {period_a})), 2) AS \"Prior Hours\",\n  round(\n    toFloat64(\n      sumIf(amount, pay_period_end_date\
    \ = {period_b}) - sumIf(amount, pay_period_end_date = {period_a})\n    ),\n    2\n  ) AS \"Amount\
    \ Change\",\n  round(\n    toFloat64(\n      sumIf(type_hours, pay_period_end_date = {period_b}) -\
    \ sumIf(type_hours, pay_period_end_date = {period_a})\n    ),\n    2\n  ) AS \"Hours Change\"\nFROM\
    \ dbpcm_warehouse.payroll\nWHERE\n  employee_code = {employee}\n  AND pay_period_end_date IN ({period_a},\
    \ {period_b})\nGROUP BY\n  register_type,\n  type_code\nORDER BY {order_by}\n"
  slots:
  - name: employee
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.employee_code
  - name: period_a
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: period_b
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Pay Category ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Pay Category
      direction: ASC
    allowed_columns:
    - Pay Category
    - Pay Code
    - Description
    - Recent Amount
    - Recent Hours
    - Prior Amount
    - Prior Hours
    - Amount Change
    - Hours Change
  slots_summary: employee, period_a, period_b, order_by
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.type_code_description
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  column_formats:
    Pay Category:
      kind: text
    Pay Code:
      kind: identifier
    Description:
      kind: text
    Recent Amount:
      kind: currency
      currency: USD
      precision: 2
    Recent Hours:
      kind: number
      unit: hours
      precision: 2
    Prior Amount:
      kind: currency
      currency: USD
      precision: 2
    Prior Hours:
      kind: number
      unit: hours
      precision: 2
    Amount Change:
      kind: currency
      currency: USD
      precision: 2
    Hours Change:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: table
- id: bp-compensation-ranking
  intent: Top N highest-paid employees separately within Salary and Hourly pay types. Rank Salary by recorded
    annual_salary and Hourly by recorded hourly_salary. Show annual salary and hourly rate in separate
    columns; never annualize hourly pay. Defaults to Active + On Leave; top_n applies separately to each
    pay type.
  slots_summary: top_n, employee_status, department
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.pay_type
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
    description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that
      ranking. It does not accept order_by or order_direction. A different selection or display order
      requires a separate query.
  - name: employee_status
    description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both;
      send a list of specific statuses to select another population. All removes the status filter and
      must be supplied alone.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    multiple: true
    default:
    - Active
    - On Leave
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  result_grain:
  - Pay Type
  - Rank
  sql_template: "WITH compensation AS (\n  SELECT\n    e.employee_code,\n    e.employee_name,\n    e.department_name,\n\
    \    e.pay_type,\n    e.hourly_salary,\n    CASE\n      WHEN e.pay_type = 'Salary' AND e.annual_salary\
    \ > 0\n      THEN e.annual_salary\n      WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n    \
    \  THEN e.hourly_salary\n      ELSE NULL\n    END AS recorded_pay\n  FROM dbpcm_warehouse.employee\
    \ AS e\n  WHERE\n    (\n      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n\
    \    )\n    AND e.department_name IN ({department})\n), ranked AS (\n  SELECT\n    employee_code,\n\
    \    employee_name,\n    department_name,\n    pay_type,\n    hourly_salary,\n    recorded_pay,\n\
    \    row_number() OVER (PARTITION BY pay_type ORDER BY recorded_pay DESC, employee_code) AS compensation_rank\n\
    \  FROM compensation\n  WHERE\n    NOT (\n      recorded_pay IS NULL\n    )\n)\nSELECT\n  pay_type\
    \ AS \"Pay Type\",\n  compensation_rank AS \"Rank\",\n  employee_code AS \"Employee Code\",\n  employee_name\
    \ AS \"Employee Name\",\n  department_name AS \"Department\",\n  CASE WHEN pay_type = 'Salary' THEN\
    \ recorded_pay ELSE NULL END AS \"Annual Salary\",\n  CASE WHEN pay_type = 'Hourly' AND hourly_salary\
    \ > 0 THEN hourly_salary ELSE NULL END AS \"Hourly Rate\"\nFROM ranked\nWHERE\n  compensation_rank\
    \ <= {top_n}\nORDER BY\n  pay_type,\n  compensation_rank\n"
  uses_rules:
  - default_employee_population
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Rank:
      kind: integer
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-consecutive-day-streaks
  intent: Employees with N or more consecutive calendar days containing at least one punch pair, showing
    streak length and date range
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH distinct_days AS (\n  SELECT DISTINCT\n    employee_code,\n    toDate(punch_date)\
    \ AS punch_date\n  FROM dbpcm_warehouse.punch_pair\n  WHERE\n    (\n      punch_date >= {window_start}\
    \ AND punch_date < {window_end}\n    )\n), streak_groups AS (\n  SELECT\n    employee_code,\n    punch_date,\n\
    \    DATE_DIFF(DAY, toDate('1970-01-01'), punch_date) - row_number() OVER (PARTITION BY employee_code\
    \ ORDER BY punch_date) AS grp\n  FROM distinct_days\n)\nSELECT\n  sg.employee_code AS \"Employee Code\"\
    ,\n  any(e.employee_name) AS \"Employee Name\",\n  min(sg.punch_date) AS \"Streak Start\",\n  max(sg.punch_date)\
    \ AS \"Streak End\",\n  count() AS \"Streak Length\"\nFROM streak_groups AS sg\nLEFT JOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = sg.employee_code\nGROUP BY\n  sg.employee_code,\n  sg.grp\nHAVING\n\
    \  count() >= {streak}\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: streak
    type: positive_integer
    required: true
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Streak Length DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Streak Length
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Streak Start
    - Streak End
    - Streak Length
  slots_summary: streak, window, max_rows, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Streak Start:
      kind: date
    Streak End:
      kind: date
    Streak Length:
      kind: integer
  presentation:
    kind: table

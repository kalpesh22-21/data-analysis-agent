- id: bp-labor-allocation-resolution
  intent: Resolve labor allocation slots 1-3 to codes and descriptions for active employees
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  e.employee_code AS \"Employee Code\",\n  e.department_name AS \"Department\"\

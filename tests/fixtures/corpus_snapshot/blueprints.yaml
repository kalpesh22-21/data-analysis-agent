    \ IS NOT NULL\n       AND toDate32(request_date) >= toStartOfYear(today()))\nGROUP BY b.employee_code\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Balance Hours\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Balance Hours\"\n           \
    \        END ASC\n"
  slots:
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC

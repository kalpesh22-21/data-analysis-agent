- id: bp-department-ot-share
  intent: Department overtime dollars as a percentage of department gross payroll earnings, ranked by
    share, combining timecard overtime with register gross
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH ot_agg AS\n  (SELECT e.department_name AS dept,\n          SUM(te.earn_amount) AS\
    \ ot_dollars\n   FROM\n     (SELECT employee_code,\n             punch_date,\n             earn_code,\n\
    \             earn_amount\n      FROM dbpcm_warehouse.total_earning) AS te\n   JOIN\n     (SELECT\
    \ earn_code,\n             category_name\n      FROM dbpcm_warehouse.earning_category FINAL) AS ec\
    \ ON ec.earn_code = te.earn_code\n   JOIN dbpcm_warehouse.employee AS e ON e.employee_code = te.employee_code\n\
    \   WHERE ec.category_name = 'Overtime'\n     AND te.punch_date BETWEEN addMonths(toDate({period}),\
    \ -1) AND toDate({period})\n   GROUP BY e.department_name),\n     gross_agg AS\n  (SELECT e2.department_name\
    \ AS dept,\n          SUM(p2.amount) AS gross_dollars\n   FROM dbpcm_warehouse.payroll AS p2\n   JOIN\
    \ dbpcm_warehouse.employee AS e2 ON e2.employee_code = p2.employee_code\n   WHERE p2.register_type\
    \ = 'EARN'\n     AND p2.pay_period_end_date = {period}\n   GROUP BY e2.department_name)\nSELECT oa.dept\
    \ AS \"Department\",\n       round(oa.ot_dollars, 2) AS \"Overtime Dollars\",\n       round(ga.gross_dollars,\
    \ 2) AS \"Gross Earnings\",\n       round(oa.ot_dollars / nullIf(ga.gross_dollars, 0) * 100, 2) AS\
    \ \"OT Share %\"\nFROM ot_agg AS oa\nLEFT JOIN gross_agg AS ga ON ga.dept = oa.dept\nORDER BY CASE\n\
    \             WHEN {order_direction} = 'DESC' THEN \"OT Share %\"\n         END DESC, CASE\n     \
    \                  WHEN {order_direction} = 'ASC' THEN \"OT Share %\"\n                   END ASC\n\
    LIMIT {top_n}\n"
  slots:
  - name: period
    type: period
    required: false
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
    optional_pattern: 'TRUE'
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: period, top_n, order_direction
  uses:
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Overtime Dollars:
      kind: currency
      currency: USD
    Gross Earnings:
      kind: currency
      currency: USD
    OT Share %:
      kind: percent
      scale: percent
      precision: 2
- id: bp-department-scorecard
  intent: Per-department KPI scorecard covering active headcount, pay, tenure, demographics and long-running
    leaves
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT department_name AS \"Department\",\n       countIf(employee_status = 'Active')\
    \ AS \"Active Headcount\",\n       round(avgIf(toFloat64(annual_salary), employee_status = 'Active'),\
    \ 2) AS \"Avg Salary (Active)\",\n       round(avgIf(date_diff('day', hire_date, now()) / 365.25,\
    \ employee_status = 'Active'), 1) AS \"Avg Tenure Years (Active)\",\n       round(100 * countIf(employee_status\
    \ = 'Active'\n                           AND gender = 'Female') / nullIf(countIf(employee_status =\
    \ 'Active'), 0), 2) AS \"Pct Female (Active)\",\n       round(100 * countIf(employee_status = 'Active'\n\
    \                           AND direct_deposit = 1) / nullIf(countIf(employee_status = 'Active'),\
    \ 0), 2) AS \"Pct Direct Deposit (Active)\",\n       countIf(employee_status = 'On Leave') AS \"On\
    \ Leave\",\n       countIf(employee_status = 'On Leave'\n               AND leave_absence_start IS\
    \ NOT NULL\n               AND toDate32(leave_absence_start) > toDate32('1900-01-01')\n          \
    \     AND NOT (leave_absence_end IS NOT NULL\n                        AND toDate32(leave_absence_end)\
    \ > toDate32('1900-01-01'))\n               AND leave_absence_start < now() - INTERVAL 1 YEAR) AS\
    \ \"On Leave Over 1 Year No End\"\nFROM dbpcm_warehouse.employee\nWHERE department_name = {department}\n\
    GROUP BY department_name\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Department\"\
    \n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Department\"\
    \n                   END ASC\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC

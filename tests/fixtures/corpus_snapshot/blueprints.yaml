- id: bp-expense-cycle-time
  intent: Median expense reimbursement cycle time by month, submission to approval and approval to payment
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(expense_paid_date), '%Y-%m') AS \"Month\",\n   \
    \    count() AS \"Line Count\",\n       round((quantileExactLow(0.5)(dateDiff('day', date_time_submitted,\
    \ approved_date)) + quantileExactHigh(0.5)(dateDiff('day', date_time_submitted, approved_date))) /\
    \ 2, 1) AS \"Median Submission To Approval\",\n       round((quantileExactLow(0.5)(dateDiff('day',\
    \ approved_date, expense_paid_date)) + quantileExactHigh(0.5)(dateDiff('day', approved_date, expense_paid_date)))\
    \ / 2, 1) AS \"Median Approval To Payment\"\nFROM dbpcm_warehouse.expense\nWHERE expense_status IN\
    \ ('Approved',\n                         'Paid',\n                         'Marked as Paid')\n  AND\
    \ date_time_submitted IS NOT NULL\n  AND toDate32(date_time_submitted) > toDate32('1900-01-01')\n\
    \  AND approved_date IS NOT NULL\n  AND toDate32(approved_date) > toDate32('1900-01-01')\n  AND expense_paid_date\
    \ IS NOT NULL\n  AND toDate32(expense_paid_date) > toDate32('1900-01-01')\n  AND expense_paid_date\
    \ >=\n    (SELECT addMonths(toStartOfMonth(max(expense_paid_date)), -{window_months})\n     FROM dbpcm_warehouse.expense\n\
    \     WHERE expense_status IN ('Approved',\n                              'Paid',\n              \
    \                'Marked as Paid')\n       AND expense_paid_date IS NOT NULL\n       AND toDate32(expense_paid_date)\
    \ > toDate32('1900-01-01'))\nGROUP BY \"Month\"\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Month\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Month\"\n                   END ASC\n"
  slots:
  - name: window_months
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: window_months, order_direction
  uses:
  - dbpcm_warehouse.expense.date_time_submitted
  - dbpcm_warehouse.expense.approved_date
  - dbpcm_warehouse.expense.expense_paid_date
  - dbpcm_warehouse.expense.expense_status
  column_formats:
    Month:
      kind: text
    Line Count:
      kind: integer
    Median Submission To Approval:
      kind: number
      unit: days
      precision: 2
    Median Approval To Payment:
      kind: number
      unit: days
      precision: 2
- id: bp-expense-line-size-distribution
  intent: Distribution of expense line amounts into bands by account description for a payment date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT expense_account_description AS \"Account Description\",\n       toInt32(floor(toFloat64(amount_approved)\
    \ / {band}) * {band}) AS \"Band Start\",\n       count() AS \"Line Count\"\nFROM dbpcm_warehouse.expense\n\
    WHERE expense_status IN ('Approved',\n                         'Paid',\n                         'Marked\
    \ as Paid')\n  AND expense_paid_date >= {expense_window_start}\n  AND expense_paid_date <= {expense_window_end}\n\
    GROUP BY expense_account_description,\n         toInt32(floor(toFloat64(amount_approved) / {band})\
    \ * {band})\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Account Description\"\
    \n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Account Description\"\
    \n                   END ASC, \"Band Start\"\n"
  slots:
  - name: expense_window
    type: period_range
    required: true
    temporal_type: date
  - name: band
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: expense_window, band, order_direction
  uses:
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.expense_account_description
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.expense.expense_paid_date
  column_formats:
    Account Description:
      kind: text
    Band Start:
      kind: currency
      currency: USD
      precision: 2
    Line Count:
      kind: integer
- id: bp-expense-monthly-trend
  intent: Monthly approved expense spend trend over the last N months with top account slice
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(expense_paid_date), '%Y-%m') AS \"Month\",\n   \
    \    round(toFloat64(SUM(amount_approved)), 2) AS \"Total Approved Spend\"\nFROM dbpcm_warehouse.expense\n\
    WHERE expense_status IN ('Approved',\n                         'Paid',\n                         'Marked\
    \ as Paid')\n  AND expense_paid_date >=\n    (SELECT addMonths(toStartOfMonth(max(expense_paid_date)),\
    \ -{window_months})\n     FROM dbpcm_warehouse.expense\n     WHERE expense_status IN ('Approved',\n\
    \                              'Paid',\n                              'Marked as Paid')\n       AND\
    \ toDate32(expense_paid_date) > toDate32('1900-01-01'))\n  AND toDate32(expense_paid_date) > toDate32('1900-01-01')\n\
    GROUP BY \"Month\"\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Month\"\n \
    \        END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Month\"\n  \
    \                 END ASC\n"
  slots:
  - name: window_months
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: window_months, order_direction
  uses:

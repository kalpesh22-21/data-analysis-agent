- id: bp-overtime-by-department
  intent: Earnings by department for a given pay period, filtered to a specific pay type (type_code) such
    as overtime
  slots_summary: department, pay_period, type_code
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: true
    binds_to: dbpcm_warehouse.department.department_name
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: pay_period
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  - name: type_code
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.type_code
  uses_rules:
  - gross_earnings
  result_grain:
  - Department
  sql_template: "SELECT e.department_name AS department,\n       SUM(p.amount) AS earnings\nFROM dbpcm_warehouse.payroll\
    \ AS p\nJOIN dbpcm_warehouse.employee AS e ON e.employee_code = p.employee_code\nWHERE p.register_type\
    \ = 'EARN'\n  AND p.type_code = {type_code}\n  AND e.department_name = {department}\n  AND p.pay_period_end_date\
    \ = {pay_period}\nGROUP BY e.department_name\n"
  column_formats:
    department:
      kind: text
    earnings:
      kind: currency
      currency: USD
- id: bp-overtime-hours-dollars
  intent: Overtime dollars and hours by department from timecard earnings, resolved via the Overtime earning
    category, for a date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.department_name AS \"Department\",\n       round(SUM(te.earn_amount), 2) AS\
    \ \"Overtime Dollars\",\n       round(SUM(te.earn_hours), 2) AS \"Overtime Hours\"\nFROM\n  (SELECT\
    \ punch_date,\n          earn_amount,\n          earn_hours,\n          earn_code,\n          employee_code\n\
    \   FROM dbpcm_warehouse.total_earning) AS te\nJOIN\n  (SELECT earn_code,\n          category_name\n\
    \   FROM dbpcm_warehouse.earning_category FINAL) AS ec ON ec.earn_code = te.earn_code\nJOIN dbpcm_warehouse.employee\
    \ AS e ON e.employee_code = te.employee_code\nWHERE ec.category_name = 'Overtime'\n  AND te.punch_date\
    \ BETWEEN {period_start} AND {period_end}\nGROUP BY e.department_name\nORDER BY CASE\n           \
    \  WHEN {order_direction} = 'DESC' THEN \"Overtime Dollars\"\n         END DESC, CASE\n          \
    \             WHEN {order_direction} = 'ASC' THEN \"Overtime Dollars\"\n                   END ASC\n"
  slots:
  - name: period
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: period, order_direction
  uses:
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.employee_code

  catalog_sha: ''
  sql_template: "-- Output aliases are Title-Case display names; consumers keying on column names\n--\
    \ must use the quoted aliases.\n\nSELECT any(e.department_name) AS \"Department\",\n       ec.changed_field\
    \ AS \"Changed Field\",\n       count() AS \"Change Events\"\nFROM\n  (SELECT employee_code,\n   \
    \       changed_field,\n          change_time_added\n   FROM dbpcm_warehouse.employee_change) AS ec\n\
    JOIN dbpcm_warehouse.employee AS e ON e.employee_code = ec.employee_code\nWHERE ec.change_time_added\

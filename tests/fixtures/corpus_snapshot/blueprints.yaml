  sql_template: "SELECT\n  ppd.ppd AS \"Pairs Per Day\",\n  count() AS \"Employee-Days\"\nFROM (\n  SELECT\n\
    \    employee_code,\n    punch_date,\n    CASE\n      WHEN count() = 1\n      THEN '1 pair'\n    \
    \  WHEN count() = 2\n      THEN '2 pairs'\n      ELSE '3+ pairs'\n    END AS ppd\n  FROM (\n    SELECT\n\
    \      employee_code,\n      punch_date\n    FROM dbpcm_warehouse.punch_pair\n  )\n  WHERE\n    (\n\
    \      punch_date >= {window_start} AND punch_date < {window_end}\n    )\n  GROUP BY\n    employee_code,\n\
    \    punch_date\n) AS ppd\nGROUP BY\n  ppd\nORDER BY {order_by}\n"

- id: bp-employee-date-summary
  intent: Counts of distinct employees with recorded original hire, most recent hire or termination dates
    in an explicit half-open period. Group by company, department, current status or event month. These
    are current employee records, not a complete employment-event history or turnover rate. Current-status
    filter is optional and may exclude rehired employees. No implicit active/terminated filter; no zero-filled
    months.
  slots_summary: date_basis, group_by, period, employee_status, department, employee, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: date_basis
    type: enum
    required: true
    enum_values:
    - original_hire
    - most_recent_hire
    - termination
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
    - month
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Group
      direction: ASC
    allowed_columns:
    - Group
    - Employee Count
  result_grain:
  - Group
  sql_template: "SELECT\n  CASE\n    WHEN {group_by} = 'month'\n    THEN SUBSTRING(\n      toString(\n\
    \        CASE\n          WHEN {date_basis} = 'most_recent_hire'\n          THEN e.most_recent_hire_date\n\
    \          WHEN {date_basis} = 'termination'\n          THEN e.termination_date\n          ELSE e.hire_date\n\
    \        END\n      ),\n      1,\n      7\n    )\n    WHEN {group_by} = 'department'\n    THEN e.department_name\n\
    \    WHEN {group_by} = 'status'\n    THEN e.employee_status\n    ELSE 'Company'\n  END AS \"Group\"\
    ,\n  uniqExact(e.employee_code) AS \"Employee Count\"\nFROM dbpcm_warehouse.employee AS e\nWHERE\n\
    \  e.employee_status IN ({employee_status})\n  AND e.department_name IN ({department})\n  AND e.employee_code\
    \ = {employee}\n  AND (\n    CASE\n      WHEN {date_basis} = 'most_recent_hire'\n      THEN e.most_recent_hire_date\n\
    \      WHEN {date_basis} = 'termination'\n      THEN e.termination_date\n      ELSE e.hire_date\n\
    \    END\n  ) >= toDate({period_start})\n  AND (\n    CASE\n      WHEN {date_basis} = 'most_recent_hire'\n\
    \      THEN e.most_recent_hire_date\n      WHEN {date_basis} = 'termination'\n      THEN e.termination_date\n\
    \      ELSE e.hire_date\n    END\n  ) < toDate({period_end})\nGROUP BY\n  \"Group\"\nORDER BY {order_by}\n"
  column_formats:
    Group:
      kind: text
    Employee Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Group
    measure_columns:
    - Employee Count
    by_group_by:
      company: figure
      month: line
- id: bp-employee-day-clock-span
  intent: Employee-day first recorded In time, last recorded Out time and matched-pair count, with paid
    hours. Clock span may contain unpaid gaps; it is not hours worked, a single shift or a lateness finding.
    Days are assigned by recorded punch_date; midnight ownership is not inferred. Optional punch-type
    filters restrict which pairs contribute. Required half-open punch-date period and resolved table_source
    prevent accidental cross-source double counting. FINAL deduplicates storage versions, not overlapping
    real-world events. Department means recorded labor-allocation department code, not current home department.
    No scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove
    completeness; missing days/months are not zero-filled. Salaried approved leave and automatic pay-period-end
    entries can generate these records; this blueprint does not establish physical attendance or current
    clock-in.
  slots_summary: top_n, period, source, employee, department, hours_type, pay_class, in_type, out_type,
    order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.punch_pair.department_code
  - dbpcm_warehouse.punch_pair.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.hours_type
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.in_punch_type
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_type
  - dbpcm_warehouse.punch_pair.pay_class_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.table_source
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.punch_pair.table_source
    multiple: true
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.department_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: hours_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.hours_type
    optional_pattern: 'TRUE'
    multiple: true
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.punch_pair.pay_class_code
    optional_pattern: 'TRUE'
    multiple: true
  - name: in_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.in_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - ID
    - IL
    - IB
    - IX
    multiple: true
  - name: out_type
    type: enum
    required: false
    binds_to: dbpcm_warehouse.punch_pair.out_punch_type
    optional_pattern: 'TRUE'
    enum_values:
    - OD
    - OL
    - OB
    - OX
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Punch Date ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Punch Date
      direction: ASC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Department
    - Punch Date
    - First Recorded In
    - Last Recorded Out
    - Pair Count
    - Paid Hours
  result_grain:
  - Employee Code
  - Punch Date
  sql_template: "SELECT\n  p.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  e.department_name AS \"Department\",\n  p.punch_date AS \"Punch Date\",\n  min(p.in_punch_time)\
    \ AS \"First Recorded In\",\n  max(p.out_punch_time) AS \"Last Recorded Out\",\n  count(*) AS \"Pair\
    \ Count\",\n  sum(p.earn_hours) AS \"Paid Hours\"\nFROM dbpcm_warehouse.punch_pair AS p\nLEFT JOIN\
    \ dbpcm_warehouse.employee AS e\n  ON e.employee_code = p.employee_code\nWHERE\n  p.punch_date >=\
    \ toDate({period_start})\n  AND p.punch_date < toDate({period_end})\n  AND p.table_source IN ({source})\n\
    \  AND p.employee_code = {employee}\n  AND p.department_code IN ({department})\n  AND p.hours_type\
    \ IN ({hours_type})\n  AND p.pay_class_code IN ({pay_class})\n  AND p.in_punch_type IN ({in_type})\n\
    \  AND p.out_punch_type IN ({out_type})\nGROUP BY\n  p.employee_code,\n  e.employee_name,\n  e.department_name,\n\
    \  p.punch_date\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Punch Date:
      kind: date
    First Recorded In:
      kind: datetime
    Last Recorded Out:
      kind: datetime
    Pair Count:
      kind: integer
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: table

    WHERE employee_status = 'Active'\nGROUP BY \"Hire Era\"\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Hire Era\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Hire Era\"\n                   END ASC\n"
  slots:
  - name: era_window

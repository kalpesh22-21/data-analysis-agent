    \  AND department_description = {department}\nGROUP BY department_description\nORDER BY CASE\n   \
    \          WHEN {order_direction} = 'DESC' THEN \"Denied Amount\"\n         END DESC, CASE\n     \
    \                  WHEN {order_direction} = 'ASC' THEN \"Denied Amount\"\n                   END ASC,\
    \ \"Department\"\n"

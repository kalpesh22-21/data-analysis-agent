    \    CASE\n      WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n      THEN e.annual_salary\n\
    \      ELSE NULL\n    END\n  ) AS \"Annual Salary\",\n  e.hourly_salary AS \"Hourly Rate\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nWHERE\n  (\n    (\n      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n\
    \    )\n    AND e.department_name IN ({department})\n    AND e.employee_code = {employee}\n    AND\
    \ (\n      (\n        {comparison} = 'above'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) > {salary}\n      )\n      OR (\n        {comparison} = 'at_least'\n     \
    \   AND (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n      \
    \      THEN e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n    \
    \        THEN e.hourly_salary\n            ELSE NULL\n          END\n        ) >= {salary}\n     \
    \ )\n      OR (\n        {comparison} = 'equal'\n        AND (\n          CASE\n            WHEN e.pay_type\
    \ = 'Salary' AND e.annual_salary > 0\n            THEN e.annual_salary\n            WHEN e.pay_type\
    \ = 'Hourly' AND e.hourly_salary > 0\n            THEN e.hourly_salary\n            ELSE NULL\n  \
    \        END\n        ) = {salary}\n      )\n      OR (\n        {comparison} = 'below'\n        AND\
    \ (\n          CASE\n            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0\n            THEN\
    \ e.annual_salary\n            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0\n            THEN\
    \ e.hourly_salary\n            ELSE NULL\n          END\n        ) < {salary}\n      )\n    )\n  )\n\
    \  AND e.pay_type = 'Salary'\nORDER BY {order_by}\nLIMIT {row_limit}\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Employee Code:
      kind: identifier
    Department:
      kind: text
    Status:
      kind: text
    Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
  presentation:
    kind: table
- id: bp-shift-differential-spend
  intent: Shift-differential dollars and hours from the payroll register, resolving earn codes dynamically
    against type_code for a date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  round(SUM(p.amount), 2) AS \"Shift Differential Dollars\",\n  round(SUM(p.type_hours),\
    \ 2) AS \"Shift Differential Hours\"\nFROM dbpcm_warehouse.payroll AS p\nWHERE\n  p.register_type\
    \ = 'EARN'\n  AND p.type_code IN (\n    SELECT\n      earn_code\n    FROM dbpcm_warehouse.earning_category\n\
    \    WHERE\n      category_name IN ({shift_category})\n  )\n  AND (\n    p.pay_period_end_date >=\
    \ {window_start} AND p.pay_period_end_date < {window_end}\n  )\nORDER BY {order_by}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: shift_category
    type: entity
    required: true
    binds_to: dbpcm_warehouse.earning_category.category_name
    description: Resolve the requested shift concept to this client's category label; do not invent earning
      codes.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Shift Differential Dollars ASC. Applies before LIMIT; no
      implicit secondary sort.
    default:
    - column: Shift Differential Dollars
      direction: ASC
    allowed_columns:
    - Shift Differential Dollars
    - Shift Differential Hours
  slots_summary: window, shift_category, order_by
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Shift Differential Dollars:
      kind: currency
      currency: USD
    Shift Differential Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: facts
    measure_columns:
    - Shift Differential Dollars
    - Shift Differential Hours
- id: bp-supervision-anomalies
  intent: Self-supervising and missing-primary-supervisor anomaly audit for active employees.
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  \"Employee Code\",\n  \"Name\",\n  \"Department\",\n  \"Supervisor Code\",\n\
    \  \"Supervisor Name\",\n  \"Anomaly Type\"\nFROM (\n  SELECT\n    employee_code AS \"Employee Code\"\
    ,\n    employee_name AS \"Name\",\n    department_name AS \"Department\",\n    primary_supervisor_ee_code\
    \ AS \"Supervisor Code\",\n    primary_supervisor_name AS \"Supervisor Name\",\n    'Self-Supervising'\
    \ AS \"Anomaly Type\"\n  FROM dbpcm_warehouse.employee\n  WHERE\n    employee_status = 'Active'\n\
    \    AND NOT (\n      primary_supervisor_ee_code IS NULL\n    )\n    AND primary_supervisor_ee_code\
    \ <> ''\n    AND primary_supervisor_ee_code = employee_code\n  UNION ALL\n  SELECT\n    employee_code\
    \ AS \"Employee Code\",\n    employee_name AS \"Name\",\n    department_name AS \"Department\",\n\
    \    primary_supervisor_ee_code AS \"Supervisor Code\",\n    primary_supervisor_name AS \"Supervisor\
    \ Name\",\n    'Missing Supervisor' AS \"Anomaly Type\"\n  FROM dbpcm_warehouse.employee\n  WHERE\n\
    \    employee_status = 'Active'\n    AND (\n      primary_supervisor_ee_code IS NULL OR primary_supervisor_ee_code\
    \ = ''\n    )\n) AS anomalies\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Anomaly Type ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Anomaly Type
      direction: ASC
    allowed_columns:
    - Employee Code
    - Name
    - Department
    - Supervisor Code
    - Supervisor Name
    - Anomaly Type
  slots_summary: top_n, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.primary_supervisor_ee_code
  - dbpcm_warehouse.employee.primary_supervisor_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Employee Code:
      kind: identifier
    Name:
      kind: text
    Department:
      kind: text
    Supervisor Code:
      kind: identifier
    Supervisor Name:
      kind: text
    Anomaly Type:
      kind: text
  presentation:
    kind: table
- id: bp-supervisor-chain-depth
  intent: Distribution of populated supervisor-level counts (0-4) across active employees
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  toString(depth) AS \"Chain Depth\",\n  count() AS \"Headcount\",\n  round(100\
    \ * count() / sum(count()) OVER (), 2) AS \"Share Pct\"\nFROM (\n  SELECT\n    employee_code,\n  \
    \  toUInt8(\n      (\n        NOT (\n          primary_supervisor_ee_code IS NULL\n        ) AND primary_supervisor_ee_code\
    \ <> ''\n      )\n    ) + toUInt8(\n      (\n        NOT (\n          secondary_supervisor_ee_code\
    \ IS NULL\n        )\n        AND secondary_supervisor_ee_code <> ''\n      )\n    ) + toUInt8(\n\
    \      (\n        NOT (\n          tertiary_supervisor_ee_code IS NULL\n        )\n        AND tertiary_supervisor_ee_code\
    \ <> ''\n      )\n    ) + toUInt8(\n      (\n        NOT (\n          quaternary_supervisor_ee_code\
    \ IS NULL\n        )\n        AND quaternary_supervisor_ee_code <> ''\n      )\n    ) AS depth\n \
    \ FROM dbpcm_warehouse.employee\n  WHERE\n    employee_status = 'Active'\n)\nGROUP BY\n  depth\nORDER\
    \ BY {order_by}\n"
  slots:
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Chain Depth ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Chain Depth
      direction: ASC
    allowed_columns:
    - Chain Depth
    - Headcount
    - Share Pct
  slots_summary: order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.primary_supervisor_ee_code
  - dbpcm_warehouse.employee.secondary_supervisor_ee_code
  - dbpcm_warehouse.employee.tertiary_supervisor_ee_code
  - dbpcm_warehouse.employee.quaternary_supervisor_ee_code
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Chain Depth:
      kind: integer
    Headcount:
      kind: integer
    Share Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: donut
    category_columns:
    - Chain Depth
    measure_columns:
    - Headcount
- id: bp-tenure-band-distribution
  intent: Active headcount by seniority-date tenure band
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  multiIf(\n    NOT (\n      NOT (\n        seniority_date IS NULL\n      )\n\
    \      AND toDate32(seniority_date) > toDate32('1900-01-01')\n    ),\n    'Unknown',\n    yrs < 1,\n\
    \    'Under 1 Year',\n    yrs < 3,\n    '1-3 Years',\n    yrs < 5,\n    '3-5 Years',\n    yrs < 10,\n\
    \    '5-10 Years',\n    yrs < 20,\n    '10-20 Years',\n    '20+ Years'\n  ) AS \"Tenure Band\",\n\
    \  count(DISTINCT employee_code) AS \"Headcount\",\n  min(\n    CASE\n      WHEN NOT (\n        seniority_date\
    \ IS NULL\n      )\n      AND toDate32(seniority_date) > toDate32('1900-01-01')\n      THEN yrs\n\
    \      ELSE NULL\n    END\n  ) AS \"Band Start\"\nFROM (\n  SELECT\n    employee_code,\n    seniority_date,\n\
    \    DATE_DIFF(DAY, seniority_date, now()) / 365.25 AS yrs\n  FROM dbpcm_warehouse.employee\n  WHERE\n\
    \    employee_status = 'Active' AND department_name IN ({department})\n)\nGROUP BY\n  \"Tenure Band\"\
    \nORDER BY {order_by}\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Band Start ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Band Start
      direction: ASC
    allowed_columns:
    - Tenure Band
    - Headcount
    - Band Start
  slots_summary: department, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.seniority_date
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Tenure Band:
      kind: text
    Headcount:
      kind: integer
    Band Start:
      kind: number
      unit: years
  presentation:
    kind: bars
    category_columns:
    - Tenure Band
    measure_columns:
    - Headcount
- id: bp-termination-family
  intent: Employees with a recorded termination date in a half-open period, with the total matching employee
    count before the display limit. Includes same-day/later rehires and employees no longer currently
    Terminated. Apply current status only when explicitly requested. For counts/grouped summaries use
    bp-employee-date-summary with date_basis=termination.
  slots_summary: period, row_limit, employee_status, department, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for all recorded terminations in the period; set only when current status is explicitly
      requested.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
    multiple: true
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Termination Date DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Termination Date
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Department
    - Current Status
    - Termination Date
    - Total Matching Employees
  result_grain:
  - Employee Code
  sql_template: "SELECT\n  e.employee_code AS \"Employee Code\",\n  e.employee_name AS \"Employee Name\"\
    ,\n  e.department_name AS \"Department\",\n  e.employee_status AS \"Current Status\",\n  e.termination_date\
    \ AS \"Termination Date\",\n  count(*) OVER () AS \"Total Matching Employees\"\nFROM dbpcm_warehouse.employee\
    \ AS e\nWHERE\n  e.termination_date >= {period_start}\n  AND e.termination_date < {period_end}\n \
    \ AND (\n    e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})\n  )\n  AND\
    \ e.department_name IN ({department})\nORDER BY {order_by}\nLIMIT {row_limit}\n\n"
  uses_rules:
  - terminations_in_period
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Current Status:
      kind: text
    Termination Date:
      kind: date
    Total Matching Employees:
      kind: integer
  presentation:
    kind: table
- id: bp-timecard-earnings-all-history
  intent: All-history timecard earnings and hours per earn code from total_earning, spanning all available
    punch dates, with optional employee or date-window filter
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  earn_code AS \"Earn Code\",\n  round(SUM(earn_amount), 2) AS \"Total Earnings\"\
    ,\n  round(SUM(earn_hours), 2) AS \"Total Hours\"\nFROM dbpcm_warehouse.total_earning\nWHERE\n  employee_code\
    \ = {ee}\n  AND (\n    punch_date >= {window_start} AND punch_date < {window_end}\n  )\nGROUP BY\n\
    \  earn_code\nORDER BY {order_by}\nLIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per
      group.
  - name: ee
    type: string
    required: false
    binds_to: dbpcm_warehouse.total_earning.employee_code
    optional_pattern: 'TRUE'
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Total Earnings
      direction: DESC
    allowed_columns:
    - Earn Code
    - Total Earnings

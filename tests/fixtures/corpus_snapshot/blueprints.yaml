    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Per Capita Spend DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Per Capita Spend
      direction: DESC
    allowed_columns:
    - Department
    - Approved Spend
    - Active Headcount
    - Per Capita Spend
  slots_summary: top_n, expense_window, order_by
  uses:
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.expense.expense_paid_date
  - dbpcm_warehouse.expense.department_description
  - dbpcm_warehouse.expense.employee_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:

- id: bp-weekend-work-share
  intent: Weekend versus weekday paid hours share by month from total_earning, the authoritative hours
    source, showing weekend percentage and totals
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(punch_date), '%Y-%m') AS \"Month\",\n       round(SUM(earn_hours),\
    \ 2) AS \"Total Hours\",\n       round(SUMIf(earn_hours, dayOfWeek(punch_date) IN (6, 7)), 2) AS \"\
    Weekend Hours\",\n       round(SUMIf(earn_hours, dayOfWeek(punch_date) NOT IN (6, 7)), 2) AS \"Weekday\
    \ Hours\",\n       round(100 * SUMIf(earn_hours, dayOfWeek(punch_date) IN (6, 7)) / nullIf(SUM(earn_hours),\
    \ 0), 2) AS \"Weekend Share Pct\"\nFROM\n  (SELECT punch_date,\n          earn_hours\n   FROM dbpcm_warehouse.total_earning)\n\
    WHERE punch_date >= today() - toIntervalMonth({win})\nGROUP BY \"Month\"\nORDER BY CASE\n        \
    \     WHEN {order_direction} = 'DESC' THEN \"Month\"\n         END DESC, CASE\n                  \
    \     WHEN {order_direction} = 'ASC' THEN \"Month\"\n                   END ASC\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  column_formats:
    Month:
      kind: text
    Total Hours:
      kind: number
      unit: hours
      precision: 2
    Weekend Hours:
      kind: number
      unit: hours
      precision: 2
    Weekday Hours:
      kind: number
      unit: hours
      precision: 2
    Weekend Share Pct:
      kind: percent
      scale: percent
      precision: 2
- id: bp-weekly-overtime-hours
  intent: Overtime hours per employee per work week based on total_earning earn_hours, the authoritative
    hours source, with a configurable weekly threshold
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH weekly AS\n  (SELECT employee_code,\n          toMonday(punch_date) AS week_start,\n\
    \          SUM(earn_hours) AS weekly_hours\n   FROM\n     (SELECT employee_code,\n             punch_date,\n\
    \             earn_hours\n      FROM dbpcm_warehouse.total_earning)\n   WHERE punch_date BETWEEN {window_start}\
    \ AND {window_end}\n   GROUP BY employee_code,\n            toMonday(punch_date))\nSELECT w.employee_code\
    \ AS \"Employee Code\",\n       max(e.employee_name) AS \"Employee Name\",\n       w.week_start AS\
    \ \"Week Start\",\n       round(w.weekly_hours, 2) AS \"Weekly Hours\",\n       round(greatest(w.weekly_hours\
    \ - {threshold}, 0), 2) AS \"Overtime Hours\"\nFROM weekly w\nLEFT JOIN dbpcm_warehouse.employee e\
    \ ON e.employee_code = w.employee_code\nWHERE w.weekly_hours > {threshold}\nGROUP BY w.employee_code,\n\
    \         w.week_start,\n         w.weekly_hours\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Overtime Hours\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Overtime Hours\"\n                   END ASC, \"Employee Code\"\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: threshold
    type: positive_integer
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, threshold, max_rows, order_direction
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Week Start:
      kind: date
    Weekly Hours:
      kind: number
      unit: hours
      precision: 2
    Overtime Hours:
      kind: number
      unit: hours
      precision: 2
- id: bp-worked-hours-daily
  intent: Total timecard-grade paid hours per calendar day from total_earning, the authoritative hours
    source, for a date window
  status: validated

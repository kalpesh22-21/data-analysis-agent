      kind: integer
    On Leave Over 1 Year No End:
      kind: integer
- id: bp-department-turnover-rate
  intent: Department turnover rate for a window using terms divided by current active headcount, ranked
    by rate
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT department_name AS \"Department\",\n       countIf(termination_date >= {window_start}\n\
    \               AND termination_date < {window_end}\n               AND termination_date IS NOT NULL\n\
    \               AND toDate32(termination_date) > toDate32('1900-01-01')\n               AND (most_recent_hire_date\
    \ IS NULL\n                    OR most_recent_hire_date < termination_date)) AS \"Terms\",\n     \
    \  round(100 * countIf(termination_date >= {window_start}\n                           AND termination_date\
    \ < {window_end}\n                           AND termination_date IS NOT NULL\n                  \
    \         AND toDate32(termination_date) > toDate32('1900-01-01')\n                           AND\
    \ (most_recent_hire_date IS NULL\n                                OR most_recent_hire_date < termination_date))\
    \ / nullIf(countIf(employee_status = 'Active'), 0), 2) AS \"Turnover Rate Pct\"\nFROM dbpcm_warehouse.employee\n\
    WHERE department_name IS NOT NULL\n  AND department_name != ''\nGROUP BY department_name\nORDER BY\
    \ CASE\n             WHEN {order_direction} = 'DESC' THEN \"Turnover Rate Pct\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Turnover Rate Pct\"\n       \
    \            END ASC, \"Department\"\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, order_direction

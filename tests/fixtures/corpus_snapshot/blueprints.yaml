- id: bp-department-scorecard
  intent: Per-department KPI scorecard covering active headcount, pay, tenure, demographics and long-running
    leaves
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  department_name AS \"Department\",\n  countIf(employee_status = 'Active') AS\
    \ \"Active Headcount\",\n  round(\n    avgIf(\n      toFloat64(annual_salary),\n      employee_status\
    \ = 'Active' AND pay_type = 'Salary' AND annual_salary > 0\n    ),\n    2\n  ) AS \"Avg Salary (Active)\"\
    ,\n  round(avgIf(DATE_DIFF(DAY, hire_date, now()) / 365.25, employee_status = 'Active'), 1) AS \"\
    Avg Tenure Years (Active)\",\n  round(\n    100 * countIf(employee_status = 'Active' AND gender =\
    \ 'Female') / nullIf(countIf(employee_status = 'Active'), 0),\n    2\n  ) AS \"Pct Female (Active)\"\
    ,\n  round(\n    100 * countIf(employee_status = 'Active' AND direct_deposit = 1) / nullIf(countIf(employee_status\
    \ = 'Active'), 0),\n    2\n  ) AS \"Pct Direct Deposit (Active)\",\n  countIf(employee_status = 'On\
    \ Leave') AS \"On Leave\",\n  countIf(\n    employee_status = 'On Leave'\n    AND NOT (\n      leave_absence_start\
    \ IS NULL\n    )\n    AND toDate32(leave_absence_start) > toDate32('1900-01-01')\n    AND NOT (\n\
    \      NOT (\n        leave_absence_end IS NULL\n      )\n      AND toDate32(leave_absence_end) >\
    \ toDate32('1900-01-01')\n    )\n    AND leave_absence_start < now() - INTERVAL '1' YEAR\n  ) AS \"\
    On Leave Over 1 Year No End\"\nFROM dbpcm_warehouse.employee\nWHERE\n  department_name IN ({department})\n\
    GROUP BY\n  department_name\nORDER BY {order_by}\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Department ASC. Applies before LIMIT; no implicit secondary
      sort.

- id: bp-employee-coverage-matrix
  intent: Multi-source employee coverage matrix showing which employees have roster entries, punch pairs,
    payroll lines, and timecard earnings, ordered by coverage gap count descending
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH punchers AS (\n  SELECT DISTINCT\n    employee_code AS employee_code,\n    1 AS\
    \ has_punches\n  FROM dbpcm_warehouse.punch_pair\n  WHERE\n    punch_date >= addMonths(today(), -12)\n\
    ), payrollers AS (\n  SELECT DISTINCT\n    employee_code AS employee_code,\n    1 AS has_payroll\n\
    \  FROM dbpcm_warehouse.payroll\n  WHERE\n    pay_period_end_date >= addMonths(today(), -12)\n), earners\
    \ AS (\n  SELECT DISTINCT\n    employee_code AS employee_code,\n    1 AS has_earnings\n  FROM dbpcm_warehouse.total_earning\n\
    \  WHERE\n    punch_date >= addMonths(today(), -12)\n)\nSELECT\n  e.employee_code AS \"Employee Code\"\
    ,\n  e.employee_name AS \"Employee Name\",\n  e.department_name AS \"Department\",\n  e.employee_status\
    \ AS \"Employee Status\",\n  1 AS \"Has Roster\",\n  COALESCE(p.has_punches, 0) AS \"Has Punches\"\
    ,\n  COALESCE(pl.has_payroll, 0) AS \"Has Payroll\",\n  COALESCE(te.has_earnings, 0) AS \"Has Earnings\"\
    ,\n  (\n    COALESCE(p.has_punches, 0) + COALESCE(pl.has_payroll, 0) + COALESCE(te.has_earnings, 0)\n\
    \  ) AS \"Coverage Score\",\n  (\n    3 - COALESCE(p.has_punches, 0) - COALESCE(pl.has_payroll, 0)\
    \ - COALESCE(te.has_earnings, 0)\n  ) AS \"Gap Count\"\nFROM dbpcm_warehouse.employee AS e\nLEFT JOIN\
    \ punchers AS p\n  ON p.employee_code = e.employee_code\nLEFT JOIN payrollers AS pl\n  ON pl.employee_code\
    \ = e.employee_code\nLEFT JOIN earners AS te\n  ON te.employee_code = e.employee_code\nORDER BY {order_by}\n\
    LIMIT {top_n}\n\n"
  slots:
  - name: top_n
    type: positive_integer
    required: false
    min_value: 1
    max_value: 1000
    optional_pattern: 'TRUE'
    description: Optional maximum number of output rows after aggregation and the declared ordering; omit
      for the full result. Bind only when the user requests a limited list. Returns at most N rows; does
      not include all tied ranks or change the measured population. Applies to the whole result, not per

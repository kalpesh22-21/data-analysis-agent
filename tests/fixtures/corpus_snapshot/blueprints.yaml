    - Payout Request
    default:
    - Time Off Request
    description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only
      when payouts are explicitly requested.
    multiple: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month

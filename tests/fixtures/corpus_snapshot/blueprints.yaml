- id: bp-post-termination-pay-audit
  intent: Terminated employees who received payroll earnings after their termination date, rehire-aware,
    for a given pay-date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  p.employee_code AS \"Employee Code\",\n  any(e.employee_name) AS \"Employee\
    \ Name\",\n  round(SUM(p.amount), 2) AS \"Total Earnings\",\n  any(e.termination_date) AS \"Termination\
    \ Date\",\n  max(p.pay_date) AS \"Last Pay Date\"\nFROM dbpcm_warehouse.payroll AS p\nJOIN dbpcm_warehouse.employee\
    \ AS e\n  ON e.employee_code = p.employee_code\nWHERE\n  p.register_type = 'EARN'\n  AND p.pay_date\
    \ >= {pay_window_start}\n  AND p.pay_date < {pay_window_end}\n  AND NOT (\n    e.termination_date\
    \ IS NULL\n  )\n  AND toDate32(e.termination_date) > toDate32('1900-01-01')\n  AND p.pay_date > e.termination_date\n\
    \  AND (\n    e.most_recent_hire_date IS NULL\n    OR toDate32(e.most_recent_hire_date) <= toDate32('1900-01-01')\n\
    \    OR e.most_recent_hire_date <= e.termination_date\n  )\nGROUP BY\n  p.employee_code\nORDER BY\
    \ {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: pay_window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Total Earnings
      direction: DESC
    allowed_columns:
    - Employee Code
    - Employee Name
    - Total Earnings
    - Termination Date

- id: bp-timeoff-lead-time
  intent: Median days from submission date to requested leave date by leave type for approved requests
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT t.earn_description AS \"Leave Type\",\n       t.earn_code AS \"Earn Code\",\n\
    \       round((quantileExactLow(0.5)(t.lead_days) + quantileExactHigh(0.5)(t.lead_days)) / 2, 1) AS\
    \ \"Median Lead Days\",\n       COUNT(*) AS \"Request Rows\"\nFROM\n  (SELECT earn_description,\n\
    \          earn_code,\n          dateDiff('day', date_added, request_date) AS lead_days\n   FROM dbpcm_warehouse.time_off_request\n\
    \   WHERE status = 'Approved'\n     AND request_date IS NOT NULL\n     AND toDate32(request_date)\
    \ > toDate32('1900-01-01')\n     AND toDate32(request_date) BETWEEN {window_start} AND {window_end})\
    \ AS t\nGROUP BY t.earn_description,\n         t.earn_code\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Median Lead Days\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Median Lead Days\"\n                   END ASC\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, order_direction
  uses:
  - dbpcm_warehouse.time_off_request.date_added
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.earn_description
  - dbpcm_warehouse.time_off_request.status
  column_formats:
    Leave Type:
      kind: text
    Earn Code:
      kind: identifier
    Median Lead Days:
      kind: number
      unit: days
      precision: 2
    Request Rows:
      kind: integer
- id: bp-timeoff-seasonality
  intent: Approved time-off hours bucketed by month and by day-of-week over a trailing N-month window
    based on request date
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(t.request_date), '%Y-%m') AS \"Month\",\n      \
    \ round(SUM(t.hours), 2) AS \"Approved Hours\"\nFROM dbpcm_warehouse.time_off_request AS t\nWHERE\
    \ t.status = 'Approved'\n  AND t.hours IS NOT NULL\n  AND t.request_date >=\n    (SELECT MAX(request_date)\n\
    \     FROM dbpcm_warehouse.time_off_request) - INTERVAL {win} MONTH\nGROUP BY \"Month\"\nORDER BY\
    \ CASE\n             WHEN {order_direction} = 'DESC' THEN \"Month\"\n         END DESC, CASE\n   \
    \                    WHEN {order_direction} = 'ASC' THEN \"Month\"\n                   END ASC\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.status
  column_formats:
    Month:
      kind: text
    Approved Hours:
      kind: number
      unit: hours
      precision: 2
- id: bp-timeoff-vs-paid-leave-tieout
  intent: Reconcile approved time-off request hours against paid leave hours from total_earning per employee
    per month, showing variance and percentage difference
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH tor_monthly AS\n  (SELECT employee_code,\n          formatDateTime(toStartOfMonth(request_date),\
    \ '%Y-%m') AS month,\n          round(SUM(hours), 2) AS tor_hours\n   FROM dbpcm_warehouse.time_off_request\n\
    \   WHERE status = 'Approved'\n     AND request_date >= addMonths(today(), -{win})\n     AND earn_code\
    \ IN\n       (SELECT earn_code\n        FROM dbpcm_warehouse.earning_category FINAL\n        WHERE\
    \ category_name = {timeoff_category})\n   GROUP BY employee_code,\n            formatDateTime(toStartOfMonth(request_date),\
    \ '%Y-%m')),\n     te_monthly AS\n  (SELECT employee_code,\n          formatDateTime(toStartOfMonth(punch_date),\
    \ '%Y-%m') AS month,\n          round(SUM(earn_hours), 2) AS te_hours\n   FROM\n     (SELECT employee_code,\n\
    \             punch_date,\n             earn_code,\n             earn_hours\n      FROM dbpcm_warehouse.total_earning)\n\
    \   WHERE punch_date >= addMonths(today(), -{win})\n     AND earn_code IN\n       (SELECT earn_code\n\
    \        FROM dbpcm_warehouse.earning_category FINAL\n        WHERE category_name = {timeoff_category})\n\
    \   GROUP BY employee_code,\n            formatDateTime(toStartOfMonth(punch_date), '%Y-%m'))\nSELECT\
    \ COALESCE(r.employee_code, t.employee_code) AS \"Employee Code\",\n       max(e.employee_name) AS\
    \ \"Employee Name\",\n       COALESCE(r.month, t.month) AS \"Month\",\n       round(COALESCE(r.tor_hours,\
    \ 0), 2) AS \"Approved Timeoff Hours\",\n       round(COALESCE(t.te_hours, 0), 2) AS \"Paid Leave\
    \ Hours\",\n       round(COALESCE(r.tor_hours, 0) - COALESCE(t.te_hours, 0), 2) AS \"Difference\"\
    ,\n       round(abs(COALESCE(r.tor_hours, 0) - COALESCE(t.te_hours, 0)) / nullIf(COALESCE(t.te_hours,\
    \ 0), 0) * 100, 2) AS \"Pct Diff\"\nFROM tor_monthly r\nFULL OUTER JOIN te_monthly t ON t.employee_code\
    \ = r.employee_code\nAND t.month = r.month\nLEFT JOIN dbpcm_warehouse.employee e ON e.employee_code\
    \ = COALESCE(r.employee_code, t.employee_code)\nGROUP BY COALESCE(r.employee_code, t.employee_code),\n\
    \         COALESCE(r.month, t.month),\n         r.tor_hours,\n         t.te_hours\nORDER BY CASE\n\
    \             WHEN {order_direction} = 'DESC' THEN abs(COALESCE(r.tor_hours, 0) - COALESCE(t.te_hours,\
    \ 0))\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN abs(COALESCE(r.tor_hours,\
    \ 0) - COALESCE(t.te_hours, 0))\n                   END ASC\nLIMIT {top_n}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  - name: timeoff_category
    type: entity
    required: true
    binds_to: dbpcm_warehouse.earning_category.category_name
    description: Resolve the requested timeoff concept to this client's category label; do not invent
      earning codes.
  slots_summary: win, top_n, order_direction, timeoff_category
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Month:
      kind: text
    Approved Timeoff Hours:
      kind: number
      unit: hours
      precision: 2
    Paid Leave Hours:
      kind: number
      unit: hours
      precision: 2
    Difference:
      kind: number
      unit: hours
      precision: 2
    Pct Diff:
      kind: percent
      scale: percent
      precision: 2
- id: bp-timeoff-withdrawal-rate
  intent: Removed or withdrawn time-off request rate by department, with denominator counting all active
    workflow statuses
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.department_name AS \"Department\",\n       COUNT(*) AS \"Total Requests\",\n\
    \       COUNTIf(t.status = 'Removed') AS \"Removed Requests\",\n       round((COUNTIf(t.status = 'Removed')\
    \ / nullIf(COUNT(*), 0)) * 100, 2) AS \"Withdrawal Rate Pct\"\nFROM dbpcm_warehouse.time_off_request\
    \ AS t\nJOIN dbpcm_warehouse.employee AS e ON e.employee_code = t.employee_code\nWHERE t.status IN\
    \ ('Approved',\n                   'Denied',\n                   'Removed',\n                   'Requested')\n\
    \  AND toDate32(t.request_date) BETWEEN {window_start} AND {window_end}\nGROUP BY e.department_name\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Withdrawal Rate Pct\"\n       \
    \  END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Withdrawal Rate Pct\"\
    \n                   END ASC, \"Department\"\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, order_direction
  uses:
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Total Requests:
      kind: integer
    Removed Requests:
      kind: integer
    Withdrawal Rate Pct:
      kind: percent
      scale: percent
      precision: 2

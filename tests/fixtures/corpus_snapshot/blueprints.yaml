  sql_template: "SELECT\n  te.earn_code AS \"Earn Code\",\n  any(te.earn_code_description) AS \"Description\"\
    ,\n  round(SUM(te.earn_amount), 2) AS \"Total Dollars\",\n  round(SUM(te.earn_hours), 2) AS \"Total\
    \ Hours\"\nFROM (\n  SELECT\n    punch_date,\n    earn_amount,\n    earn_code,\n    earn_code_description,\n\
    \    earn_hours\n  FROM dbpcm_warehouse.total_earning\n) AS te\nJOIN (\n  SELECT\n    earn_code,\n\
    \    category_name\n  FROM dbpcm_warehouse.earning_category\n) AS ec\n  ON ec.earn_code = te.earn_code\n\
    WHERE\n  ec.category_name IN ({concept})\n  AND te.punch_date >= toDate('2023-01-01')\n  AND te.punch_date\
    \ <= toDate('2026-12-31')\nGROUP BY\n  te.earn_code\nORDER BY\n  \"Total Dollars\" DESC,\n  \"Earn\
    \ Code\"\nLIMIT {top_n}\n"

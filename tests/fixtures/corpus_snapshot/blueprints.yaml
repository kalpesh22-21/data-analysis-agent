- id: bp-upcoming-anniversaries
  intent: Active employees with upcoming work anniversaries based on hire date month and day within the
    next N days
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       employee_name AS \"Name\",\n     \
    \  department_name AS \"Department\",\n       hire_date AS \"Hire Date\",\n       date_diff('year',\
    \ hire_date, now()) AS \"Years of Service\"\nFROM dbpcm_warehouse.employee\nWHERE employee_status\
    \ = 'Active'\n  AND hire_date IS NOT NULL\n  AND toDate32(hire_date) > toDate32('1900-01-01')\n  AND\
    \ toDayOfYear(hire_date) >= toDayOfYear(now())\n  AND toDayOfYear(hire_date) <= toDayOfYear(now())\
    \ + {win}\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN toDayOfYear(hire_date)\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN toDayOfYear(hire_date)\n\
    \                   END ASC, employee_code\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Employee Code:
      kind: identifier
    Name:
      kind: text
    Department:
      kind: text
    Hire Date:
      kind: datetime
    Years of Service:
      kind: number
      unit: years
      precision: 2
- id: bp-upcoming-timeoff-roster
  intent: Roster of employees with approved time-off requests in the next N days for coverage planning,
    optionally filtered by department
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT t.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\
    \ Name\",\n       any(e.department_name) AS \"Department\",\n       toDate32(t.request_date) AS \"\
    Request Date\",\n       t.earn_description AS \"Leave Type\",\n       round(SUM(t.hours), 2) AS \"\
    Hours\"\nFROM dbpcm_warehouse.time_off_request AS t\nJOIN dbpcm_warehouse.employee AS e ON e.employee_code\
    \ = t.employee_code\nWHERE t.status = 'Approved'\n  AND toDate32(t.request_date) >= today()\n  AND\
    \ toDate32(t.request_date) <= today() + INTERVAL {win} DAY\n  AND e.department_name = {dept}\nGROUP\
    \ BY t.employee_code,\n         toDate32(t.request_date),\n         t.earn_description\nORDER BY toDate32(t.request_date)\
    \ ASC, \"Employee Code\"\n"
  slots:
  - name: win

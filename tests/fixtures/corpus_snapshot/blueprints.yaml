- id: bp-headcount-by-hire-era
  intent: Active headcount and average tenure split by hire era around a supplied window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT multiIf(hire_date < {era_window_start}, 'Pre Era', hire_date < {era_window_end},\
    \ 'Era', 'Post Era') AS \"Hire Era\",\n       count(DISTINCT employee_code) AS \"Headcount\",\n  \

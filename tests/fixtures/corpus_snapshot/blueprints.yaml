      kind: text
    Department:
      kind: text
    Old Termination Date:
      kind: datetime
    Rehire Date:
      kind: datetime
    Days Between:
      kind: number
      unit: days
      precision: 2
- id: bp-retroactive-change-share
  intent: Count and share of retroactive employee master-data changes where the effective date precedes
    the record date by more than a specified number of days, grouped by changed field
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "-- Output aliases are Title-Case display names; consumers keying on column names\n--\
    \ must use the quoted aliases.\n\nSELECT changed_field AS \"Changed Field\",\n       count() AS \"\
    Retroactive Changes\",\n       round(count() * 100.0 / nullIf(\n                                 \
    \       (SELECT count()\n                                         FROM dbpcm_warehouse.employee_change\n\
    \                                         WHERE change_time_added >= addMonths(today(), -{win})\n\
    \                                           AND effective_date IS NOT NULL), 0), 2) AS \"Share Pct\"\
    \nFROM dbpcm_warehouse.employee_change\nWHERE change_time_added >= addMonths(today(), -{win})\n  AND\
    \ effective_date IS NOT NULL\n  AND dateDiff('day', effective_date, change_time_added) > {lag_days}\n\
    GROUP BY changed_field\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Retroactive\
    \ Changes\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"\
    Retroactive Changes\"\n                   END ASC, \"Changed Field\"\nLIMIT {max_rows}\n"
  slots:
  - name: lag_days
    type: positive_integer
    required: true
  - name: win
    type: relative_window
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: lag_days, win, max_rows, order_direction
  uses:
  - dbpcm_warehouse.employee_change.effective_date
  - dbpcm_warehouse.employee_change.change_time_added
  - dbpcm_warehouse.employee_change.changed_field
  column_formats:
    Changed Field:
      kind: text
    Retroactive Changes:
      kind: integer
    Share Pct:
      kind: percent
      scale: percent
      precision: 2
- id: bp-salary-distribution
  intent: Annual compensation histogram by pay type with positive whole-currency band_width. Lower inclusive,
    upper exclusive; percentages use the selected known-compensation population within each pay type.
    salary_population selects recorded (including zero) or positive values. Salary uses annual_salary;
    Hourly uses hourly_salary and estimated annual compensation = hourly_salary * 2080 (40 hours/week,
    52 weeks/year; excludes overtime). Keep pay types separate. Defaults to Active + On Leave; employee_status
    overrides or All removes the filter.
  slots_summary: band_width, salary_population, employee_status, department, employee, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: band_width
    type: positive_integer
    required: true
    min_value: 1
    max_value: 10000000
  - name: salary_population
    type: enum
    required: true
    enum_values:
    - recorded
    - positive
    description: Use recorded (including zero) unless the user explicitly requests positive/nonzero compensation.
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Lower Bound
  - Pay Type
  sql_template: "SELECT e.employee_pay_type AS `Pay Type`,\n       CASE\n           WHEN e.employee_pay_type\
    \ = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'\n           WHEN e.employee_pay_type\
    \ = 'Salary' THEN 'Recorded annual salary'\n           ELSE 'Unknown compensation basis'\n       END\
    \ AS `Compensation Basis`,\n       floor((CASE\n                  WHEN e.employee_pay_type = 'Salary'\
    \ THEN e.annual_salary\n                  WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\
    \ * 2080\n                  ELSE NULL\n              END) / {band_width}) * {band_width} AS `Lower\
    \ Bound`, (floor((CASE\n                                                                         \
    \       WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                               \
    \                                                 WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\
    \ * 2080\n                                                                                ELSE NULL\n\
    \                                                                            END) / {band_width})\
    \ + 1) * {band_width} AS `Upper Bound Exclusive`,\n                                              \
    \                                                           count(*) AS `Employee Count`,\n      \
    \                                                                                                \
    \   100.0 * count(*) / sum(count(*)) OVER (PARTITION BY e.employee_pay_type) AS `Percent Within Pay\
    \ Type`\nFROM dbpcm_warehouse.employee e\nWHERE (e.employee_status = {employee_status}\n       OR\
    \ {employee_status} = 'All')\n  AND e.department_name = {department}\n  AND e.employee_code = {employee}\n\
    \  AND (CASE\n           WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n           WHEN\
    \ e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n           ELSE NULL\n       END) IS\
    \ NOT NULL\n  AND ({salary_population} = 'recorded'\n       OR (CASE\n               WHEN e.employee_pay_type\
    \ = 'Salary' THEN e.annual_salary\n               WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\
    \ * 2080\n               ELSE NULL\n           END) > 0)\nGROUP BY e.employee_pay_type,\n        \
    \ floor((CASE\n                    WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n    \
    \                WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n               \
    \     ELSE NULL\n                END) / {band_width})\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN `Lower Bound`\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN `Lower Bound`\n                   END ASC\n"
  uses_rules:

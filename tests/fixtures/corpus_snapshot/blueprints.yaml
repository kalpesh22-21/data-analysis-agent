- id: bp-comp-range-exceptions
  intent: Active employees paid outside their salary range or below a compa-ratio cap
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       department_name AS \"Department\"\
    ,\n       round(annual_salary, 2) AS \"Annual Salary\",\n       round(salary_min, 2) AS \"Range Min\"\
    ,\n       round(salary_mid, 2) AS \"Range Mid\",\n       round(salary_max, 2) AS \"Range Max\",\n\
    \       round(toFloat64(annual_salary) / nullIf(toFloat64(salary_mid), 0), 3) AS \"Compa Ratio\"\n\
    FROM dbpcm_warehouse.employee\nWHERE employee_status = 'Active'\n  AND department_name = {department}\n\
    \  AND annual_salary IS NOT NULL\n  AND (toFloat64(annual_salary) < toFloat64(salary_min)\n      \
    \ OR (toFloat64(salary_max) > 0\n           AND toFloat64(annual_salary) > toFloat64(salary_max))\n\
    \       OR toFloat64(annual_salary) / nullIf(toFloat64(salary_mid), 0) < {compa_cap_pct} / 100.0)\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Compa Ratio\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Compa Ratio\"\n             \
    \      END ASC\n"
  slots:
  - name: compa_cap_pct
    type: positive_integer
    required: true
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: compa_cap_pct, department, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.salary_min
  - dbpcm_warehouse.employee.salary_mid
  - dbpcm_warehouse.employee.salary_max
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Employee Code:
      kind: identifier
    Department:
      kind: text
    Annual Salary:
      kind: currency
      currency: USD
      precision: 2
    Range Min:
      kind: currency
      currency: USD
    Range Mid:
      kind: currency
      currency: USD
    Range Max:
      kind: currency
      currency: USD
    Compa Ratio:
      kind: number
      precision: 3
- id: bp-compare-employee-check-detail-two-periods
  intent: Compare a single employee's two paychecks line-item by line-item across two pay periods, with
    per-item deltas
  slots_summary: employee, period_a, period_b
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.payroll.type_code_description
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  slots:
  - name: employee
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.employee_code
  - name: period_a
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  - name: period_b
    type: period
    temporal_type: date
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  result_grain:
  - register_type
  - type_code
  composes:
  - order: 0
    output:
      detail_a: table
    ref:
      blueprint: bp-employee-check-detail-for-period
      slots:
        employee: employee
        period: period_a
  - order: 1
    output:
      detail_b: table
    ref:
      blueprint: bp-employee-check-detail-for-period
      slots:
        employee: employee
        period: period_b
  - order: 2
    feeds_from:
    - 0
    - 1
    consumes:
      detail_a: $0
      detail_b: $1
    output: {}
    sql_template: "SELECT coalesce(a.register_type, b.register_type) AS register_type,\n       coalesce(a.type_code,\
      \ b.type_code) AS type_code,\n       coalesce(a.type_code_description, b.type_code_description)\
      \ AS type_code_description,\n       coalesce(a.amount, 0) AS amount_a,\n       coalesce(b.amount,\
      \ 0) AS amount_b,\n       coalesce(b.amount, 0) - coalesce(a.amount, 0) AS amount_delta,\n     \
      \  coalesce(a.hours, 0) AS hours_a,\n       coalesce(b.hours, 0) AS hours_b\nFROM scratch.detail_a\
      \ AS a\nFULL OUTER JOIN scratch.detail_b AS b ON a.register_type = b.register_type\nAND a.type_code\
      \ = b.type_code\nORDER BY coalesce(a.register_type, b.register_type),\n         coalesce(a.type_code,\
      \ b.type_code)\n"
  column_formats:
    register_type:
      kind: text
    type_code:
      kind: identifier
    type_code_description:
      kind: text
    amount_a:
      kind: currency
      currency: USD
      precision: 2
    amount_b:
      kind: currency
      currency: USD
      precision: 2
    amount_delta:
      kind: currency
      currency: USD
      precision: 2
    hours_a:
      kind: number
      unit: hours
      precision: 2
    hours_b:
      kind: number
      unit: hours
      precision: 2
- id: bp-compare-employee-paychecks-two-periods
  intent: Compare a single employee's paychecks line-item by line-item across two given pay periods, with
    per-item amounts, hours, and period-over-period change
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT toString(register_type) AS \"Pay Category\",\n       toString(type_code) AS \"\
    Pay Code\",\n       any(toString(type_code_description)) AS \"Description\",\n       round(toFloat64(sumIf(amount,\
    \ pay_period_end_date = {period_b})), 2) AS \"Recent Amount\",\n       round(toFloat64(sumIf(type_hours,\
    \ pay_period_end_date = {period_b})), 2) AS \"Recent Hours\",\n       round(toFloat64(sumIf(amount,\
    \ pay_period_end_date = {period_a})), 2) AS \"Prior Amount\",\n       round(toFloat64(sumIf(type_hours,\
    \ pay_period_end_date = {period_a})), 2) AS \"Prior Hours\",\n       round(toFloat64(sumIf(amount,\
    \ pay_period_end_date = {period_b}) - sumIf(amount, pay_period_end_date = {period_a})), 2) AS \"Amount\
    \ Change\",\n       round(toFloat64(sumIf(type_hours, pay_period_end_date = {period_b}) - sumIf(type_hours,\
    \ pay_period_end_date = {period_a})), 2) AS \"Hours Change\"\nFROM dbpcm_warehouse.payroll\nWHERE\
    \ employee_code = {employee}\n  AND pay_period_end_date IN ({period_a}, {period_b})\nGROUP BY register_type,\n\
    \         type_code\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN toString(register_type)\n\
    \         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN toString(register_type)\n\
    \                   END ASC, toString(type_code)\n"
  slots:
  - name: employee
    type: string
    required: true
    binds_to: dbpcm_warehouse.payroll.employee_code
  - name: period_a
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: period_b
    type: period
    required: true

  uses:
  - dbpcm_warehouse.expense.expense_status
  - dbpcm_warehouse.expense.amount_approved
  - dbpcm_warehouse.expense.department_description
  - dbpcm_warehouse.expense.expense_paid_date
  column_formats:
    Department:
      kind: text
    Denied Count:
      kind: integer
    Denied Amount:
      kind: currency
      currency: USD
      precision: 2
    Denial Rate:
      kind: percent
      scale: ratio
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Denied Count
- id: bp-department-directory
  intent: Complete department dictionary with codes, names, active headcount and total headcount including

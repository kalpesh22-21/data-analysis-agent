  sql_template: "SELECT\n  employee_code AS \"Employee Code\",\n  employee_name AS \"Name\",\n  department_name\
    \ AS \"Department\",\n  toUInt8(badge_number IS NULL OR badge_number = '') AS \"No Badge\",\n  toUInt8(employee_gl_code\
    \ IS NULL OR employee_gl_code = '') AS \"No GL Code\",\n  toUInt8(paycode_profile_code IS NULL OR\
    \ paycode_profile_code = '') AS \"No Paycode Profile\",\n  toUInt8(earning_profile IS NULL OR earning_profile\
    \ = '') AS \"No Earning Profile\",\n  toUInt8(pay_class IS NULL OR pay_class = '') AS \"No Pay Class\"\
    ,\n  toUInt8(pay_frequency IS NULL OR pay_frequency = '') AS \"No Pay Frequency\",\n  toUInt8(schedule_group\
    \ IS NULL OR schedule_group = '') AS \"No Schedule Group\",\n  toUInt8((\n    badge_number IS NULL\
    \ OR badge_number = ''\n  )) + toUInt8((\n    employee_gl_code IS NULL OR employee_gl_code = ''\n\
    \  )) + toUInt8((\n    paycode_profile_code IS NULL OR paycode_profile_code = ''\n  )) + toUInt8((\n\
    \    earning_profile IS NULL OR earning_profile = ''\n  )) + toUInt8((\n    pay_class IS NULL OR pay_class\
    \ = ''\n  )) + toUInt8((\n    pay_frequency IS NULL OR pay_frequency = ''\n  )) + toUInt8((\n    schedule_group\
    \ IS NULL OR schedule_group = ''\n  )) AS \"Gap Count\"\nFROM dbpcm_warehouse.employee\nWHERE\n  employee_status\
    \ = 'Active'\n  AND department_name IN ({department})\n  AND (\n    toUInt8((\n      badge_number\
    \ IS NULL OR badge_number = ''\n    )) + toUInt8((\n      employee_gl_code IS NULL OR employee_gl_code\
    \ = ''\n    )) + toUInt8((\n      paycode_profile_code IS NULL OR paycode_profile_code = ''\n    ))\
    \ + toUInt8((\n      earning_profile IS NULL OR earning_profile = ''\n    )) + toUInt8((\n      pay_class\
    \ IS NULL OR pay_class = ''\n    )) + toUInt8((\n      pay_frequency IS NULL OR pay_frequency = ''\n\
    \    )) + toUInt8((\n      schedule_group IS NULL OR schedule_group = ''\n    ))\n  ) > 0\nORDER BY\
    \ {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: department

- id: bp-salary-exact-median
  intent: Exact middle-pair median, mean, min, max and known-compensation count by company, department
    or status, separately by pay type. salary_population selects recorded values (including zero) or positive
    values; NULLs excluded. Salary uses annual_salary; Hourly uses hourly_salary and estimated annual
    compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes overtime). Keep pay types
    separate. Defaults to Active + On Leave; employee_status overrides or All removes the filter.
  slots_summary: group_by, salary_population, employee_status, department, employee, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
  - name: salary_population
    type: enum
    required: true
    enum_values:
    - recorded
    - positive
    description: Use recorded (including zero) unless the user explicitly requests positive/nonzero compensation.
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  - Pay Type
  sql_template: "SELECT e.employee_pay_type AS `Pay Type`,\n       CASE\n           WHEN e.employee_pay_type\
    \ = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'\n           WHEN e.employee_pay_type\
    \ = 'Salary' THEN 'Recorded annual salary'\n           ELSE 'Unknown compensation basis'\n       END\
    \ AS `Compensation Basis`,\n       CASE\n           WHEN {group_by} = 'department' THEN e.department_name\n\
    \           WHEN {group_by} = 'status' THEN e.employee_status\n           ELSE 'Company'\n       END\
    \ AS `Group`,\n       count((CASE\n                  WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n\
    \                  WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n             \
    \     ELSE NULL\n              END)) AS `Known Compensation Count`,\n       (quantileExactLow(0.5)((CASE\n\
    \                                   WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n   \
    \                                WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n\
    \                                   ELSE NULL\n                               END)) + quantileExactHigh(0.5)((CASE\n\
    \                                                                   WHEN e.employee_pay_type = 'Salary'\
    \ THEN e.annual_salary\n                                                                   WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n                                                       \
    \            ELSE NULL\n                                                               END))) / 2\
    \ AS `Exact Median Annual Compensation`,\n       avg((CASE\n                WHEN e.employee_pay_type\
    \ = 'Salary' THEN e.annual_salary\n                WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\
    \ * 2080\n                ELSE NULL\n            END)) AS `Average Annual Compensation`,\n       min((CASE\n\
    \                WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n                ELSE NULL\n            END)) AS `Minimum\
    \ Annual Compensation`,\n       max((CASE\n                WHEN e.employee_pay_type = 'Salary' THEN\
    \ e.annual_salary\n                WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n\
    \                ELSE NULL\n            END)) AS `Maximum Annual Compensation`,\n       avg(CASE\n\
    \               WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\n               ELSE NULL\n\
    \           END) AS `Average Hourly Rate`\nFROM dbpcm_warehouse.employee e\nWHERE (e.employee_status\
    \ = {employee_status}\n       OR {employee_status} = 'All')\n  AND e.department_name = {department}\n\
    \  AND e.employee_code = {employee}\n  AND (CASE\n           WHEN e.employee_pay_type = 'Salary' THEN\
    \ e.annual_salary\n           WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n  \
    \         ELSE NULL\n       END) IS NOT NULL\n  AND ({salary_population} = 'recorded'\n       OR (CASE\n\
    \               WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n               WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n               ELSE NULL\n           END) > 0)\nGROUP BY\
    \ e.employee_pay_type,\n         CASE\n             WHEN {group_by} = 'department' THEN e.department_name\n\
    \             WHEN {group_by} = 'status' THEN e.employee_status\n             ELSE 'Company'\n   \
    \      END\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN `Group`\n         END\
    \ DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN `Group`\n               \
    \    END ASC\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Group:
      kind: text
    Known Compensation Count:
      kind: integer
    Exact Median Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Average Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Minimum Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Maximum Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
- id: bp-salary-histogram
  intent: Active employee salary distribution histogram in configurable dollar bands, excluding zero or
    null salary placeholders
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT concat('$', toString(toInt32(floor(toFloat64(annual_salary) / toUInt32({band}))\
    \ * toUInt32({band}))), ' - $', toString(toInt32(floor(toFloat64(annual_salary) / toUInt32({band}))\
    \ * toUInt32({band}) + toUInt32({band}) - 1))) AS \"Salary Band\",\n       count(DISTINCT employee_code)\
    \ AS \"Headcount\"\nFROM dbpcm_warehouse.employee\nWHERE employee_status = 'Active'\n  AND annual_salary\
    \ IS NOT NULL\n  AND toFloat64(annual_salary) > 0\nGROUP BY floor(toFloat64(annual_salary) / toUInt32({band}))\n\
    ORDER BY floor(toFloat64(annual_salary) / toUInt32({band})) ASC\n"
  slots:
  - name: band
    type: positive_integer
    required: true
  slots_summary: band
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Salary Band:
      kind: text
    Headcount:
      kind: integer
- id: bp-salary-threshold-count
  intent: Employee counts by pay type above, below, at least or exactly a whole-currency annual compensation
    threshold. Empty results mean no matches. Salary uses annual_salary; Hourly uses hourly_salary and
    estimated annual compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes overtime).
    Keep pay types separate. Defaults to Active + On Leave; employee_status overrides or All removes the
    filter.
  slots_summary: comparison, salary, employee_status, department, employee
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: comparison
    type: enum
    required: true
    enum_values:
    - above
    - at_least
    - equal
    - below
  - name: salary
    type: nonnegative_integer
    required: true
    min_value: 0
    max_value: 1000000000
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: e.employee_status IN ('Active', 'On Leave')
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  result_grain:
  - Pay Type
  sql_template: "SELECT e.employee_pay_type AS `Pay Type`,\n       CASE\n           WHEN e.employee_pay_type\
    \ = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'\n           WHEN e.employee_pay_type\
    \ = 'Salary' THEN 'Recorded annual salary'\n           ELSE 'Unknown compensation basis'\n       END\
    \ AS `Compensation Basis`,\n       count(DISTINCT e.employee_code) AS `Employee Count`\nFROM dbpcm_warehouse.employee\
    \ e\nWHERE (e.employee_status = {employee_status}\n       OR {employee_status} = 'All')\n  AND e.department_name\
    \ = {department}\n  AND e.employee_code = {employee}\n  AND (({comparison} = 'above'\n        AND\
    \ (CASE\n                 WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n             \
    \    WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n                 ELSE NULL\n\
    \             END) > {salary})\n       OR ({comparison} = 'at_least'\n           AND (CASE\n     \
    \               WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                    WHEN\
    \ e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080\n                    ELSE NULL\n    \
    \            END) >= {salary})\n       OR ({comparison} = 'equal'\n           AND (CASE\n        \
    \            WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary\n                    WHEN e.employee_pay_type\
    \ = 'Hourly' THEN e.hourly_salary * 2080\n                    ELSE NULL\n                END) = {salary})\n\
    \       OR ({comparison} = 'below'\n           AND (CASE\n                    WHEN e.employee_pay_type\
    \ = 'Salary' THEN e.annual_salary\n                    WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary\
    \ * 2080\n                    ELSE NULL\n                END) < {salary}))\nGROUP BY e.employee_pay_type\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Employee Count:
      kind: integer

- id: bp-headcount-monthly-trend
  intent: End-of-month active headcount and monthly termination trend reconstructed from hire and termination
    dates over the last N months
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(dateTrunc('MONTH', month_end), '%Y-%m') AS \"Month\",\n  countIf(\n\
    \    hire_date <= month_end\n    AND (\n      termination_date IS NULL\n      OR toDate32(termination_date)\
    \ <= toDate32('1900-01-01')\n      OR termination_date > month_end\n    )\n  ) AS \"Active Headcount\"\
    ,\n  countIf(\n    termination_date >= dateTrunc('MONTH', month_end)\n    AND termination_date <=\
    \ month_end\n    AND NOT (\n      termination_date IS NULL\n    )\n    AND toDate32(termination_date)\
    \ > toDate32('1900-01-01')\n    AND (\n      most_recent_hire_date IS NULL OR most_recent_hire_date\
    \ < termination_date\n    )\n  ) AS \"Terms In Month\"\nFROM (\n  SELECT\n    toLastDayOfMonth(addMonths(anchor.latest_hire,\
    \ -toInt32(number))) AS month_end\n  FROM (\n    SELECT\n      max(hire_date) AS latest_hire\n   \
    \ FROM dbpcm_warehouse.employee\n    WHERE\n      toDate32(hire_date) > toDate32('1900-01-01')\n \
    \ ) AS anchor\n  CROSS JOIN (\n    SELECT\n      arrayJoin(range(0, toInt32({win}))) AS number\n \
    \ ) AS seq\n) AS months\nCROSS JOIN dbpcm_warehouse.employee AS e\nWHERE\n  NOT (\n    hire_date IS\
    \ NULL\n  ) AND toDate32(hire_date) > toDate32('1900-01-01')\nGROUP BY\n  \"Month\"\nORDER BY {order_by}\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Active Headcount
    - Terms In Month
  slots_summary: win, order_by
  uses:
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Month:
      kind: text
    Active Headcount:
      kind: integer
    Terms In Month:
      kind: integer
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Active Headcount
    - Terms In Month
- id: bp-hires-in-range
  intent: New hires per month within an explicit start/end date range — counts by original hire date;
    rehires are not re-counted
  slots_summary: hire_window, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: hire_window
    type: period_range
    temporal_type: date
    required: true
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Hires
  result_grain:
  - Month
  window_anchor: calendar
  sql_template: "SELECT\n  dateTrunc('MONTH', hire_date) AS \"Month\",\n  COUNT(DISTINCT employee_code)\
    \ AS \"Hires\"\nFROM dbpcm_warehouse.employee\nWHERE\n  hire_date >= {hire_window_start}\n  AND hire_date\
    \ < {hire_window_end}\n  AND (\n    employee_status <> 'Not Hired' OR employee_status IS NULL\n  )\n\
    GROUP BY\n  dateTrunc('MONTH', hire_date)\nORDER BY {order_by}\n"
  column_formats:
    Month:
      kind: date
    Hires:
      kind: integer
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Hires
- id: bp-hires-per-month
  intent: New hires per month over a trailing window of the last N months — counts by original hire date;
    rehires are not re-counted
  slots_summary: window_months, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 36
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
    default:
    - column: Month
      direction: ASC
    allowed_columns:
    - Month
    - Hires
  result_grain:
  - Month
  window_anchor: data
  sql_template: "SELECT\n  dateTrunc('MONTH', hire_date) AS \"Month\",\n  COUNT(DISTINCT employee_code)\
    \ AS \"Hires\"\nFROM dbpcm_warehouse.employee\nWHERE\n  hire_date >= (\n    SELECT\n      dateTrunc('MONTH',\
    \ max(hire_date))\n    FROM dbpcm_warehouse.employee\n    WHERE\n      employee_status <> 'N' OR employee_status\
    \ IS NULL\n  ) - INTERVAL (\n    {window_months}\n  ) MONTH\n  AND (\n    employee_status <> 'N' OR\
    \ employee_status IS NULL\n  )\nGROUP BY\n  dateTrunc('MONTH', hire_date)\nORDER BY {order_by}\n"
  column_formats:
    Month:
      kind: date
    Hires:
      kind: integer
  presentation:
    kind: line
    category_columns:
    - Month
    measure_columns:
    - Hires
- id: bp-hires-projection
  intent: Projected number of hires over the next N months at the current hiring pace (run-rate over a
    trailing window) — counts by original hire date; rehires are not re-counted
  slots_summary: window_months, horizon_months, order_by
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.employee_status
  slots:
  - name: window_months
    type: relative_window
    required: true
    min_value: 2
    max_value: 36
  - name: horizon_months
    type: relative_window
    required: true
    min_value: 1
    max_value: 24
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Hires In Window ASC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Hires In Window
      direction: ASC
    allowed_columns:
    - Hires In Window
    - Average Monthly Hires
    - Projected Hires
  result_grain: []
  window_anchor: data
  sql_template: "SELECT\n  COUNT(DISTINCT employee_code) AS \"Hires In Window\",\n  round(COUNT(DISTINCT\
    \ employee_code) / {window_months}, 1) AS \"Average Monthly Hires\",\n  round(COUNT(DISTINCT employee_code)\
    \ / {window_months} * {horizon_months}) AS \"Projected Hires\"\nFROM dbpcm_warehouse.employee\nWHERE\n\
    \  hire_date >= addMonths(\n    (\n      SELECT\n        dateTrunc('MONTH', max(hire_date))\n    \
    \  FROM dbpcm_warehouse.employee\n      WHERE\n        employee_status <> 'N' OR employee_status IS\
    \ NULL\n    ),\n    1\n  ) - INTERVAL (\n    {window_months}\n  ) MONTH\n  AND (\n    employee_status\
    \ <> 'N' OR employee_status IS NULL\n  )\nORDER BY {order_by}\n"
  column_formats:
    Hires In Window:
      kind: integer
    Average Monthly Hires:
      kind: number
    Projected Hires:
      kind: number
  presentation:
    kind: facts
    measure_columns:
    - Hires In Window
    - Average Monthly Hires
    - Projected Hires
- id: bp-holiday-work-audit
  intent: Total paid hours and employee counts on company-observed holiday dates from total_earning using
    runtime-resolved holiday earn codes
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  te.punch_date AS \"Punch Date\",\n  count(DISTINCT te.employee_code) AS \"\
    Employees\",\n  round(SUM(te.earn_hours), 2) AS \"Total Hours\"\nFROM (\n  SELECT\n    employee_code,\n\
    \    punch_date,\n    earn_hours,\n    earn_code\n  FROM dbpcm_warehouse.total_earning\n) AS te\n\
    WHERE\n  (\n    te.punch_date >= {window_start} AND te.punch_date < {window_end}\n  )\n  AND te.earn_code\
    \ IN ({concept})\nGROUP BY\n  te.punch_date\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: concept
    type: string
    required: true
    binds_to: dbpcm_warehouse.total_earning.earn_code
    multiple: true
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Total Hours DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Total Hours
      direction: DESC
    allowed_columns:
    - Punch Date
    - Employees
    - Total Hours
  slots_summary: concept, window, max_rows, order_by
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Punch Date:
      kind: date
    Employees:
      kind: integer
    Total Hours:
      kind: number
      unit: hours
      precision: 2
  presentation:
    kind: line
    category_columns:
    - Punch Date
    measure_columns:
    - Employees
    - Total Hours

- id: bp-avg-shift-length
  intent: Average shift duration in hours from In/Out punch timestamps per punch pair by employee home
    department, using punch_pair event data only
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  e.department_name AS \"Department\",\n  round(AVG(DATE_DIFF(MINUTE, pp.in_punch_time,\
    \ pp.out_punch_time) / 60.0), 2) AS \"Avg Shift Hours\",\n  count() AS \"Pair Count\"\nFROM (\n  SELECT\n\
    \    employee_code,\n    punch_date,\n    in_punch_time,\n    out_punch_time\n  FROM dbpcm_warehouse.punch_pair\n\
    ) AS pp\nJOIN dbpcm_warehouse.employee AS e\n  ON e.employee_code = pp.employee_code\nWHERE\n  (\n\
    \    pp.punch_date >= {window_start} AND pp.punch_date < {window_end}\n  )\n  AND NOT (\n    pp.in_punch_time\
    \ IS NULL\n  )\n  AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n  AND NOT (\n    pp.out_punch_time\
    \ IS NULL\n  )\n  AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')\nGROUP BY\n  e.department_name\n\
    ORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Avg Shift Hours DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Avg Shift Hours
      direction: DESC
    allowed_columns:
    - Department
    - Avg Shift Hours
    - Pair Count
  slots_summary: window, max_rows, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Avg Shift Hours:
      kind: number
      unit: hours
      precision: 2
    Pair Count:
      kind: integer
  presentation:
    kind: bars
    category_columns:
    - Department
    measure_columns:
    - Avg Shift Hours
- id: bp-break-gap-median
  intent: Median break gap in hours between consecutive punch pairs on the same employee-day using punch_pair
    event timestamps only
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH ordered AS (\n  SELECT\n    employee_code,\n    punch_date,\n    in_punch_time,\n\
    \    out_punch_time,\n    toInt64(\n      row_number() OVER (PARTITION BY employee_code, punch_date\
    \ ORDER BY in_punch_time)\n    ) AS rn\n  FROM (\n    SELECT\n      employee_code,\n      punch_date,\n\
    \      in_punch_time,\n      out_punch_time\n    FROM dbpcm_warehouse.punch_pair\n  )\n  WHERE\n \
    \   (\n      punch_date >= {window_start} AND punch_date < {window_end}\n    )\n    AND NOT (\n  \
    \    in_punch_time IS NULL\n    )\n    AND toDate32(in_punch_time) > toDate32('1900-01-01')\n    AND\
    \ NOT (\n      out_punch_time IS NULL\n    )\n    AND toDate32(out_punch_time) > toDate32('1900-01-01')\n\
    )\nSELECT\n  current.employee_code AS \"Employee Code\",\n  current.punch_date AS \"Punch Date\",\n\
    \  round(\n    (\n      (\n        quantileExactLow(0.5)(DATE_DIFF(MINUTE, prev.out_punch_time, current.in_punch_time))\
    \ + quantileExactHigh(0.5)(DATE_DIFF(MINUTE, prev.out_punch_time, current.in_punch_time))\n      )\
    \ / 2\n    ) / 60.0,\n    2\n  ) AS \"Median Break Gap Hours\",\n  count() AS \"Gap Count\"\nFROM\
    \ ordered AS current\nJOIN ordered AS prev\n  ON prev.employee_code = current.employee_code\n  AND\
    \ prev.punch_date = current.punch_date\n  AND prev.rn = current.rn - 1\nGROUP BY\n  current.employee_code,\n\
    \  current.punch_date\nHAVING\n  count() > 0\nORDER BY {order_by}\nLIMIT {max_rows}\n\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Median Break Gap Hours DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Median Break Gap Hours
      direction: DESC
    allowed_columns:
    - Employee Code
    - Punch Date
    - Median Break Gap Hours
    - Gap Count
  slots_summary: window, max_rows, order_by
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  column_formats:
    Employee Code:
      kind: identifier
    Punch Date:
      kind: date
    Median Break Gap Hours:
      kind: number
      unit: hours
      precision: 2
    Gap Count:
      kind: integer
  presentation:
    kind: table

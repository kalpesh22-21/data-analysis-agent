- id: bp-negative-paycheck-employees
  intent: Employees and pay periods where net pay is negative, flagging reversals and adjustments that
    result in a negative net-pay amount
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT p.employee_code AS \"Employee Code\",\n       e.employee_name AS \"Employee Name\"\
    ,\n       e.department_name AS \"Department\",\n       p.pay_period_end_date AS \"Pay Period End\"\
    ,\n       round(SUMIf(p.amount, p.register_type = 'EARN'), 2) AS \"Gross Earnings\",\n       round(SUMIf(p.amount,\
    \ p.register_type = 'NETPAYDIST'), 2) AS \"Net Pay\"\nFROM dbpcm_warehouse.payroll p\nLEFT JOIN dbpcm_warehouse.employee\
    \ e ON e.employee_code = p.employee_code\nWHERE p.pay_period_end_date BETWEEN {window_start} AND {window_end}\n\
    GROUP BY p.employee_code,\n         e.employee_name,\n         e.department_name,\n         p.pay_period_end_date\n\
    HAVING \"Gross Earnings\" < 0\nOR \"Net Pay\" < 0\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Pay Period End\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Pay Period End\"\n                   END ASC, p.employee_code\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, order_direction
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date

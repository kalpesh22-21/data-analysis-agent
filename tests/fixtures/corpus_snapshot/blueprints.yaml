    \ AS \"Supervisor Name\",\n       'Missing Supervisor' AS \"Anomaly Type\"\nFROM dbpcm_warehouse.employee\n\
    WHERE employee_status = 'Active'\n  AND (primary_supervisor_ee_code IS NULL\n       OR primary_supervisor_ee_code\
    \ = '')\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Anomaly Type\"\n     \
    \    END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Anomaly Type\"\n\

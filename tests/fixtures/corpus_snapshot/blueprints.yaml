  intent: Expense spend matched to a user-supplied concept via rule or account descriptions for a payment
    date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT coalesce(expense_rule_description, expense_account_description) AS \"Matched Description\"\
    ,\n       round(toFloat64(SUM(amount_approved)), 2) AS \"Approved Spend\",\n       count() AS \"Line\
    \ Count\"\nFROM dbpcm_warehouse.expense\nWHERE expense_status IN ('Approved',\n                  \
    \       'Paid',\n                         'Marked as Paid')\n  AND expense_paid_date >= {expense_window_start}\n\
    \  AND expense_paid_date <= {expense_window_end}\n  AND (expense_rule_description ILIKE concat('%',\
    \ {concept}, '%')\n       OR expense_account_description ILIKE concat('%', {concept}, '%'))\nGROUP\
    \ BY coalesce(expense_rule_description, expense_account_description)\nORDER BY CASE\n            \
    \ WHEN {order_direction} = 'DESC' THEN \"Approved Spend\"\n         END DESC, CASE\n             \
    \          WHEN {order_direction} = 'ASC' THEN \"Approved Spend\"\n                   END ASC, \"\
    Matched Description\"\nLIMIT {max_rows}\n"
  slots:
  - name: concept
    type: string
    required: true
  - name: expense_window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true

- id: bp-ytd-earnings-per-employee
  intent: Year-to-date gross earnings, net pay, and paid hours per employee from the payroll register,
    optionally filtered by employee or department
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT p.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\
    \ Name\",\n       round(SUMIf(p.amount, p.register_type = 'EARN'), 2) AS \"Gross Earnings\",\n   \
    \    round(SUMIf(p.amount, p.register_type = 'NETPAYDIST'), 2) AS \"Net Pay\",\n       round(SUMIf(p.type_hours,\
    \ p.register_type = 'EARN'), 2) AS \"Paid Hours\"\nFROM dbpcm_warehouse.payroll AS p\nJOIN dbpcm_warehouse.employee\
    \ AS e ON e.employee_code = p.employee_code\nWHERE p.employee_code = {ee}\n  AND e.department_name\
    \ = {dept}\nGROUP BY p.employee_code\nORDER BY CASE\n             WHEN {order_direction} = 'DESC'\
    \ THEN \"Gross Earnings\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Gross Earnings\"\n                   END ASC\nLIMIT {top_n}\n"
  slots:
  - name: ee
    type: string
    required: false
    binds_to: dbpcm_warehouse.payroll.employee_code
    optional_pattern: 'TRUE'
  - name: dept
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: ee, dept, top_n, order_direction
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Gross Earnings:
      kind: currency
      currency: USD
    Net Pay:
      kind: currency
      currency: USD
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
- id: bp-zero-net-pay-employees
  intent: Employees with exactly $0.00 net pay in a pay period, distinguishing those with no net-pay-distribution
    rows from those with a zero net-pay amount
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\"\nFROM dbpcm_warehouse.payroll\nWHERE pay_period_end_date\
    \ = {period}\nGROUP BY employee_code\nHAVING SUMIf(amount, register_type = 'EARN') > 0\nAND SUMIf(amount,\
    \ register_type = 'NETPAYDIST') = 0\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN\
    \ \"Employee Code\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC'\
    \ THEN \"Employee Code\"\n                   END ASC\n"
  slots:
  - name: period
    type: period
    required: false
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  slots_summary: period, order_direction
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date
  column_formats:
    Employee Code:
      kind: identifier

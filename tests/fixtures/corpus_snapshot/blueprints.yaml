- id: bp-headcount-growth-rate
  intent: Monthly hires, terminations and net headcount delta over the last N months
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  formatDateTime(m.month_start, '%Y-%m') AS \"Month\",\n  countIf(\n    e.most_recent_hire_date\
    \ >= m.month_start\n    AND e.most_recent_hire_date <= m.month_end\n    AND NOT (\n      e.most_recent_hire_date\
    \ IS NULL\n    )\n    AND toDate32(e.most_recent_hire_date) > toDate32('1900-01-01')\n  ) AS \"Hires\"\
    ,\n  countIf(\n    e.termination_date >= m.month_start\n    AND e.termination_date <= m.month_end\n\
    \    AND NOT (\n      e.termination_date IS NULL\n    )\n    AND toDate32(e.termination_date) > toDate32('1900-01-01')\n\
    \    AND (\n      e.most_recent_hire_date IS NULL OR e.most_recent_hire_date < e.termination_date\n\
    \    )\n  ) AS \"Terms\",\n  countIf(\n    e.most_recent_hire_date >= m.month_start\n    AND e.most_recent_hire_date\
    \ <= m.month_end\n    AND NOT (\n      e.most_recent_hire_date IS NULL\n    )\n    AND toDate32(e.most_recent_hire_date)\
    \ > toDate32('1900-01-01')\n  ) - countIf(\n    e.termination_date >= m.month_start\n    AND e.termination_date\
    \ <= m.month_end\n    AND NOT (\n      e.termination_date IS NULL\n    )\n    AND toDate32(e.termination_date)\
    \ > toDate32('1900-01-01')\n    AND (\n      e.most_recent_hire_date IS NULL OR e.most_recent_hire_date\
    \ < e.termination_date\n    )\n  ) AS \"Net Delta\"\nFROM (\n  SELECT\n    addMonths(dateTrunc('MONTH',\
    \ anchor.latest_hire), -toInt32(number)) AS month_start,\n    toLastDayOfMonth(addMonths(anchor.latest_hire,\
    \ -toInt32(number))) AS month_end\n  FROM (\n    SELECT\n      max(most_recent_hire_date) AS latest_hire\n\
    \    FROM dbpcm_warehouse.employee\n    WHERE\n      toDate32(most_recent_hire_date) > toDate32('1900-01-01')\n\
    \  ) AS anchor\n  CROSS JOIN (\n    SELECT\n      arrayJoin(range(0, toInt32({win}))) AS number\n\
    \  ) AS seq\n) AS m\nCROSS JOIN dbpcm_warehouse.employee AS e\nGROUP BY\n  \"Month\"\nORDER BY {order_by}\n"
  slots:
  - name: win

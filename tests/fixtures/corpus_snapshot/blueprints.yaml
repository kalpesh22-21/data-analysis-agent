- id: bp-mileage-summary
  intent: Total approved mileage reimbursement and miles for a payment period
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT round(toFloat64(SUM(amount_approved)), 2) AS \"Approved Amount\",\n       round(toFloat64(SUM(approved_miles)),\
    \ 2) AS \"Approved Miles\",\n       round(toFloat64(SUM(submitted_miles)), 2) AS \"Submitted Miles\"\
    \nFROM dbpcm_warehouse.expense\nWHERE (submitted_miles > 0\n       OR approved_miles > 0)\n  AND expense_status\

    \ hire_date, now()) / 365.25, 1) AS \"Tenure Years\"\nFROM dbpcm_warehouse.employee\nWHERE employee_status\
    \ = 'Active'\nORDER BY hire_date ASC,\n         employee_code\nLIMIT {top_n}\n"

  catalog_sha: ''
  sql_template: "SELECT e.department_name AS `Department`,\n       round(SUM(te.earn_amount), 2) AS `Total\
    \ Dollars`\nFROM\n  (SELECT employee_code,\n          punch_date,\n          earn_amount,\n      \
    \    earn_code\n   FROM dbpcm_warehouse.total_earning) AS te\nJOIN\n  (SELECT earn_code,\n       \
    \   category_name\n   FROM dbpcm_warehouse.earning_category FINAL) AS ec ON ec.earn_code = te.earn_code\n\
    JOIN dbpcm_warehouse.employee AS e ON e.employee_code = te.employee_code\nWHERE ec.category_name =\
    \ {concept}\n  AND te.punch_date >= toDate({period_start})\n  AND te.punch_date < toDate({period_end})\n\
    GROUP BY e.department_name\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN `Total\
    \ Dollars`\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN `Total\
    \ Dollars`\n                   END ASC, `Department`\nLIMIT {top_n}\n"

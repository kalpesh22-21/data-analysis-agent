# Full clickhouse-api blueprint snapshot, synchronized 2026-10-29 (188 blueprints).
# Source: app/corpus/data/blueprints/bp-*.yaml, sorted by filename.
# Used for full-corpus parity and SQL round-trip tests, not the local demo warehouse seed.
- id: bp-accrual-balance-summary
  intent: 'Recorded beginning, accrued, awarded and taken plan balances by company, department or plan.
    Optional accrual plan code, employee status, department and employee. Uses taken_amount, never approved
    event hours. No implicit PTO filter: resolve plan code for PTO. No event-date restriction, current-balance
    formula or assumed units. Cross-plan sums require compatible units; otherwise use plan grouping/filter.
    Preaggregate balance rows by employee/plan before LEFT JOIN; preserve source row count without assuming
    unique plan rows.'
  slots_summary: group_by, accrual_code, employee_status, department, employee, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.time_off_balance.employee_code
  - dbpcm_warehouse.time_off_balance.accrual_code
  - dbpcm_warehouse.time_off_balance.beginning_balance
  - dbpcm_warehouse.time_off_balance.accrued_amount
  - dbpcm_warehouse.time_off_balance.awarded_amount
  - dbpcm_warehouse.time_off_balance.taken_amount
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - plan
  - name: accrual_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_balance.accrual_code
    optional_pattern: 'TRUE'
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  sql_template: "WITH b AS\n  (SELECT employee_code,\n          accrual_code,\n          sum(beginning_balance)\
    \ AS beginning,\n          sum(accrued_amount) AS accrued,\n          sum(awarded_amount) AS awarded,\n\
    \          sum(taken_amount) AS taken,\n          count(*) AS balance_rows\n   FROM dbpcm_warehouse.time_off_balance\n\
    \   WHERE accrual_code = {accrual_code}\n   GROUP BY employee_code,\n            accrual_code)\nSELECT\
    \ CASE {group_by}\n           WHEN 'department' THEN e.department_name\n           WHEN 'plan' THEN\
    \ b.accrual_code\n           ELSE 'Company'\n       END AS \"Group\",\n       sum(CAST(b.beginning\
    \ AS Nullable(Decimal(38, 6)))) AS \"Beginning Balance\",\n       sum(CAST(b.accrued AS Nullable(Decimal(38,\
    \ 6)))) AS \"Accrued Amount\",\n       sum(CAST(b.awarded AS Nullable(Decimal(38, 6)))) AS \"Awarded\
    \ Amount\",\n       sum(CAST(b.taken AS Nullable(Decimal(38, 6)))) AS \"Taken Amount\",\n       sum(CAST(b.balance_rows\
    \ AS Nullable(Decimal(20, 0)))) AS \"Source Balance Rows\",\n       uniqExact(b.employee_code) AS\
    \ \"Employee Count\"\nFROM b\nLEFT JOIN dbpcm_warehouse.employee AS e ON b.employee_code = e.employee_code\n\
    WHERE e.employee_status = {employee_status}\n  AND e.department_name = {department}\n  AND e.employee_code\
    \ = {employee}\nGROUP BY CASE {group_by}\n             WHEN 'department' THEN e.department_name\n\
    \             WHEN 'plan' THEN b.accrual_code\n             ELSE 'Company'\n         END\nORDER BY\
    \ CASE\n             WHEN {order_direction} = 'DESC' THEN \"Group\"\n         END DESC, CASE\n   \
    \                    WHEN {order_direction} = 'ASC' THEN \"Group\"\n                   END ASC\n"
  column_formats:
    Group:
      kind: text
    Beginning Balance:
      kind: number
    Accrued Amount:
      kind: number
    Awarded Amount:
      kind: number
    Taken Amount:
      kind: number
    Source Balance Rows:
      kind: integer
    Employee Count:
      kind: integer
- id: bp-accrual-code-dictionary
  intent: Distinct accrual codes with descriptions and counts of employees who hold each bank type
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT b.accrual_code AS \"Accrual Code\",\n       any(b.accrual_description) AS \"Accrual\
    \ Description\",\n       COUNT(DISTINCT b.employee_code) AS \"Holder Count\"\nFROM dbpcm_warehouse.time_off_balance\
    \ AS b\nWHERE NOT (b.accrual_code IS NULL)\n  AND b.accrual_code <> ''\nGROUP BY b.accrual_code\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Holder Count\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Holder Count\"\n            \
    \       END ASC\n"
  slots:
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: order_direction
  uses:
  - dbpcm_warehouse.time_off_balance.accrual_code
  - dbpcm_warehouse.time_off_balance.accrual_description
  - dbpcm_warehouse.time_off_balance.employee_code
  column_formats:
    Accrual Code:
      kind: identifier
    Accrual Description:
      kind: text
    Holder Count:
      kind: integer
- id: bp-accrual-event-summary
  intent: Accrual event/day row counts, event hours and distinct employees by company, department, workflow
    status, event type, event-date month or department_status (department and status together). Includes
    all event types and leave categories unless explicitly filtered. Required half-open requested-for-date
    period [start,end); optional workflow status enum, resolved event_type and earn_code strings, employee
    status, department and employee. No implicit Approved or PTO filter. COUNT counts event/day rows,
    not distinct multi-day requests. Approved hours are not taken balance usage. LEFT JOIN preserves unmatched
    events unless employee filters supplied; does not zero-fill periods or prove full coverage. For time-off-taken
    questions bind event_status=Approved and event_type=Time Off Request, plus the requested category/date
    scope; assume these requests were taken and disclose it. Offer a separate payroll-paid-hours check
    without executing it unless requested.
  slots_summary: group_by, period, event_status, event_type, earn_code, employee_status, department, employee,
    order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.time_off_request.earn_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - status
    - event_type
    - month
    - department_status
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: event_status
    type: enum
    required: false
    enum_values:
    - Approved
    - Requested
    - Denied
    - Removed
    - Calendar Only
    binds_to: dbpcm_warehouse.time_off_request.status
    optional_pattern: 'TRUE'
  - name: event_type
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_request.event_type
    optional_pattern: 'TRUE'
  - name: earn_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.time_off_request.earn_code
    optional_pattern: 'TRUE'
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  - Event Status
  sql_template: "WITH a AS\n  (SELECT employee_code,\n          status,\n          event_type,\n     \
    \     SUBSTRING(toString(request_date), 1, 7) AS month,\n          count(*) AS event_rows,\n     \
    \     sum(hours) AS hours\n   FROM dbpcm_warehouse.time_off_request\n   WHERE status = {event_status}\n\
    \     AND event_type = {event_type}\n     AND earn_code = {earn_code}\n     AND toDate(request_date)\
    \ >= toDate({period_start})\n     AND toDate(request_date) < toDate({period_end})\n   GROUP BY employee_code,\n\
    \            status,\n            event_type,\n            SUBSTRING(toString(request_date), 1, 7))\n\
    SELECT CASE {group_by}\n           WHEN 'department' THEN e.department_name\n           WHEN 'department_status'\
    \ THEN e.department_name\n           WHEN 'status' THEN a.status\n           WHEN 'event_type' THEN\
    \ a.event_type\n           WHEN 'month' THEN toString(a.month)\n           ELSE 'Company'\n      \
    \ END AS \"Group\",\n       CASE\n           WHEN {group_by} = 'department_status' THEN a.status\n\
    \           ELSE 'All selected statuses'\n       END AS \"Event Status\",\n       sum(CAST(a.event_rows\
    \ AS Nullable(Decimal(20, 0)))) AS \"Event Day Rows\",\n       sum(CAST(a.hours AS Nullable(Decimal(38,\
    \ 6)))) AS \"Event Hours\",\n       uniqExact(a.employee_code) AS \"Employee Count\"\nFROM a\nLEFT\
    \ JOIN dbpcm_warehouse.employee AS e ON a.employee_code = e.employee_code\nWHERE e.employee_status\
    \ = {employee_status}\n  AND e.department_name = {department}\n  AND e.employee_code = {employee}\n\
    GROUP BY CASE {group_by}\n             WHEN 'department' THEN e.department_name\n             WHEN\
    \ 'department_status' THEN e.department_name\n             WHEN 'status' THEN a.status\n         \
    \    WHEN 'event_type' THEN a.event_type\n             WHEN 'month' THEN toString(a.month)\n     \
    \        ELSE 'Company'\n         END,\n         CASE\n             WHEN {group_by} = 'department_status'\
    \ THEN a.status\n             ELSE 'All selected statuses'\n         END\nORDER BY CASE\n        \
    \     WHEN {order_direction} = 'DESC' THEN \"Group\"\n         END DESC, CASE\n                  \
    \     WHEN {order_direction} = 'ASC' THEN \"Group\"\n                   END ASC, \"Event Status\"\n"
  column_formats:
    Group:
      kind: text
    Event Status:
      kind: text
    Event Day Rows:
      kind: integer
    Event Hours:
      kind: number
      unit: hours
      precision: 2
    Employee Count:
      kind: integer
- id: bp-active-headcount-by-department
  intent: Employee headcount by department, including departments with no matching employees. Defaults
    to Active + On Leave; employee_status selects another status or All to remove the filter.
  slots_summary: department, employee_status, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.department.department_code
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
  - name: employee_status
    description: Select Active for active employees. Omit for current employees (Active + On Leave); All removes the status filter.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    optional_pattern: employee_status IN ('Active', 'On Leave')
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  uses_rules:
  - default_employee_population
  result_grain:
  - department_code
  sql_template: "SELECT d.department_code AS department_code,\n       d.department_name AS department,\n\
    \       coalesce(e.active_count, 0) AS headcount\nFROM dbpcm_warehouse.department AS d\nLEFT JOIN\n\
    \  (SELECT department_code,\n          uniqExact(employee_code) AS active_count\n   FROM dbpcm_warehouse.employee\n\
    \   WHERE (employee_status = {employee_status}\n          OR {employee_status} = 'All')\n   GROUP\
    \ BY department_code) AS e ON d.department_code = e.department_code\nWHERE d.department_name = {department}\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN headcount\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN headcount\n                   END ASC,\
    \ department,\n                            department_code\n"
  column_formats:
    department_code:
      kind: identifier
    department:
      kind: text
    headcount:
      kind: integer
- id: bp-adjustment-line-volume
  intent: Volume of negative payroll register earnings lines per month, counting adjustment and reversal
    activity over the last N pay periods
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(pay_period_end_date), '%Y-%m') AS \"Month\",\n \
    \      count() AS \"Adjustment Lines\",\n       round(SUM(amount), 2) AS \"Adjustment Amount\"\nFROM\
    \ dbpcm_warehouse.payroll\nWHERE register_type = 'EARN'\n  AND amount < 0\n  AND pay_period_end_date\
    \ >= addMonths(\n                                         (SELECT max(pay_period_end_date)\n     \
    \                                     FROM dbpcm_warehouse.payroll), -{win})\nGROUP BY \"Month\"\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Month\"\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN \"Month\"\n                   END ASC\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.pay_period_end_date
  column_formats:
    Month:
      kind: text
    Adjustment Lines:
      kind: integer
    Adjustment Amount:
      kind: currency
      currency: USD
- id: bp-age-band-distribution
  intent: Active employee headcount by age band with average and median workforce age, computed from date
    of birth at query time
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT multiIf(age < 25, 'Under 25', age < 35, '25-34', age < 45, '35-44', age < 55,\
    \ '45-54', age < 65, '55-64', '65+') AS \"Age Band\",\n       count(DISTINCT employee_code) AS \"\
    Headcount\",\n       round(avg(age), 1) AS \"Avg Age In Band\",\n       round((quantileExactLow(0.5)(toFloat64(age))\
    \ + quantileExactHigh(0.5)(toFloat64(age))) / 2, 1) AS \"Median Age In Band\"\nFROM\n  (SELECT employee_code,\n\
    \          department_name,\n          date_diff('year', date_of_birth, now()) AS age\n   FROM dbpcm_warehouse.employee\n\
    \   WHERE employee_status = 'Active'\n     AND date_of_birth IS NOT NULL\n     AND toDate32(date_of_birth)\
    \ > toDate32('1900-01-01')\n     AND department_name = {department})\nGROUP BY \"Age Band\"\nORDER\
    \ BY min(age) ASC\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  slots_summary: department
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.date_of_birth
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Age Band:
      kind: text
    Headcount:
      kind: integer
    Avg Age In Band:
      kind: number
      unit: years
      precision: 2
    Median Age In Band:
      kind: number
      unit: years
      precision: 2
- id: bp-approved-timeoff-hours
  intent: Approved time-off hours by department or company-wide for a request-date window, counting only
    Approved status leave events
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.department_name AS \"Department\",\n       round(SUM(t.hours), 2) AS \"Approved\
    \ Hours\"\nFROM dbpcm_warehouse.time_off_request AS t\nJOIN dbpcm_warehouse.employee AS e ON e.employee_code\
    \ = t.employee_code\nWHERE t.status = 'Approved'\n  AND t.hours IS NOT NULL\n  AND toDate32(t.request_date)\
    \ BETWEEN {window_start} AND {window_end}\n  AND e.department_name = {dept}\nGROUP BY e.department_name\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Approved Hours\"\n         END\
    \ DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Approved Hours\"\n    \
    \               END ASC\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: dept
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, dept, order_direction
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Approved Hours:
      kind: number
      unit: hours
      precision: 2
- id: bp-approved-timeoff-ranking
  intent: Rank employees by approved time-off request hours in a half-open requested-for-date period.
    Assume approved requests were taken and disclose that assumption. Include all accessible request records,
    retain ties at the requested rank, and offer a separate payroll-paid-hours check. Days are distinct
    requested calendar dates, not punch days.
  slots_summary: period, top_n, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.hours
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.time_off_request.event_type
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: top_n
    type: positive_integer
    required: true
    min_value: 1
    max_value: 100
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  result_grain:
  - Employee Code
  sql_template: "WITH totals AS\n  (SELECT employee_code,\n          sum(hours) AS approved_hours,\n \
    \         uniqExact(toDate(request_date)) AS requested_days\n   FROM dbpcm_warehouse.time_off_request\n\
    \   WHERE status = 'Approved'\n     AND event_type = 'Time Off Request'\n     AND request_date >=\
    \ {period_start}\n     AND request_date < {period_end}\n   GROUP BY employee_code),\n     ranked AS\n\
    \  (SELECT employee_code,\n          approved_hours,\n          requested_days,\n          dense_rank()\
    \ OVER (\n                             ORDER BY CASE\n                                          WHEN\
    \ {order_direction} = 'DESC' THEN approved_hours\n                                      END DESC,\
    \ CASE\n                                                    WHEN {order_direction} = 'ASC' THEN approved_hours\n\
    \                                                END ASC) AS hours_rank\n   FROM totals)\nSELECT r.employee_code\
    \ AS `Employee Code`,\n       e.employee_name AS `Employee Name`,\n       e.department_name AS `Department`,\n\
    \       r.approved_hours AS `Approved Time-Off Hours`,\n       r.requested_days AS `Requested Days`,\n\
    \       r.hours_rank AS `Rank`\nFROM ranked r\nLEFT JOIN dbpcm_warehouse.employee e ON e.employee_code\
    \ = r.employee_code\nWHERE r.hours_rank <= {top_n}\nORDER BY r.hours_rank,\n         r.employee_code\n"
  uses_rules: []
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Approved Time-Off Hours:
      kind: number
      unit: hours
      precision: 2
    Requested Days:
      kind: integer
    Rank:
      kind: integer
- id: bp-average-annual-salary-by-status
  intent: Average annual compensation by pay type, filtered by employee status. Salary uses annual_salary;
    Hourly uses hourly_salary and estimated annual compensation = hourly_salary * 2080 (40 hours/week,
    52 weeks/year; excludes overtime). Keep pay types separate. Defaults to Active + On Leave; employee_status
    overrides or All removes the filter.
  slots_summary: employee_status
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  slots:
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    binds_to: dbpcm_warehouse.employee.employee_status
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    optional_pattern: employee_status IN ('Active', 'On Leave')
  sql_template: "SELECT employee_pay_type AS `Pay Type`,\n       CASE\n           WHEN employee_pay_type\
    \ = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'\n           WHEN employee_pay_type\
    \ = 'Salary' THEN 'Recorded annual salary'\n           ELSE 'Unknown compensation basis'\n       END\
    \ AS `Compensation Basis`,\n       avg(CASE\n               WHEN employee_pay_type = 'Salary' THEN\
    \ annual_salary\n               WHEN employee_pay_type = 'Hourly' THEN hourly_salary * 2080\n    \
    \           ELSE NULL\n           END) AS `Average Annual Compensation`,\n       avg(CASE\n      \
    \         WHEN employee_pay_type = 'Hourly' THEN hourly_salary\n               ELSE NULL\n       \
    \    END) AS `Average Hourly Rate`\nFROM dbpcm_warehouse.employee\nWHERE (employee_status = {employee_status}\n\
    \       OR {employee_status} = 'All')\nGROUP BY employee_pay_type\n"
  result_grain:
  - Pay Type
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    Average Annual Compensation:
      kind: currency
      currency: USD
      precision: 2
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
- id: bp-average-salary-by-department
  intent: Average annual compensation and headcount by department and pay type. Averages exclude unknown
    compensation; headcount includes it. Salary uses annual_salary; Hourly uses hourly_salary and estimated
    annual compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes overtime). Keep
    pay types separate. Defaults to Active + On Leave; employee_status overrides or All removes the filter.
  slots_summary: department, employee_status
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.employee_pay_type
  - dbpcm_warehouse.employee.hourly_salary
  - dbpcm_warehouse.department.department_name
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee_status
    description: Omit for Active + On Leave; select a status to override, or All to remove the status
      filter.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: employee_status IN ('Active', 'On Leave')
  result_grain:
  - Department
  - Pay Type
  sql_template: "SELECT employee_pay_type AS `Pay Type`,\n       CASE\n           WHEN employee_pay_type\
    \ = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'\n           WHEN employee_pay_type\
    \ = 'Salary' THEN 'Recorded annual salary'\n           ELSE 'Unknown compensation basis'\n       END\
    \ AS `Compensation Basis`,\n       department_name AS department,\n       AVG((CASE\n            \
    \    WHEN employee_pay_type = 'Salary' THEN annual_salary\n                WHEN employee_pay_type\
    \ = 'Hourly' THEN hourly_salary * 2080\n                ELSE NULL\n            END)) AS average_annual_compensation,\n\
    \       COUNT(DISTINCT employee_code) AS headcount,\n       avg(CASE\n               WHEN employee_pay_type\
    \ = 'Hourly' THEN hourly_salary\n               ELSE NULL\n           END) AS `Average Hourly Rate`\n\
    FROM dbpcm_warehouse.employee\nWHERE department_name = {department}\n  AND (employee_status = {employee_status}\n\
    \       OR {employee_status} = 'All')\nGROUP BY employee_pay_type,\n         department_name\n"
  uses_rules:
  - compensation_by_pay_type
  column_formats:
    Pay Type:
      kind: text
    Compensation Basis:
      kind: text
    department:
      kind: text
    average_annual_compensation:
      kind: currency
      currency: USD
      precision: 2
    headcount:
      kind: integer
    Average Hourly Rate:
      kind: currency
      currency: USD
      precision: 2
      unit: per hour
- id: bp-avg-request-size
  intent: Average approved time-off request hours per row by leave type over a request-date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT t.earn_description AS \"Leave Type\",\n       t.earn_code AS \"Earn Code\",\n\
    \       round(AVG(t.hours), 2) AS \"Average Hours\",\n       COUNT(*) AS \"Request Rows\"\nFROM dbpcm_warehouse.time_off_request\
    \ AS t\nWHERE t.status = 'Approved'\n  AND t.hours IS NOT NULL\n  AND toDate32(t.request_date) BETWEEN\
    \ {window_start} AND {window_end}\nGROUP BY t.earn_description,\n         t.earn_code\nORDER BY CASE\n\
    \             WHEN {order_direction} = 'DESC' THEN \"Average Hours\"\n         END DESC, CASE\n  \
    \                     WHEN {order_direction} = 'ASC' THEN \"Average Hours\"\n                   END\
    \ ASC\n"
  slots:

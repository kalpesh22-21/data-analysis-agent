    \   FROM dbpcm_warehouse.earning_category FINAL) AS ec ON ec.earn_code = te.earn_code\nWHERE ec.category_name\
    \ = {concept}\n  AND te.punch_date >= addMonths(\n                                   (SELECT max(punch_date)\n\
    \                                    FROM dbpcm_warehouse.total_earning), -{win})\nGROUP BY \"Month\"\
    \nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Month\"\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN \"Month\"\n                   END ASC\n"

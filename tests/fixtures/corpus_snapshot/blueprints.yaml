- id: bp-department-ot-share
  intent: Department overtime dollars as a percentage of department gross payroll earnings, ranked by
    share, combining timecard overtime with register gross
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH ot_agg AS (\n  SELECT\n    e.department_name AS dept,\n    SUM(te.earn_amount) AS\
    \ ot_dollars\n  FROM (\n    SELECT\n      employee_code,\n      punch_date,\n      earn_code,\n  \
    \    earn_amount\n    FROM dbpcm_warehouse.total_earning\n  ) AS te\n  JOIN (\n    SELECT\n      earn_code,\n\
    \      category_name\n    FROM dbpcm_warehouse.earning_category\n  ) AS ec\n    ON ec.earn_code =\
    \ te.earn_code\n  JOIN dbpcm_warehouse.employee AS e\n    ON e.employee_code = te.employee_code\n\
    \  WHERE\n    ec.category_name = 'Overtime'\n    AND te.punch_date BETWEEN addMonths(toDate({period}),\
    \ -1) AND toDate({period})\n  GROUP BY\n    e.department_name\n), gross_agg AS (\n  SELECT\n    e2.department_name\
    \ AS dept,\n    SUM(p2.amount) AS gross_dollars\n  FROM dbpcm_warehouse.payroll AS p2\n  JOIN dbpcm_warehouse.employee\
    \ AS e2\n    ON e2.employee_code = p2.employee_code\n  WHERE\n    p2.register_type = 'EARN' AND p2.pay_period_end_date\
    \ = {period}\n  GROUP BY\n    e2.department_name\n)\nSELECT\n  oa.dept AS \"Department\",\n  round(oa.ot_dollars,\
    \ 2) AS \"Overtime Dollars\",\n  round(ga.gross_dollars, 2) AS \"Gross Earnings\",\n  round(oa.ot_dollars\
    \ / nullIf(ga.gross_dollars, 0) * 100, 2) AS \"OT Share %\"\nFROM ot_agg AS oa\nLEFT JOIN gross_agg\
    \ AS ga\n  ON ga.dept = oa.dept\nORDER BY {order_by}\nLIMIT {top_n}\n"
  slots:
  - name: period
    type: period
    required: false
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
    optional_pattern: 'TRUE'
  - name: top_n
    type: positive_integer
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to OT Share % DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: OT Share %
      direction: DESC
    allowed_columns:
    - Department
    - Overtime Dollars
    - Gross Earnings
    - OT Share %
  slots_summary: period, top_n, order_by
  uses:
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name

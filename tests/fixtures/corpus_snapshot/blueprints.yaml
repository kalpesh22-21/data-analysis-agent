  catalog_sha: ''
  sql_template: "SELECT multiIf(NOT (seniority_date IS NOT NULL\n                    AND toDate32(seniority_date)\
    \ > toDate32('1900-01-01')), 'Unknown', yrs < 1, 'Under 1 Year', yrs < 3, '1-3 Years', yrs < 5, '3-5\
    \ Years', yrs < 10, '5-10 Years', yrs < 20, '10-20 Years', '20+ Years') AS \"Tenure Band\",\n    \
    \   count(DISTINCT employee_code) AS \"Headcount\"\nFROM\n  (SELECT employee_code,\n          seniority_date,\n\
    \          date_diff('day', seniority_date, now()) / 365.25 AS yrs\n   FROM dbpcm_warehouse.employee\n\
    \   WHERE employee_status = 'Active'\n     AND department_name = {department})\nGROUP BY \"Tenure\
    \ Band\"\nORDER BY min(yrs) ASC\n"
  slots:
  - name: department
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  slots_summary: department
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.seniority_date
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  column_formats:
    Tenure Band:
      kind: text
    Headcount:
      kind: integer
- id: bp-termination-family
  intent: Employees with a recorded termination date in a half-open period, with total matching record
    count before the display limit. Includes same-day/later rehires and employees no longer currently
    Terminated. Apply current status only when explicitly requested. For counts/grouped summaries use
    bp-employee-date-summary with date_basis=termination.
  slots_summary: period, row_limit, employee_status, department, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.department.department_name
  slots:
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: row_limit
    type: positive_integer
    required: true
    min_value: 1
    max_value: 1000
  - name: employee_status
    description: Omit for all recorded terminations in the period; set only when current status is explicitly
      requested.
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    - All
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  result_grain:
  - Employee Code
  sql_template: "SELECT e.employee_code AS `Employee Code`,\n       e.employee_name AS `Employee Name`,\n\
    \       e.department_name AS `Department`,\n       e.employee_status AS `Current Status`,\n      \
    \ e.termination_date AS `Termination Date`,\n       count(*) OVER () AS `Total Matching Records`\n\
    FROM dbpcm_warehouse.employee e\nWHERE e.termination_date >= {period_start}\n  AND e.termination_date\
    \ < {period_end}\n  AND (e.employee_status = {employee_status}\n       OR {employee_status} = 'All')\n\
    \  AND e.department_name = {department}\nORDER BY CASE\n             WHEN {order_direction} = 'DESC'\
    \ THEN e.termination_date\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN e.termination_date\n                   END ASC, e.employee_code\nLIMIT {row_limit}\n"
  uses_rules:
  - terminations_in_period
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Current Status:
      kind: text
    Termination Date:
      kind: date
    Total Matching Records:
      kind: integer
- id: bp-timecard-earnings-all-history
  intent: All-history timecard earnings and hours per earn code from total_earning, spanning all available
    punch dates, with optional employee or date-window filter
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT earn_code AS \"Earn Code\",\n       round(SUM(earn_amount), 2) AS \"Total Earnings\"\
    ,\n       round(SUM(earn_hours), 2) AS \"Total Hours\"\nFROM dbpcm_warehouse.total_earning\nWHERE\
    \ employee_code = {ee}\n  AND punch_date BETWEEN {window_start} AND {window_end}\nGROUP BY earn_code\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Total Earnings\"\n         END\
    \ DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Total Earnings\"\n    \
    \               END ASC\n"
  slots:
  - name: ee
    type: string
    required: false
    binds_to: dbpcm_warehouse.total_earning.employee_code
    optional_pattern: 'TRUE'
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: ee, window, order_direction
  uses:
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.employee_code
  column_formats:
    Earn Code:
      kind: identifier
    Total Earnings:
      kind: currency
      currency: USD
      precision: 2
    Total Hours:
      kind: number
      unit: hours
      precision: 2
- id: bp-timecard-earnings-summary
  intent: 'Total timecard earnings, paid hours, entry counts and employee counts by company, employee,
    allocated department, day, month or earning code. Supports per-person hours and pay in a period and
    monthly labor-cost trends. Uses daily total_earning entries: in-progress earnings finalized and moved
    to payroll after period close. Use payroll earnings for finalized periods. Do not add both lifecycle
    stages for the same earnings. This template does not infer period-close status or switch sources.
    Amount is not net pay, annual salary or proof of payment. Optional earning_code is client-defined:
    resolve regular/overtime concepts, never hardcode a universal OT code. No average-rate calculation
    across unlike earning codes. Required half-open punch-date period and resolved table_source prevent
    accidental cross-source double counting. FINAL deduplicates storage versions, not overlapping real-world
    events. Department means recorded labor-allocation department code, not current home department. No
    scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove
    completeness; missing days/months are not zero-filled.'
  slots_summary: group_by, period, source, employee, department, earning_code, pay_class, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.total_earning.department_code
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.pay_class_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.table_source
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - employee
    - department
    - day
    - month
    - earning_code
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: source
    type: entity
    required: true
    binds_to: dbpcm_warehouse.total_earning.table_source
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.employee_code
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.department_code
    optional_pattern: 'TRUE'
  - name: earning_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.earn_code
    optional_pattern: 'TRUE'
  - name: pay_class
    type: entity
    required: false
    binds_to: dbpcm_warehouse.total_earning.pay_class_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  sql_template: "SELECT CASE {group_by}\n           WHEN 'employee' THEN employee_code\n           WHEN\
    \ 'department' THEN department_code\n           WHEN 'day' THEN toString(punch_date)\n           WHEN\
    \ 'month' THEN substring(toString(punch_date), 1, 7)\n           WHEN 'earning_code' THEN earn_code\n\
    \           ELSE 'Company'\n       END AS `Group`,\n       sum(earn_amount) AS `Timecard Earning Amount`,\n\
    \       sum(earn_hours) AS `Paid Hours`,\n       count(*) AS `Entry Count`,\n       count(DISTINCT\
    \ employee_code) AS `Employee Count`,\n       count(DISTINCT punch_date) AS `Observed Days`,\n   \
    \    min(punch_date) AS `First Observed Date`,\n       max(punch_date) AS `Last Observed Date`\nFROM\
    \ dbpcm_warehouse.total_earning\nWHERE punch_date >= toDate({period_start})\n  AND punch_date < toDate({period_end})\n\
    \  AND table_source = {source}\n  AND employee_code = {employee}\n  AND department_code = {department}\n\
    \  AND earn_code = {earning_code}\n  AND pay_class_code = {pay_class}\nGROUP BY CASE {group_by}\n\
    \             WHEN 'employee' THEN employee_code\n             WHEN 'department' THEN department_code\n\
    \             WHEN 'day' THEN toString(punch_date)\n             WHEN 'month' THEN substring(toString(punch_date),\
    \ 1, 7)\n             WHEN 'earning_code' THEN earn_code\n             ELSE 'Company'\n         END\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN `Group`\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN `Group`\n                   END ASC\n"
  column_formats:
    Group:
      kind: text
    Timecard Earning Amount:
      kind: currency
      currency: USD
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
    Entry Count:
      kind: integer
    Employee Count:
      kind: integer
    Observed Days:
      kind: integer
    First Observed Date:
      kind: date
    Last Observed Date:
      kind: date
- id: bp-timecard-vs-register-recon
  intent: Reconcile total_earning timecard hours against payroll register paid hours per employee for
    a single pay period, showing variance and percentage difference
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH period_bounds AS\n  (SELECT any(pay_period_start_date) AS start_dt,\n          any(pay_period_end_date)\
    \ AS end_dt\n   FROM dbpcm_warehouse.payroll\n   WHERE pay_period_end_date = {period}),\n     register_hours\
    \ AS\n  (SELECT employee_code,\n          SUM(type_hours) AS register_hours\n   FROM dbpcm_warehouse.payroll\n\
    \   WHERE register_type = 'EARN'\n     AND pay_period_end_date = {period}\n   GROUP BY employee_code),\n\
    \     te_hours AS\n  (SELECT te.employee_code,\n          SUM(te.earn_hours) AS te_hours\n   FROM\n\
    \     (SELECT employee_code,\n             punch_date,\n             earn_hours\n      FROM dbpcm_warehouse.total_earning)\
    \ AS te\n   CROSS JOIN period_bounds pb\n   WHERE te.punch_date BETWEEN pb.start_dt AND pb.end_dt\n\
    \   GROUP BY te.employee_code)\nSELECT COALESCE(r.employee_code, t.employee_code) AS \"Employee Code\"\
    ,\n       max(e.employee_name) AS \"Employee Name\", {period} AS \"Pay Period End\",\n           \
    \                                      round(COALESCE(r.register_hours, 0), 2) AS \"Register Hours\"\
    ,\n                                                 round(COALESCE(t.te_hours, 0), 2) AS \"Timecard\
    \ Hours\",\n                                                 round(COALESCE(t.te_hours, 0) - COALESCE(r.register_hours,\
    \ 0), 2) AS \"Difference\",\n                                                 round(abs(COALESCE(t.te_hours,\
    \ 0) - COALESCE(r.register_hours, 0)) / nullIf(COALESCE(r.register_hours, 0), 0) * 100, 2) AS \"Pct\
    \ Diff\"\nFROM register_hours r\nFULL OUTER JOIN te_hours t ON t.employee_code = r.employee_code\n\
    LEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = COALESCE(r.employee_code, t.employee_code)\n\
    GROUP BY COALESCE(r.employee_code, t.employee_code), {period}, r.register_hours,\n               \
    \                                                t.te_hours\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN abs(COALESCE(t.te_hours, 0) - COALESCE(r.register_hours, 0))\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN abs(COALESCE(t.te_hours, 0) - COALESCE(r.register_hours,\
    \ 0))\n                   END ASC\nLIMIT {top_n}\n"
  slots:
  - name: period
    type: period
    required: true
    binds_to: dbpcm_warehouse.payroll.pay_period_end_date
    temporal_type: date
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: period, top_n, order_direction
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_period_start_date
  - dbpcm_warehouse.payroll.pay_period_end_date
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_hours
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Pay Period End:
      kind: date
    Register Hours:
      kind: number
      unit: hours
      precision: 2
    Timecard Hours:
      kind: number
      unit: hours
      precision: 2
    Difference:
      kind: number
      unit: hours
      precision: 2
    Pct Diff:
      kind: percent
      scale: percent
      precision: 2
- id: bp-timeoff-by-leave-type

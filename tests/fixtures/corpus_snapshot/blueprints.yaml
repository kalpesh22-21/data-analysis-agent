- id: bp-post-termination-accrual-audit
  intent: Terminated employees with time-off balance accrual activity dated after their termination date,
    rehire-aware
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT b.employee_code AS \"Employee Code\",\n       e.employee_name AS \"Employee Name\"\
    ,\n       b.accrual_code AS \"Accrual Code\",\n       b.accrual_date AS \"Accrual Date\",\n      \
    \ e.termination_date AS \"Termination Date\",\n       round(toFloat64(SUM(b.accrued_amount)), 2) AS\
    \ \"Accrual Amount\"\nFROM dbpcm_warehouse.time_off_balance AS b\nJOIN dbpcm_warehouse.employee AS\
    \ e ON e.employee_code = b.employee_code\nWHERE e.termination_date IS NOT NULL\n  AND toDate32(e.termination_date)\
    \ > toDate32('1900-01-01')\n  AND b.accrual_date IS NOT NULL\n  AND b.accrual_date > toDate32(e.termination_date)\n\
    \  AND (e.most_recent_hire_date IS NULL\n       OR toDate32(e.most_recent_hire_date) <= toDate32('1900-01-01')\n\
    \       OR e.most_recent_hire_date <= e.termination_date)\n  AND b.accrued_amount > 0\n  AND b.accrual_date\
    \ >= {accrual_window_start}\n  AND b.accrual_date <= {accrual_window_end}\nGROUP BY b.employee_code,\n\
    \         e.employee_name,\n         b.accrual_code,\n         b.accrual_date,\n         e.termination_date\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN b.accrual_date\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN b.accrual_date\n              \
    \     END ASC\nLIMIT {max_rows}\n"
  slots:
  - name: accrual_window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: accrual_window, max_rows, order_direction

- id: bp-payroll-summary
  intent: Payroll amount, source line count and distinct employee count by company, department or pay-date
    month. Required register_type enum and half-open pay-date period [start,end); select EARN for gross
    earnings. Optional type_code, employee status, department and employee. Earnings represent finalized
    total_earning after period close; use total_earning for in-progress earnings and never add both for
    the same covered earnings. Preaggregate payroll per employee/month before LEFT JOIN; unmatched employees
    retained unless employee filters supplied. Does not prove complete months or zero-fill missing months;
    no implicit earnings filter.
  slots_summary: group_by, register_type, period, type_code, employee_status, department, employee, order_direction
  status: validated
  drift_status: clean
  catalog_sha: ''
  uses:
  - dbpcm_warehouse.payroll.employee_code
  - dbpcm_warehouse.payroll.pay_date
  - dbpcm_warehouse.payroll.amount
  - dbpcm_warehouse.payroll.register_type
  - dbpcm_warehouse.payroll.type_code
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.department_name
  - dbpcm_warehouse.department.department_name
  slots:
  - name: group_by
    type: enum
    required: true
    enum_values:
    - company
    - department
    - month
  - name: register_type
    type: enum
    required: true
    enum_values:
    - EARN
    - EETAX
    - DDUCT
    - NETPAYDIST
    - EEBEN
    - ERTAX
    binds_to: dbpcm_warehouse.payroll.register_type
  - name: period
    type: period_range
    temporal_type: date
    required: true
  - name: type_code
    type: entity
    required: false
    binds_to: dbpcm_warehouse.payroll.type_code
    optional_pattern: 'TRUE'
  - name: employee_status
    type: enum
    required: false
    enum_values:
    - Active
    - Deceased
    - Inactive
    - Retired
    - Terminated
    - On Leave
    - Not Hired
    - Prehire
    - Unknown
    binds_to: dbpcm_warehouse.employee.employee_status
    optional_pattern: 'TRUE'
  - name: department
    type: entity
    required: false
    binds_to: dbpcm_warehouse.department.department_name
    optional_pattern: 'TRUE'
    description: Resolve department names/abbreviations against the directory; a known department may
      have no matching employees.
  - name: employee
    type: entity
    required: false
    binds_to: dbpcm_warehouse.employee.employee_code
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  sql_template: "WITH p AS\n  (SELECT employee_code,\n          substring(toString(pay_date), 1, 7) AS\
    \ month,\n          sum(amount) AS amount,\n          count(*) AS line_count\n   FROM dbpcm_warehouse.payroll\n\
    \   WHERE register_type = {register_type}\n     AND type_code = {type_code}\n     AND toDate(pay_date)\
    \ >= toDate({period_start})\n     AND toDate(pay_date) < toDate({period_end})\n   GROUP BY employee_code,\n\
    \            substring(toString(pay_date), 1, 7))\nSELECT CASE\n           WHEN {group_by} = 'department'\
    \ THEN e.department_name\n           WHEN {group_by} = 'month' THEN toString(p.month)\n           ELSE 'Company'\n\
    \       END AS `Group`,\n       sum(CAST(p.amount AS Nullable(Decimal(38, 2)))) AS `Payroll Amount`,\n\
    \       sum(CAST(p.line_count AS Nullable(Decimal(20, 0)))) AS `Source Line Count`,\n       uniqExact(p.employee_code)\
    \ AS `Employee Count`\nFROM p\nLEFT JOIN dbpcm_warehouse.employee e ON p.employee_code = e.employee_code\n\
    WHERE e.employee_status = {employee_status}\n  AND e.department_name = {department}\n  AND e.employee_code\
    \ = {employee}\nGROUP BY CASE\n             WHEN {group_by} = 'department' THEN e.department_name\n\
    \             WHEN {group_by} = 'month' THEN toString(p.month)\n             ELSE 'Company'\n         END\nORDER\
    \ BY CASE\n             WHEN {order_direction} = 'DESC' THEN `Group`\n         END DESC, CASE\n  \
    \                     WHEN {order_direction} = 'ASC' THEN `Group`\n                   END ASC\n"
  column_formats:
    Group:
      kind: text
    Payroll Amount:
      kind: currency
      currency: USD
      precision: 2
    Source Line Count:
      kind: integer
    Employee Count:
      kind: integer
- id: bp-pending-timeoff-queue
  intent: Pending time-off requests queue with days waiting since submission, optionally filtered by department;
    Days Waiting is the oldest pending submission in each employee/request-date group
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT t.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\
    \ Name\",\n       any(e.department_name) AS \"Department\",\n       toDate32(t.request_date) AS \"\
    Request Date\",\n       round(SUM(t.hours), 2) AS \"Pending Hours\",\n       max(dateDiff('day', t.date_added,\
    \ today())) AS \"Days Waiting\"\nFROM dbpcm_warehouse.time_off_request AS t\nJOIN dbpcm_warehouse.employee\
    \ AS e ON e.employee_code = t.employee_code\nWHERE t.status = 'Requested'\n  AND e.department_name\
    \ = {dept}\n  AND dateDiff('day', t.date_added, today()) >= {min_wait}\nGROUP BY t.employee_code,\n\
    \         toDate32(t.request_date)\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN\
    \ \"Request Date\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC'\
    \ THEN \"Request Date\"\n                   END ASC\n"
  slots:
  - name: dept
    type: string
    required: false
    binds_to: dbpcm_warehouse.employee.department_name
    optional_pattern: 'TRUE'
  - name: min_wait
    type: nonnegative_integer
    required: false
    optional_pattern: 'TRUE'
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: dept, min_wait, order_direction
  uses:

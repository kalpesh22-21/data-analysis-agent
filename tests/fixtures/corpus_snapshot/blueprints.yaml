- id: bp-headcount-growth-rate
  intent: Monthly hires, terminations and net headcount delta over the last N months
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(m.month_start, '%Y-%m') AS \"Month\",\n       countIf(e.most_recent_hire_date\
    \ >= m.month_start\n               AND e.most_recent_hire_date <= m.month_end\n               AND\
    \ e.most_recent_hire_date IS NOT NULL\n               AND toDate32(e.most_recent_hire_date) > toDate32('1900-01-01'))\
    \ AS \"Hires\",\n       countIf(e.termination_date >= m.month_start\n               AND e.termination_date\
    \ <= m.month_end\n               AND e.termination_date IS NOT NULL\n               AND toDate32(e.termination_date)\
    \ > toDate32('1900-01-01')\n               AND (e.most_recent_hire_date IS NULL\n                \
    \    OR e.most_recent_hire_date < e.termination_date)) AS \"Terms\",\n       countIf(e.most_recent_hire_date\
    \ >= m.month_start\n               AND e.most_recent_hire_date <= m.month_end\n               AND\
    \ e.most_recent_hire_date IS NOT NULL\n               AND toDate32(e.most_recent_hire_date) > toDate32('1900-01-01'))\
    \ - countIf(e.termination_date >= m.month_start\n                                                \
    \                                         AND e.termination_date <= m.month_end\n                \
    \                                                                         AND e.termination_date IS\
    \ NOT NULL\n                                                                                     \
    \    AND toDate32(e.termination_date) > toDate32('1900-01-01')\n                                 \
    \                                                        AND (e.most_recent_hire_date IS NULL\n  \
    \                                                                                            OR e.most_recent_hire_date\
    \ < e.termination_date)) AS \"Net Delta\"\nFROM\n  (SELECT addMonths(toStartOfMonth(anchor.latest_hire),\
    \ -toInt32(number)) AS month_start,\n          toLastDayOfMonth(addMonths(anchor.latest_hire, -toInt32(number)))\
    \ AS month_end\n   FROM\n     (SELECT max(most_recent_hire_date) AS latest_hire\n      FROM dbpcm_warehouse.employee\n\
    \      WHERE toDate32(most_recent_hire_date) > toDate32('1900-01-01')) AS anchor\n   CROSS JOIN\n\
    \     (SELECT arrayJoin(range(0, toInt32({win}))) AS number) AS seq) AS m\nCROSS JOIN dbpcm_warehouse.employee\
    \ AS e\nGROUP BY \"Month\"\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Month\"\
    \n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Month\"\n\
    \                   END ASC\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.termination_date
  column_formats:
    Month:
      kind: text
    Hires:
      kind: integer
    Terms:
      kind: integer
    Net Delta:
      kind: integer
- id: bp-headcount-monthly-trend
  intent: End-of-month active headcount and monthly termination trend reconstructed from hire and termination
    dates over the last N months
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT formatDateTime(toStartOfMonth(month_end), '%Y-%m') AS \"Month\",\n       countIf(hire_date\
    \ <= month_end\n               AND (termination_date IS NULL\n                    OR toDate32(termination_date)\
    \ <= toDate32('1900-01-01')\n                    OR termination_date > month_end)) AS \"Active Headcount\"\
    ,\n       countIf(termination_date >= toStartOfMonth(month_end)\n               AND termination_date\
    \ <= month_end\n               AND termination_date IS NOT NULL\n               AND toDate32(termination_date)\
    \ > toDate32('1900-01-01')\n               AND (most_recent_hire_date IS NULL\n                  \
    \  OR most_recent_hire_date < termination_date)) AS \"Terms In Month\"\nFROM\n  (SELECT toLastDayOfMonth(addMonths(anchor.latest_hire,\
    \ -toInt32(number))) AS month_end\n   FROM\n     (SELECT max(hire_date) AS latest_hire\n      FROM\
    \ dbpcm_warehouse.employee\n      WHERE toDate32(hire_date) > toDate32('1900-01-01')) AS anchor\n\
    \   CROSS JOIN\n     (SELECT arrayJoin(range(0, toInt32({win}))) AS number) AS seq) AS months\nCROSS\
    \ JOIN dbpcm_warehouse.employee AS e\nWHERE hire_date IS NOT NULL\n  AND toDate32(hire_date) > toDate32('1900-01-01')\n\
    GROUP BY \"Month\"\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Month\"\n \
    \        END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Month\"\n  \
    \                 END ASC\n"
  slots:
  - name: win
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: win, order_direction
  uses:
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Month:
      kind: text
    Active Headcount:
      kind: integer
    Terms In Month:
      kind: integer

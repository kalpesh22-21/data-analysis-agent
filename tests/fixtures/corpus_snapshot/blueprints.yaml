- id: bp-new-hire-90d-attrition
  intent: New hires in a window who terminated within 90 days of hire, with the 90-day attrition rate
    as a ratio
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT count(DISTINCT employee_code) AS \"Hires In Window\",\n       COUNT(DISTINCT CASE\n\
    \                          WHEN NOT (termination_date IS NULL)\n                               AND\
    \ toDate32(termination_date) > toDate32('1900-01-01')\n                               AND DATE_DIFF(DAY,\
    \ hire_date, termination_date) <= 90\n                               AND (most_recent_hire_date IS\
    \ NULL\n                                    OR most_recent_hire_date < termination_date) THEN employee_code\n\
    \                          ELSE NULL\n                      END) AS \"Terms Within 90 Days\",\n  \
    \     round(100 * COUNT(DISTINCT CASE\n                                      WHEN NOT (termination_date\
    \ IS NULL)\n                                           AND toDate32(termination_date) > toDate32('1900-01-01')\n\
    \                                           AND DATE_DIFF(DAY, hire_date, termination_date) <= 90\n\
    \                                           AND (most_recent_hire_date IS NULL\n                 \
    \                               OR most_recent_hire_date < termination_date) THEN employee_code\n\
    \                                      ELSE NULL\n                                  END) / nullIf(count(DISTINCT\
    \ employee_code), 0), 2) AS \"90-Day Attrition Pct\"\nFROM dbpcm_warehouse.employee\nWHERE NOT (hire_date\
    \ IS NULL)\n  AND toDate32(hire_date) > toDate32('1900-01-01')\n  AND hire_date >= {window_start}\n\
    \  AND hire_date < {window_end}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  slots_summary: window
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.hire_date
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  column_formats:
    Hires In Window:
      kind: integer
    Terms Within 90 Days:
      kind: integer
    90-Day Attrition Pct:
      kind: percent
      scale: percent
      precision: 2
- id: bp-night-shift-share
  intent: Night-shift hours share by department using total_earning earn_hours where the shift date is
    identified by In punch time between configurable night-start and night-end hours
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH night_dates AS\n  (SELECT DISTINCT pp.employee_code,\n                   pp.punch_date\n\
    \   FROM\n     (SELECT employee_code,\n             punch_date,\n             in_punch_time\n    \
    \  FROM dbpcm_warehouse.punch_pair) pp\n   WHERE pp.punch_date BETWEEN {window_start} AND {window_end}\n\
    \     AND pp.in_punch_time IS NOT NULL\n     AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n\
    \     AND (toHour(pp.in_punch_time) >= {night_start}\n          OR toHour(pp.in_punch_time) < {night_end})),\n\
    \     dept_total AS\n  (SELECT e.department_name AS dept,\n          SUM(te.earn_hours) AS total_hours\n\
    \   FROM\n     (SELECT employee_code,\n             punch_date,\n             earn_hours\n      FROM\
    \ dbpcm_warehouse.total_earning) te\n   JOIN dbpcm_warehouse.employee e ON e.employee_code = te.employee_code\n\
    \   WHERE te.punch_date BETWEEN {window_start} AND {window_end}\n   GROUP BY e.department_name),\n\
    \     dept_night AS\n  (SELECT e.department_name AS dept,\n          SUM(te.earn_hours) AS night_hours\n\
    \   FROM night_dates nd\n   JOIN\n     (SELECT employee_code,\n             punch_date,\n        \
    \     earn_hours\n      FROM dbpcm_warehouse.total_earning) te ON te.employee_code = nd.employee_code\n\
    \   AND te.punch_date = nd.punch_date\n   JOIN dbpcm_warehouse.employee e ON e.employee_code = te.employee_code\n\
    \   GROUP BY e.department_name)\nSELECT COALESCE(d.dept, n.dept) AS \"Department\",\n       round(COALESCE(d.total_hours,\
    \ 0), 2) AS \"Total Hours\",\n       round(COALESCE(n.night_hours, 0), 2) AS \"Night Hours\",\n  \
    \     round(100.0 * COALESCE(n.night_hours, 0) / nullIf(COALESCE(d.total_hours, 0), 0), 2) AS \"Night\
    \ Share Pct\"\nFROM dept_total d\nFULL OUTER JOIN dept_night n ON n.dept = d.dept\nORDER BY CASE\n\
    \             WHEN {order_direction} = 'DESC' THEN \"Night Share Pct\"\n         END DESC, CASE\n\
    \                       WHEN {order_direction} = 'ASC' THEN \"Night Share Pct\"\n                \
    \   END ASC, \"Department\"\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: night_start
    type: positive_integer
    required: true
  - name: night_end
    type: positive_integer
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, night_start, night_end, max_rows, order_direction
  uses:
  - dbpcm_warehouse.total_earning.employee_code
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Total Hours:
      kind: number
      unit: hours
      precision: 2
    Night Hours:
      kind: number
      unit: hours
      precision: 2
    Night Share Pct:
      kind: percent
      scale: percent
      precision: 2

- id: bp-quarterly-terminations-with-top-reasons
  intent: Terminations per quarter within a window, ranked to the top-N termination reasons per quarter
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT \"Quarter\",\n       \"Term Reason\",\n       \"Terms\",\n       \"Quarter Total\"\
    \nFROM\n  (SELECT \"Quarter\",\n          \"Term Reason\",\n          \"Terms\",\n          sum(\"\
    Terms\") OVER (PARTITION BY \"Quarter\") AS \"Quarter Total\",\n          row_number() OVER (PARTITION\
    \ BY \"Quarter\"\n                             ORDER BY \"Terms\" DESC) AS reason_rank\n   FROM\n\
    \     (SELECT toStartOfQuarter(termination_date) AS \"Quarter\",\n             ifNull(nullIf(term_reason,\
    \ ''), 'Unspecified') AS \"Term Reason\",\n             count(DISTINCT employee_code) AS \"Terms\"\
    \n      FROM dbpcm_warehouse.employee\n      WHERE employee_status = 'Terminated'\n        AND termination_date\
    \ >= {term_window_start}\n        AND termination_date < {term_window_end}\n        AND termination_date\
    \ IS NOT NULL\n        AND toDate32(termination_date) > toDate32('1900-01-01')\n        AND (most_recent_hire_date\
    \ IS NULL\n             OR most_recent_hire_date < termination_date)\n      GROUP BY \"Quarter\",\n\
    \               \"Term Reason\"))\nWHERE reason_rank <= {top_n}\nORDER BY CASE\n             WHEN\
    \ {order_direction} = 'DESC' THEN \"Quarter\"\n         END DESC, CASE\n                       WHEN\
    \ {order_direction} = 'ASC' THEN \"Quarter\"\n                   END ASC, \"Terms\" DESC\n"
  slots:
  - name: term_window
    type: period_range
    required: true
    temporal_type: date
  - name: top_n
    type: relative_window
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: term_window, top_n, order_direction
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.termination_date
  - dbpcm_warehouse.employee.most_recent_hire_date
  - dbpcm_warehouse.employee.term_reason
  column_formats:
    Quarter:
      kind: date
    Term Reason:
      kind: text
    Terms:
      kind: integer
    Quarter Total:
      kind: integer

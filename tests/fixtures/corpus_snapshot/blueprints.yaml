    - OL
    - OB
    - OX
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: ASC
    description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation
      order).
  result_grain:
  - Group
  sql_template: "SELECT CASE {group_by}\n           WHEN 'employee' THEN employee_code\n           WHEN\
    \ 'department' THEN department_code\n           WHEN 'day' THEN toString(punch_date)\n           WHEN\
    \ 'month' THEN substring(toString(punch_date), 1, 7)\n           WHEN 'hours_type' THEN hours_type\n\
    \           ELSE 'Company'\n       END AS `Group`,\n       count(*) AS `Pair Count`,\n       count(DISTINCT\
    \ employee_code) AS `Employee Count`,\n       count(DISTINCT punch_date) AS `Observed Days`,\n   \
    \    sum(earn_hours) AS `Paid Hours`,\n       sum(earn_amount) AS `Pair Earning Amount`,\n       min(punch_date)\
    \ AS `First Observed Date`,\n       max(punch_date) AS `Last Observed Date`\nFROM dbpcm_warehouse.punch_pair\n\
    WHERE punch_date >= toDate({period_start})\n  AND punch_date < toDate({period_end})\n  AND table_source\
    \ = {source}\n  AND employee_code = {employee}\n  AND department_code = {department}\n  AND hours_type\
    \ = {hours_type}\n  AND pay_class_code = {pay_class}\n  AND in_punch_type = {in_type}\n  AND out_punch_type\
    \ = {out_type}\nGROUP BY CASE {group_by}\n             WHEN 'employee' THEN employee_code\n      \
    \       WHEN 'department' THEN department_code\n             WHEN 'day' THEN toString(punch_date)\n\
    \             WHEN 'month' THEN substring(toString(punch_date), 1, 7)\n             WHEN 'hours_type'\
    \ THEN hours_type\n             ELSE 'Company'\n         END\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN `Group`\n         END DESC, CASE\n                       WHEN {order_direction} =\
    \ 'ASC' THEN `Group`\n                   END ASC\n"
  column_formats:
    Group:
      kind: text
    Pair Count:
      kind: integer
    Employee Count:
      kind: integer
    Observed Days:
      kind: integer
    Paid Hours:
      kind: number
      unit: hours
      precision: 2
    Pair Earning Amount:
      kind: currency
      currency: USD
    First Observed Date:
      kind: date
    Last Observed Date:
      kind: date
- id: bp-punch-plus-timeoff-overlap
  intent: Employees with punch pair entries on days that also have approved time-off requests, a same-day
    double-dip audit with configurable overlap-day threshold
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH punch_days AS\n  (SELECT DISTINCT employee_code,\n                   punch_date\n\
    \   FROM dbpcm_warehouse.punch_pair\n   WHERE punch_date BETWEEN {window_start} AND {window_end}),\n\
    \     overlap AS\n  (SELECT pd.employee_code,\n          pd.punch_date AS overlap_date\n   FROM punch_days\
    \ pd\n   JOIN dbpcm_warehouse.time_off_request tor ON tor.employee_code = pd.employee_code\n   WHERE\
    \ tor.status = 'Approved'\n     AND toDate32(tor.request_date) = pd.punch_date)\nSELECT e.employee_code\
    \ AS \"Employee Code\",\n       e.employee_name AS \"Employee Name\",\n       e.department_name AS\
    \ \"Department\",\n       count(DISTINCT o.overlap_date) AS \"Overlap Days\"\nFROM overlap o\nJOIN\
    \ dbpcm_warehouse.employee AS e ON e.employee_code = o.employee_code\nGROUP BY e.employee_code,\n\
    \         e.employee_name,\n         e.department_name\nHAVING count(DISTINCT o.overlap_date) >= {threshold}\n\
    ORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Overlap Days\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Overlap Days\"\n            \
    \       END ASC, e.employee_code\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: threshold
    type: positive_integer
    required: true
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, threshold, max_rows, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.time_off_request.employee_code
  - dbpcm_warehouse.time_off_request.request_date
  - dbpcm_warehouse.time_off_request.status
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_name
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Employee Code:
      kind: identifier
    Employee Name:
      kind: text
    Department:
      kind: text
    Overlap Days:
      kind: integer

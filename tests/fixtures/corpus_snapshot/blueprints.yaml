- id: bp-expense-approval-backlog
  intent: Expenses awaiting approval longest, by submission age, with optional minimum wait threshold
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT employee_code AS \"Employee Code\",\n       count() AS \"Pending Lines\",\n  \
    \     round(toFloat64(SUM(amount_approved)), 2) AS \"Pending Amount\",\n       round(AVG(dateDiff('day',\
    \ date_time_submitted, today())), 1) AS \"Avg Days Pending\"\nFROM dbpcm_warehouse.expense\nWHERE\
    \ expense_status = 'Pending Approval'\n  AND date_time_submitted IS NOT NULL\n  AND toDate32(date_time_submitted)\
    \ > toDate32('1900-01-01')\n  AND dateDiff('day', date_time_submitted, today()) >= {min_age}\nGROUP\
    \ BY employee_code\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Avg Days Pending\"\
    \n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Avg Days Pending\"\
    \n                   END ASC, \"Employee Code\"\nLIMIT {top_n}\n"
  slots:
  - name: min_age
    type: nonnegative_integer
    required: true
  - name: top_n
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: min_age, top_n, order_direction

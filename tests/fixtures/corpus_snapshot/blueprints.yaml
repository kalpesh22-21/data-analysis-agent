  intent: Top N employees by approved expense spend for a payment date window
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.employee_code AS \"Employee Code\",\n       any(e.employee_name) AS \"Employee\
    \ Name\",\n       round(toFloat64(SUM(x.amount_approved)), 2) AS \"Approved Spend\"\nFROM dbpcm_warehouse.expense\
    \ AS x\nJOIN dbpcm_warehouse.employee AS e ON e.employee_code = x.employee_code\nWHERE x.expense_status\
    \ IN ('Approved',\n                           'Paid',\n                           'Marked as Paid')\n\
    \  AND x.expense_paid_date >= {expense_window_start}\n  AND x.expense_paid_date <= {expense_window_end}\n\
    GROUP BY e.employee_code\nORDER BY CASE\n             WHEN {order_direction} = 'DESC' THEN \"Approved\
    \ Spend\"\n         END DESC, CASE\n                       WHEN {order_direction} = 'ASC' THEN \"\
    Approved Spend\"\n                   END ASC, \"Employee Code\"\nLIMIT {top_n}\n"
  slots:
  - name: top_n

- id: bp-avg-shift-length
  intent: Average shift duration in hours from In/Out punch timestamps per punch pair by employee home
    department, using punch_pair event data only
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT e.department_name AS \"Department\",\n       round(AVG(dateDiff('minute', pp.in_punch_time,\
    \ pp.out_punch_time) / 60.0), 2) AS \"Avg Shift Hours\",\n       count() AS \"Pair Count\"\nFROM\n\
    \  (SELECT employee_code,\n          punch_date,\n          in_punch_time,\n          out_punch_time\n\
    \   FROM dbpcm_warehouse.punch_pair) AS pp\nJOIN dbpcm_warehouse.employee e ON e.employee_code = pp.employee_code\n\
    WHERE pp.punch_date BETWEEN {window_start} AND {window_end}\n  AND pp.in_punch_time IS NOT NULL\n\
    \  AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')\n  AND pp.out_punch_time IS NOT NULL\n\
    \  AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')\nGROUP BY e.department_name\nORDER BY\
    \ CASE\n             WHEN {order_direction} = 'DESC' THEN \"Avg Shift Hours\"\n         END DESC,\
    \ CASE\n                       WHEN {order_direction} = 'ASC' THEN \"Avg Shift Hours\"\n         \
    \          END ASC\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, max_rows, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.department_name
  column_formats:
    Department:
      kind: text
    Avg Shift Hours:
      kind: number
      unit: hours
      precision: 2
    Pair Count:
      kind: integer
- id: bp-break-gap-median
  intent: Median break gap in hours between consecutive punch pairs on the same employee-day using punch_pair
    event timestamps only
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH ordered AS\n  (SELECT employee_code,\n          punch_date,\n          in_punch_time,\n\
    \          out_punch_time,\n          toInt64(row_number() OVER (PARTITION BY employee_code, punch_date\n\
    \                                     ORDER BY in_punch_time)) AS rn\n   FROM\n     (SELECT employee_code,\n\
    \             punch_date,\n             in_punch_time,\n             out_punch_time\n      FROM dbpcm_warehouse.punch_pair)\n\
    \   WHERE punch_date BETWEEN {window_start} AND {window_end}\n     AND in_punch_time IS NOT NULL\n\
    \     AND toDate32(in_punch_time) > toDate32('1900-01-01')\n     AND out_punch_time IS NOT NULL\n\
    \     AND toDate32(out_punch_time) > toDate32('1900-01-01'))\nSELECT current.employee_code AS \"Employee\
    \ Code\",\n       current.punch_date AS \"Punch Date\",\n       round(((quantileExactLow(0.5)(dateDiff('minute',\
    \ prev.out_punch_time, current.in_punch_time)) + quantileExactHigh(0.5)(dateDiff('minute', prev.out_punch_time,\
    \ current.in_punch_time))) / 2) / 60.0, 2) AS \"Median Break Gap Hours\",\n       count() AS \"Gap\
    \ Count\"\nFROM ordered current\nJOIN ordered prev ON prev.employee_code = current.employee_code\n\
    AND prev.punch_date = current.punch_date\nAND prev.rn = current.rn - 1\nGROUP BY current.employee_code,\n\
    \         current.punch_date\nHAVING count() > 0\nORDER BY CASE\n             WHEN {order_direction}\
    \ = 'DESC' THEN \"Median Break Gap Hours\"\n         END DESC, CASE\n                       WHEN {order_direction}\
    \ = 'ASC' THEN \"Median Break Gap Hours\"\n                   END ASC, \"Employee Code\"\nLIMIT {max_rows}\n"
  slots:
  - name: window
    type: period_range
    required: true
    temporal_type: date
  - name: max_rows
    type: positive_integer
    required: true
  - name: order_direction
    type: enum
    required: false
    enum_values:
    - DESC
    - ASC
    default: DESC
    description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
  slots_summary: window, max_rows, order_direction
  uses:
  - dbpcm_warehouse.punch_pair.employee_code
  - dbpcm_warehouse.punch_pair.punch_date
  - dbpcm_warehouse.punch_pair.in_punch_time
  - dbpcm_warehouse.punch_pair.out_punch_time
  column_formats:
    Employee Code:
      kind: identifier
    Punch Date:
      kind: date
    Median Break Gap Hours:
      kind: number
      unit: hours
      precision: 2
    Gap Count:
      kind: integer

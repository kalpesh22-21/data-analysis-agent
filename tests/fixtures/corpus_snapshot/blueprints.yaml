- id: bp-earnings-category-mix
  intent: Category mix showing percent share of total earnings dollars and paid hours by earning category
    for a punch date window, preserving uncategorized rows
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "WITH totals AS (\n  SELECT\n    SUM(earn_amount) AS all_dollars,\n    SUM(earn_hours)\
    \ AS all_hours\n  FROM dbpcm_warehouse.total_earning\n  WHERE\n    punch_date >= toDate({period_start})\
    \ AND punch_date < toDate({period_end})\n)\nSELECT\n  ifNull(ec.category_name, 'Uncategorized') AS\
    \ \"Category\",\n  round(SUM(te.earn_amount), 2) AS \"Total Dollars\",\n  round(SUM(te.earn_hours),\
    \ 2) AS \"Total Hours\",\n  round(\n    SUM(te.earn_amount) * 100.0 / nullIf((\n      SELECT\n   \
    \     all_dollars\n      FROM totals\n    ), 0),\n    2\n  ) AS \"Dollar Pct\",\n  round(\n    SUM(te.earn_hours)\
    \ * 100.0 / nullIf((\n      SELECT\n        all_hours\n      FROM totals\n    ), 0),\n    2\n  ) AS\
    \ \"Hours Pct\"\nFROM (\n  SELECT\n    punch_date,\n    earn_amount,\n    earn_hours,\n    earn_code\n\
    \  FROM dbpcm_warehouse.total_earning\n) AS te\nLEFT JOIN (\n  SELECT\n    earn_code,\n    category_name\n\
    \  FROM dbpcm_warehouse.earning_category\n) AS ec\n  ON ec.earn_code = te.earn_code\nWHERE\n  te.punch_date\
    \ >= toDate({period_start})\n  AND te.punch_date < toDate({period_end})\n  AND (\n    {metric} = 'dollars'\
    \ OR {metric} = 'hours'\n  )\nGROUP BY\n  ifNull(ec.category_name, 'Uncategorized')\nORDER BY {order_by}\n"
  slots:
  - name: period
    type: period_range
    required: true
    temporal_type: date
    description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01
      and end 2026-04-01; for a complete day, end is the next day.
  - name: metric
    type: enum
    required: true
    enum_values:
    - dollars
    - hours
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Dollar Pct DESC. Applies before LIMIT; no implicit secondary
      sort.
    default:
    - column: Dollar Pct
      direction: DESC
    allowed_columns:
    - Category
    - Total Dollars
    - Total Hours
    - Dollar Pct
    - Hours Pct
  slots_summary: period, metric, order_by
  uses:
  - dbpcm_warehouse.total_earning.earn_amount
  - dbpcm_warehouse.total_earning.earn_hours
  - dbpcm_warehouse.total_earning.punch_date
  - dbpcm_warehouse.total_earning.earn_code
  - dbpcm_warehouse.earning_category.earn_code
  - dbpcm_warehouse.earning_category.category_name
  column_formats:
    Category:
      kind: text
    Total Dollars:
      kind: currency
      currency: USD
    Total Hours:
      kind: number
      unit: hours
      precision: 2
    Dollar Pct:
      kind: percent
      scale: percent
      precision: 2
    Hours Pct:
      kind: percent
      scale: percent
      precision: 2
  presentation:
    kind: bars
    category_columns:
    - Category
    measure_columns:
    - Total Dollars

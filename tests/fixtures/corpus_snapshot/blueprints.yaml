- id: bp-labor-allocation-rollup
  intent: Active headcount and average salary grouped by a chosen labor allocation slot value, ranked
    by headcount
  status: validated
  drift_status: clean
  catalog_sha: ''
  sql_template: "SELECT\n  la.code AS \"Allocation Code\",\n  la.description AS \"Allocation Description\"\
    ,\n  count(DISTINCT e.employee_code) AS \"Active Headcount\",\n  round(\n    avgIf(\n      toFloat64(e.annual_salary),\n\
    \      NOT (\n        e.annual_salary IS NULL\n      ) AND toFloat64(e.annual_salary) > 0\n    ),\n\
    \    2\n  ) AS \"Avg Salary\"\nFROM (\n  SELECT\n    employee_code,\n    employee_status,\n    annual_salary,\n\
    \    CASE\n      WHEN {slot} = 1\n      THEN labor_allocation_key_1\n      WHEN {slot} = 2\n     \
    \ THEN labor_allocation_key_2\n      WHEN {slot} = 3\n      THEN labor_allocation_key_3\n      WHEN\
    \ {slot} = 4\n      THEN labor_allocation_key_4\n      WHEN {slot} = 5\n      THEN labor_allocation_key_5\n\
    \      WHEN {slot} = 6\n      THEN labor_allocation_key_6\n      WHEN {slot} = 7\n      THEN labor_allocation_key_7\n\
    \      WHEN {slot} = 8\n      THEN labor_allocation_key_8\n      WHEN {slot} = 9\n      THEN labor_allocation_key_9\n\
    \      WHEN {slot} = 10\n      THEN labor_allocation_key_10\n      WHEN {slot} = 11\n      THEN labor_allocation_key_11\n\
    \      WHEN {slot} = 12\n      THEN labor_allocation_key_12\n      WHEN {slot} = 13\n      THEN labor_allocation_key_13\n\
    \      WHEN {slot} = 14\n      THEN labor_allocation_key_14\n      WHEN {slot} = 15\n      THEN labor_allocation_key_15\n\
    \      WHEN {slot} = 16\n      THEN labor_allocation_key_16\n      WHEN {slot} = 17\n      THEN labor_allocation_key_17\n\
    \      WHEN {slot} = 18\n      THEN labor_allocation_key_18\n      WHEN {slot} = 19\n      THEN labor_allocation_key_19\n\
    \      ELSE labor_allocation_key_20\n    END AS selected_key\n  FROM dbpcm_warehouse.employee\n) AS\
    \ e\nLEFT JOIN dbpcm_warehouse.labor_allocation AS la\n  ON la.join_key = e.selected_key\nWHERE\n\
    \  e.employee_status = 'Active'\n  AND NOT (\n    e.selected_key IS NULL\n  )\n  AND e.selected_key\
    \ <> ''\nGROUP BY\n  la.code,\n  la.description\nORDER BY {order_by}\nLIMIT {top_n}\n"
  slots:
  - name: slot
    type: positive_integer
    required: true
  - name: top_n
    type: relative_window
    required: true
  - name: order_by
    type: sort_order
    required: false
    description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or
      DESC; no duplicate columns. Defaults to Active Headcount DESC. Applies before LIMIT; no implicit
      secondary sort.
    default:
    - column: Active Headcount
      direction: DESC
    allowed_columns:
    - Allocation Code
    - Allocation Description
    - Active Headcount
    - Avg Salary
  slots_summary: slot, top_n, order_by
  uses:
  - dbpcm_warehouse.employee.employee_code
  - dbpcm_warehouse.employee.employee_status
  - dbpcm_warehouse.employee.annual_salary
  - dbpcm_warehouse.employee.labor_allocation_key_1
  - dbpcm_warehouse.employee.labor_allocation_key_2
  - dbpcm_warehouse.employee.labor_allocation_key_3
  - dbpcm_warehouse.employee.labor_allocation_key_4
  - dbpcm_warehouse.employee.labor_allocation_key_5
  - dbpcm_warehouse.employee.labor_allocation_key_6
  - dbpcm_warehouse.employee.labor_allocation_key_7
  - dbpcm_warehouse.employee.labor_allocation_key_8
  - dbpcm_warehouse.employee.labor_allocation_key_9
  - dbpcm_warehouse.employee.labor_allocation_key_10
  - dbpcm_warehouse.employee.labor_allocation_key_11
  - dbpcm_warehouse.employee.labor_allocation_key_12
  - dbpcm_warehouse.employee.labor_allocation_key_13
  - dbpcm_warehouse.employee.labor_allocation_key_14
  - dbpcm_warehouse.employee.labor_allocation_key_15
  - dbpcm_warehouse.employee.labor_allocation_key_16
  - dbpcm_warehouse.employee.labor_allocation_key_17
  - dbpcm_warehouse.employee.labor_allocation_key_18
  - dbpcm_warehouse.employee.labor_allocation_key_19
  - dbpcm_warehouse.employee.labor_allocation_key_20
  - dbpcm_warehouse.labor_allocation.join_key
  - dbpcm_warehouse.labor_allocation.code
  - dbpcm_warehouse.labor_allocation.description
  column_formats:
    Allocation Code:
      kind: identifier

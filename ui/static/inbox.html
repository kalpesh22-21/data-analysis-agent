<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Agent — Review Inbox</title>
<style>
  :root {
    --color-bg: #0f1117;
    --color-surface: #171a23;
    --color-surface-2: #1f2330;
    --color-border: #2a2f3d;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b2;
    --color-accent: #5b8cff;
    --color-accent-text: #ffffff;
    --color-error-bg: #3a1c1c;
    --color-error-border: #b33a3a;
    --color-error-text: #ffb4b4;
    --color-warn-bg: #332816;
    --color-warn-border: #a5772a;
    --color-warn-text: #f0c987;
    --color-danger: #b33a3a;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    display: flex;
    justify-content: center;
    padding: var(--space-5);
  }

  main {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  h1 {
    font-size: 1.25rem;
    margin: 0;
  }

  .session-line {
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  button {
    background: var(--color-accent);
    color: var(--color-accent-text);
    border: none;
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-4);
    font-size: 0.9rem;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  /* --- Banners --- */
  #error-banner[hidden],
  #health-banner[hidden] {
    display: none;
  }

  #error-banner {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error-border);
    color: var(--color-error-text);
    border-radius: var(--radius);
    padding: var(--space-3) var(--space-4);
  }

  #error-banner .error-code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-weight: 600;
    margin-right: var(--space-2);
  }

  #health-banner {
    background: var(--color-warn-bg);
    border: 1px solid var(--color-warn-border);
    color: var(--color-warn-text);
    border-radius: var(--radius);
    padding: var(--space-3) var(--space-4);
    font-size: 0.9rem;
  }

  /* --- Controls: status toggle + type tabs --- */
  .inbox-controls {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .status-toggle {
    display: inline-flex;
    align-self: flex-start;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .status-toggle .status-btn {
    background: var(--color-surface);
    color: var(--color-text-dim);
    border: none;
    border-radius: 0;
    padding: var(--space-2) var(--space-4);
    font-size: 0.85rem;
  }

  .status-toggle .status-btn + .status-btn {
    border-left: 1px solid var(--color-border);
  }

  .status-toggle .status-btn.is-active {
    background: var(--color-accent);
    color: var(--color-accent-text);
  }

  .type-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    border-bottom: 1px solid var(--color-border);
  }

  .type-tab {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    background: transparent;
    color: var(--color-text-dim);
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: var(--space-2) var(--space-3);
    font-size: 0.85rem;
  }

  .type-tab.is-active {
    color: var(--color-text);
    border-bottom-color: var(--color-accent);
  }

  .tab-count {
    display: inline-flex;
    justify-content: center;
    min-width: 1.4em;
    padding: 0 var(--space-2);
    border-radius: 999px;
    background: var(--color-surface-2);
    color: var(--color-text-dim);
    font-size: 0.7rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .type-tab.is-active .tab-count {
    background: var(--color-accent);
    color: var(--color-accent-text);
  }

  /* --- The pager (one card at a time) -------------------------------------
     A review queue is a WORKLIST, not a feed: a reviewer adjudicates one candidate and
     moves on. Scrolling past two dozen full cards to reach the next undecided one made
     the position in the queue invisible and the act of moving on implicit. */

  .inbox-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
  }

  .inbox-pager[hidden] { display: none; }

  .pager-btn {
    background: var(--color-surface-2);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-4);
    font-size: 0.85rem;
    cursor: pointer;
  }

  .pager-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pager-btn:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .pager-position {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  /* --- Inbox list --- */
  #inbox-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  #inbox-empty[hidden] {
    display: none;
  }

  #inbox-empty {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-5);
    text-align: center;
    color: var(--color-text-dim);
  }

  .inbox-item {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  /* Items outside the active type tab stay in the DOM but are hidden. The
     attribute selector out-specifies `.inbox-item { display: flex }`. */
  .inbox-item[hidden] {
    display: none;
  }

  .item-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }

  .item-reason {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
  }

  .item-type {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.75rem;
    color: var(--color-text-dim);
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .item-status {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--color-error-border);
    background: var(--color-error-bg);
    color: var(--color-error-text);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  /* The Phase-3 verify state of a promotable card. Same chip as .item-status without
     the rejected red — an unverified row is the next step, not a failure. */
  .item-verified {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    color: var(--color-text-dim);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .item-verified.is-verified {
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  .item-summary {
    margin: 0;
    line-height: 1.5;
  }

  .item-field-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-dim);
    margin: 0 0 var(--space-1) 0;
  }

  pre.payload-view,
  pre.promotion-yaml {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    margin: 0;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* --- Typed candidate card (payload rendering) ---------------------------
     The payload used to be one `JSON.stringify(payload_view, null, 2)` dump, which
     put the thing a reviewer is actually deciding about — is this literal frozen for
     a good reason? — on line 34 of eighty. These sections split it into the
     comparison the review is: SLOTS beside FROZEN FILTERS. The raw dump survives
     verbatim under `<details>`; nothing is removed, only ranked. */

  .card-section {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .card-sections {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  /* The generalized template. Slot tokens are `<span>` chips built from the
     server-supplied `template_parts` split — never from a regex here, and never
     from an HTML-string sink (see the JS note on the page's textContent posture). */
  .card-template {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    margin: 0;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-template .slot {
    background: var(--color-surface-2);
    border: 1px solid var(--color-accent);
    color: var(--color-accent);
    border-radius: 999px;
    padding: 0 var(--space-2);
    font-size: 0.75rem;
    white-space: nowrap;
  }

  /* The slot table SCROLLS IN ITS OWN BOX rather than pushing the card wide. `binds_to` is a
     fully-qualified `database.table.column`, so three slots is enough to overflow 720px and
     clip the REQUIRED column off the right edge — which is exactly the column that says
     whether a caller MUST supply the slot. Short fixture names hid this; live data showed it
     immediately. */
  .card-table-wrap {
    overflow-x: auto;
    max-width: 100%;
  }

  .card-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  .card-table td.mono {
    white-space: nowrap;
  }

  .card-table th,
  .card-table td {
    text-align: left;
    padding: var(--space-1) var(--space-2);
    border-bottom: 1px solid var(--color-border);
    vertical-align: top;
  }

  .card-table th {
    font-weight: 600;
    color: var(--color-text-dim);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .card-table td.mono,
  .card-table th.mono {
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .card-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    font-size: 0.8rem;
  }

  .card-list .value {
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--color-text);
    word-break: break-all;
  }

  .card-list .why {
    color: var(--color-text-dim);
  }

  /* A frozen filter with no stated reason. NOT an error — plenty are legitimate
     metric definitions — but it is the one thing on this card worth a reviewer's
     eye, so it is marked rather than left to read as an ordinary row. */
  .card-list .why.is-missing {
    color: var(--color-warn-text);
  }

  .card-empty {
    font-size: 0.8rem;
    color: var(--color-text-dim);
    font-style: italic;
  }

  .card-checks {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  .check-pill {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    color: var(--color-text-dim);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .check-pill.is-fail {
    border-color: var(--color-error-border);
    background: var(--color-error-bg);
    color: var(--color-error-text);
  }

  .card-chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    font-size: 0.75rem;
  }

  .card-chip {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    color: var(--color-text-dim);
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  /* The raw payload, kept verbatim and collapsed. It is the fallback for anything
     the typed sections do not know how to show, so it is never removed. */
  .card-raw > summary {
    cursor: pointer;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-dim);
    padding: var(--space-1) 0;
  }

  .card-raw > summary:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .card-raw[open] > summary {
    margin-bottom: var(--space-2);
  }

  /* --- The parameterization judge's marker (design §D, phase D-1) -----------
     It observes; it cannot drop, route or repair. The marker exists so the reviewer's
     ordinary approve/reject BECOMES the agree/disagree half of the measurement,
     without asking anybody to do extra work. */

  .item-judge {
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    border-radius: var(--radius);
    padding: var(--space-3);
    font-size: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  /* Only a Class A finding says the blueprint is WRONG rather than merely narrow. That
     is the distinction the whole judge is built around, so it is the one the card
     colours on — not the verdict, which says `revise` for a naming nit too. */
  .item-judge.is-serious {
    border-color: var(--color-warn-border);
    background: var(--color-warn-bg);
    color: var(--color-warn-text);
  }

  .item-judge .judge-head {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    align-items: center;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.75rem;
  }

  .item-judge .judge-findings {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .item-judge .finding-class {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-weight: 600;
  }

  /* --- The revise assistant on the fail-to-review form (design §C) ---------- */

  .revise-block {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
  }

  .revise-block textarea {
    width: 100%;
    min-height: 60px;
    background: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
    font-family: inherit;
    font-size: 0.85rem;
  }

  .revise-diff {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    font-size: 0.78rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .revise-diff .kind {
    display: inline-block;
    min-width: 7em;
    color: var(--color-text-dim);
  }

  .revise-diff .added .kind,
  .revise-diff .role_changed .kind,
  .revise-diff .slot_changed .kind {
    color: var(--color-accent);
  }

  .revise-diff .removed .kind {
    color: var(--color-error-text);
  }

  .revise-diff .conflict .kind {
    color: var(--color-warn-text);
  }

  /* The BEFORE side of a diff row. Dimmed, NOT struck through: these rows carry a full
     `why` sentence, and a line through three wrapped lines of prose is unreadable — which
     defeats the point of showing the reviewer what they are replacing. */
  .revise-diff .before {
    color: var(--color-text-dim);
  }

  .revise-rationale {
    font-size: 0.8rem;
    color: var(--color-text-dim);
    margin: 0;
  }

  /* A proposal that carries entries AND a warning — the append/replace conflict. Coloured,
     because the reviewer is one click from an apply that will decline. */
  /* The leakage override. Styled as a WARNING, never as a neutral control: it is the only
     action on this page that steps past an entity gate, and it should not look like a
     convenience button. */
  .scan-override {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border: 1px solid var(--color-warn-border);
    background: var(--color-warn-bg);
    color: var(--color-warn-text);
    border-radius: var(--radius);
    padding: var(--space-3);
    font-size: 0.8rem;
  }

  .scan-override input[type="text"] {
    background: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
    font-family: inherit;
    font-size: 0.85rem;
  }

  .scan-attested {
    font-size: 0.8rem;
    color: var(--color-accent);
  }

  /* The card re-rendered with a proposal applied. Bordered and labelled, because the
     reviewer must never be unsure whether they are looking at the stored candidate or a
     suggestion — the whole value of previewing on the card is that it reads in the same
     terms as the card, which is also exactly how it could be mistaken for it. */
  .preview-block {
    border: 1px solid var(--color-accent);
    border-radius: var(--radius);
    padding: var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .preview-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-accent);
  }

  /* A row the proposal moves. Marked in BOTH panes so the eye can pair them. */
  .is-preview-changed {
    background: rgba(91, 140, 255, 0.12);
    border-left: 2px solid var(--color-accent);
    padding-left: var(--space-2);
  }

  .trial-block {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
  }

  .trial-binding {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: 0.8rem;
  }

  .trial-binding label {
    min-width: 14em;
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--color-text-dim);
  }

  .trial-binding input {
    flex: 1;
    background: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
  }

  .trial-result {
    font-size: 0.8rem;
    border-radius: var(--radius);
    padding: var(--space-2);
    border: 1px solid var(--color-border);
  }

  .trial-result.is-pass {
    border-color: var(--color-accent);
    color: var(--color-accent);
  }

  .trial-result.is-fail {
    border-color: var(--color-error-border);
    background: var(--color-error-bg);
    color: var(--color-error-text);
  }

  .revise-warning {
    font-size: 0.8rem;
    margin: 0;
    color: var(--color-warn-text);
    background: var(--color-warn-bg);
    border: 1px solid var(--color-warn-border);
    border-radius: var(--radius);
    padding: var(--space-2);
  }

  /* --- The SQL rewrite opt-in (design §C.5) ---------------------------------
     Styled as a WARNING wherever it appears, never as a neutral option: ticking it
     lets the assistant replace the query the session actually ran, which is the one
     thing on this surface that breaks the provenance chain the static checks stand on. */

  .revise-allow-sql {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: 0.8rem;
  }

  .revise-allow-sql input[disabled] + span {
    color: var(--color-text-dim);
  }

  .revise-allow-sql-caution,
  .revise-allow-sql-unavailable {
    margin: 0;
    font-size: 0.75rem;
    line-height: 1.5;
    color: var(--color-text-dim);
  }

  .revise-sql {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .revise-sql-panes {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
  }

  .revise-sql-pane {
    flex: 1 1 320px;
    min-width: 0;
  }

  .revise-sql-pane pre {
    margin: var(--space-1) 0 0;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.75rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .revise-sql-pane.is-after pre {
    border-color: var(--color-warn-border);
  }

  /* The persistent card badge and the line beside Approve. Both say the same thing,
     in the two places a reviewer decides: reading the card, and clicking the button. */
  .item-sql-rewritten {
    display: block;
    flex: 1 1 100%;
    font-size: 0.75rem;
    color: var(--color-warn-text);
    background: var(--color-warn-bg);
    border: 1px solid var(--color-warn-border);
    border-radius: var(--radius);
    padding: var(--space-1) var(--space-2);
    line-height: 1.5;
  }

  .approve-caution {
    font-size: 0.75rem;
    color: var(--color-warn-text);
    line-height: 1.5;
  }

  .item-evidence,
  .item-scan,
  .item-dedup {
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  .item-evidence .refs,
  .item-dedup .key {
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--color-text);
    word-break: break-all;
  }

  .item-scan {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    align-items: center;
  }

  .scan-hit {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--color-warn-border);
    color: var(--color-warn-text);
    background: var(--color-warn-bg);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  /* --- Fail-to-review (needs_parameterization) --- */
  .item-decline {
    border: 1px solid var(--color-warn-border);
    background: var(--color-warn-bg);
    border-radius: var(--radius);
    padding: var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .decline-line {
    font-size: 0.8rem;
    color: var(--color-warn-text);
  }

  .decline-line .code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--color-text);
  }

  pre.decline-detail {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    margin: 0;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .complete-form {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .complete-form textarea {
    width: 100%;
    min-height: 8rem;
    box-sizing: border-box;
    background: var(--color-bg);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .complete-form button.action-complete {
    align-self: flex-start;
  }

  .complete-options {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  /* --- Promotion hop (validated -> canon PR) --- */
  .item-promotion {
    border: 1px solid var(--color-border);
    background: var(--color-surface-2);
    border-radius: var(--radius);
    padding: var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .promotion-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
  }

  .promotion-head .item-field-label {
    margin: 0;
    flex: 1 1 auto;
  }

  button.promotion-copy {
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    font-size: 0.8rem;
    padding: var(--space-1) var(--space-3);
  }

  .promotion-copy-status {
    font-size: 0.75rem;
    color: var(--color-text-dim);
  }

  .promotion-meta {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: var(--space-1) var(--space-3);
    margin: 0;
    font-size: 0.8rem;
  }

  .promotion-meta dt {
    color: var(--color-text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.7rem;
    align-self: center;
  }

  .promotion-meta dd {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, monospace;
    word-break: break-all;
  }

  .verify-note {
    margin: 0;
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  .verify-note.is-warning {
    border: 1px solid var(--color-warn-border);
    background: var(--color-warn-bg);
    color: var(--color-warn-text);
    border-radius: var(--radius);
    padding: var(--space-3);
  }

  .item-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    border-top: 1px solid var(--color-border);
    padding-top: var(--space-3);
  }

  button.action-reject,
  button.action-retract {
    background: var(--color-surface-2);
    color: var(--color-text);
    border: 1px solid var(--color-border);
  }

  button.confirming {
    background: var(--color-danger);
    color: var(--color-accent-text);
    border-color: var(--color-danger);
  }

  button.action-cancel[hidden] {
    display: none;
  }

  button.action-cancel {
    background: transparent;
    color: var(--color-text-dim);
    border: 1px solid var(--color-border);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- the revise modal: the candidate as it WOULD be, before committing to it --- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-4); z-index: 100;
  }
  .modal {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); width: 100%; max-width: 860px;
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-head, .modal-foot {
    padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border);
  }
  .modal-foot { border-bottom: 0; border-top: 1px solid var(--color-border);
                display: flex; gap: var(--space-3); align-items: center; }
  .modal-body { padding: var(--space-4); overflow-y: auto; }
  .modal h3 { margin: 0 0 var(--space-1); font-size: 15px; }
  .modal .modal-sub { margin: 0; font-size: 12px; color: var(--color-text-dim); line-height: 1.5; }
  .modal-sql {
    background: var(--color-bg); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: var(--space-3);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    margin: var(--space-2) 0 var(--space-4);
  }
  .modal-entry {
    border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: var(--space-3); margin-bottom: var(--space-3); background: var(--color-bg);
  }
  .modal-entry.is-changed { border-color: var(--color-accent); }
  .modal-entry .who {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    display: block; margin-bottom: var(--space-2);
  }
  .modal-entry .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--color-accent); margin-left: var(--space-2);
  }
  .modal-grid { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .modal-grid > label { flex: 1 1 150px; font-size: 11px; color: var(--color-text-dim); }
  .modal-grid input, .modal-grid select {
    width: 100%; background: var(--color-surface); color: var(--color-text);
    border: 1px solid var(--color-border); border-radius: 4px;
    padding: 4px 6px; font-size: 12px; font-family: inherit;
  }
  .modal-note { font-size: 12px; color: var(--color-text-dim); line-height: 1.5; }
  .modal-sql-tag {
    margin: 0 0 var(--space-1); font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--color-warn-text); font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Data Agent — Review Inbox</h1>
    <p class="session-line" id="count-line" data-testid="inbox-count-line">loading…</p>
    <p class="session-line">
      Know a question the loop has not mined yet?
      <a href="/mint" data-testid="mint-link">Author a blueprint</a> — it lands here for review.
    </p>
  </header>

  <div id="revise-modal-host"></div>

  <div id="error-banner" data-testid="error-banner" role="alert" hidden>
    <span id="error-code" class="error-code" data-testid="error-code"></span>
    <span id="error-message" data-testid="error-message"></span>
  </div>

  <div id="health-banner" data-testid="inbox-health-banner" role="status" hidden></div>

  <section aria-labelledby="inbox-heading">
    <h2 id="inbox-heading" class="sr-only">Items awaiting review</h2>

    <div class="inbox-controls">
      <div class="status-toggle" data-testid="inbox-status-toggle" role="group" aria-label="Inbox status">
        <button type="button" class="status-btn is-active" data-status="in_review" aria-pressed="true">Review queue</button>
        <button type="button" class="status-btn" data-status="needs_parameterization" aria-pressed="false">Needs parameterization</button>
        <button type="button" class="status-btn" data-status="validated" aria-pressed="false">Promotable</button>
        <button type="button" class="status-btn" data-status="promoted" aria-pressed="false">Promoted</button>
        <button type="button" class="status-btn" data-status="rejected" aria-pressed="false">Archived</button>
      </div>
      <div class="type-tabs" data-testid="inbox-tabs" role="tablist" aria-label="Candidate type"></div>
    </div>

    <nav id="inbox-pager" class="inbox-pager" data-testid="inbox-pager" hidden>
      <button type="button" id="pager-prev" class="pager-btn" data-testid="inbox-pager-prev">‹ Prev</button>
      <span id="pager-position" class="pager-position" data-testid="inbox-pager-position"></span>
      <button type="button" id="pager-next" class="pager-btn" data-testid="inbox-pager-next">Next ›</button>
    </nav>
    <ul id="inbox-list" data-testid="inbox-list" aria-live="polite"></ul>
    <div id="inbox-empty" data-testid="inbox-empty" role="status" hidden></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // write_plane === "offline" pre-disables approve so a reviewer never clicks
  // into a 503 (contract §5). Set by loadHealth() before the list renders.
  var state = {
    offline: false,
    status: "in_review",
    activeType: "blueprint",
    items: [],
    // Index into the ACTIVE (type-filtered) list — the card the reviewer is on. Reset to
    // 0 whenever the filtered set changes identity (a tab or status switch, a reload),
    // because position 7 of the old queue means nothing in the new one.
    cursor: 0
  };

  // Fixed, always-shown candidate types (contract §Frontend): stable order,
  // readable labels, live count badges. Grouping is client-side on item.type.
  var TYPES = [
    { type: "blueprint", label: "Blueprints" },
    { type: "global_knowledge", label: "Global Knowledge" },
    { type: "user_knowledge", label: "User Knowledge" },
    { type: "schema_edit", label: "Schema Edits" },
  ];

  var els = {
    countLine: document.getElementById("count-line"),
    errorBanner: document.getElementById("error-banner"),
    errorCode: document.getElementById("error-code"),
    errorMessage: document.getElementById("error-message"),
    healthBanner: document.getElementById("health-banner"),
    list: document.getElementById("inbox-list"),
    empty: document.getElementById("inbox-empty"),
    tabs: document.querySelector('[data-testid="inbox-tabs"]'),
    statusToggle: document.querySelector('[data-testid="inbox-status-toggle"]'),
    pager: document.getElementById("inbox-pager"),
    pagerPrev: document.getElementById("pager-prev"),
    pagerNext: document.getElementById("pager-next"),
    pagerPosition: document.getElementById("pager-position"),
  };

  // Per-type tab controls, built once at init and keyed by candidate type.
  var tabEls = {};

  // Monotonic token for loadInbox(): status toggles + action refreshes can
  // issue overlapping fetches, so only the latest one is allowed to mutate
  // state/UI (last-issued wins, not last-resolved). See loadInbox().
  var loadSeq = 0;

  function clearError() {
    els.errorBanner.hidden = true;
    els.errorCode.textContent = "";
    els.errorMessage.textContent = "";
  }

  function showError(code, message) {
    els.errorBanner.hidden = false;
    els.errorCode.textContent = code || "ERROR";
    els.errorMessage.textContent = message || "Something went wrong.";
  }

  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // Every payload_view value is already redacted server-side (D17); entity
  // spans are the literal token "[redacted]". We render it verbatim and via
  // textContent only — never innerHTML with server data (contract §4).
  function stringifyPayload(view) {
    try {
      return JSON.stringify(view, null, 2);
    } catch (err) {
      return String(view);
    }
  }

  // --- Typed candidate card ------------------------------------------------
  //
  // The payload used to reach the reviewer as one `stringifyPayload(payload_view)`
  // dump. Everything below splits it into the comparison the review actually is —
  // SLOTS beside FROZEN FILTERS — and leaves that dump intact, collapsed, at the
  // bottom of every card.
  //
  // NO HTML SINK, anywhere in here: every server value reaches the DOM through
  // `textContent` or `createTextNode`. `tests/ui/test_inbox_markup.py` pins that for
  // the whole file, and the slot chips are the reason it matters more now than it
  // did — they are the one place a template string is split apart and reassembled.

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function isObject(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  // A labelled section, or null for an absent body — so callers can append
  // unconditionally instead of repeating the emptiness test at every call site.
  function section(label, body, testid) {
    if (!body) return null;
    var wrap = el("div", "card-section");
    if (testid) wrap.setAttribute("data-testid", testid);
    wrap.appendChild(el("p", "item-field-label", label));
    wrap.appendChild(body);
    return wrap;
  }

  // The generalized SQL, with `{slot}` tokens as chips.
  //
  // `template_parts` arrives PRE-SPLIT from the service, tokenized there from the
  // redacted payload_view by the same `SLOT_TOKEN` the runtime uses. So this page
  // never spells that grammar, and a template is never concatenated into markup.
  // The fallback renders the plain string when the field is absent (an older service,
  // or a candidate whose generalization carries no template).
  function renderTemplate(item) {
    var pre = el("pre", "card-template");
    pre.setAttribute("data-testid", "inbox-bp-template");
    var parts = item.template_parts;
    if (Array.isArray(parts) && parts.length) {
      parts.forEach(function (part) {
        if (!isObject(part)) return;
        if (typeof part.slot === "string") {
          pre.appendChild(el("span", "slot", part.slot));
        } else if (typeof part.text === "string") {
          pre.appendChild(document.createTextNode(part.text));
        }
      });
      return pre;
    }
    var gen = isObject(item.payload_view) ? item.payload_view.generalization : null;
    var raw = isObject(gen) ? gen.sql_template : null;
    if (typeof raw !== "string" || !raw) return null;
    pre.appendChild(document.createTextNode(raw));
    return pre;
  }

  // The template as a PLAIN STRING, for the places that compare it against another
  // string rather than render it with slot chips (the revise modal, and the before/after
  // panes of a proposed SQL rewrite). Same two sources as `renderTemplate`, same order of
  // preference — one accessor, so a card and its comparison can never disagree about what
  // the current query is.
  function currentTemplateText(item) {
    var gen = isObject(item && item.payload_view) ? item.payload_view.generalization : null;
    var raw = isObject(gen) ? gen.sql_template : null;
    if (typeof raw === "string" && raw) return raw;
    var parts = Array.isArray(item && item.template_parts) ? item.template_parts : [];
    return parts.map(function (part) {
      if (!isObject(part)) return "";
      if (typeof part.slot === "string") return "{" + part.slot + "}";
      return typeof part.text === "string" ? part.text : "";
    }).join("");
  }

  // An ISO stamp, in UTC, to the minute. UTC rather than the reviewer's locale on purpose:
  // the same string appears in the candidate record and the audit log, and a badge the
  // reviewer cannot line up against those is a worse badge. An unparseable value is shown
  // VERBATIM rather than as "Invalid Date" — a server that sent something unexpected should
  // be legible, not swallowed.
  function formatWhen(value) {
    if (typeof value !== "string" || !value.trim()) return "an unrecorded time";
    var when = new Date(value);
    if (isNaN(when.getTime())) return value;
    return when.toISOString().replace("T", " ").slice(0, 16) + " UTC";
  }

  // The caution shown wherever a rewrite is offered or has happened. One sentence, one
  // definition — the server sends its own for a live proposal, and this is the fallback and
  // the text used where there is no server sentence to quote.
  var SQL_REWRITE_CAUTION =
    "A rewritten query is no longer the one the session ran. It will be re-checked from " +
    "scratch, cannot auto-land, and should be trial-run before approval.";

  function paramEntries(view) {
    var entries = isObject(view) ? view.parameterization : null;
    return Array.isArray(entries) ? entries.filter(isObject) : [];
  }

  function locatorText(entry) {
    var loc = isObject(entry.locator) ? entry.locator : {};
    var parts = [loc.table, loc.column].filter(function (piece) {
      return typeof piece === "string" && piece;
    });
    return parts.length ? parts.join(".") : "(no locator)";
  }

  function textCell(value, mono) {
    var td = el("td", mono ? "mono" : "");
    td.textContent =
      value === null || value === undefined || value === "" ? "—" : String(value);
    return td;
  }

  // role=slot — the fillable holes. Empty means the template takes no arguments,
  // which is legitimate (a fixed report) and is shown rather than hidden.
  function renderSlots(entries) {
    var slots = entries.filter(function (entry) { return entry.role === "slot"; });
    // No slots: the SENTENCE, not an empty table. A header row over "none" is four column
    // labels describing nothing — it reads as a rendering fault rather than as the fact it
    // is stating. The fact still gets its section, because "this template takes no
    // arguments" is information about the blueprint.
    if (!slots.length) {
      var none = el("p", "card-empty", "none — this template takes no arguments");
      none.setAttribute("data-testid", "inbox-bp-slots");
      return none;
    }
    var table = el("table", "card-table");
    var thead = el("thead");
    var head = el("tr");
    // `binds to` LAST, because it is the only unbounded column — a fully-qualified
    // `database.table.column` — and whichever column follows it is the one that scrolls out of
    // sight. `required` is the fact a reviewer is deciding on (must a caller supply this?), so
    // it must not be that column.
    ["name", "type", "required", "binds to"].forEach(function (label) {
      head.appendChild(el("th", "", label));
    });
    thead.appendChild(head);
    table.appendChild(thead);
    var tbody = el("tbody");
    slots.forEach(function (entry) {
      var slot = isObject(entry.slot) ? entry.slot : {};
      var row = el("tr");
      row.appendChild(textCell(slot.name, true));
      row.appendChild(textCell(slot.type, true));
      row.appendChild(textCell(slot.required === false ? "optional" : "required", false));
      row.appendChild(textCell(slot.binds_to, true));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    var wrap = el("div", "card-table-wrap");
    wrap.setAttribute("data-testid", "inbox-bp-slots");
    wrap.appendChild(table);
    return wrap;
  }

  // role=inline — the literals FROZEN into the template, with the model's stated
  // reason. Rendered even when empty, deliberately: "no frozen filters" on a
  // blueprint whose intent names a specific metric is information — it says nothing
  // in the query still defines that metric — and a section that vanishes when empty
  // cannot say it. An entry with no `why` is marked, not flagged: plenty of frozen
  // literals are legitimate, but an unexplained one is the thing worth a second look.
  function renderInline(entries) {
    var inline = entries.filter(function (entry) { return entry.role === "inline"; });
    var list = el("ul", "card-list");
    list.setAttribute("data-testid", "inbox-bp-inline");
    if (!inline.length) {
      list.appendChild(el("li", "card-empty", "none — nothing in this template is frozen"));
      return list;
    }
    inline.forEach(function (entry) {
      var loc = isObject(entry.locator) ? entry.locator : {};
      var item = el("li");
      item.appendChild(el("span", "value", locatorText(entry) + " = " + String(loc.value)));
      var why = typeof entry.why === "string" ? entry.why.trim() : "";
      item.appendChild(
        el("span", why ? "why" : "why is-missing", why ? " — " + why : " — no reason given")
      );
      list.appendChild(item);
    });
    return list;
  }

  // role=rule — literals a catalog rule accounts for. Omitted when empty; unlike the
  // frozen filters, an absent rule citation carries no signal of its own.
  function renderRules(entries) {
    var rules = entries.filter(function (entry) { return entry.role === "rule"; });
    if (!rules.length) return null;
    var list = el("ul", "card-list");
    list.setAttribute("data-testid", "inbox-bp-rules");
    rules.forEach(function (entry) {
      var item = el("li");
      item.appendChild(el("span", "value", locatorText(entry)));
      item.appendChild(el("span", "why", " — rule " + String(entry.rule_id)));
      list.appendChild(item);
    });
    return list;
  }

  // The five S4 static checks, in `decide_outcome`'s precedence order rather than a
  // prettier one: the FIRST failing check is the reason tag the write router routes
  // on, so a reviewer reading left to right reads them in the order that produced the
  // routing they are looking at.
  var STATIC_CHECKS = [
    { key: "explain_ok", label: "explain" },
    // ASCII on purpose: "⊆" has no glyph in this page's monospace stack and renders as
    // a substitution box, which reads as a rendering fault rather than as a check name.
    { key: "binds_to_subset_uses", label: "binds in uses" },
    { key: "dag_ok", label: "dag" },
    { key: "read_only_select", label: "read-only" },
    { key: "date_literal_ok", label: "no frozen date" }
  ];

  function renderChecks(view) {
    var gen = isObject(view) ? view.generalization : null;
    var checks = isObject(gen) ? gen.static_validation : null;
    if (!isObject(checks)) return null;
    var wrap = el("div", "card-checks");
    wrap.setAttribute("data-testid", "inbox-bp-checks");
    STATIC_CHECKS.forEach(function (check) {
      var value = checks[check.key];
      // An ABSENT check is not a passing one. It renders as a failure pill with a
      // "?" so a payload missing a check reads as unknown rather than as clean.
      var passed = value === true;
      var mark = value === true ? "✓" : value === false ? "✗" : "?";
      wrap.appendChild(
        el("span", passed ? "check-pill" : "check-pill is-fail", mark + " " + check.label)
      );
    });
    if (checks.outcome && checks.outcome !== "ok") {
      wrap.appendChild(
        el("span", "check-pill is-fail", String(checks.outcome) + ": " + String(checks.reason))
      );
    }
    return wrap;
  }

  // The rewrite record the server stamps on a candidate whose SQL was replaced
  // (`{by, applied_at, previous_sql_sha256}`). Read through one accessor because two places
  // ask the same question — the header badge and the line beside Approve — and they must
  // never disagree about whether this artifact is still the session's query.
  function sqlRewriteRecord(item) {
    var view = isObject(item) ? item.payload_view : null;
    var record = isObject(view) ? view.sql_rewrite : null;
    return isObject(record) ? record : null;
  }

  // PERSISTENT, on the card, for every reviewer after the one who applied it.
  //
  // The modal's caution is seen once, by the person who chose the rewrite. This badge is for
  // everyone who arrives later and would otherwise read the card as a faithful record of a
  // query that ran — which, after a rewrite, it is not.
  function renderSqlRewriteBadge(item) {
    var record = sqlRewriteRecord(item);
    if (!record) return null;
    var badge = el("span", "item-sql-rewritten",
      "SQL rewritten by the assistant on " + formatWhen(record.applied_at) +
      " — not the session's query. Trial-run before approving.");
    badge.setAttribute("data-testid", "inbox-card-sql-rewritten");
    return badge;
  }

  function renderChips(values, testid) {
    var list = Array.isArray(values) ? values.filter(function (v) {
      return typeof v === "string" && v;
    }) : [];
    if (!list.length) return null;
    var wrap = el("div", "card-chips");
    if (testid) wrap.setAttribute("data-testid", testid);
    list.forEach(function (value) { wrap.appendChild(el("span", "card-chip", value)); });
    return wrap;
  }

  // Is there anything to say about this value? `[]`, `{}`, `""` and null are the shapes a
  // model emits for "I had nothing here", and rendering them puts `shape: [ ]` and
  // `invariants: [ ]` on every single card — noise that trains a reviewer to skim past the
  // section that sometimes carries the grain.
  function isEmptyValue(value) {
    if (value === null || value === undefined) return true;
    if (typeof value === "string") return !value.trim();
    if (Array.isArray(value)) return value.every(isEmptyValue);
    if (isObject(value)) return Object.keys(value).every(function (k) {
      return isEmptyValue(value[k]);
    });
    return false;
  }

  // One value, rendered by SHAPE rather than by schema.
  //
  // Shape-driven on purpose: `result_signature` is MODEL-AUTHORED on the fail-to-review path,
  // and the live corpus carries `grain`, `shape`, `invariants`, `measures`, `ordering`,
  // `limit`, and `dimensions`/`metrics` that are a dict on one card and a list of objects on
  // the next. There is no schema to render against — but there are only a few SHAPES, and each
  // has an obvious reading. Anything genuinely unrecognized still falls back to JSON, so a new
  // key is unpretty rather than invisible.
  function renderValue(value) {
    if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") {
      return el("span", "value", String(value));
    }
    if (Array.isArray(value)) {
      var scalars = value.every(function (v) {
        return typeof v === "string" || typeof v === "number" || typeof v === "boolean";
      });
      if (scalars) return el("span", "value", value.join(", "));
      // A list of small flat objects — `shape: [{column, type}]`, `metrics: [{name, ...}]`.
      var flat = value.every(function (v) {
        return isObject(v) && Object.keys(v).every(function (k) { return !isObject(v[k]) && !Array.isArray(v[k]); });
      });
      if (flat) {
        var list = el("ul", "card-list");
        value.forEach(function (row) {
          list.appendChild(el("li", "value", Object.keys(row).map(function (k) {
            return k + "=" + String(row[k]);
          }).join("  ")));
        });
        return list;
      }
      return el("pre", "payload-view", stringifyPayload(value));
    }
    if (isObject(value)) {
      var flatObj = Object.keys(value).every(function (k) {
        var v = value[k];
        return !isObject(v) && (!Array.isArray(v) || v.every(function (x) { return !isObject(x); }));
      });
      if (flatObj) {
        var rows = el("ul", "card-list");
        Object.keys(value).forEach(function (k) {
          if (isEmptyValue(value[k])) return;
          var li = el("li");
          li.appendChild(el("span", "why", k + ": "));
          li.appendChild(el("span", "value", Array.isArray(value[k])
            ? value[k].join(", ")
            : String(value[k])));
          rows.appendChild(li);
        });
        return rows;
      }
      return el("pre", "payload-view", stringifyPayload(value));
    }
    return el("span", "value", String(value));
  }

  // A labelled block per non-empty key. Returns null when EVERY key is empty, so the whole
  // section disappears rather than rendering a header over nothing.
  function renderKeyValues(obj, testid) {
    if (!isObject(obj)) return null;
    var keys = Object.keys(obj).filter(function (k) { return !isEmptyValue(obj[k]); });
    if (!keys.length) return null;
    var list = el("ul", "card-list");
    if (testid) list.setAttribute("data-testid", testid);
    keys.forEach(function (key) {
      var item = el("li");
      item.appendChild(el("span", "why", key.replace(/_/g, " ") + ": "));
      item.appendChild(renderValue(obj[key]));
      list.appendChild(item);
    });
    return list;
  }

  function renderText(value) {
    if (typeof value !== "string" || !value.trim()) return null;
    return el("p", "item-summary", value);
  }

  // Whatever the typed sections above did not consume.
  //
  // This is not tidiness — it is the correctness argument for typed rendering at all.
  // A renderer shows the fields it knows about, so a payload key added upstream would
  // become INVISIBLE rather than merely ugly. Accounting for the remainder means the
  // worst a new key can do is land in a plain block at the bottom.
  function renderOtherFields(view, consumed) {
    if (!isObject(view)) return null;
    var rest = {};
    var found = false;
    Object.keys(view).forEach(function (key) {
      if (consumed.indexOf(key) === -1) {
        rest[key] = view[key];
        found = true;
      }
    });
    if (!found) return null;
    var pre = el("pre", "payload-view", stringifyPayload(rest));
    pre.setAttribute("data-testid", "inbox-other-fields");
    return pre;
  }

  // The original dump, verbatim, collapsed. It keeps `data-testid` so the assertions
  // written against it still point at the raw JSON they were written for, and it is
  // never omitted for any card: the typed view is a ranking of the payload, not a
  // replacement for it.
  function renderRawPayload(item) {
    var details = el("details", "card-raw");
    details.setAttribute("data-testid", "inbox-raw-toggle");
    details.appendChild(el("summary", "", "raw JSON"));
    var pre = el("pre", "payload-view", stringifyPayload(item.payload_view));
    pre.setAttribute("data-testid", "inbox-payload-view");
    details.appendChild(pre);
    return details;
  }

  // Keys the blueprint card renders explicitly. Anything else falls to
  // `renderOtherFields`. `intent` is here because the card header already shows it as
  // the summary — consumed, not ignored.
  var BLUEPRINT_KEYS = [
    "intent", "kind", "resolves", "notes", "composes", "parameterization",
    "generalization", "result_signature", "source_tool_call_refs", "accepted_signal",
    "withheld",
    // Present on the FAIL-TO-REVIEW payload only (it is the model's raw plan, not the
    // S4-enriched one), and rendered by the sections below — `uses` falls back into the USES
    // chips when there is no generalization to take them from, and `grain`/`tables` are shown
    // beside the result. Listed here so they stop landing in "other fields" as a JSON dump.
    "uses", "tables", "grain"
  ];

  function blueprintSections(item) {
    var view = item.payload_view;
    if (!isObject(view)) return null;
    var entries = paramEntries(view);
    var gen = isObject(view.generalization) ? view.generalization : {};
    var out = [];

    // A withheld payload leads, because every section under it will be empty and a
    // card that renders blank reads as a candidate with nothing in it — the exact
    // failure the unscanned-notice exists to prevent.
    if (typeof view.withheld === "string" && view.withheld) {
      out.push(section("withheld", el("p", "card-empty", view.withheld), "inbox-bp-withheld"));
    }

    out.push(section("template", renderTemplate(item), null));
    out.push(section("slots", renderSlots(entries), null));
    out.push(section("frozen filters", renderInline(entries), null));
    out.push(section("rule filters", renderRules(entries), null));
    out.push(section("checks", renderChecks(view), null));
    out.push(section("resolves", renderKeyValues(view.resolves, "inbox-bp-resolves"), null));
    out.push(
      section(
        "result",
        renderKeyValues(
          // The fail-to-review payload carries a top-level `grain` beside the signature;
          // merged here so one section describes the result rather than two.
          isObject(view.result_signature) || view.grain
            ? Object.assign({}, view.result_signature || {},
                view.grain && !(isObject(view.result_signature) && view.result_signature.grain)
                  ? { grain: view.grain } : {})
            : null,
          "inbox-bp-result"
        ),
        null
      )
    );
    // `generalization.uses` is the S4-resolved transitive set; the payload-level `uses` is the
    // model's own declaration and is all a fail-to-review card has. Prefer the resolved one.
    out.push(
      section("uses", renderChips(gen.uses || view.uses, "inbox-bp-uses"), null)
    );
    out.push(section("tables", renderChips(view.tables, null), null));
    out.push(section("rules used", renderChips(gen.uses_rules, null), null));
    out.push(section("composes", renderChips(view.composes, null), null));
    out.push(section("notes", renderText(view.notes), null));
    out.push(section("other fields", renderOtherFields(view, BLUEPRINT_KEYS), null));
    return out;
  }

  // Knowledge and schema-edit payloads have no fixed shape this page can rely on, so
  // they get a typed-by-VALUE rendering — one labelled block per top-level key,
  // scalars as prose and structures as JSON — rather than a guessed schema. Still a
  // large improvement on one blob, and it cannot be wrong about a field it does not
  // claim to understand.
  function genericSections(item) {
    var view = item.payload_view;
    if (!isObject(view)) return null;
    var keys = Object.keys(view);
    if (!keys.length) return null;
    return keys.map(function (key) {
      var value = view[key];
      var body =
        typeof value === "string"
          ? (value.trim() ? el("p", "item-summary", value) : el("p", "card-empty", "—"))
          : typeof value === "number" || typeof value === "boolean"
            ? el("p", "item-summary", String(value))
            : value === null || value === undefined
              ? el("p", "card-empty", "—")
              : el("pre", "payload-view", stringifyPayload(value));
      return section(key.replace(/_/g, " "), body, null);
    });
  }

  // Dispatch on candidate type. The unknown-type leg is load-bearing: a typed
  // renderer shows only what it recognizes, so a candidate type added later must fall
  // ALL the way back to the dump rather than render a confident, partial view of
  // itself.
  function renderPayload(item) {
    var wrap = el("div", "card-sections");
    wrap.setAttribute("data-testid", "inbox-payload");
    var sections = null;
    if (item.type === "blueprint") {
      sections = blueprintSections(item);
    } else if (
      item.type === "global_knowledge" ||
      item.type === "user_knowledge" ||
      item.type === "schema_edit"
    ) {
      sections = genericSections(item);
    }
    if (!sections) {
      wrap.appendChild(el("p", "item-field-label", "payload"));
      var pre = el("pre", "payload-view", stringifyPayload(item.payload_view));
      pre.setAttribute("data-testid", "inbox-payload-view");
      wrap.appendChild(pre);
      return wrap;
    }
    sections.forEach(function (node) { if (node) wrap.appendChild(node); });
    wrap.appendChild(renderRawPayload(item));
    return wrap;
  }

  // --- The parameterization judge's marker (design §D, phase D-1) ----------
  //
  // The judge OBSERVES. It cannot drop, route or repair anything, and nothing on this card
  // changes because of it — which is exactly why the marker has to be here. The rollout
  // decision needs to know how often the judge and a human disagree, and the cheapest way to
  // collect that is to show the reviewer the verdict on the card they were already going to
  // approve or reject.
  //
  // It colours on a CLASS A finding rather than on the verdict: `revise` is also what a slot
  // naming nit produces, and Class A is the only class that means the blueprint is WRONG
  // rather than merely narrower.
  function renderJudge(item) {
    var judge = item.param_judge;
    if (!isObject(judge) || !judge.verdict) return null;
    var findings = Array.isArray(judge.findings) ? judge.findings.filter(isObject) : [];
    var serious = findings.some(function (f) { return f.class === "A"; });

    var wrap = el("div", serious ? "item-judge is-serious" : "item-judge");
    wrap.setAttribute("data-testid", "inbox-judge");

    var head = el("div", "judge-head");
    head.appendChild(el("span", "", "parameterization judge (shadow)"));
    head.appendChild(el("span", "", "· " + String(judge.verdict)));
    if (typeof judge.confidence === "number") {
      head.appendChild(el("span", "", "· " + judge.confidence.toFixed(2)));
    }
    if (serious) {
      // The phrasing is deliberate: it names what phase D-2 WOULD do, in a phase where
      // nothing was done. A marker that read like an action taken would misdescribe the
      // candidate sitting under it.
      var flag = el("span", "", "· would be discarded under D-2");
      flag.setAttribute("data-testid", "inbox-judge-would-discard");
      head.appendChild(flag);
    }
    wrap.appendChild(head);

    if (judge.feedback) wrap.appendChild(el("p", "revise-rationale", judge.feedback));

    if (findings.length) {
      var list = el("ul", "judge-findings");
      list.setAttribute("data-testid", "inbox-judge-findings");
      findings.forEach(function (f) {
        var row = el("li");
        row.appendChild(el("span", "finding-class", String(f.class) + " "));
        row.appendChild(
          document.createTextNode(String(f.criterion || "") + " — " + String(f.note || ""))
        );
        list.appendChild(row);
      });
      wrap.appendChild(list);
    }
    return wrap;
  }

  // --- The leakage override (reviewer attestation) --------------------------
  //
  // Shown only where it can do anything: a SETTLED, NON-PASS verdict on a card a human is
  // adjudicating. The scanner is a regex+NER pass over generalized SQL, so it flags enum
  // literals as people — the case that prompted this was `event_type = '<leave type> Request'`
  // read as a `person`, which quarantined a time-off blueprint with no way to unblock it.
  //
  // The note is REQUIRED and the button stays disabled without one. This is the only control
  // on the page that steps past a D17 gate, so the reason is part of the operation.
  function renderScanOverride(item, node) {
    var scan = item.entity_scan || {};
    var settled = scan.result && scan.result !== "pending";
    if (!settled || scan.result === "pass") return null;

    // Already attested: say so instead of offering it again. The server only sends an
    // attestation that still BINDS to the current finding, so this can never read as
    // "signed off" for a verdict that has since changed.
    if (isObject(item.leakage_attestation)) {
      var done = el("p", "scan-attested");
      done.setAttribute("data-testid", "inbox-scan-attested");
      done.textContent =
        "entity finding attested as a false positive (" +
        String(item.leakage_attestation.hit_count) + " hit(s), " +
        String(item.leakage_attestation.attested_at) + ") — " +
        String(item.leakage_attestation.note);
      return done;
    }

    var wrap = el("div", "scan-override");
    wrap.setAttribute("data-testid", "inbox-scan-override");
    wrap.appendChild(
      el("p", "", "the entity scan flagged this candidate, so the assistant is unavailable. " +
        "If these are false positives, say why and override — the verdict itself is kept, " +
        "and this does NOT make the candidate auto-promotable.")
    );
    var note = document.createElement("input");
    note.type = "text";
    note.setAttribute("data-testid", "inbox-scan-override-note");
    note.setAttribute("aria-label", "why this entity finding is a false positive");
    note.placeholder = "e.g. 'Vacation' is a leave-type enum in event_type, not a person";
    wrap.appendChild(note);

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "action-complete";
    btn.setAttribute("data-testid", "inbox-scan-override-apply");
    btn.textContent = "Attest false positive";
    btn.disabled = true;
    note.addEventListener("input", function () {
      btn.disabled = !note.value.trim();
    });
    btn.addEventListener("click", function () {
      clearError();
      btn.disabled = true;
      fetch("/api/inbox/" + encodeURIComponent(item.candidate_id) + "/attest_scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ note: note.value })
      })
        .then(function (response) {
          return response.text().then(function (text) {
            if (!response.ok) {
              var parsed = null;
              try { parsed = JSON.parse(text); } catch (err) { parsed = null; }
              showError("HTTP_" + response.status,
                (parsed && parsed.detail) || text || response.statusText);
              btn.disabled = false;
              return;
            }
            loadInbox();
          });
        })
        .catch(function (err) {
          showError("NETWORK", String(err));
          btn.disabled = false;
        });
    });
    wrap.appendChild(btn);
    return wrap;
  }

  // --- Previewing a proposal ON the card ------------------------------------
  //
  // A diff list says `role_changed | payroll.register_type`. The card says which SLOTS the
  // template takes and which FILTERS are frozen — the terms the reviewer is actually judging
  // in. So the proposal is applied to a COPY of the payload and those sections are
  // re-rendered from it, with the moved entries marked on both sides.
  //
  // ⚠ THE TEMPLATE IS NOT REGENERATED, and that is deliberate rather than laziness. The
  // `sql_template` is DERIVED by the S4 AST rewrite from the accepted SQL; this page cannot
  // reproduce that, and a hand-spliced approximation of the resulting SQL would be the exact
  // "model writes the template" failure the whole design refuses, wearing a UI costume. The
  // preview says the template is regenerated on apply and shows the current one unchanged.
  function previewPayload(view, entries, replace) {
    var current = (isObject(view) && Array.isArray(view.parameterization))
      ? view.parameterization : [];
    var merged = replace ? entries.slice() : current.concat(entries);
    // Under APPEND a proposal that touches an existing locator produces a duplicate, which
    // is the `conflict` the diff already names. For the PREVIEW the honest rendering is the
    // proposal winning, because that is what the reviewer is being asked to picture — the
    // warning beside it says the apply needs `replace`.
    var byKey = {};
    var out = [];
    merged.forEach(function (entry) {
      var loc = isObject(entry) && isObject(entry.locator) ? entry.locator : {};
      var key = String(loc.table) + "." + String(loc.column) + "=" + String(loc.value);
      if (Object.prototype.hasOwnProperty.call(byKey, key)) {
        out[byKey[key]] = entry;
        return;
      }
      byKey[key] = out.length;
      out.push(entry);
    });
    var copy = {};
    Object.keys(view || {}).forEach(function (k) { copy[k] = view[k]; });
    copy.parameterization = out;
    return copy;
  }

  // The locators a proposal touches, so both panes can mark the same rows.
  function changedLocators(diff) {
    var keys = {};
    (Array.isArray(diff) ? diff : []).forEach(function (row) {
      if (isObject(row) && row.kind && row.kind !== "unchanged") keys[row.locator] = true;
    });
    return keys;
  }

  function markChanged(node, changed) {
    if (!node) return node;
    node.querySelectorAll("tbody tr, li").forEach(function (row) {
      var text = row.textContent || "";
      Object.keys(changed).forEach(function (loc) {
        if (loc && loc !== "(no locator)" && text.indexOf(loc) !== -1) {
          row.classList.add("is-preview-changed");
        }
      });
    });
    return node;
  }

  function renderPreview(item, payload, diff) {
    var changed = changedLocators(diff);
    var entries = paramEntries(payload);
    var block = el("div", "preview-block");
    block.setAttribute("data-testid", "inbox-preview");

    var head = el("div", "preview-head");
    head.appendChild(el("span", "", "proposed — not yet applied"));
    block.appendChild(head);

    block.appendChild(section("slots (proposed)", markChanged(renderSlots(entries), changed), null));
    block.appendChild(
      section("frozen filters (proposed)", markChanged(renderInline(entries), changed), null)
    );
    var rules = markChanged(renderRules(entries), changed);
    if (rules) block.appendChild(section("rule filters (proposed)", rules, null));
    block.appendChild(
      el("p", "card-empty",
        "the SQL template is regenerated by the server when you apply — it is not " +
        "previewed here, because this page does not author SQL")
    );
    // ⚠ NAMESPACE THE PREVIEW'S TESTIDS. `renderSlots`/`renderInline`/`renderRules` stamp the
    // card's own ids, so rendering them twice made `inbox-bp-slots` resolve to TWO elements —
    // ambiguous for every selector on the page, not just for a test. The preview keeps its
    // sections addressable under its own prefix and leaves the live card's ids unique.
    block.querySelectorAll("[data-testid]").forEach(function (node) {
      var id = node.getAttribute("data-testid");
      if (id && id.indexOf("inbox-preview") !== 0) {
        node.setAttribute("data-testid", "preview-" + id);
      }
    });
    return block;
  }

  // --- Trial run (does it still execute, with values I chose?) ---------------
  //
  // The promotion gate replays with SYNTHETIC samples, which is how a badly-typed `period`
  // sample went unnoticed until it blocked every approve. This lets a reviewer bind the slots
  // themselves and see what comes back.
  //
  // ⚠ STRUCTURE, NEVER ROWS. Columns, a row count and a distinct-grain count — the server
  // refuses to return rows, and this pane could not show them if it wanted to. That is
  // `replay.py`'s rule: returning warehouse rows would turn a review surface for REDACTED
  // candidates into a data-browsing surface, which is a decision to take deliberately rather
  // than as a side effect of adding a button.
  function renderTrialRun(item) {
    var parts = Array.isArray(item.template_parts) ? item.template_parts : [];
    var slots = [];
    parts.forEach(function (part) {
      if (isObject(part) && typeof part.slot === "string" && slots.indexOf(part.slot) === -1) {
        slots.push(part.slot);
      }
    });
    var gen = isObject(item.payload_view) ? item.payload_view.generalization : null;
    if (!isObject(gen) || !gen.sql_template) return null;

    var block = el("div", "trial-block");
    block.setAttribute("data-testid", "inbox-trial");
    block.appendChild(el("p", "item-field-label", "trial run — does it execute?"));

    // THE REVIEWER PASTES THEIR OWN TOKEN. This page never mints one and never asks the
    // server to: a review surface that could produce warehouse authority would turn "allowed
    // to review candidates" into "allowed to obtain a warehouse token", which is not the same
    // grant. The trial BORROWS authority for one request.
    //
    // Held in a local only — never written to storage, never put in a URL, and never sent
    // anywhere but this one POST. It is cleared from the field after a run so a shared screen
    // or a browser restore cannot leak it.
    var tokenInput = document.createElement("input");
    tokenInput.type = "password";
    tokenInput.setAttribute("data-testid", "inbox-trial-token");
    tokenInput.setAttribute("autocomplete", "off");
    tokenInput.placeholder = "paste a warehouse token you already hold";
    var tokenRow = el("div", "trial-binding");
    tokenRow.appendChild(el("label", "", "run as"));
    tokenRow.appendChild(tokenInput);
    block.appendChild(tokenRow);
    block.appendChild(
      el("p", "card-empty",
        "the token's own entitlements decide what this returns — a trial proves the SQL runs " +
        "and what shape it returns, not that the declared column footprint is honest (that is " +
        "checked separately before anything is served)")
    );

    var inputs = {};
    slots.forEach(function (name) {
      var row = el("div", "trial-binding");
      var label = el("label", "", name);
      label.setAttribute("for", "trial-" + item.candidate_id + "-" + name);
      row.appendChild(label);
      var input = document.createElement("input");
      input.type = "text";
      input.id = "trial-" + item.candidate_id + "-" + name;
      input.setAttribute("data-testid", "inbox-trial-binding");
      input.setAttribute("data-slot", name);
      input.placeholder = "a value to bind";
      inputs[name] = input;
      row.appendChild(input);
      block.appendChild(row);
    });
    if (!slots.length) {
      block.appendChild(
        el("p", "card-empty", "this template takes no arguments — run it as-is")
      );
    }

    var out = el("div");
    out.setAttribute("data-testid", "inbox-trial-output");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "action-complete";
    btn.setAttribute("data-testid", "inbox-trial-run");
    btn.textContent = "Run it";
    btn.addEventListener("click", function () {
      clearError();
      clearNode(out);
      btn.disabled = true;
      btn.textContent = "Running…";
      var bindings = {};
      Object.keys(inputs).forEach(function (n) { bindings[n] = inputs[n].value; });
      fetch("/api/inbox/" + encodeURIComponent(item.candidate_id) + "/trial_run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bindings: bindings, token: tokenInput.value })
      })
        .then(function (response) {
          return response.text().then(function (text) {
            var parsed = null;
            try { parsed = JSON.parse(text); } catch (err) { parsed = null; }
            if (!response.ok) {
              showError("HTTP_" + response.status,
                (parsed && parsed.detail) || text || response.statusText);
              return;
            }
            out.appendChild(renderTrialResult(parsed));
          });
        })
        .catch(function (err) { showError("NETWORK", String(err)); })
        .then(function () {
          btn.disabled = false;
          btn.textContent = "Run it";
          // CLEARED once the request has settled, win or lose. A bearer credential left in a
          // focused field survives a shared screen, a screenshot and a browser session
          // restore; re-pasting it costs one keystroke.
          tokenInput.value = "";
        });
    });
    block.appendChild(btn);
    block.appendChild(out);
    return block;
  }

  function renderTrialResult(r) {
    if (!isObject(r)) return el("p", "trial-result is-fail", "no result");
    if (!r.ok) {
      // A run that could NOT happen is not a failed blueprint. The reasons are kept apart
      // because they need different fixes: missing bindings is the reviewer's next action,
      // `no_uses_scope` is a refusal to mint an unrestricted token, and `warehouse_error` is
      // the only one that says anything about the SQL.
      var why = String(r.reason || "unknown");
      if (why === "missing_bindings") {
        why = "fill in: " + (r.missing || []).join(", ");
      } else if (why === "no_uses_scope") {
        why = "this blueprint declares no column footprint, so there is nothing to check the " +
              "query against — it is refused rather than run unscoped";
      } else if (why === "warehouse_error") {
        why = "the warehouse rejected it: " + String(r.detail || "");
      } else if (why === "no_token") {
        why = "paste a warehouse token to run the trial — this page never mints one, so it " +
              "runs as you rather than as the service";
      } else if (why === "no_template") {
        why = "no SQL template on this candidate";
      }
      var fail = el("p", "trial-result is-fail", why);
      fail.setAttribute("data-testid", "inbox-trial-result");
      return fail;
    }
    // ⚠ AN EMPTY RESULT IS NOT A PASS. The D56 gate is satisfied vacuously by zero rows —
    // the grain teeth hold and the signature check is skipped when the candidate declares no
    // `shape` — so `verify_passed` alone would put a green tick on a run that proved only
    // that the SQL parses and is authorized. The server computes `inconclusive`; this states
    // it in the reviewer's words rather than implying success.
    var verdictClass = r.inconclusive
      ? "trial-result"
      : (r.verify_passed ? "trial-result is-pass" : "trial-result is-fail");
    var pass = el("div", verdictClass);
    pass.setAttribute("data-testid", "inbox-trial-result");
    if (r.inconclusive) {
      pass.appendChild(el("p", "", "~ it ran, but returned no rows and no columns"));
      pass.appendChild(
        el("p", "card-empty",
          "that proves the SQL parses and the scoped token is allowed to run it — and " +
          "nothing about its shape. A filter that matches no rows looks exactly like this.")
      );
    } else {
      pass.appendChild(
        el("p", "", (r.verify_passed ? "✓ ran and verified" : "✗ ran, but the shape check failed"
          + (r.verify_reason ? " (" + r.verify_reason + ")" : "")))
      );
    }
    pass.appendChild(el("p", "", "rows: " + String(r.row_count) +
      (r.distinct_grain_count === null || r.distinct_grain_count === undefined
        ? "" : "  ·  distinct grain: " + String(r.distinct_grain_count))));
    var cols = renderChips(r.columns, "inbox-trial-columns");
    if (cols) pass.appendChild(cols);
    // Stated, not implied: a reviewer who sees a row COUNT will wonder where the rows are.
    pass.appendChild(
      el("p", "card-empty", "structure only — no rows are returned to this surface")
    );
    return pass;
  }

  // --- Type tabs + status toggle ------------------------------------------

  function typeLabel(type) {
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].type === type) return TYPES[i].label;
    }
    return type || "unknown";
  }

  // Count the currently-fetched set by type. All four keys are always present
  // (including 0) so every tab shows a badge (contract §Frontend).
  function computeCounts() {
    var counts = {};
    TYPES.forEach(function (t) { counts[t.type] = 0; });
    state.items.forEach(function (item) {
      if (Object.prototype.hasOwnProperty.call(counts, item.type)) {
        counts[item.type] += 1;
      }
    });
    return counts;
  }

  // Build the four type tabs once as a roving-tabindex tablist. Clicking a tab
  // is a client-side filter only — it never refetches.
  function buildTabs() {
    TYPES.forEach(function (t) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "type-tab";
      btn.setAttribute("role", "tab");
      btn.setAttribute("data-testid", "inbox-tab");
      btn.setAttribute("data-type", t.type);
      btn.setAttribute("aria-selected", "false");
      btn.tabIndex = -1;
      var label = document.createElement("span");
      label.className = "tab-label";
      label.textContent = t.label;
      btn.appendChild(label);
      var count = document.createElement("span");
      count.className = "tab-count";
      count.setAttribute("data-testid", "inbox-tab-count");
      count.textContent = "0";
      btn.appendChild(count);
      btn.addEventListener("click", function () { setActiveType(t.type); });
      tabEls[t.type] = { btn: btn, count: count };
      els.tabs.appendChild(btn);
    });
    els.tabs.addEventListener("keydown", onTabKeydown);
  }

  // Left/Right/Home/End roving focus across the tablist.
  function onTabKeydown(event) {
    var idx = -1;
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].type === state.activeType) { idx = i; break; }
    }
    if (idx === -1) return;
    var next = idx;
    if (event.key === "ArrowRight") next = (idx + 1) % TYPES.length;
    else if (event.key === "ArrowLeft") next = (idx - 1 + TYPES.length) % TYPES.length;
    else if (event.key === "Home") next = 0;
    else if (event.key === "End") next = TYPES.length - 1;
    else return;
    event.preventDefault();
    var type = TYPES[next].type;
    setActiveType(type);
    tabEls[type].btn.focus();
  }

  // Wire the status toggle (Review queue / Needs parameterization / Promotable /
  // Promoted / Archived). Switching status REFETCHES the list for that status (contract
  // §Status toggle) — each one is a different queue with different actions.
  function buildStatusToggle() {
    els.statusToggle.querySelectorAll(".status-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var next = btn.dataset.status;
        if (next === state.status) return;
        state.status = next;
        loadInbox();
      });
    });
  }

  function updateStatusToggle() {
    els.statusToggle.querySelectorAll(".status-btn").forEach(function (btn) {

      var active = btn.dataset.status === state.status;
      btn.classList.toggle("is-active", active);
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }

  // Filter the rendered list to a type (client-side; no refetch).
  function setActiveType(type) {
    // A tab switch is a NEW queue, so the position resets. Position 7 of the blueprints
    // means nothing among the knowledge candidates.
    if (type !== state.activeType) state.cursor = 0;
    state.activeType = type;
    render();
  }

  // On a fresh fetch, keep the current tab if it still has items (preserves the
  // reviewer's tab across status switches / action refreshes), else fall back to
  // the first non-empty type, else the default (blueprint).
  function pickDefaultType() {
    var counts = computeCounts();
    if (counts[state.activeType] > 0) return state.activeType;
    for (var i = 0; i < TYPES.length; i++) {
      if (counts[TYPES[i].type] > 0) return TYPES[i].type;
    }
    return "blueprint";
  }

  // Update tab active state + count badges + roving tabindex.
  function updateTabs(counts) {
    TYPES.forEach(function (t) {
      var refs = tabEls[t.type];
      if (!refs) return;
      var active = t.type === state.activeType;
      refs.count.textContent = String(counts[t.type]);
      refs.btn.classList.toggle("is-active", active);
      refs.btn.setAttribute("aria-selected", active ? "true" : "false");
      refs.btn.tabIndex = active ? 0 : -1;
    });
  }

  // --- Per-item confirm / disable helpers ---------------------------------

  // Reset every action button in a row back to its default (non-confirming)
  // label and hide the cancel affordance.
  function resetConfirm(actions) {
    var buttons = actions.querySelectorAll("button.action-btn");
    buttons.forEach(function (btn) {
      btn.classList.remove("confirming");
      btn.dataset.confirming = "0";
      btn.textContent = btn.dataset.label;
      btn.setAttribute("aria-pressed", "false");
    });
    var cancel = actions.querySelector("button.action-cancel");
    if (cancel) cancel.hidden = true;
  }

  // Disable all controls in a row while a POST is in flight.
  function disableActions(actions) {
    actions.querySelectorAll("button").forEach(function (btn) {
      btn.disabled = true;
    });
  }

  // Re-enable controls after an action. The rules are per-LIST, because a transition
  // the current list cannot legally make is a 409 waiting to happen:
  //   approve  — disabled offline (the write plane can't land it, contract §5);
  //   retract  — disabled wherever it IS rendered (the review-queue row builds it as a
  //              placeholder); it applies to validated items only, and the promotable
  //              list does not render it at all (contract §4);
  //   verify   — validated-only: a promoted candidate has left that state, so verifying
  //              it can only 409;
  //   promote  — live on BOTH promotion lists: the first emit from `validated`, and the
  //              idempotent re-emit from `promoted` that recovers a lost PR.
  function enableActions(actions) {
    var promotable = state.status === "validated";
    var promoted = state.status === "promoted";
    actions.querySelectorAll("button").forEach(function (btn) {
      var act = btn.dataset.action;
      if (act === "approve" && state.offline) {
        btn.disabled = true;
      } else if (act === "retract") {
        btn.disabled = true;
      } else if (act === "verify") {
        btn.disabled = !promotable;
      } else if (act === "promote") {
        btn.disabled = !(promotable || promoted);
      } else {
        btn.disabled = false;
      }
    });
  }

  // --- Action POST + error mapping ----------------------------------------

  // verify and promote answer WITH something the reviewer has to read — the
  // `node_stamped` outcome, and the canon YAML — so they render in place instead of
  // taking the usual drop-the-row-and-refresh path, which would destroy the answer
  // before it could be copied. (verify also leaves the candidate on this list: it flips
  // `verified`, not `status`.)
  function keepsRow(action) {
    return action === "verify" || action === "promote";
  }

  function performAction(candidateId, action, node, actions) {
    clearError();
    // APPROVE REPLAYS AGAINST THE WAREHOUSE, so it needs the reviewer's own token — nothing
    // here or upstream mints one. Read from the trial box on the same card when it is filled
    // in (the common flow: trial it, then approve it), and asked for otherwise.
    var body = {};
    if (action === "approve") {
      var box = node.querySelector("[data-testid=inbox-trial-token]");
      var token = (box && box.value.trim()) || window.prompt(
        "Approving runs this blueprint against the warehouse as YOU.\n" +
        "Paste a warehouse token (nothing here mints one):"
      );
      if (!token) {
        showError("NO_TOKEN", "Approve needs a warehouse token — nothing was changed.");
        resetConfirm(actions);
        return;
      }
      body.token = token;
      if (box) box.value = "";
    }
    disableActions(actions);
    fetch("/api/inbox/" + encodeURIComponent(candidateId) + "/" + action, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(function (response) {
        if (response.ok) {
          if (keepsRow(action)) {
            return response.text().then(function (text) {
              var result = null;
              try {
                result = JSON.parse(text);
              } catch (err) {
                result = null;
              }
              if (action === "promote") {
                renderPromotionEmit(node, result);
              } else {
                renderVerifyResult(node, result);
              }
              // Re-arm the row: verify is the step BEFORE promote, and the reviewer
              // clicks the second button on the same card.
              resetConfirm(actions);
              enableActions(actions);
              if (action === "promote") {
                // This candidate is `promoted` now. Verify is validated-only, so
                // re-arming it would hand back a button whose only outcome is a 409.
                // Promote itself stays live — it re-emits idempotently, which is how a
                // lost PR is recovered.
                var verifyBtn = actions.querySelector('button[data-action="verify"]');
                if (verifyBtn) verifyBtn.disabled = true;
              }
            });
          }
          // A validated/rejected/retired item is no longer in_review: drop it
          // from the DOM for instant feedback, then refresh the authoritative
          // list (which also handles the transition to the empty state).
          node.parentNode && node.parentNode.removeChild(node);
          loadInbox();
          return;
        }
        return response.text().then(function (text) {
          var parsed = null;
          try {
            parsed = JSON.parse(text);
          } catch (err) {
            parsed = null;
          }
          var reason = parsed && (parsed.reason || parsed.detail);
          var message;
          if (response.status === 503) {
            // 503 means a different thing per verb — no landing plane for approve,
            // no validation plane for complete, an unconfigured reviewer token for any
            // of them — so only approve gets the approve sentence and the rest defer to
            // the server's own reason. Naming the wrong cause is worse than naming none.
            message =
              action === "approve"
                ? "approve-that-lands is unavailable in this deployment"
                : reason || "that action is unavailable in this deployment";
          } else if (response.status === 409) {
            // hold reason / illegal-transition, surfaced verbatim (contract §2).
            message = reason || "That transition is not allowed right now.";
          } else {
            message = reason || text || response.statusText;
          }
          showError("HTTP_" + response.status, message);
          resetConfirm(actions);
          enableActions(actions);
        });
      })
      .catch(function (err) {
        showError("NETWORK", String(err));
        resetConfirm(actions);
        enableActions(actions);
      });
  }

  // Build one action button with a two-step confirm: the first click arms it
  // (destructive/promotion actions require intent), the second click fires.
  function makeActionButton(candidateId, action, label, node, actions, disabled) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "action-btn action-" + action;
    btn.dataset.action = action;
    btn.dataset.label = label;
    btn.dataset.confirming = "0";
    btn.textContent = label;
    btn.setAttribute("data-testid", "inbox-" + action);
    btn.setAttribute("aria-pressed", "false");
    if (disabled) btn.disabled = true;

    btn.addEventListener("click", function () {
      if (btn.dataset.confirming === "1") {
        performAction(candidateId, action, node, actions);
        return;
      }
      // Arm this button; reset any other armed button first.
      resetConfirm(actions);
      btn.dataset.confirming = "1";
      btn.classList.add("confirming");
      btn.textContent = "Confirm " + label;
      btn.setAttribute("aria-pressed", "true");
      var cancel = actions.querySelector("button.action-cancel");
      if (cancel) cancel.hidden = false;
    });

    return btn;
  }

  // --- Promotion hop results (verify / promote) ----------------------------

  // The PromotionEmit metadata (contract §8.1), in the order a human needs it to open
  // the PR by hand. The service does NOT touch git — these fields ARE the handoff.
  var PROMOTION_FIELDS = [
    { key: "target_path", label: "target path" },
    { key: "filename", label: "filename" },
    { key: "suggested_branch", label: "suggested branch" },
    { key: "commit_message", label: "commit message" },
    { key: "note", label: "note" },
  ];

  // Action results belong ABOVE the actions row (which is always last, under its
  // border-top), so a card keeps reading top-to-bottom: what it is, what just
  // happened, what you can do next.
  function insertResultPanel(node, panel) {
    var actions = node.querySelector(".item-actions");
    if (actions) node.insertBefore(panel, actions);
    else node.appendChild(panel);
  }

  // The promote response is the MCP-format YAML plus PR metadata — NOT the
  // {candidate_id, status, reason} shape every other action returns. It is rendered in
  // place, with a copy button, because the reviewer's next step is outside this app:
  // open a PR against the MCP corpus repo, regenerate the parity sidecars, rebuild.
  // A re-promote replaces the previous panel so two emits never read as two candidates.
  function renderPromotionEmit(node, emit) {
    var previous = node.querySelector('[data-testid="inbox-promotion"]');
    if (previous && previous.parentNode) previous.parentNode.removeChild(previous);

    var wrap = document.createElement("div");
    wrap.className = "item-promotion";
    wrap.setAttribute("data-testid", "inbox-promotion");

    var head = document.createElement("div");
    head.className = "promotion-head";
    var label = document.createElement("p");
    label.className = "item-field-label";
    label.textContent = "MCP canon YAML — open the PR by hand";
    head.appendChild(label);

    var yamlText = emit && typeof emit.yaml === "string" ? emit.yaml : "";
    var copyStatus = document.createElement("span");
    copyStatus.className = "promotion-copy-status";
    copyStatus.setAttribute("data-testid", "inbox-promotion-copy-status");
    copyStatus.setAttribute("role", "status");

    var copy = document.createElement("button");
    copy.type = "button";
    // Deliberately NOT `action-btn`: that class is the two-step-confirm family the
    // actions row sweeps; this button lives in the panel and copies on first click.
    copy.className = "promotion-copy";
    copy.setAttribute("data-testid", "inbox-promotion-copy");
    copy.setAttribute("aria-label", "Copy the promotion YAML to the clipboard");
    copy.textContent = "Copy YAML";
    copy.addEventListener("click", function () {
      // `navigator.clipboard` does not exist on an insecure origin, and writeText can
      // still be denied. Say so next to the button — the YAML stays selectable in the
      // block below, and a silent no-op would look like a copy that worked.
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        copyStatus.textContent = "clipboard unavailable — select the YAML below";
        return;
      }
      navigator.clipboard.writeText(yamlText).then(
        function () {
          copyStatus.textContent = "copied";
        },
        function (err) {
          copyStatus.textContent = "copy failed: " + String(err);
        }
      );
    });
    head.appendChild(copy);
    head.appendChild(copyStatus);
    wrap.appendChild(head);

    var pre = document.createElement("pre");
    pre.className = "promotion-yaml";
    pre.setAttribute("data-testid", "inbox-promotion-yaml");
    // The block scrolls horizontally on a long line, so it has to be reachable and
    // scrollable from the keyboard — and named, or it focuses as an anonymous stop.
    pre.setAttribute("tabindex", "0");
    pre.setAttribute("aria-label", "Promotion YAML");
    // textContent only — this is server-rendered document text, never HTML (contract §4).
    pre.textContent = yamlText;
    wrap.appendChild(pre);

    var meta = document.createElement("dl");
    meta.className = "promotion-meta";
    meta.setAttribute("data-testid", "inbox-promotion-meta");
    PROMOTION_FIELDS.forEach(function (field) {
      var value = emit ? emit[field.key] : null;
      if (!value) return;
      var dt = document.createElement("dt");
      dt.textContent = field.label;
      meta.appendChild(dt);
      var dd = document.createElement("dd");
      dd.setAttribute("data-testid", "inbox-promotion-" + field.key);
      dd.textContent = String(value);
      meta.appendChild(dd);
    });
    wrap.appendChild(meta);

    insertResultPanel(node, wrap);
  }

  // verify flips `verified=true` on the landed node. `node_stamped === false` means the
  // neo4j write did NOT land (the service fails open, so the envelope moved and the node
  // did not) — that has to be visible, or the reviewer walks away believing a node is
  // vouched when nothing on it says so.
  function renderVerifyResult(node, result) {
    var previous = node.querySelector('[data-testid="inbox-verify-note"]');
    if (previous && previous.parentNode) previous.parentNode.removeChild(previous);

    var stamped = !(result && result.node_stamped === false);
    var note = document.createElement("p");
    note.className = stamped ? "verify-note" : "verify-note is-warning";
    note.setAttribute("data-testid", "inbox-verify-note");
    note.setAttribute("role", "status");
    // Inserted EMPTY, then filled: a live region only announces changes that happen
    // while it is in the document, so setting the text first would render the outcome
    // silently for a screen-reader user.
    insertResultPanel(node, note);
    note.textContent = stamped
      ? "verified — human-vouched; promote to emit the canon YAML"
      : "node not stamped — re-verify: the vouch did not reach the staging node, so " +
        "nothing on it records that a human signed off";
  }

  // --- Item rendering ------------------------------------------------------

  function renderEvidence(item) {
    var refs = Array.isArray(item.evidence_refs) ? item.evidence_refs : [];
    var wrap = document.createElement("p");
    wrap.className = "item-evidence";
    wrap.setAttribute("data-testid", "inbox-evidence");
    var count = document.createElement("span");
    count.textContent = refs.length + " evidence ref" + (refs.length === 1 ? "" : "s");
    wrap.appendChild(count);
    if (refs.length > 0) {
      var sep = document.createElement("span");
      sep.textContent = ": ";
      wrap.appendChild(sep);
      var idents = document.createElement("span");
      idents.className = "refs";
      // Identifiers only — never quotes (contract §0 evidence decision).
      idents.textContent = refs.join(", ");
      wrap.appendChild(idents);
    }
    return wrap;
  }

  // entity_scan finding (field + kind) as a quiet attention marker. hits carry
  // blanked spans (""), so nothing raw can re-leak — we show field/kind only.
  function renderScan(item) {
    var scan = item.entity_scan;
    var hits = scan && Array.isArray(scan.hits) ? scan.hits : [];
    if (hits.length === 0) return null;
    var wrap = document.createElement("p");
    wrap.className = "item-scan";
    wrap.setAttribute("data-testid", "inbox-scan");
    var label = document.createElement("span");
    label.textContent = "entity scan:";
    wrap.appendChild(label);
    hits.forEach(function (hit) {
      var chip = document.createElement("span");
      chip.className = "scan-hit";
      var field = hit && hit.field ? hit.field : "?";
      var kind = hit && hit.kind ? hit.kind : "?";
      chip.textContent = field + " (" + kind + ")";
      wrap.appendChild(chip);
    });
    return wrap;
  }

  // The fail-to-review block: why the form could not be filled in, and what the
  // machine already knew. `detail` names the uncovered predicates and the catalog
  // rules that declare them — it is the reviewer's whole task — but the server
  // WITHHOLDS it unless the leakage scan came back a clean pass, so a withheld
  // detail is announced rather than rendered as an empty card.
  function renderDecline(item) {
    var decline = item.decline;
    if (!decline) return null;
    var wrap = document.createElement("div");
    wrap.className = "item-decline";
    wrap.setAttribute("data-testid", "inbox-decline");

    var head = document.createElement("p");
    head.className = "decline-line";
    head.setAttribute("data-testid", "inbox-decline-reason");
    var reasonLabel = document.createElement("span");
    reasonLabel.textContent = "declined ";
    head.appendChild(reasonLabel);
    var reasonCode = document.createElement("span");
    reasonCode.className = "code";
    reasonCode.textContent = decline.reason || "(unknown)";
    head.appendChild(reasonCode);
    var attempts = document.createElement("span");
    var n = decline.corrections_attempted || 0;
    attempts.textContent =
      " after " + n + " corrective round" + (n === 1 ? "" : "s");
    head.appendChild(attempts);
    wrap.appendChild(head);

    if (decline.judge_covered_by || decline.judge_verdict) {
      var judge = document.createElement("p");
      judge.className = "decline-line";
      judge.setAttribute("data-testid", "inbox-decline-judge");
      var jLabel = document.createElement("span");
      jLabel.textContent = "prior-art judge: " + (decline.judge_verdict || "n/a");
      judge.appendChild(jLabel);
      if (decline.judge_covered_by) {
        var covered = document.createElement("span");
        covered.className = "code";
        covered.textContent = " closest: " + decline.judge_covered_by;
        judge.appendChild(covered);
      }
      wrap.appendChild(judge);
    }

    if (decline.detail_withheld) {
      var held = document.createElement("p");
      held.className = "decline-line";
      held.setAttribute("data-testid", "inbox-decline-withheld");
      held.textContent =
        "the predicate detail is withheld — the entity scan did not settle a clean " +
        "pass on this candidate, so its text is not shown here";
      wrap.appendChild(held);
    } else if (decline.detail) {
      var detail = document.createElement("pre");
      detail.className = "decline-detail";
      detail.setAttribute("data-testid", "inbox-decline-detail");
      // textContent only — the detail carries literals lifted from the analyst's
      // SQL, and it is never HTML (contract §4).
      detail.textContent = decline.detail;
      wrap.appendChild(detail);
    }
    return wrap;
  }

  // The completion form: the reviewer writes the missing parameterization entries
  // and the server RE-VALIDATES them against the accepted SQL. Nothing here is a
  // shortcut — a form that still does not cover every predicate comes back declined
  // with the fresh reason, and the row stays put.
  // --- The revise assistant (design §C) ------------------------------------
  //
  // A reviewer describes what is wrong in a sentence; the assistant proposes entries. It
  // WRITES NOTHING: the proposal lands in the entries textarea below it, and the reviewer
  // applies it with the SAME "Re-validate & complete" button a hand-typed array uses. That
  // two-step is the design, not a rough edge — `complete` stays the only write path into a
  // candidate's payload, so the model's output faces the identical re-validation.
  //
  // A 503 (no reviser wired) is not an error state for this page: the form still works, so
  // the block simply reports that the assistant is unavailable and gets out of the way.
  function renderReviseBlock(item, area, replaceBox, node) {
    var block = el("div", "revise-block");
    block.setAttribute("data-testid", "inbox-revise-block");
    block.appendChild(
      el("p", "item-field-label", "describe the fix (the assistant proposes entries)")
    );

    var feedback = document.createElement("textarea");
    feedback.setAttribute("data-testid", "inbox-revise-feedback");
    feedback.setAttribute("aria-label", "describe what is wrong with the parameterization");
    feedback.placeholder =
      "e.g. total_earnings != '0' guards the ratio's own denominator — inline it. " +
      "register_type spans two catalog rules, so it cannot cite one.";
    block.appendChild(feedback);

    // THE SQL REWRITE OPT-IN, off by default.
    //
    // Everything else the assistant proposes is a re-reading of a query that really ran: the
    // template is derived from it, so `explain_ok`, `binds_to_subset_uses` and
    // `read_only_select` mean something because they check a provenance chain. A rewrite
    // CUTS that chain — the artifact stops being the session's query — so it is a deliberate
    // tick, with the consequence stated next to it rather than in a doc.
    var composite = isObject(item.payload_view) && item.payload_view.kind === "composite";
    var cautionId = "revise-allow-sql-caution-" +
      String(item.candidate_id || "").replace(/[^A-Za-z0-9_-]/g, "-");

    var allowWrap = el("label", "revise-allow-sql");
    var allowSql = document.createElement("input");
    allowSql.type = "checkbox";
    allowSql.checked = false;
    allowSql.setAttribute("data-testid", "inbox-revise-allow-sql");
    allowSql.setAttribute("aria-describedby", cautionId);
    allowWrap.appendChild(allowSql);
    allowWrap.appendChild(el("span", "", "Let the assistant rewrite the SQL"));
    block.appendChild(allowWrap);

    var allowCaution = el("p", "revise-allow-sql-caution", SQL_REWRITE_CAUTION);
    allowCaution.id = cautionId;
    allowCaution.setAttribute("data-testid", "inbox-revise-allow-sql-caution");
    block.appendChild(allowCaution);

    // A composite blueprint composes other blueprints rather than carrying one query, so
    // there is no single template to replace. DISABLED rather than removed: a reviewer who
    // cannot find the option learns nothing, and the server 422s this case anyway — the box
    // says why before the round trip does.
    if (composite) {
      allowSql.disabled = true;
      allowWrap.title = "SQL rewrite is not offered for composite blueprints yet.";
      var unavailable = el("p", "revise-allow-sql-unavailable",
        "Not offered for composite blueprints yet — a composite has no single query to rewrite.");
      unavailable.setAttribute("data-testid", "inbox-revise-allow-sql-unavailable");
      block.appendChild(unavailable);
    }

    var ask = document.createElement("button");
    ask.type = "button";
    ask.className = "action-complete";
    ask.setAttribute("data-testid", "inbox-revise");
    ask.textContent = "Ask the assistant";
    block.appendChild(ask);

    var out = el("div");
    out.setAttribute("data-testid", "inbox-revise-output");
    block.appendChild(out);

    // On the REVIEW QUEUE there is no entries textarea to load into — the card is not a
    // form. The block carries its own apply button, which posts the proposal to
    // `apply_revision`: REPLACE-only, and therefore idempotent, which is what lets it be
    // offered on a status whose guard cannot protect an append (see `ReviewInbox`).
    // OPENS THE MODAL rather than posting straight through, on BOTH surfaces. The old button
    // asked a reviewer to read a row-level diff and commit on trust; the modal shows the
    // candidate as it WOULD be and lets them adjust first.
    //
    // The FORM gets it too, and that is where it matters most: a `needs_parameterization` row
    // exists BECAUSE something is unclassified, so a proposal is near-certain there — while the
    // review queue's cards are usually already complete and the assistant often has nothing to
    // add. Wiring it only to the queue put it on the path least likely to open it.
    var apply = document.createElement("button");
    apply.type = "button";
    apply.className = "action-complete";
    apply.setAttribute("data-testid", "inbox-revise-apply");
    apply.textContent = "Review the change…";
    apply.hidden = true;
    block.appendChild(apply);

    ask.addEventListener("click", function () {
      clearError();
      ask.disabled = true;
      ask.textContent = "Asking…";
      fetch("/api/inbox/" + encodeURIComponent(item.candidate_id) + "/revise", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // `allow_sql` is always sent, explicitly false when untouched: a server that had
        // to read an absent field as "no" would be one default away from rewriting on a
        // request that never asked. A disabled box cannot be checked, so a composite sends
        // false without a second guard here.
        body: JSON.stringify({ feedback: feedback.value, allow_sql: allowSql.checked === true })
      })
        .then(function (response) {
          return response.text().then(function (text) {
            var parsed = null;
            try { parsed = JSON.parse(text); } catch (err) { parsed = null; }
            if (!response.ok) {
              var detail = parsed && parsed.detail ? parsed.detail : text;
              showError("HTTP_" + response.status, detail || response.statusText);
              return;
            }
            renderProposal(parsed, out, area, replaceBox, item, node);
            if (apply) {
              // Shown only once there is something to apply, and it carries the entries it
              // was shown with — not a re-read of the card — so what the reviewer approved
              // is exactly what is posted.
              var proposed = (parsed && parsed.entries) || [];
              // ⚠ A REWRITE WITH NO ENTRIES IS APPLICABLE. D97's totality walk passes an
              // EMPTY array for a query that has no literal predicates to classify — a plain
              // aggregate with no WHERE is the ordinary case — so gating this button on
              // `entries` alone would render that proposal, warning and all, and leave the
              // reviewer no way to take it. An entries-only proposal with nothing in it still
              // has nothing to apply.
              apply.hidden = !(proposed.length || (parsed && parsed.sql_changed === true));
              apply.onclick = function () {
                // *sql* is non-empty ONLY for a proposal the server marked `sql_changed`, and
                // it is the server's own string, passed through unedited — the page never
                // composes SQL, it only carries what it was offered and showed.
                openReviseModal(item, parsed, node, function (entries, replace, sql) {
                  if (area) {
                    // THE FORM. Route through the textarea the reviewer can still see and edit,
                    // so the modal never becomes a hidden second source of truth for what is
                    // about to be posted — and `performCompletion` stays the one submit path.
                    area.value = JSON.stringify(entries, null, 2);
                    if (replaceBox) replaceBox.checked = replace;
                    performCompletion(item.candidate_id, area.value, replace, node,
                                      node, apply, sql);
                  } else {
                    performRevisionApply(item.candidate_id, entries, node, apply, sql);
                  }
                });
              };
            }
          });
        })
        .catch(function (err) { showError("NETWORK", String(err)); })
        .then(function () {
          ask.disabled = false;
          ask.textContent = "Ask the assistant";
        });
    });
    return block;
  }

  // The proposed SQL, when the assistant was allowed to rewrite it and did.
  //
  // Two panes rather than a line-level diff: the reviewer's question here is not "which
  // characters moved" but "is this still the query I asked about", and that is read by
  // looking at both queries whole. Both are `<pre>` + textContent — the proposed SQL is
  // server data like any other (contract §4).
  //
  // Returns null when nothing was rewritten, so the caller appends unconditionally and a
  // proposal that only touched entries looks exactly as it did before this existed.
  function renderSqlRewrite(payload, item) {
    if (!isObject(payload) || payload.sql_changed !== true) return null;
    var wrap = el("div", "revise-sql");
    wrap.setAttribute("data-testid", "inbox-revise-sql");

    // The server's OWN sentence, not a re-worded one: it knows why this particular rewrite
    // is being cautioned about. The constant is a fallback for a server that sent none.
    var warn = el("p", "revise-warning", payload.caution || SQL_REWRITE_CAUTION);
    warn.setAttribute("data-testid", "inbox-revise-sql-warning");
    warn.setAttribute("role", "alert");
    wrap.appendChild(warn);

    var panes = el("div", "revise-sql-panes");
    var before = el("div", "revise-sql-pane is-before");
    before.appendChild(el("p", "item-field-label", "current template"));
    var beforePre = el("pre", "", currentTemplateText(item) || "(this candidate carries no template)");
    beforePre.setAttribute("data-testid", "inbox-revise-sql-before");
    before.appendChild(beforePre);
    panes.appendChild(before);

    var after = el("div", "revise-sql-pane is-after");
    after.appendChild(el("p", "item-field-label", "proposed SQL"));
    var afterPre = el("pre", "", String(payload.sql || ""));
    afterPre.setAttribute("data-testid", "inbox-revise-sql-after");
    after.appendChild(afterPre);
    panes.appendChild(after);

    wrap.appendChild(panes);
    return wrap;
  }

  // Show the proposal and LOAD IT INTO THE FORM. The reviewer reads the diff, edits the
  // entries if they want, and applies with the button they would have used anyway — so an
  // assistant that proposed something wrong costs a glance, not a bad write.
  function renderProposal(payload, out, area, replaceBox, item, node) {
    clearNode(out);
    if (!isObject(payload)) return;
    var entries = Array.isArray(payload.entries) ? payload.entries : [];
    // ABOVE the empty-proposal note as well as above the entries: a rewrite that arrived
    // with no entry changes still changed the artifact, and a page that showed nothing for
    // it would be hiding the biggest thing the assistant did.
    var rewrite = renderSqlRewrite(payload, item);
    if (rewrite) out.appendChild(rewrite);
    if (!entries.length) {
      // "No suggestion" is the wrong sentence for a rewrite that classified nothing because
      // there was nothing to classify — the proposal above is real and applicable.
      out.appendChild(
        el("p", "card-empty", payload.reason || (rewrite
          ? "no parameterization entries — the rewritten query has no literal predicates to classify"
          : "the assistant had no suggestion"))
      );
      return;
    }
    if (payload.rationale) {
      out.appendChild(el("p", "revise-rationale", payload.rationale));
    }
    // A proposal can arrive WITH entries and still carry a reason — the append/replace
    // conflict. Shown here rather than only on the empty-proposal path, because that is the
    // case where the reviewer is about to click a button that will decline.
    if (payload.reason) {
      var warn = el("p", "revise-warning", payload.reason);
      warn.setAttribute("data-testid", "inbox-revise-warning");
      out.appendChild(warn);
    }
    var diff = Array.isArray(payload.diff) ? payload.diff.filter(isObject) : [];
    if (diff.length) {
      // COLLAPSED, now that the preview below states the same change in the card's own
      // terms. The row-level diff is the precise record — locator, before, after — and it is
      // worth keeping for a reviewer checking exactly what will be posted; it is not worth
      // three wrapped lines of prose above the thing that actually reads well.
      var fold = el("details", "card-raw");
      fold.setAttribute("data-testid", "inbox-revise-diff-toggle");
      fold.appendChild(el("summary", "", "entry-level diff"));
      var list = el("ul", "revise-diff");
      list.setAttribute("data-testid", "inbox-revise-diff");
      diff.forEach(function (row) {
        var li = el("li", String(row.kind || ""));
        li.appendChild(el("span", "kind", String(row.kind || "")));
        if (row.before && row.kind !== "unchanged") {
          li.appendChild(el("span", "before", String(row.before)));
          li.appendChild(document.createTextNode("  →  "));
        }
        li.appendChild(document.createTextNode(String(row.after || row.before || "")));
        list.appendChild(li);
      });
      fold.appendChild(list);
      out.appendChild(fold);
    }
    // THE PREVIEW: the card's own sections, re-rendered with the proposal applied, and the
    // affected rows marked on BOTH sides so the eye can pair them. This is the difference
    // between "role_changed | payroll.register_type" and seeing register_type leave the slot
    // table and arrive under frozen filters.
    if (item && node) {
      var preview = renderPreview(
        item, previewPayload(item.payload_view, entries, payload.replace === true), payload.diff
      );
      out.appendChild(preview);
      // Mark the same rows on the LIVE card, so the before/after pairing is visible without
      // hunting for the matching line.
      markChanged(node.querySelector('[data-testid="inbox-bp-slots"]'), changedLocators(payload.diff));
      markChanged(node.querySelector('[data-testid="inbox-bp-inline"]'), changedLocators(payload.diff));
    }

    // ON THE FORM the proposal becomes the textarea's contents, and `replace` is mirrored
    // onto the checkbox because it changes what applying MEANS — append versus
    // replace-the-whole-array — and a proposal whose flag silently disagreed with the box
    // would apply the other operation.
    //
    // ON THE REVIEW QUEUE there is no textarea: the card is not a form, so the block carries
    // its own apply button and the entries never round-trip through an editable field.
    if (area) {
      area.value = stringifyPayload(entries);
      if (replaceBox) replaceBox.checked = payload.replace === true;
      out.appendChild(
        el("p", "card-empty", "loaded into the entries box above — review, edit, then complete")
      );
    }
  }

  // Attach the proposed SQL to a write body — and ONLY when there is one.
  //
  // Both write verbs take an optional `sql`, and both treat its ABSENCE as "keep the query
  // the session ran". So the field is added only for a proposal the server itself marked
  // `sql_changed`; every hand-typed completion and every entries-only revision posts the
  // body it always posted.
  function withProposedSql(body, sql) {
    if (typeof sql === "string" && sql) body.sql = sql;
    return body;
  }

  // POST an accepted proposal for a candidate already under review. Same three outcomes as
  // a completion, and the same reason for each: `completed` re-entered the pipeline so the
  // row is gone; `declined` means the revision still does not validate and the FRESH reason
  // belongs on the card, not in a banner; an HTTP error is the usual banner.
  // --- the revise modal ------------------------------------------------------------------
  //
  // The inline proposal asked a reviewer to read a diff and trust it. This shows the candidate
  // AS IT WOULD BE and lets them adjust before committing — the assistant's answer becomes a
  // starting point rather than a take-it-or-leave-it.
  //
  // ⚠ THE SQL IS SHOWN AND NOT EDITABLE, which is the same guarantee the reviser's tool makes.
  // The template is DERIVED from the accepted query by AST rewrite, so `explain_ok`,
  // `binds_to_subset_uses` and `read_only_select` only mean something because they check a
  // provenance chain back to a query that really ran. A hand-edited template would leave all
  // three validating prose. Change what a literal MEANS and the template follows.
  //
  // Apply goes through `apply_revision` — the same re-validation a hand-typed array faces. The
  // modal is a better keyboard, not a second write path.

  var ROLE_FIELDS = {
    slot: ["name", "type", "binds_to"],
    inline: ["why"],
    rule: ["rule_id"]
  };

  function closeReviseModal() {
    clearNode(document.getElementById("revise-modal-host"));
  }

  function entryLocatorKey(entry) {
    var l = (entry && entry.locator) || {};
    return [l.table, l.column, l.value].join("|");
  }

  function modalField(label, value, testid) {
    var wrap = el("label", "", label);
    var input = document.createElement("input");
    input.type = "text";
    input.value = value == null ? "" : String(value);
    input.setAttribute("data-field", testid);
    wrap.appendChild(input);
    return wrap;
  }

  function renderModalEntry(entry, changedKeys) {
    var card = el("div", "modal-entry");
    var key = entryLocatorKey(entry);
    if (changedKeys.indexOf(key) !== -1) {
      card.classList.add("is-changed");
    }
    card.setAttribute("data-locator", key);

    var l = entry.locator || {};
    var who = el("span", "who", [l.table, l.column].filter(Boolean).join(".") +
      " = " + String(l.value));
    if (changedKeys.indexOf(key) !== -1) {
      who.appendChild(el("span", "badge", "changed by the assistant"));
    }
    card.appendChild(who);

    var grid = el("div", "modal-grid");
    var roleWrap = el("label", "", "role");
    var role = document.createElement("select");
    role.setAttribute("data-field", "role");
    ["slot", "inline", "rule"].forEach(function (r) {
      var o = document.createElement("option");
      o.value = r; o.textContent = r;
      if (entry.role === r) o.selected = true;
      role.appendChild(o);
    });
    roleWrap.appendChild(role);
    grid.appendChild(roleWrap);

    var slot = entry.slot || {};
    grid.appendChild(modalField("slot name", slot.name, "name"));
    grid.appendChild(modalField("type", slot.type, "type"));
    grid.appendChild(modalField("binds_to", slot.binds_to, "binds_to"));
    grid.appendChild(modalField("why (inline)", entry.why, "why"));
    grid.appendChild(modalField("rule_id (rule)", entry.rule_id, "rule_id"));
    card.appendChild(grid);
    return card;
  }

  function readModalEntries(host) {
    // REBUILT from the form, keeping only the fields the chosen role uses. An `inline` entry
    // carrying an empty `slot` object reads as a slot declaration and fails validation — the
    // documented live-model failure, reachable here by a reviewer switching a role and leaving
    // the old boxes populated.
    var out = [];
    var cards = host.querySelectorAll(".modal-entry");
    for (var i = 0; i < cards.length; i += 1) {
      var card = cards[i];
      var parts = String(card.getAttribute("data-locator")).split("|");
      var role = card.querySelector('[data-field="role"]').value;
      var entry = {
        locator: { table: parts[0], column: parts[1], value: parts[2] },
        role: role
      };
      var wanted = ROLE_FIELDS[role] || [];
      if (role === "slot") {
        var slot = {};
        wanted.forEach(function (f) {
          var v = card.querySelector('[data-field="' + f + '"]').value.trim();
          if (v) slot[f] = v;
        });
        if (Object.keys(slot).length) entry.slot = slot;
      } else {
        wanted.forEach(function (f) {
          var v = card.querySelector('[data-field="' + f + '"]').value.trim();
          if (v) entry[f] = v;
        });
      }
      out.push(entry);
    }
    return out;
  }

  function openReviseModal(item, payload, node, commit) {
    // *commit* is `function (entries, replace)` — the ONLY thing that differs between the two
    // surfaces. The review queue REPLACES (`apply_revision`, idempotent, safe on a status whose
    // guard cannot protect an append); the form APPENDS what the reviewer was missing
    // (`complete`, which is why its guard is an equality against `needs_parameterization`).
    // Everything the reviewer sees and edits is identical.
    var host = document.getElementById("revise-modal-host");
    clearNode(host);
    var proposed = Array.isArray(payload.entries) ? payload.entries.filter(isObject) : [];
    // WHICH query is in the pre depends on whether this proposal rewrites it. Showing the
    // OLD template above entries that were written against a new one would be the worst
    // version of this screen: the reviewer would approve a change they never read.
    var rewritten = payload.sql_changed === true;
    var proposedSql = rewritten ? String(payload.sql || "") : "";
    // The early return survives for the NON-REWRITE case only: an entries-only proposal with
    // no entries has nothing to apply, and a modal over it would be an empty dialog. A
    // rewrite is a change to the artifact whether or not any entry moved.
    if (!proposed.length && !rewritten) return;
    var changedKeys = (Array.isArray(payload.diff) ? payload.diff : [])
      .filter(isObject)
      .map(function (d) { return entryLocatorKey(d); });

    var backdrop = el("div", "modal-backdrop");
    backdrop.setAttribute("data-testid", "inbox-revise-modal");
    var modal = el("div", "modal");
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");

    var head = el("div", "modal-head");
    head.appendChild(el("h3", "", "Review the change before it is applied"));
    head.appendChild(el("p", "modal-sub",
      "The assistant's answer, shown in place. Adjust anything, then apply — it goes through " +
      "the same validation a hand-typed array does."));
    modal.appendChild(head);

    var body = el("div", "modal-body");
    if (payload.rationale) {
      body.appendChild(el("p", "modal-note", payload.rationale));
    }
    var template = rewritten ? proposedSql : currentTemplateText(item);
    if (template) {
      if (rewritten) {
        var tag = el("p", "modal-sql-tag", "Rewritten by the assistant");
        tag.setAttribute("data-testid", "inbox-revise-modal-sql-rewritten");
        body.appendChild(tag);
        var modalCaution = el("p", "revise-warning", payload.caution || SQL_REWRITE_CAUTION);
        modalCaution.setAttribute("data-testid", "inbox-revise-modal-sql-caution");
        modalCaution.setAttribute("role", "alert");
        body.appendChild(modalCaution);
        body.appendChild(el("p", "modal-sub",
          "The SQL the assistant proposes IN PLACE OF the session's query. Still not editable " +
          "here — applying sends this exact text, and every check re-runs against it."));
      } else {
        body.appendChild(el("p", "modal-sub",
          "The query this classifies. Not editable — the template is derived from it by rewrite, " +
          "which is what makes the static checks mean anything."));
      }
      body.appendChild(el("pre", "modal-sql", template));
    }
    if (!proposed.length) {
      // Reachable only on the rewrite path (the early return above covers the other). Said
      // out loud because an empty modal body would read as a rendering fault, and because
      // applying it CLEARS the array the old query needed.
      var noEntries = el("p", "modal-note",
        "No parameterization entries: the rewritten query has no literal predicates to " +
        "classify, so the blueprint's parameterization becomes an empty array.");
      noEntries.setAttribute("data-testid", "inbox-revise-modal-no-entries");
      body.appendChild(noEntries);
    }
    proposed.forEach(function (entry) {
      body.appendChild(renderModalEntry(entry, changedKeys));
    });
    modal.appendChild(body);

    var foot = el("div", "modal-foot");
    var apply = el("button", "action-btn",
      rewritten ? "Apply, including the rewritten SQL" : "Apply to the blueprint");
    apply.type = "button";
    apply.setAttribute("data-testid", "inbox-revise-modal-apply");
    var cancel = el("button", "action-btn action-cancel", "Cancel");
    cancel.type = "button";
    cancel.setAttribute("data-testid", "inbox-revise-modal-cancel");
    cancel.addEventListener("click", closeReviseModal);
    apply.addEventListener("click", function () {
      var entries = readModalEntries(body);
      closeReviseModal();
      // The SQL goes back VERBATIM — the string the server proposed and the reviewer just
      // read, never a re-derivation. Empty when nothing was rewritten, and the senders drop
      // the field entirely in that case.
      commit(entries, payload.replace === true, proposedSql);
    });
    foot.appendChild(apply);
    foot.appendChild(cancel);
    foot.appendChild(el("span", "modal-note", "Nothing is written until you apply."));
    modal.appendChild(foot);

    backdrop.appendChild(modal);
    // Click-outside and Escape both cancel: a modal that can only be dismissed by a button is
    // a trap on a surface where the safe action is to walk away.
    backdrop.addEventListener("click", function (ev) {
      if (ev.target === backdrop) closeReviseModal();
    });
    document.addEventListener("keydown", function onKey(ev) {
      if (ev.key === "Escape") { closeReviseModal(); document.removeEventListener("keydown", onKey); }
    });
    host.appendChild(backdrop);
  }

  function performRevisionApply(candidateId, entries, node, button, sql) {
    clearError();
    button.disabled = true;
    button.textContent = "Re-validating…";
    fetch("/api/inbox/" + encodeURIComponent(candidateId) + "/apply_revision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // `sql` is sent ONLY when this proposal rewrote it. Sending "" on every apply would
      // ask the server to distinguish "no rewrite" from "rewrite to nothing", and one of
      // those readings deletes the query.
      body: JSON.stringify(withProposedSql({ entries: entries }, sql))
    })
      .then(function (response) {
        return response.text().then(function (text) {
          var parsed = null;
          try { parsed = JSON.parse(text); } catch (err) { parsed = null; }
          if (!response.ok) {
            showError("HTTP_" + response.status,
              (parsed && parsed.detail) || text || response.statusText);
            return;
          }
          if (parsed && parsed.outcome === "declined") {
            var why = el("p", "revise-warning",
              "still declined: " + ((parsed.decline || {}).reason || "(no reason)") +
              " — " + ((parsed.decline || {}).detail || ""));
            why.setAttribute("data-testid", "inbox-revise-declined");
            node.appendChild(why);
            return;
          }
          loadInbox();
        });
      })
      .catch(function (err) { showError("NETWORK", String(err)); })
      .then(function () {
        button.disabled = false;
        button.textContent = "Re-validate & apply";
      });
  }

  function renderCompleteForm(item, node) {
    var form = document.createElement("div");
    form.className = "complete-form";
    form.setAttribute("data-testid", "inbox-complete-form");

    var label = document.createElement("p");
    label.className = "item-field-label";
    label.textContent = "parameterization entries (JSON array)";
    form.appendChild(label);

    var area = document.createElement("textarea");
    area.setAttribute("data-testid", "inbox-complete-entries");
    area.setAttribute("aria-label", "parameterization entries as a JSON array");
    area.placeholder =
      '[{"locator": {"table": "db.table", "column": "col", "value": "X"}, ' +
      '"role": "inline", "why": "defines the metric"}]';
    form.appendChild(area);

    var options = document.createElement("label");
    options.className = "complete-options";
    var replace = document.createElement("input");
    replace.type = "checkbox";
    replace.setAttribute("data-testid", "inbox-complete-replace");
    options.appendChild(replace);
    var optText = document.createElement("span");
    optText.textContent =
      "replace the whole parameterization array (default: append to what the model wrote)";
    options.appendChild(optText);
    form.appendChild(options);

    // The assistant sits between the raw entries and the submit button: it FILLS the textarea
    // above it, and the reviewer commits with the button below. Built last because it needs
    // both controls to write into.
    form.appendChild(renderReviseBlock(item, area, replace, node));

    var submit = document.createElement("button");
    submit.type = "button";
    // Deliberately NOT `action-btn`: that class is the two-step confirm family
    // `resetConfirm`/`disableActions` sweep inside an actions row, and this button
    // lives in the form and fires on the first click (the reviewer already committed
    // by typing the entries).
    submit.className = "action-complete";
    submit.dataset.action = "complete";
    submit.setAttribute("data-testid", "inbox-complete");
    submit.textContent = "Re-validate & complete";
    submit.addEventListener("click", function () {
      performCompletion(item.candidate_id, area.value, replace.checked, node, form, submit);
    });
    form.appendChild(submit);
    return form;
  }

  // POST the completed form. Three outcomes, three different things to do:
  //   completed — the candidate re-entered the pipeline; drop the row and refresh.
  //   declined  — the form is still incomplete; show the FRESH detail in place, and
  //               leave the row (and the reviewer's text) exactly where they are.
  //   HTTP err  — the usual banner (503 = this deployment cannot re-validate).
  function performCompletion(candidateId, raw, replaceAll, node, form, submit, sql) {
    clearError();
    var entries;
    try {
      entries = JSON.parse(raw && raw.trim() ? raw : "[]");
    } catch (err) {
      showError("INVALID_JSON", "entries must be a JSON array: " + String(err));
      return;
    }
    if (!Array.isArray(entries)) {
      showError("INVALID_JSON", "entries must be a JSON ARRAY of parameterization objects.");
      return;
    }
    submit.disabled = true;
    fetch("/api/inbox/" + encodeURIComponent(candidateId) + "/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(withProposedSql({ entries: entries, replace: replaceAll }, sql)),
    })
      .then(function (response) {
        return response.text().then(function (text) {
          var parsed = null;
          try {
            parsed = JSON.parse(text);
          } catch (err) {
            parsed = null;
          }
          if (!response.ok) {
            var reason = parsed && (parsed.reason || parsed.detail);
            showError("HTTP_" + response.status, reason || text || response.statusText);
            submit.disabled = false;
            return;
          }
          if (parsed && parsed.outcome === "declined") {
            renderFreshDecline(form, parsed.decline);
            submit.disabled = false;
            return;
          }
          node.parentNode && node.parentNode.removeChild(node);
          loadInbox();
        });
      })
      .catch(function (err) {
        showError("NETWORK", String(err));
        submit.disabled = false;
      });
  }

  // Show the decline the SERVER just produced, next to the form that produced it.
  // Replaces any previous one so two rounds never read as two problems.
  function renderFreshDecline(form, decline) {
    var previous = form.querySelector('[data-testid="inbox-complete-decline"]');
    if (previous) form.removeChild(previous);
    var block = document.createElement("pre");
    block.className = "decline-detail";
    block.setAttribute("data-testid", "inbox-complete-decline");
    if (!decline) {
      block.textContent = "still declined (no detail available)";
    } else if (decline.detail_withheld) {
      block.textContent =
        "still declined: " + (decline.reason || "unknown") +
        " — the detail is withheld because the entity scan did not settle a clean pass";
    } else {
      block.textContent =
        "still declined: " + (decline.reason || "unknown") + "\n" + (decline.detail || "");
    }
    form.appendChild(block);
  }

  function renderDedup(item) {
    var dedup = item.dedup;
    if (!dedup || !dedup.canonical_key) return null;
    var wrap = document.createElement("p");
    wrap.className = "item-dedup";
    wrap.setAttribute("data-testid", "inbox-dedup");
    var label = document.createElement("span");
    label.textContent = "dedup key: ";
    wrap.appendChild(label);
    var key = document.createElement("span");
    key.className = "key";
    key.textContent = dedup.canonical_key;
    wrap.appendChild(key);
    return wrap;
  }

  function renderItem(item) {
    var li = document.createElement("li");
    li.className = "inbox-item";
    li.setAttribute("data-testid", "inbox-item");
    li.setAttribute("data-candidate-id", item.candidate_id || "");

    // Header: reason category label + type badge.
    var header = document.createElement("div");
    header.className = "item-header";
    var reason = document.createElement("h3");
    reason.className = "item-reason";
    reason.setAttribute("data-testid", "inbox-reason");
    reason.textContent = item.reason || "(no reason)";
    header.appendChild(reason);
    var type = document.createElement("span");
    type.className = "item-type";
    type.setAttribute("data-testid", "inbox-type");
    type.textContent = item.type || "unknown";
    header.appendChild(type);
    // Archived (terminal) items carry a REJECTED status badge (contract
    // §Frontend). Its presence also drives the read-only, no-actions path below.
    // A fail-to-review item carries its own badge: the task is to COMPLETE the form,
    // not to judge the idea, and the two must not look alike in a queue.
    if (item.status === "rejected" || item.status === "needs_parameterization") {
      var status = document.createElement("span");
      status.className = "item-status";
      status.setAttribute("data-testid", "inbox-status");
      status.textContent =
        item.status === "rejected" ? "REJECTED" : "NEEDS PARAMETERIZATION";
      header.appendChild(status);
    }
    // A promotable card carries its verify state, because that state is the whole
    // difference between the two buttons under it: promote REQUIRES `verified` and 409s
    // without it, and nothing else on the card says which of the two is the next step.
    if (item.status === "validated") {
      var verified = document.createElement("span");
      verified.className = item.verified ? "item-verified is-verified" : "item-verified";
      verified.setAttribute("data-testid", "inbox-verified");
      verified.textContent = item.verified
        ? "verified — ready to promote"
        : "awaiting verify";
      header.appendChild(verified);
    }
    // A rewritten query is a fact about the ARTIFACT, so it rides the card rather than a
    // transient banner — it has to still be there for the next reviewer, who never saw the
    // modal that made it.
    var rewriteBadge = renderSqlRewriteBadge(item);
    if (rewriteBadge) header.appendChild(rewriteBadge);
    li.appendChild(header);

    // Body: summary.
    if (item.summary) {
      var summary = document.createElement("p");
      summary.className = "item-summary";
      summary.setAttribute("data-testid", "inbox-summary");
      summary.textContent = item.summary;
      li.appendChild(summary);
    }

    // Body: the typed candidate card. Every value is still the already-redacted
    // `payload_view` (D17) and still reaches the DOM through textContent; what
    // changed is the RANKING — slots beside frozen filters, with the verbatim dump
    // collapsed at the bottom of the card rather than standing in for it.
    li.appendChild(renderPayload(item));

    // The parameterization judge's observation, ABOVE the evidence and below the payload:
    // it is about the payload the reviewer just read, and it is not evidence.
    var judge = renderJudge(item);
    if (judge) li.appendChild(judge);

    // Evidence: count + identifiers.
    li.appendChild(renderEvidence(item));

    // Quiet attention markers.
    var scan = renderScan(item);
    if (scan) li.appendChild(scan);
    // Directly under the scan chips: the override is about the finding they name.
    var override = renderScanOverride(item, li);
    if (override) li.appendChild(override);
    var dedup = renderDedup(item);
    if (dedup) li.appendChild(dedup);

    // Terminal (archived) items are read-only — no approve/reject/retract
    // (contract §Actions). The service also guards this; the hide is UX.
    if (item.status === "rejected") return li;

    // Fail-to-review: the decline is the task, so it goes ABOVE the actions, and the
    // form comes with it. Reject stays available (a form with no honest answer must
    // still be clearable); approve does not exist for this status — the server
    // refuses it, and offering it would invite a reviewer to try to skip validation.
    if (item.status === "needs_parameterization") {
      var declineBlock = renderDecline(item);
      if (declineBlock) li.appendChild(declineBlock);
      var completeActions = document.createElement("div");
      completeActions.className = "item-actions";
      completeActions.setAttribute("data-testid", "inbox-actions");
      li.appendChild(renderCompleteForm(item, li));
      completeActions.appendChild(
        makeActionButton(
          item.candidate_id, "reject", "Reject", li, completeActions, false
        )
      );
      var completeCancel = document.createElement("button");
      completeCancel.type = "button";
      completeCancel.className = "action-cancel";
      completeCancel.setAttribute("data-testid", "inbox-cancel");
      completeCancel.textContent = "Cancel";
      completeCancel.hidden = true;
      completeCancel.addEventListener("click", function () {
        resetConfirm(completeActions);
      });
      completeActions.appendChild(completeCancel);
      li.appendChild(completeActions);
      return li;
    }

    // The trial run: offered wherever a human is deciding whether this artifact goes
    // further — the review queue and the promotable list. `validated` is the one the
    // "before promoting" case actually needs.
    if (
      item.type === "blueprint" &&
      (item.status === "in_review" || item.status === "validated")
    ) {
      var trial = renderTrialRun(item);
      if (trial) li.appendChild(trial);
    }

    // The assistant on the REVIEW QUEUE (design §C.4). Offered on a blueprint a human is
    // adjudicating — the reviewer who can SEE a bad role on the card is exactly who should be
    // able to fix it there, rather than rejecting the candidate and losing the work.
    //
    // Blueprints only: there is nothing to re-parameterize on a knowledge or schema-edit
    // candidate. `in_review` only: a validated or promoted artifact has passed golden replay
    // and may be landed, so editing it is a re-verify-and-re-land (that is `retract`).
    if (item.status === "in_review" && item.type === "blueprint") {
      li.appendChild(renderReviseBlock(item, null, null, li));
    }

    // Actions.
    var actions = document.createElement("div");
    actions.className = "item-actions";
    actions.setAttribute("data-testid", "inbox-actions");

    var id = item.candidate_id;
    if (item.status === "validated") {
      // The promotable list: an auto-landed node's remaining hop is verify (a human
      // vouches for it) then promote (emit the canon YAML for a manual PR). Approve and
      // reject are in_review-ONLY at the service, so they are not offered here — the
      // page never invites a reviewer into a transition that will be refused.
      actions.appendChild(
        makeActionButton(id, "verify", "Verify", li, actions, false)
      );
      actions.appendChild(
        makeActionButton(id, "promote", "Promote", li, actions, false)
      );
    } else if (item.status === "promoted") {
      // Terminal, but NOT read-only like the archive: `promote` re-emits from
      // `promoted` idempotently with no status move, so the YAML behind an abandoned or
      // lost PR can always be regenerated. That is the ONLY thing offered here — verify
      // and the adjudication verbs have all left their legal window.
      actions.appendChild(
        makeActionButton(id, "promote", "Re-emit YAML", li, actions, false)
      );
    } else {
      // Approve is pre-disabled offline (contract §5); retract is disabled here
      // because every listed item is in_review, not validated (contract §4).
      actions.appendChild(
        makeActionButton(id, "approve", "Approve", li, actions, state.offline)
      );
      // Said AGAIN beside the button: the badge sits at the top of a long card and the
      // decision is made at the bottom of it. It does not block approve — a reviewer who has
      // trial-run the rewrite is exactly the person who should be able to approve it.
      if (sqlRewriteRecord(item)) {
        var approveCaution = el("span", "approve-caution",
          "The SQL was rewritten by the assistant — trial-run it before approving.");
        approveCaution.setAttribute("data-testid", "inbox-approve-sql-rewritten");
        actions.appendChild(approveCaution);
      }
      actions.appendChild(
        makeActionButton(id, "reject", "Reject", li, actions, false)
      );
      actions.appendChild(
        makeActionButton(id, "retract", "Retract", li, actions, true)
      );
    }

    var cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "action-cancel";
    cancel.setAttribute("data-testid", "inbox-cancel");
    cancel.textContent = "Cancel";
    cancel.hidden = true;
    cancel.addEventListener("click", function () {
      resetConfirm(actions);
    });
    actions.appendChild(cancel);

    li.appendChild(actions);
    return li;
  }

  function emptyMessage() {
    var where = "the review queue";
    if (state.status === "rejected") where = "the archive";
    else if (state.status === "validated") where = "the promotable list";
    else if (state.status === "promoted") where = "the promoted list";
    else if (state.status === "needs_parameterization") where = "the parameterization queue";
    return "No " + typeLabel(state.activeType).toLowerCase() + " in " + where;
  }

  // Render the whole fetched set from state (tabs + toggle + list). Items are
  // grouped by type: the active tab is filtered to view, other-type items stay
  // in the DOM but hidden. Counts are recomputed against the loaded status set.
  function render() {
    var counts = computeCounts();
    var total = state.items.length;

    updateStatusToggle();
    updateTabs(counts);

    if (state.status === "rejected") {
      els.countLine.textContent =
        total === 1 ? "1 archived item" : total + " archived items";
    } else if (state.status === "validated") {
      els.countLine.textContent =
        total === 1
          ? "1 item awaiting promotion"
          : total + " items awaiting promotion";
    } else if (state.status === "promoted") {
      els.countLine.textContent =
        total === 1 ? "1 promoted item" : total + " promoted items";
    } else if (state.status === "needs_parameterization") {
      els.countLine.textContent =
        total === 1
          ? "1 item needing parameterization"
          : total + " items needing parameterization";
    } else {
      els.countLine.textContent =
        total === 1 ? "1 item awaiting review" : total + " items awaiting review";
    }

    clearNode(els.list);
    // Active-type items first (stable), so the first DOM row is always the first
    // visible row; other types follow, hidden. THE WHOLE SET STAYS IN THE DOM — the pager
    // narrows what is SHOWN, and keeping the rest attached is what lets a reviewer page
    // without a refetch, and what the existing tab filter already relied on.
    var ordered = state.items.slice().sort(function (a, b) {
      var ai = a.type === state.activeType ? 0 : 1;
      var bi = b.type === state.activeType ? 0 : 1;
      return ai - bi;
    });
    var active = ordered.filter(function (item) { return item.type === state.activeType; });
    // Clamp rather than reset: an approve/reject shortens the list under the cursor, and
    // landing on the NEXT undecided card is the behaviour a worklist wants — sending the
    // reviewer back to the top after every decision is what makes a queue feel endless.
    if (state.cursor > active.length - 1) state.cursor = Math.max(0, active.length - 1);
    if (state.cursor < 0) state.cursor = 0;

    var shownIndex = 0;
    ordered.forEach(function (item) {
      var li = renderItem(item);
      if (item.type !== state.activeType) {
        li.hidden = true;
      } else {
        li.hidden = shownIndex !== state.cursor;
        shownIndex += 1;
      }
      els.list.appendChild(li);
    });
    updatePager(active.length);

    // Empty state is per active tab + per status.
    if (counts[state.activeType] === 0) {
      els.empty.textContent = emptyMessage();
      els.empty.hidden = false;
    } else {
      els.empty.hidden = true;
    }
  }

  // The pager's own state. Hidden for a single card — a "1 of 1" with two dead buttons is
  // furniture, not navigation.
  function updatePager(total) {
    if (total <= 1) {
      els.pager.hidden = true;
      return;
    }
    els.pager.hidden = false;
    els.pagerPosition.textContent = (state.cursor + 1) + " of " + total;
    els.pagerPrev.disabled = state.cursor <= 0;
    els.pagerNext.disabled = state.cursor >= total - 1;
  }

  function step(delta) {
    var total = state.items.filter(function (i) {
      return i.type === state.activeType;
    }).length;
    var next = state.cursor + delta;
    if (next < 0 || next > total - 1) return;
    state.cursor = next;
    render();
    // Bring the new card into view: paging from a long card would otherwise leave the
    // reviewer scrolled to the middle of one they have already dealt with.
    if (els.list.firstChild) window.scrollTo({ top: 0, behavior: "instant" });
  }

  // --- Loaders -------------------------------------------------------------

  // Load the list for the active status (?status=in_review | needs_parameterization |
  // validated | promoted | rejected). Called on bootstrap, on a status switch, and after
  // a successful action.
  function loadInbox() {
    clearError();
    // Capture this call's token; a newer loadInbox() bumps loadSeq and makes
    // any earlier (still in-flight) response stale, so it bails out below.
    var seq = ++loadSeq;
    // A refetch is a new queue: reset the position rather than restoring a cursor into a
    // list that may no longer contain the same candidates.
    state.cursor = 0;
    var url = "/api/inbox?status=" + encodeURIComponent(state.status);
    return fetch(url, { headers: { Accept: "application/json" } })
      .then(function (response) {
        if (!response.ok) {
          return response.text().then(function (text) {
            if (seq !== loadSeq) return;
            // Error path skips render(), so sync the toggle highlight here or
            // it desyncs from state.status after a failed status switch.
            updateStatusToggle();
            showError("HTTP_" + response.status, text || response.statusText);
          });
        }
        return response.json().then(function (payload) {
          if (seq !== loadSeq) return;
          state.items = payload && Array.isArray(payload.items) ? payload.items : [];
          state.activeType = pickDefaultType();
          render();
        });
      })
      .catch(function (err) {
        if (seq !== loadSeq) return;
        updateStatusToggle();
        showError("NETWORK", String(err));
      });
  }

  // On load, learn the write-plane health so approve is pre-disabled and a
  // "read-only review" banner shows in offline mode (contract §5). Failure to
  // read health is treated as offline (fail safe — never arm a doomed approve).
  function loadHealth() {
    return fetch("/api/inbox/health", { headers: { Accept: "application/json" } })
      .then(function (response) {
        if (!response.ok) throw new Error("health " + response.status);
        return response.json();
      })
      .then(function (data) {
        state.offline = data && data.write_plane === "offline";
      })
      .catch(function () {
        state.offline = true;
      })
      .then(function () {
        if (state.offline) {
          els.healthBanner.textContent =
            "read-only review — approve-that-lands unavailable";
          els.healthBanner.hidden = false;
        } else {
          els.healthBanner.hidden = true;
        }
      });
  }

  els.pagerPrev.addEventListener("click", function () { step(-1); });
  els.pagerNext.addEventListener("click", function () { step(1); });
  // Arrow keys page the queue, but NOT while the reviewer is typing — the fail-to-review
  // form and the assistant's feedback box both take free text, and stealing Left/Right
  // there would make them unusable.
  document.addEventListener("keydown", function (event) {
    var tag = (event.target && event.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || event.target.isContentEditable) return;
    if (event.key === "ArrowLeft") step(-1);
    else if (event.key === "ArrowRight") step(1);
  });

  // Bootstrap: build the static controls, learn write-plane health (gates
  // approve), then load the default Review-queue list.
  buildTabs();
  buildStatusToggle();
  loadHealth().then(loadInbox);
})();
</script>
</body>
</html>

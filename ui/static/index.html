<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Agent — Phase 0</title>
<style>
  :root {
    --color-bg: #0f1117;
    --color-surface: #171a23;
    --color-surface-2: #1f2330;
    --color-border: #2a2f3d;
    --color-text: #e6e8ee;
    --color-text-dim: #9aa1b2;
    --color-accent: #5b8cff;
    --color-accent-text: #ffffff;
    --color-error-bg: #3a1c1c;
    --color-error-border: #b33a3a;
    --color-error-text: #ffb4b4;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    display: flex;
    justify-content: center;
    padding: var(--space-5);
  }

  main {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  h1 {
    font-size: 1.25rem;
    margin: 0;
  }

  .session-line {
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    flex-wrap: wrap;
  }

  .new-session-button {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--color-surface-2);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: var(--space-2) var(--space-4);
    font-size: 0.85rem;
  }

  .new-session-button:hover:not(:disabled) {
    border-color: var(--color-accent);
  }

  .new-session-icon {
    font-size: 1rem;
    line-height: 1;
  }

  form#message-form {
    display: flex;
    gap: var(--space-2);
    align-items: center;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: var(--space-1);
    padding-left: var(--space-3);
  }

  form#message-form input[type="text"] {
    border: none;
    background: transparent;
    padding: var(--space-2) var(--space-1);
  }

  form#message-form input[type="text"]:focus {
    outline: none;
  }

  form#message-form:focus-within {
    border-color: var(--color-accent);
    outline: 2px solid var(--color-accent);
    outline-offset: 1px;
  }

  form#message-form #send-button {
    border-radius: 999px;
    padding: var(--space-2) var(--space-5);
    flex: none;
  }

  input[type="text"] {
    flex: 1;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    color: var(--color-text);
    padding: var(--space-3);
    font-size: 1rem;
  }

  input[type="text"]:focus {
    outline: 2px solid var(--color-accent);
    outline-offset: 1px;
  }

  button {
    background: var(--color-accent);
    color: var(--color-accent-text);
    border: none;
    border-radius: var(--radius);
    padding: var(--space-3) var(--space-4);
    font-size: 1rem;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  section {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-4);
  }

  section h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-dim);
    margin: 0 0 var(--space-3) 0;
  }

  #progress-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    max-height: 220px;
    overflow-y: auto;
  }

  #progress-list:empty::after {
    content: "No activity yet.";
    color: var(--color-text-dim);
    font-size: 0.9rem;
  }

  .progress-item {
    background: var(--color-surface-2);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .progress-item .step {
    color: var(--color-text);
  }

  .progress-item .shape {
    color: var(--color-text-dim);
    font-size: 0.8rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* --- Conversation transcript (iMessage-style bubble list) --- */
  /* #transcript is a scrollable, vertical message list; each turn is a
     .turn-block flex column whose direct children (question bubble, answer
     bubble, meta, status, detail panels) align left/right like a chat. */
  #transcript {
    background: none;
    border: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    max-height: 60vh;
    overflow-y: auto;
  }

  #transcript:empty::after {
    content: "Ask a question to begin.";
    color: var(--color-text-dim);
    font-size: 0.9rem;
  }

  /* One turn = a stack of chat items; no card chrome — the bubbles carry it. */
  .turn-block {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  /* USER bubble — right-aligned accent, classic asymmetric tail corner. */
  .turn-question {
    align-self: flex-end;
    max-width: 78%;
    margin: 0;
    padding: var(--space-2) var(--space-4);
    background: var(--color-accent);
    color: var(--color-accent-text);
    border-radius: 18px 18px 4px 18px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.4;
  }

  /* ASSISTANT bubble — left-aligned surface, mirror-corner tail. */
  .turn-answer {
    align-self: flex-start;
    max-width: 78%;
    padding: var(--space-2) var(--space-4);
    background: var(--color-surface-2);
    color: var(--color-text);
    border-radius: 18px 18px 18px 4px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }

  .turn-answer:empty::after {
    /* Empty answer = in-progress / scope-withheld / paused past turn. Keep the
       `:empty` selector the renderers depend on, but read as a subtle typing /
       placeholder dot cluster rather than a bare em dash. */
    content: "•••";
    letter-spacing: 0.15em;
    color: var(--color-text-dim);
  }

  /* Assistant-side supporting content — meta chips, status, detail panels —
     hang under the answer bubble, left-aligned. The flex `gap` handles vertical
     rhythm, so the legacy top-margins are neutralized here. */
  .turn-block .answer-meta,
  .turn-block .turn-status,
  .turn-block .result-panel {
    align-self: flex-start;
    max-width: 92%;
    margin-top: 0;
  }

  .turn-status {
    font-size: 0.85rem;
    color: var(--color-text-dim);
    margin-top: 0;
  }

  #ask-user[hidden] {
    display: none;
  }

  #ask-user-question {
    margin: 0 0 var(--space-3) 0;
    font-weight: 600;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
  }

  .chip {
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    border-radius: 999px;
    padding: var(--space-2) var(--space-4);
    cursor: pointer;
    font-size: 0.9rem;
  }

  .chip:hover,
  .chip:focus-visible {
    border-color: var(--color-accent);
  }

  #ask-user-freetext {
    display: flex;
    gap: var(--space-2);
  }

  #error-banner[hidden] {
    display: none;
  }

  #error-banner {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error-border);
    color: var(--color-error-text);
    border-radius: var(--radius);
    padding: var(--space-3) var(--space-4);
  }

  #error-banner .error-code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-weight: 600;
    margin-right: var(--space-2);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- Enriched result rendering (UI Slice 1, scoped per turn in Slice 3) --- */
  .result-panel[hidden],
  .blueprint-chip[hidden],
  .verified-badge[hidden],
  .table-blueprint-chip[hidden],
  .table-verified-badge[hidden],
  .table-pager[hidden],
  .result-table-caption[hidden] {
    display: none;
  }

  .table-pager {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }

  .table-pager button {
    padding: 0.2rem 0.7rem;
    cursor: pointer;
  }

  .table-pager button:disabled {
    cursor: default;
    opacity: 0.5;
  }

  .pager-status {
    font-size: 0.85em;
    opacity: 0.75;
  }

  .answer-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }

  .static-chip {
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.8rem;
    cursor: default;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    border: 1px solid var(--color-border);
    border-radius: 999px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  .result-panel {
    margin-top: var(--space-3);
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
  }

  .result-panel > summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--color-text-dim);
  }

  .result-panel[open] > summary {
    margin-bottom: var(--space-3);
  }

  pre.sql-block {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-3);
    margin: 0 0 var(--space-2) 0;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }

  pre.sql-block:last-child {
    margin-bottom: 0;
  }

  .table-scroll {
    overflow-x: auto;
  }

  table.result-grid {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.85rem;
  }

  table.result-grid th,
  table.result-grid td {
    border: 1px solid var(--color-border);
    padding: var(--space-2) var(--space-3);
    text-align: left;
    white-space: nowrap;
  }

  table.result-grid th {
    background: var(--color-surface);
    color: var(--color-text-dim);
    font-weight: 600;
  }

  .result-caption {
    margin-top: var(--space-2);
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  /* --- Multi-table answers (08 §E) --- */
  /* One collapsible panel per designated answer table, stacked. A stack of
     labelled disclosures stays readable at the cap (8) in a way a row of
     side-by-side grids would not: every panel names its own table in the
     summary, and only the panels the user opens fetch any rows. */
  .answer-tables {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  /* No designated table → no panel, and no stray flex gap in the turn block. */
  .answer-tables:empty {
    display: none;
  }

  /* The container takes over the width/alignment the single inline panel used
     to carry; the panels inside it fill the container instead of re-applying
     92% of an already-92% box. */
  .turn-block .answer-tables {
    align-self: flex-start;
    max-width: 92%;
  }

  /* `align-self: stretch` undoes the flex-start the shared `.turn-block
     .result-panel` rule applies: inside the container the panels must line up
     with each other, not each shrink to its own summary text — eight ragged
     boxes is the "unreadable stack" this layout is meant to avoid. */
  .turn-block .answer-tables .result-panel {
    align-self: stretch;
    max-width: 100%;
    margin-top: 0;
  }

  /* The gap hangs off the CHIP/BADGE, not the title: both are display:none when
     the table carries no blueprint / no verification block, so a lone bare panel
     keeps the exact summary width it had before these existed. */
  .table-blueprint-chip,
  .table-verified-badge {
    margin-left: var(--space-2);
  }

  /* Multi-table only: bound each grid so one long expanded table cannot bury
     the panels under it. N=1 keeps its unbounded grid, exactly as before. */
  .answer-tables.multi .table-scroll {
    max-height: 22rem;
    overflow-y: auto;
  }

  /* The scroll box is focusable so it can be scrolled from the keyboard. */
  .table-scroll:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .prov-empty {
    font-size: 0.8rem;
    color: var(--color-text-dim);
  }

  /* Plain-English assumptions — a bulleted list, never code. Reuses the shared
     .result-panel chrome; only the list itself needs layout tokens. */
  .assumptions-list {
    margin: 0;
    padding-left: var(--space-5);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--color-text);
  }

  /* Per-SQL lineage breakdown (history turns only) */
  .per-sql-item {
    margin-bottom: var(--space-3);
  }

  .per-sql-item:last-child {
    margin-bottom: 0;
  }

  .per-sql-name {
    font-size: 0.8rem;
    color: var(--color-text-dim);
    font-family: ui-monospace, SFMono-Regular, monospace;
    margin-bottom: var(--space-2);
  }

  /* --- Upload widget (UI Slice 4) --- */
  .upload-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--space-2);
  }

  #upload-column-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }

  #upload-column-list:empty {
    display: none;
  }

  .upload-column-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-2) var(--space-3);
    font-size: 0.9rem;
  }

  .upload-col-name {
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .upload-col-type {
    color: var(--color-text-dim);
    font-size: 0.8rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
  }

  .upload-col-sample {
    flex: 1;
    color: var(--color-text-dim);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .upload-column-row select {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    color: var(--color-text);
    padding: var(--space-1) var(--space-2);
    font-size: 0.85rem;
  }

  #upload-confirm-button[hidden],
  #upload-result[hidden],
  #upload-mapping-warning[hidden] {
    display: none;
  }

  #upload-confirm-button {
    margin-top: var(--space-3);
  }

  #upload-result {
    margin: var(--space-3) 0 0 0;
    font-size: 0.9rem;
    color: var(--color-text);
  }

  #upload-mapping-warning {
    margin: var(--space-2) 0 0 0;
    font-size: 0.85rem;
    color: var(--color-error-text);
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="header-row">
      <h1>Data Agent — Phase 0</h1>
      <button
        type="button"
        id="new-session-button"
        data-testid="new-session-button"
        class="new-session-button"
        title="Start a new session"
      >
        <span class="new-session-icon" aria-hidden="true">⟳</span>
        <span>New session</span>
      </button>
    </div>
    <p class="session-line">Session: <span id="session-line">connecting…</span></p>
  </header>

  <div id="error-banner" data-testid="error-banner" role="alert" hidden>
    <span id="error-code" class="error-code" data-testid="error-code"></span>
    <span id="error-message" data-testid="error-message"></span>
  </div>

  <form id="message-form" aria-label="Send a message to the agent">
    <label for="message-input" class="sr-only">Message</label>
    <input
      type="text"
      id="message-input"
      data-testid="message-input"
      placeholder="Ask a question about the HR data…"
      autocomplete="off"
    />
    <button type="submit" id="send-button" data-testid="send-button">Send</button>
  </form>

  <section id="upload-panel" data-testid="upload-panel" aria-labelledby="upload-heading">
    <h2 id="upload-heading">Upload a dataset</h2>
    <div class="upload-row">
      <label for="upload-file-input" class="sr-only">Choose a CSV or XLSX file to upload</label>
      <input
        type="file"
        id="upload-file-input"
        data-testid="upload-file-input"
        accept=".csv,.xlsx"
      />
      <button type="button" id="upload-analyze-button" data-testid="upload-analyze-button">Analyze</button>
    </div>
    <div id="upload-column-list" data-testid="upload-column-list"></div>
    <p id="upload-mapping-warning" data-testid="upload-mapping-warning" role="alert" hidden></p>
    <button type="button" id="upload-confirm-button" data-testid="upload-confirm-button" hidden>Confirm mapping</button>
    <p id="upload-result" data-testid="upload-result" aria-live="polite" hidden></p>
  </section>

  <section aria-labelledby="progress-heading">
    <h2 id="progress-heading">Progress</h2>
    <ul id="progress-list" data-testid="progress-list" aria-live="polite"></ul>
  </section>

  <section id="ask-user" data-testid="ask-user" aria-labelledby="ask-user-question" hidden>
    <h2 id="ask-user-heading">Agent needs input</h2>
    <p id="ask-user-question" data-testid="ask-user-question"></p>
    <div class="chip-row" id="ask-user-options"></div>
    <div id="ask-user-freetext">
      <label for="ask-user-input" class="sr-only">Your answer</label>
      <input type="text" id="ask-user-input" data-testid="ask-user-input" placeholder="Type your answer…" />
      <button type="button" id="ask-user-submit" data-testid="ask-user-submit">Submit</button>
    </div>
  </section>

  <section id="transcript" data-testid="transcript" aria-label="Conversation transcript"></section>

  <!-- One turn block, cloned per turn into #transcript. Same nodes as the old
       singleton Answer section, but keyed by class (ids → classes) so many can
       coexist. Queried via root.querySelector(...) by the scoped renderers. -->
  <template id="turn-template">
    <div class="turn-block" data-testid="turn-block">
      <p class="turn-question" data-testid="turn-question"></p>
      <div class="turn-answer" data-testid="answer" aria-live="polite"></div>

      <div class="answer-meta">
        <span class="blueprint-chip static-chip" data-testid="blueprint-chip" hidden></span>
        <span class="verified-badge badge" data-testid="verified-badge" hidden></span>
      </div>

      <div class="turn-status" data-testid="status"></div>

      <details class="assumptions-panel result-panel" data-testid="assumptions-panel" hidden>
        <summary>Assumptions</summary>
        <ul class="assumptions-list"></ul>
      </details>

      <details class="sql-panel result-panel" data-testid="sql-panel" hidden>
        <summary>Show the query</summary>
        <div class="sql-blocks"></div>
      </details>

      <!-- One panel per designated answer table, cloned from #answer-table-template
           (08 §E). Empty when the turn designated nothing. -->
      <div class="answer-tables" data-testid="answer-tables"></div>

      <details class="provenance-panel result-panel" data-testid="provenance-panel" hidden>
        <summary>Data lineage</summary>
        <div class="provenance-chips chip-row"></div>
      </details>

      <details class="per-sql-panel result-panel" data-testid="per-sql-panel" hidden>
        <summary>Per-query lineage</summary>
        <div class="per-sql-list"></div>
      </details>
    </div>
  </template>

  <!-- One answer table, cloned once per entry of `answer_tables` into a turn
       block's `.answer-tables` container (08 §E). This used to be a singleton
       subtree inside #turn-template, found by root.querySelector(".result-table")
       — which is exactly why a turn could only ever page ONE grid. Cloning it
       gives every table its own nodes AND its own `offset` closure, so paging
       one grid cannot page another. Same nodes, same classes, same testid as
       the singleton it replaces, so the N=1 panel is unchanged. -->
  <template id="answer-table-template">
    <details class="result-table result-panel" data-testid="result-table">
      <summary>
        <span class="result-table-title">Results</span>
        <span class="table-blueprint-chip static-chip" data-testid="table-blueprint-chip" hidden></span>
        <span class="table-verified-badge badge" data-testid="table-verified-badge" hidden></span>
      </summary>
      <div class="table-scroll" role="region" tabindex="0">
        <table class="result-grid">
          <thead class="result-table-head"></thead>
          <tbody class="result-table-body"></tbody>
        </table>
      </div>
      <div class="data-as-of result-caption" data-testid="data-as-of" hidden></div>
      <div class="result-table-caption result-caption" hidden></div>
      <div class="table-pager" hidden>
        <button type="button" class="pager-prev" disabled>Previous</button>
        <span class="pager-status" role="status"></span>
        <button type="button" class="pager-next" disabled>Next</button>
      </div>
    </details>
  </template>
</main>

<script src="/answer-document.js"></script>
<script>
(function () {
  "use strict";

  var sessionId = null;
  // The turn block awaiting a live `result` event. Set on submit (fresh block)
  // or, after a resume-on-reload, to the rehydrated paused turn block.
  var inProgressBlock = null;
  // The File object held between analyze → confirm (Option B: the same file is
  // re-sent to /api/upload so the server re-parses it, §0/§5). The browser never
  // holds parsed rows — only this File reference from the picker.
  var uploadFile = null;

  // Stream lifecycle guards. Each turn (and each reset) bumps `streamEpoch` and
  // becomes the sole owner of that epoch; events/finalizers whose captured epoch
  // != the current one are dropped, so an abandoned SSE stream is fully inert.
  // `currentController` aborts the in-flight fetch when a turn is superseded or
  // the session is reset (stops the server-side read too, not just the UI).
  var streamEpoch = 0;
  var currentController = null;

  // Supersede any in-flight stream and open a new epoch. Returns this stream's
  // epoch for the caller to capture and gate its own finalizers on.
  function beginStream() {
    streamEpoch += 1;
    if (currentController) currentController.abort();
    currentController = new AbortController();
    return streamEpoch;
  }

  var els = {
    sessionLine: document.getElementById("session-line"),
    newSessionButton: document.getElementById("new-session-button"),
    form: document.getElementById("message-form"),
    input: document.getElementById("message-input"),
    sendButton: document.getElementById("send-button"),
    progressList: document.getElementById("progress-list"),
    askUser: document.getElementById("ask-user"),
    askUserQuestion: document.getElementById("ask-user-question"),
    askUserOptions: document.getElementById("ask-user-options"),
    askUserInput: document.getElementById("ask-user-input"),
    askUserSubmit: document.getElementById("ask-user-submit"),
    errorBanner: document.getElementById("error-banner"),
    errorCode: document.getElementById("error-code"),
    errorMessage: document.getElementById("error-message"),
    transcript: document.getElementById("transcript"),
    turnTemplate: document.getElementById("turn-template"),
    answerTableTemplate: document.getElementById("answer-table-template"),
    uploadFileInput: document.getElementById("upload-file-input"),
    uploadAnalyzeButton: document.getElementById("upload-analyze-button"),
    uploadColumnList: document.getElementById("upload-column-list"),
    uploadMappingWarning: document.getElementById("upload-mapping-warning"),
    uploadConfirmButton: document.getElementById("upload-confirm-button"),
    uploadResult: document.getElementById("upload-result"),
  };

  function clearError() {
    els.errorBanner.hidden = true;
    els.errorCode.textContent = "";
    els.errorMessage.textContent = "";
  }

  function showError(code, message) {
    els.errorBanner.hidden = false;
    els.errorCode.textContent = code || "ERROR";
    els.errorMessage.textContent = message || "Something went wrong.";
  }

  function addProgressItem(step) {
    var li = document.createElement("li");
    li.className = "progress-item";
    li.setAttribute("data-testid", "progress-item");

    var stepSpan = document.createElement("span");
    stepSpan.className = "step";
    stepSpan.textContent = step;
    li.appendChild(stepSpan);

    els.progressList.appendChild(li);
    els.progressList.scrollTop = els.progressList.scrollHeight;
  }

  function clearProgress() {
    clearNode(els.progressList);
  }

  // --- Shared DOM helpers (carried over verbatim from Slice 1, §5.6) ---

  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // Render a heterogeneous JSON scalar cell as plain text (never HTML — cells
  // are the caller's own answer data but still go through textContent, §5.6).
  function cellText(value) {
    if (value === null || value === undefined) return "";
    if (typeof value === "object") return JSON.stringify(value);
    return String(value);
  }

  // --- Per-turn block lifecycle (UI Slice 3, §5.1/§5.3) ---

  // Clone the turn template into a fresh block, render its question, and append
  // it to #transcript. Returns the block root (used as the querySelector scope
  // by every renderer below).
  function createTurnBlock(question) {
    var frag = els.turnTemplate.content.cloneNode(true);
    var block = frag.querySelector(".turn-block");
    setBlockQuestion(block, question);
    els.transcript.appendChild(block);
    scrollTranscriptToEnd();
    return block;
  }

  // Keep the newest message in view (messenger-style). The transcript is a
  // max-height scroll container, so nudging its own scrollTop won't move the
  // page — used on turn creation and when a live `result` arrives.
  function scrollTranscriptToEnd() {
    // Instant (behavior:"auto") — no animation to flake Playwright visibility
    // waits or fight prefers-reduced-motion.
    els.transcript.scrollTo({ top: els.transcript.scrollHeight, behavior: "auto" });
  }

  function setBlockQuestion(block, question) {
    block.querySelector(".turn-question").textContent = question || "";
  }

  // Live turns carry status + tool_calls_made; history turns do not (field
  // absent → leave the status line empty).
  function setBlockStatus(block, data) {
    var status = block.querySelector(".turn-status");
    if (!data || data.status === undefined || data.status === null) {
      status.textContent = "";
      return;
    }
    status.textContent =
      "status: " + data.status + (data.tool_calls_made == null ? "" : " · tool_calls_made: " + data.tool_calls_made);
  }

  // --- Enriched result rendering (UI Slice 1 renderers, scoped to a block) ---
  // Every field is optional and possibly-null on any status; each renderer
  // treats null/undefined/empty as "hide" so a scope-withheld or missing field
  // simply collapses its panel. Behavior per field is identical to Slice 1 —
  // this is a scoping refactor: `els.*` → `root.querySelector(...)`.

  // Field 1 — `sql: string[] | null`: one <pre> code block per statement, in
  // order. null / [] → hide the panel.
  function fillGrid(head, body, columns, rows) {
    clearNode(head);
    clearNode(body);
    if (Array.isArray(columns) && columns.length > 0) {
      var headRow = document.createElement("tr");
      columns.forEach(function (col) {
        var th = document.createElement("th");
        th.setAttribute("scope", "col");
        th.textContent = cellText(col);
        headRow.appendChild(th);
      });
      head.appendChild(headRow);
    }
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      var cells = Array.isArray(row) ? row : [row];
      cells.forEach(function (cell) {
        var td = document.createElement("td");
        td.textContent = cellText(cell);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  // How many rows one page fetches. The runtime clamps to its own MAX_PAGE_SIZE
  // regardless, so this is a display choice, not a limit.
  var PAGE_SIZE = 50;

  // Page only explicitly approved table handles under the current session scope.
  var answerTableSeq = 0;

  function cloneTablePanel(container, title) {
    var frag = els.answerTableTemplate.content.cloneNode(true);
    var panel = frag.querySelector(".result-table");
    var titleEl = panel.querySelector(".result-table-title");
    var scroll = panel.querySelector(".table-scroll");
    var grid = panel.querySelector(".result-grid");

    answerTableSeq += 1;
    var titleId = "answer-table-title-" + answerTableSeq;
    titleEl.id = titleId;
    titleEl.textContent = title;
    // Name the grid and its scroll box after this panel's own title, so eight
    // grids in one turn are distinguishable to a screen reader instead of being
    // eight anonymous "Results" tables.
    grid.setAttribute("aria-labelledby", titleId);
    scroll.setAttribute("aria-labelledby", titleId);

    container.appendChild(panel);
    return {
      panel: panel,
      chip: panel.querySelector(".table-blueprint-chip"),
      badge: panel.querySelector(".table-verified-badge"),
      head: panel.querySelector(".result-table-head"),
      body: panel.querySelector(".result-table-body"),
      caption: panel.querySelector(".result-table-caption"),
      dataAsOf: panel.querySelector(".data-as-of"),
      pager: panel.querySelector(".table-pager"),
      prev: panel.querySelector(".pager-prev"),
      next: panel.querySelector(".pager-next"),
      status: panel.querySelector(".pager-status"),
      title: title,
    };
  }

  // Per-table "verified ✓" badge, driven ONLY by that table's own block — never by
  // a turn-level flag, which at N>1 would claim a blueprint gate over grids that
  // never went through one (08 §C). Same rule as the block-level badge: absence is
  // information, never a warning — a missing block renders nothing rather than a
  // red state. `empty_result` is the one non-green state that IS rendered (J6).
  function renderDataAsOf(element, value, source) {
    if (source && source.freshness) {
      element.textContent = window.answerFreshnessLabel(source);
      element.hidden = !element.textContent;
      return;
    }
    var date = typeof value === "string" ? new Date(value) : null;
    var valid = date && Number.isFinite(date.getTime());
    element.textContent = valid ? "Data as of " + date.toISOString().replace("T", " ").replace("Z", " UTC") : "";
    element.hidden = !valid;
  }

  function wireTablePaging(panelEls, tableRef, autoOpen) {
    var offset = 0;
    var loaded = false;

    function setBusy(busy) {
      panelEls.prev.disabled = busy || offset === 0;
      panelEls.next.disabled = busy;
    }

    function load() {
      loaded = true;
      setBusy(true);
      panelEls.status.textContent = "loading…";
      fetch("/api/query/page", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          table_ref: tableRef,
          limit: PAGE_SIZE,
          offset: offset,
        }),
      })
        .then(function (r) {
          return r.json().then(function (payload) {
            return { ok: r.ok, payload: payload };
          });
        })
        .then(function (res) {
          if (!res.ok) {
            // A denial (403) or an unparseable query (400) is shown in place of THIS
            // grid rather than swallowed — the user should see why this table is
            // missing, not an empty panel, and the other panels are unaffected.
            clearNode(panelEls.head);
            clearNode(panelEls.body);
            panelEls.caption.textContent =
              "Could not load the table: " + cellText(res.payload.error || "unknown error");
            panelEls.caption.hidden = false;
            panelEls.pager.hidden = true;
            return;
          }
          // A successful fresh page supersedes history, including unknown freshness.
          renderDataAsOf(panelEls.dataAsOf, res.payload.data_as_of, res.payload);
          var rows = Array.isArray(res.payload.rows) ? res.payload.rows : [];
          fillGrid(panelEls.head, panelEls.body, res.payload.columns, rows);
          panelEls.caption.hidden = true;
          panelEls.caption.textContent = "";
          var first = rows.length === 0 ? offset : offset + 1;
          panelEls.status.textContent = "rows " + first + "–" + (offset + rows.length);
          panelEls.prev.disabled = offset === 0;
          // `has_more` is a hint derived from a full page, not a total count —
          // there is no row count to show without a second aggregate query.
          panelEls.next.disabled = res.payload.has_more !== true;
          panelEls.pager.hidden = false;
        })
        .catch(function () {
          panelEls.caption.textContent = "Could not load the table.";
          panelEls.caption.hidden = false;
          panelEls.pager.hidden = true;
        });
    }

    panelEls.prev.setAttribute("aria-label", "Previous page of " + panelEls.title);
    panelEls.next.setAttribute("aria-label", "Next page of " + panelEls.title);
    panelEls.prev.onclick = function () {
      offset = Math.max(0, offset - PAGE_SIZE);
      load();
    };
    panelEls.next.onclick = function () {
      offset = offset + PAGE_SIZE;
      load();
    };

    // Lazy first fetch (08 §E). The panel has always been a collapsed <details>,
    // but it used to fetch at render regardless. Fetching on first open instead
    // makes N=8 cost ONE query at render (the lead table, opened below) rather
    // than eight concurrent warehouse queries nobody has looked at yet.
    panelEls.panel.addEventListener("toggle", function () {
      if (panelEls.panel.open && !loaded) load();
    });
    if (autoOpen) {
      // `load()` marks itself loaded synchronously, so the `toggle` this queues
      // cannot fire a second request.
      load();
      panelEls.panel.open = true;
    }
  }

  // Render every designated answer table into the turn block's container: one
  // cloned panel each, each with its own paging closure.
  function renderTurnBlock(block, data) {
    setBlockStatus(block, data);
    var container = block.querySelector(".turn-answer");
    block.querySelector(".answer-tables").replaceChildren();
    if (!data.answer_document && data.status && data.status.startsWith("paused")) {
      container.textContent = data.pending_question || "Waiting for your input.";
      return;
    }
    var doc = data.answer_document;
    window.renderAnswerDocument(container, doc, function (parent, ref, title, source) {
      var panel = cloneTablePanel(parent, title);
      renderDataAsOf(panel.dataAsOf, source.data_as_of, source);
      wireTablePaging(panel, ref, false);
    });
    if (!doc) return;
    var refresh = document.createElement("button");
    refresh.textContent = "Refresh answer";
    container.appendChild(refresh);
    refresh.onclick = async function () {
      refresh.disabled = true;
      var capturedSession = sessionId;
      try {
        var response = await fetch("/api/answer/refresh", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({session_id:capturedSession, answer_id:doc.answer_id, expected_revision:doc.revision})
        });
        if (!response.ok) {
          if ([401,403,404].includes(response.status)) container.textContent = "This answer is unavailable. Reload to check access.";
          throw new Error("Refresh failed. Reload before trying again.");
        }
        await consumeSSE(response, function (event, result) {
          if (sessionId !== capturedSession || !block.isConnected) return;
          if (event === "progress") refresh.textContent = result.message || "Refreshing…";
          if (event === "error") {
            if (result.code === "RefreshAccessChangedError") { container.textContent = "Access changed. Reloading…"; rehydrateHistory(); }
            throw new Error(result.message);
          }
          if (event === "result" && result.answer_document && result.answer_document.answer_id === doc.answer_id && result.answer_document.revision > doc.revision) renderTurnBlock(block, result);
        });
      } catch (error) { showError("REFRESH_FAILED", error.message); }
      finally { refresh.disabled = false; refresh.textContent = "Refresh answer"; }
    };
  }

  // --- History rehydrate (§5.4) ---

  // History uses exactly the same saved document as live delivery.
  function renderHistoryTurn(turn) {
    var block = createTurnBlock(turn.question);
    renderTurnBlock(block, {answer_document: turn.answer_document});
    return block;
  }

  // Rebuild the transcript from persisted history (§5.4/§5.5). Rebuild-on-load
  // avoids double-render: live appends only accrue within a page session.
  // Failure is non-fatal — surface it and start with an empty transcript.
  function renderHistory(data) {
    clearNode(els.transcript);
    inProgressBlock = null;
    var turns = data && Array.isArray(data.turns) ? data.turns : [];
    var lastBlock = null;
    turns.forEach(function (turn) {
      lastBlock = renderHistoryTurn(turn);
    });
    // Resume-after-reload (§1.4): re-open the ask-user prompt and aim the next
    // `result` at the paused turn's block (last rendered turn). pending_question
    // is already the {question, options} dict — pass it through exactly like the
    // live SSE path (do NOT re-wrap it).
    if (data && data.pending_question) {
      showAskUser(data.pending_question);
      inProgressBlock = lastBlock;
    }
  }

  function rehydrateHistory() {
    return fetch("/api/history?session_id=" + encodeURIComponent(sessionId))
      .then(function (response) {
        if (response.status === 404) {
          // The BFF restarted and lost this session's JWT (_SESSIONS map). Drop
          // the stale id, mint a fresh session, and start with an empty
          // transcript — reload-restore degrades cleanly across a BFF restart.
          clearSavedSession();
          clearNode(els.transcript);
          inProgressBlock = null;
          return mintSession();
        }
        if (!response.ok) throw new Error("history request failed: " + response.status);
        return response.json().then(renderHistory);
      })
      .catch(function (err) {
        showError("HISTORY_LOAD_FAILED", String(err));
      });
  }

  function hideAskUser() {
    els.askUser.hidden = true;
    els.askUserQuestion.textContent = "";
    clearNode(els.askUserOptions);
    els.askUserInput.value = "";
  }

  function showAskUser(pendingQuestion) {
    // Re-enable at the render boundary: a superseded resume's gated .finally may
    // have skipped setAskUserBusy(false), which would otherwise orphan the
    // freetext input + Submit disabled on a re-rendered (possibly chip-less)
    // question. Resetting here clears that regardless of which epoch orphaned it.
    setAskUserBusy(false);
    els.askUserQuestion.textContent = pendingQuestion.question || "";
    clearNode(els.askUserOptions);

    var options = pendingQuestion.options || [];
    options.forEach(function (option) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.setAttribute("data-testid", "ask-user-option");
      chip.setAttribute("data-option", option);
      chip.textContent = option;
      chip.addEventListener("click", function () {
        submitAnswer(option);
      });
      els.askUserOptions.appendChild(chip);
    });

    els.askUser.hidden = false;
    if (options.length === 0) {
      els.askUserInput.focus();
    }
  }

  function setBusy(isBusy) {
    els.sendButton.disabled = isBusy;
    els.input.disabled = isBusy;
  }

  function setAskUserBusy(isBusy) {
    els.askUserSubmit.disabled = isBusy;
    els.askUserInput.disabled = isBusy;
    var chips = els.askUserOptions.querySelectorAll(".chip");
    chips.forEach(function (chip) {
      chip.disabled = isBusy;
    });
  }

  /**
   * Read a fetch Response body as a stream of SSE frames (`event:`/`data:`
   * blocks separated by a blank line) and invoke `onEvent(eventName, data)`
   * for each one as it arrives. EventSource can't POST, hence this manual
   * fetch + reader parse (per the runtime's SSE contract).
   */
  function consumeSSE(response, onEvent) {
    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";

    function processBuffer() {
      var frames = buffer.split("\n\n");
      buffer = frames.pop(); // last element may be incomplete — keep it
      frames.forEach(function (frame) {
        if (!frame.trim()) return;
        var eventName = "message";
        var dataLines = [];
        frame.split("\n").forEach(function (line) {
          if (line.startsWith("event:")) {
            eventName = line.slice(6).trim();
          } else if (line.startsWith("data:")) {
            dataLines.push(line.slice(5).trim());
          }
        });
        var data = null;
        if (dataLines.length > 0) {
          try {
            data = JSON.parse(dataLines.join("\n"));
          } catch (err) {
            data = null;
          }
        }
        onEvent(eventName, data);
      });
    }

    function pump() {
      return reader.read().then(function (result) {
        if (result.done) {
          buffer += decoder.decode();
          if (buffer.trim()) processBuffer();
          return;
        }
        buffer += decoder.decode(result.value, { stream: true });
        processBuffer();
        return pump();
      });
    }

    return pump();
  }

  function handleSSEEvent(eventName, data) {
    if (eventName === "progress" && data) {
      addProgressItem(data.step);
    } else if (eventName === "result" && data) {
      // Populate the in-progress turn block (no clearing — prior blocks stay).
      if (inProgressBlock) {
        renderTurnBlock(inProgressBlock, data);
        scrollTranscriptToEnd();
      }
      if (data.pending_question) {
        showAskUser(data.pending_question);
      } else {
        hideAskUser();
      }
    } else if (eventName === "error" && data) {
      showError(data.code, data.message);
    }
  }

  function runTurn(url, body, myEpoch) {
    clearError();
    var signal = currentController ? currentController.signal : undefined;
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: signal,
    }).then(function (response) {
      // Superseded before the response arrived — this stream is abandoned.
      if (myEpoch !== streamEpoch) return;
      if (!response.ok) {
        return response.text().then(function (text) {
          if (myEpoch !== streamEpoch) return;
          var message = text || response.statusText;
          try {
            var parsed = JSON.parse(text);
            if (parsed && parsed.detail) message = parsed.detail;
          } catch (err) {
            // not JSON — show the raw text as-is
          }
          showError("HTTP_" + response.status, message);
        });
      }
      // Drop every event (progress/result/pending_question/error) from an
      // abandoned stream: the epoch check makes the whole handler inert.
      return consumeSSE(response, function (eventName, data) {
        if (myEpoch !== streamEpoch) return;
        handleSSEEvent(eventName, data);
      });
    }).catch(function (err) {
      // Aborting on reset/supersede is expected — never surface it as an error.
      if (err && err.name === "AbortError") return;
      // Stale-epoch rejections belong to an abandoned stream — stay silent.
      if (myEpoch !== streamEpoch) return;
      // Live-epoch fetch failure (e.g. server down → TypeError: Failed to fetch):
      // surface it instead of re-throwing into an unhandled rejection. The non-OK
      // HTTP branch returns normally (already showed its error), so no double-report.
      showError("NETWORK_ERROR", String(err));
    });
  }

  function sendMessage(message) {
    if (!sessionId) {
      showError("NO_SESSION", "Session not ready yet — try again in a moment.");
      return;
    }
    var myEpoch = beginStream();
    setBusy(true);
    hideAskUser();
    clearProgress();
    // Fresh turn block, question rendered immediately, appended — prior blocks
    // are untouched. The live `result` event fills this block (§5.3).
    inProgressBlock = createTurnBlock(message);
    runTurn("/api/turn", { session_id: sessionId, message: message }, myEpoch).finally(
      function () {
        // A stale, superseded stream's finalizer must not clobber the new turn's
        // busy state — only the current epoch's owner re-enables the composer.
        if (myEpoch === streamEpoch) setBusy(false);
      }
    );
  }

  function submitAnswer(answer) {
    if (!answer || !answer.trim()) return;
    // Defense in depth: never resume against a torn-down/unminted session.
    if (!sessionId) {
      showError("NO_SESSION", "Session not ready yet — try again in a moment.");
      return;
    }
    var myEpoch = beginStream();
    // A chip click can land in the gap between a `result` (which shows ask-user)
    // and the prior stream's .finally; that finally is now stale and won't run
    // setBusy(false). The composer should always be usable during a resume, so
    // enable it here explicitly (consistent with the normal send flow).
    setBusy(false);
    setAskUserBusy(true);
    // Resume continues the paused turn. Within a page session inProgressBlock is
    // already the paused block; after a reload rehydrate aimed it at the paused
    // turn. Fall back to a fresh block only if neither applies.
    if (!inProgressBlock) {
      inProgressBlock = createTurnBlock("");
    }
    runTurn("/api/turn/resume", { session_id: sessionId, answer: answer }, myEpoch).finally(
      function () {
        if (myEpoch === streamEpoch) setAskUserBusy(false);
      }
    );
  }

  els.form.addEventListener("submit", function (event) {
    event.preventDefault();
    var message = els.input.value.trim();
    if (!message) return;
    els.input.value = "";
    sendMessage(message);
  });

  els.askUserSubmit.addEventListener("click", function () {
    var answer = els.askUserInput.value.trim();
    submitAnswer(answer);
    els.askUserInput.value = "";
  });

  els.askUserInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      els.askUserSubmit.click();
    }
  });

  // --- Upload widget (UI Slice 4, §5) ---
  // analyze → map columns → confirm. Additive to the transcript flow; shares
  // sessionId + the showError banner. Both endpoints are multipart; the same
  // File is sent to analyze (preview) and upload (authoritative re-parse).

  // The four locked mapping roles (§1b). `none` is the default and is omitted
  // from the mapping JSON; the others each canonicalize to a join key server-side.
  var UPLOAD_ROLES = ["EmployeeCode", "DepartmentCode", "DepartmentName", "none"];

  // Every role <select> in the rendered column list.
  function roleSelects() {
    return els.uploadColumnList.querySelectorAll("select[data-testid='upload-role-select']");
  }

  // Build the mapping JSON `{ <sanitized_col>: <role> }`, omitting `none` (§5.3).
  function buildMapping() {
    var mapping = {};
    roleSelects().forEach(function (sel) {
      var role = sel.value;
      if (role && role !== "none") {
        mapping[sel.getAttribute("data-col")] = role;
      }
    });
    return mapping;
  }

  // Client-side fast path: is any non-`none` role selected on more than one
  // column? The server rejection (UPLOAD_MAPPING_INVALID) remains authoritative.
  function hasDuplicateRoles() {
    var seen = {};
    var duplicate = false;
    roleSelects().forEach(function (sel) {
      var role = sel.value;
      if (role && role !== "none") {
        if (seen[role]) duplicate = true;
        seen[role] = true;
      }
    });
    return duplicate;
  }

  // Reflect duplicate-role state onto the confirm button + inline warning.
  function updateConfirmState() {
    var duplicate = hasDuplicateRoles();
    els.uploadConfirmButton.disabled = duplicate;
    els.uploadMappingWarning.textContent = duplicate
      ? "Each role may be assigned to at most one column."
      : "";
    els.uploadMappingWarning.hidden = !duplicate;
  }

  function setUploadBusy(isBusy) {
    els.uploadFileInput.disabled = isBusy;
    els.uploadAnalyzeButton.disabled = isBusy;
    if (isBusy) els.uploadConfirmButton.disabled = true;
  }

  // Surface a non-OK upload response through the shared banner. Prefers the
  // contract's {error, code}; falls back to FastAPI's {detail} from the BFF,
  // then to raw text / status (mirrors runTurn's error handling, §1/§1c).
  function reportUploadError(response) {
    return response.text().then(function (text) {
      var code = "HTTP_" + response.status;
      var message = text || response.statusText || "Upload failed.";
      try {
        var parsed = JSON.parse(text);
        if (parsed) {
          if (parsed.code) code = parsed.code;
          if (parsed.error) message = parsed.error;
          else if (parsed.detail) message = parsed.detail;
        }
      } catch (err) {
        // not JSON — keep the raw text/status
      }
      showError(code, message);
    });
  }

  // Render one row per analyzed column: sanitized name + inferred type + a
  // sample cell (first sample row, via textContent) + a role <select>. All
  // strings go through textContent — an uploaded header/cell is untrusted (§5).
  function renderColumnList(data) {
    clearNode(els.uploadColumnList);
    els.uploadMappingWarning.hidden = true;
    var columns = data && Array.isArray(data.columns) ? data.columns : [];
    var sampleRows = data && Array.isArray(data.sample_rows) ? data.sample_rows : [];
    var firstSample = sampleRows.length > 0 && Array.isArray(sampleRows[0]) ? sampleRows[0] : [];

    if (columns.length === 0) {
      var note = document.createElement("p");
      note.className = "prov-empty";
      note.textContent = "No columns found in this file.";
      els.uploadColumnList.appendChild(note);
      els.uploadConfirmButton.hidden = true;
      return;
    }

    columns.forEach(function (col, i) {
      var colName = col && col.name !== undefined && col.name !== null ? String(col.name) : "";

      var row = document.createElement("div");
      row.className = "upload-column-row";
      row.setAttribute("data-testid", "upload-column-row");

      var nameSpan = document.createElement("span");
      nameSpan.className = "upload-col-name";
      nameSpan.textContent = colName;
      row.appendChild(nameSpan);

      var typeSpan = document.createElement("span");
      typeSpan.className = "upload-col-type";
      typeSpan.textContent = col && col.type ? cellText(col.type) : "";
      row.appendChild(typeSpan);

      var sampleSpan = document.createElement("span");
      sampleSpan.className = "upload-col-sample";
      sampleSpan.textContent = i < firstSample.length ? cellText(firstSample[i]) : "";
      row.appendChild(sampleSpan);

      var label = document.createElement("label");
      label.className = "sr-only";
      var selectId = "upload-role-" + i;
      label.setAttribute("for", selectId);
      label.textContent = "Role for column " + colName;
      row.appendChild(label);

      var select = document.createElement("select");
      select.id = selectId;
      select.setAttribute("data-testid", "upload-role-select");
      select.setAttribute("data-col", colName);
      UPLOAD_ROLES.forEach(function (role) {
        var option = document.createElement("option");
        option.value = role;
        option.textContent = role;
        select.appendChild(option);
      });
      select.value = "none"; // default (§5.2)
      row.appendChild(select);

      els.uploadColumnList.appendChild(row);
    });

    els.uploadConfirmButton.hidden = false;
    updateConfirmState();
  }

  function renderUploadResult(data) {
    var table = data && data.table ? cellText(data.table) : "";
    var rowCount = data && typeof data.row_count === "number" ? data.row_count : 0;
    els.uploadResult.textContent =
      "scratch table ready: " + table + " (" + rowCount + " rows)";
    els.uploadResult.hidden = false;
  }

  function analyzeUpload() {
    if (!sessionId) {
      showError("NO_SESSION", "Session not ready yet — try again in a moment.");
      return;
    }
    var file = els.uploadFileInput.files && els.uploadFileInput.files[0];
    if (!file) {
      showError("UPLOAD_NO_FILE", "Choose a CSV or XLSX file first.");
      return;
    }
    clearError();
    uploadFile = file; // Option B: kept for the re-send at confirm.
    clearNode(els.uploadColumnList);
    els.uploadMappingWarning.hidden = true;
    els.uploadConfirmButton.hidden = true;
    els.uploadResult.hidden = true;
    els.uploadResult.textContent = "";

    var form = new FormData();
    form.append("file", file);
    setUploadBusy(true);
    fetch("/api/upload/analyze?session_id=" + encodeURIComponent(sessionId), {
      method: "POST",
      body: form,
    })
      .then(function (response) {
        if (!response.ok) return reportUploadError(response);
        return response.json().then(renderColumnList);
      })
      .catch(function (err) {
        showError("UPLOAD_ANALYZE_FAILED", String(err));
      })
      .finally(function () {
        setUploadBusy(false);
      });
  }

  function confirmUpload() {
    if (!sessionId) {
      showError("NO_SESSION", "Session not ready yet — try again in a moment.");
      return;
    }
    if (!uploadFile) {
      showError("UPLOAD_NO_FILE", "Analyze a file before confirming.");
      return;
    }
    // Fast-path client guard; the server is still authoritative (§5.5).
    if (hasDuplicateRoles()) {
      updateConfirmState();
      showError("UPLOAD_MAPPING_INVALID", "Each role may be assigned to at most one column.");
      return;
    }
    clearError();
    var mapping = buildMapping();
    var form = new FormData();
    form.append("file", uploadFile); // the SAME File object (Option B).
    form.append("mapping", JSON.stringify(mapping));

    setUploadBusy(true);
    els.uploadConfirmButton.disabled = true;
    fetch("/api/upload?session_id=" + encodeURIComponent(sessionId), {
      method: "POST",
      body: form,
    })
      .then(function (response) {
        if (!response.ok) return reportUploadError(response);
        return response.json().then(renderUploadResult);
      })
      .catch(function (err) {
        showError("UPLOAD_FAILED", String(err));
      })
      .finally(function () {
        setUploadBusy(false);
        updateConfirmState();
      });
  }

  els.uploadAnalyzeButton.addEventListener("click", analyzeUpload);
  els.uploadConfirmButton.addEventListener("click", confirmUpload);
  els.uploadColumnList.addEventListener("change", function (event) {
    if (event.target && event.target.getAttribute("data-testid") === "upload-role-select") {
      updateConfirmState();
    }
  });

  // --- Session persistence (§5.4) ---
  // Persist the minted session_id across reloads so rehydrate has something to
  // restore. The JWT stays server-side (D82/D5); only the opaque id is stored.
  var SESSION_STORAGE_KEY = "data-agent-session";

  function readSavedSession() {
    try {
      return sessionStorage.getItem(SESSION_STORAGE_KEY);
    } catch (err) {
      return null;
    }
  }

  function saveSession(id) {
    try {
      sessionStorage.setItem(SESSION_STORAGE_KEY, id);
    } catch (err) {
      /* storage unavailable (private mode / disabled) — degrade to per-load */
    }
  }

  function clearSavedSession() {
    try {
      sessionStorage.removeItem(SESSION_STORAGE_KEY);
    } catch (err) {
      /* ignore */
    }
  }

  // Mint a fresh session_id (and, server-side only, a JWT — D82/D5) and persist
  // it. Used on first-ever load and after a BFF restart drops a stale session.
  function mintSession() {
    return fetch("/api/session", { method: "POST" })
      .then(function (response) {
        if (!response.ok) throw new Error("session request failed: " + response.status);
        return response.json();
      })
      .then(function (data) {
        sessionId = data.session_id;
        saveSession(sessionId);
        els.sessionLine.textContent = sessionId;
      });
  }

  // "New session": fully reset the client and mint a BRAND-NEW session_id. This
  // must NOT reuse the old id — clearSavedSession() drops the persisted id and
  // mintSession() issues a fresh POST /api/session whose new id replaces the old
  // in both `sessionId` and sessionStorage. No rehydrate: a new session has no
  // history, so we intentionally leave the transcript empty (":empty" placeholder).
  function resetSession() {
    els.newSessionButton.disabled = true;

    // 0. Supersede + abort any still-draining stream. Bumping the epoch makes
    //    every in-flight event and finalizer from the old turn a no-op; aborting
    //    the fetch also stops the server-side read (belt and suspenders).
    streamEpoch += 1;
    if (currentController) {
      currentController.abort();
      currentController = null;
    }

    // 1. Drop the stale session so nothing can reuse it.
    clearSavedSession();
    sessionId = null;

    // 2. Reset transcript + progress + ask-user + error banner.
    clearNode(els.transcript);
    inProgressBlock = null;
    clearProgress();
    hideAskUser();
    clearError();

    // 2a. Re-enable the composer + ask-user controls immediately. The old
    //     stream's gated finalizer won't touch them (its epoch is now stale).
    setBusy(false);
    setAskUserBusy(false);

    // 2b. Reset the upload widget back to its initial state.
    clearNode(els.uploadColumnList);
    els.uploadConfirmButton.hidden = true;
    els.uploadConfirmButton.disabled = false;
    els.uploadResult.hidden = true;
    els.uploadResult.textContent = "";
    els.uploadMappingWarning.hidden = true;
    els.uploadMappingWarning.textContent = "";
    els.uploadFileInput.value = "";
    uploadFile = null;

    els.sessionLine.textContent = "connecting…";

    // 3. Re-mint: repoints sessionId, persists the new id, updates the line.
    //    4. Guard double-clicks via the disabled flag; re-enable in .finally.
    mintSession()
      .catch(function (err) {
        els.sessionLine.textContent = "failed to start session";
        showError("SESSION_RESET_FAILED", String(err));
      })
      .finally(function () {
        els.newSessionButton.disabled = false;
      });
  }

  els.newSessionButton.addEventListener("click", resetSession);

  // Bootstrap: reuse a saved session_id if present (→ rehydrate the transcript),
  // otherwise mint a fresh one, then rehydrate.
  function bootstrap() {
    var saved = readSavedSession();
    if (saved) {
      sessionId = saved;
      els.sessionLine.textContent = sessionId;
      return rehydrateHistory();
    }
    return mintSession()
      .then(function () {
        return rehydrateHistory();
      })
      .catch(function (err) {
        els.sessionLine.textContent = "failed to start session";
        showError("SESSION_INIT_FAILED", String(err));
      });
  }

  bootstrap();
})();
</script>
</body>
</html>
